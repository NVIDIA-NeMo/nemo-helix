[project]
name = "nemo-platform-sdk"
description = "The official Python library for the NeMo Platform API"
dynamic = ["readme", "version"]
license = "Apache-2.0"
authors = [{name = "NVIDIA Corporation"}]

dependencies = [
  "httpx>=0.23.0, <1",
  "pydantic>=2.0.0,<3",
  "typing-extensions>=4.14, <5",
  "anyio>=4.0.0,<5",
  "distro>=1.7.0, <2",
  "sniffio",
  "nemo-platform-plugin",
  "typer>=0.20.0",
  "rich>=13.7.1",
  "prompt_toolkit>=3.0.0",
  "requests>=2.31.0",
  "pyyaml>=6.0.0",
  "docker>=7.0.0",
  "ngcsdk>=4.8.2",
  "nvidia-ml-py>=13.0.0",
  "psutil>=5.9.0",
  "openai",
  "fsspec>=2023.1.0",
]

requires-python = ">=3.12,<3.14"
classifiers = [
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: Apache Software License"
]

[project.urls]
Homepage = "https://docs.nvidia.com/nemo/microservices/latest/about/index.html"

[project.optional-dependencies]
aiohttp = ["aiohttp", "httpx_aiohttp>=0.1.9"]
nemo-evaluator-sdk = [
  "pydantic>=2.10.6",
  "nemo-sandboxed-gym",
  "jinja2>=3.1.6",
  "jsonschema>=4.23.0",
  "jsonpath-ng>=1.7.0",
  "pyarrow>=19.0.1",
  "pandas>=1.5.3",
  "openai>=1.61.0",
  "httpx>=0.27.0,<1",
  "sacrebleu>=2.5.1",
  "rouge_score==0.1.2",
  "ragas==0.4.3",
  "langchain-openai>=1.3.5",
  "langchain-nvidia-ai-endpoints>=1.4.3,<2.0.0",
  "nemo-relay>=0.7.3,<0.8",
  "nemo-fabric==0.3.0b1",
  "opentelemetry-proto>=1.27.0",
  "pytrec-eval-terrier==0.5.10",
]

[project.entry-points."nemo.skills"]
platform = "nemo_platform.skills:skills_dir"

[project.scripts]
nemo = "nemo_platform.cli.app:cli"
nmp = "nemo_platform.cli.app:cli"
[tool.uv]
managed = true
required-version = ">=0.9"

[[tool.uv.cache-keys]]
file = "pyproject.toml"

[[tool.uv.cache-keys]]
[tool.uv.cache-keys.git]
commit = true
tags = true
[tool.uv.sources]
nmp-build-tools = {workspace = true}
[dependency-groups]
# version pins are in uv.lock
dev = [
    "pyright==1.1.399",
    "mypy==1.17",
    "respx",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "time-machine",
    "dirty-equals>=0.6.0",
    "importlib-metadata>=6.7.0",
    "rich>=13.7.1",
    "pytest-xdist>=3.6.1",
]
pydantic-v2 = [
    "pydantic~=2.0 ; python_full_version < '3.14'",
    "pydantic~=2.12 ; python_full_version >= '3.14'",
]

[build-system]
requires = ["hatchling==1.26.3", "hatch-fancy-pypi-readme", "nmp-build-tools"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
  "src/*"
]

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_platform"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[[tool.hatch.build.targets.wheel.hooks.custom.source-packages]]
source = "packages/nemo_platform_ext/src/nemo_platform_ext"
target = "nemo_platform_ext"
include = ["**/*.py", "skills/**/*.md", "skills/**/*.yaml", "skills/**/*.yml", "skills/**/*.json"]

[[tool.hatch.build.targets.wheel.hooks.custom.source-packages]]
source = "packages/models/src/models"
target = "models"

[[tool.hatch.build.targets.wheel.hooks.custom.source-packages]]
source = "packages/filesets/src/filesets"
target = "filesets"

[[tool.hatch.build.targets.wheel.hooks.custom.source-packages]]
source = "packages/nemo_evaluator_sdk/src/nemo_evaluator_sdk"
target = "nemo_evaluator_sdk"
include = ["**/*.py", "agent_eval/runtimes/fabric/sandbox.Dockerfile"]
[tool.hatch.build.targets.sdist]
# Basically everything except hidden files/directories (such as .github, .devcontainers, .python-version, etc)
include = [
  "/*.toml",
  "/*.json",
  "/*.lock",
  "/*.md",
  "/mypy.ini",
  "/noxfile.py",
  "bin/*",
  "examples/*",
  "src/*",
  "tests/*",
]

[tool.hatch.build.targets.sdist.hooks.custom]
path = "hatch_build.py"

[[tool.hatch.build.targets.sdist.hooks.custom.source-packages]]
source = "packages/nemo_platform_ext/src/nemo_platform_ext"
target = "nemo_platform_ext"
include = ["**/*.py", "skills/**/*.md", "skills/**/*.yaml", "skills/**/*.yml", "skills/**/*.json"]

[[tool.hatch.build.targets.sdist.hooks.custom.source-packages]]
source = "packages/models/src/models"
target = "models"

[[tool.hatch.build.targets.sdist.hooks.custom.source-packages]]
source = "packages/filesets/src/filesets"
target = "filesets"

[[tool.hatch.build.targets.sdist.hooks.custom.source-packages]]
source = "packages/nemo_evaluator_sdk/src/nemo_evaluator_sdk"
target = "nemo_evaluator_sdk"
include = ["**/*.py", "agent_eval/runtimes/fabric/sandbox.Dockerfile"]
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# replace relative links with absolute links
pattern = '\[(.+?)\]\(((?!https?://)\S+?)\)'
replacement = '[\1](https://github.com/stainless-sdks/nemo-platform-python/tree/main/\g<2>)'


[tool.hatch.version]
source = "nmp-dynamic-versioning"
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -n auto -k 'not aiohttp' -Wdefault"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
  "error"
]

[tool.pyright]
# this enables practically every flag given by pyright.
# there are a couple of flags that are still disabled by
# default in strict mode as they are experimental and niche.
typeCheckingMode = "strict"
pythonVersion = "3.12"

exclude = [
    "_dev",
    ".venv",
    ".nox",
    ".git",
]

reportImplicitOverride = true
reportOverlappingOverload = false

reportImportCycles = false
reportPrivateUsage = false

[tool.mypy]
pretty = true
show_error_codes = true

# Exclude _files.py because mypy isn't smart enough to apply
# the correct type narrowing and as this is an internal module
# it's fine to just use Pyright.
#
# We also exclude our `tests` as mypy doesn't always infer
# types correctly and Pyright will still catch any type errors.
exclude = ["src/nemo_platform/_files.py", "_dev/.*.py", "tests/.*"]

strict_equality = true
implicit_reexport = true
check_untyped_defs = true
no_implicit_optional = true

warn_return_any = true
warn_unreachable = true
warn_unused_configs = true

# Turn these options off as it could cause conflicts
# with the Pyright options.
warn_unused_ignores = false
warn_redundant_casts = false

disallow_any_generics = true
disallow_untyped_defs = true
disallow_untyped_calls = true
disallow_subclassing_any = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
cache_fine_grained = true

# By default, mypy reports an error if you assign a value to the result
# of a function call that doesn't return anything. We do this in our test
# cases:
# ```
# result = ...
# assert result is None
# ```
# Changing this codegen to make mypy happy would increase complexity
# and would not be worth it.
disable_error_code = "func-returns-value,overload-cannot-match"

# https://github.com/python/mypy/issues/12162
[[tool.mypy.overrides]]
module = "black.files.*"
ignore_errors = true
ignore_missing_imports = true


[tool.ruff]
line-length = 120
output-format = "grouped"
target-version = "py312"

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
  # isort
  "I",
  # bugbear rules
  "B",
  # remove unused imports
  "F401",
  # check for missing future annotations
  "FA102",
  # bare except statements
  "E722",
  # unused arguments
  "ARG",
  # print statements
  "T201",
  "T203",
  # misuse of typing.TYPE_CHECKING
  "TC004",
  # import rules
  "TID251",
]
ignore = [
  # mutable defaults
  "B006",
]
unfixable = [
  # disable auto fix for print statements
  "T201",
  "T203",
]

extend-safe-fixes = ["FA102"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"functools.lru_cache".msg = "This function does not retain type information for the wrapped function's arguments; The `lru_cache` function from `_utils` should be used instead"

[tool.ruff.lint.isort]
length-sort = true
length-sort-straight = true
combine-as-imports = true
extra-standard-library = ["typing_extensions"]
known-first-party = ["nemo_platform", "tests"]

[tool.ruff.lint.per-file-ignores]
"bin/**.py" = ["T201", "T203"]
"scripts/**.py" = ["T201", "T203"]
"tests/**.py" = ["T201", "T203"]
"examples/**.py" = ["T201", "T203"]
