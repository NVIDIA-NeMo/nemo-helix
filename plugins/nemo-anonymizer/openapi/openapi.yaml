    RiskTolerance:
      type: string
      enum:
      - minimal
      - low
      - moderate
      - high
      title: RiskTolerance
      description: "Risk tolerance presets for leakage mass thresholds.\n\nEach preset\
        \ bundles a coherent set of repair and review thresholds:\n\n- **minimal**\
        \ \u2014 Tight leakage threshold (0.6), flags for review aggressively.\n \
        \ Good for medical, legal, and financial data.\n- **low** \u2014 Default.\
        \ Moderate leakage threshold (1.0).\n  Good for most privacy-sensitive data.\n\
        - **moderate** \u2014 Relaxed leakage threshold (1.5), lower review bar.\n\
        - **high** \u2014 High leakage threshold (2.0), does not auto-repair\n  individual\
        \ high-sensitivity leaks."
