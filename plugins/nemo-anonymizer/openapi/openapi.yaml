openapi: 3.1.0
info:
  title: anonymizer (plugin)
  version: 0.0.0
paths:
  /apis/anonymizer/v2/workspaces/{workspace}/entity-labels:
    get:
      tags:
      - Anonymizer
      summary: List Default Entity Labels
      description: Return the default entity labels detected when a config omits ``entity_labels``.
      operationId: list_entity_labels_apis_anonymizer_v2_workspaces__workspace__entity_labels_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      responses:
        '200':
          description: The default entity labels used by the detection stage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityLabelsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/anonymizer/v2/workspaces/{workspace}/jobs/run:
    post:
      tags:
      - Anonymizer
      summary: Create Job
      operationId: create_job_apis_anonymizer_v2_workspaces__workspace__jobs_run_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunJobRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Anonymizer
      summary: List Jobs
      operationId: list_jobs_apis_anonymizer_v2_workspaces__workspace__jobs_run_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: page
        in: query
        required: false
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Page number.
          default: 1
          title: Page
        description: Page number.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Page size.
          default: 10
          title: Page Size
        description: Page size.
      - name: sort
        in: query
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/RunJobsSortField'
          description: The field to sort by. To sort in decreasing order, use `-`
            in front of the field name.
          default: -created_at
        description: The field to sort by. To sort in decreasing order, use `-` in
          front of the field name.
      - in: query
        name: filter
        style: deepObject
        required: false
        explode: true
        schema:
          $ref: '#/components/schemas/RunJobsListFilter'
        description: Filter jobs on various criteria.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunJobsPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/anonymizer/v2/workspaces/{workspace}/jobs/run/{job}/results/{name}:
    get:
      tags:
      - Anonymizer
      summary: Get Job Result
      operationId: get_job_result_apis_anonymizer_v2_workspaces__workspace__jobs_run__job__results__name__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: job
        in: path
        required: true
        schema:
          type: string
          title: Job
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobResultResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/anonymizer/v2/workspaces/{workspace}/jobs/run/{job}/results/{name}/download:
    get:
      tags:
      - Anonymizer
      summary: Download Job Result
      operationId: download_job_result_apis_anonymizer_v2_workspaces__workspace__jobs_run__job__results__name__download_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: job
        in: path
        required: true
        schema:
          type: string
          title: Job
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/anonymizer/v2/workspaces/{workspace}/jobs/run/{name}:
    get:
      tags:
      - Anonymizer
      summary: Get Job
      operationId: get_job_apis_anonymizer_v2_workspaces__workspace__jobs_run__name__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Anonymizer
      summary: Delete Job
      operationId: delete_job_apis_anonymizer_v2_workspaces__workspace__jobs_run__name__delete
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '204':
          description: Successful Response
        '404':
          description: Job not Found
        '409':
          description: Job is not in a terminal state
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/anonymizer/v2/workspaces/{workspace}/jobs/run/{name}/cancel:
    post:
      tags:
      - Anonymizer
      summary: Cancel Job
      operationId: cancel_job_apis_anonymizer_v2_workspaces__workspace__jobs_run__name__cancel_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/anonymizer/v2/workspaces/{workspace}/jobs/run/{name}/logs:
    get:
      tags:
      - Anonymizer
      summary: Get Job Logs
      operationId: get_job_logs_apis_anonymizer_v2_workspaces__workspace__jobs_run__name__logs_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: limit
        in: query
        required: false
        schema:
          title: Limit
          type: integer
      - name: page_cursor
        in: query
        required: false
        schema:
          title: Page Cursor
          type: string
      - name: tail
        in: query
        required: false
        schema:
          title: Tail
          type: integer
          maximum: 10000
          exclusiveMinimum: 0
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobLogPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/anonymizer/v2/workspaces/{workspace}/jobs/run/{name}/results:
    get:
      tags:
      - Anonymizer
      summary: List Job Results
      operationId: list_job_results_apis_anonymizer_v2_workspaces__workspace__jobs_run__name__results_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobListResultResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/anonymizer/v2/workspaces/{workspace}/jobs/run/{name}/status:
    get:
      tags:
      - Anonymizer
      summary: Get Job Status
      operationId: get_job_status_apis_anonymizer_v2_workspaces__workspace__jobs_run__name__status_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/anonymizer/v2/workspaces/{workspace}/preview:
    post:
      tags:
      - Anonymizer
      summary: Streaming preview of an Anonymizer config.
      description: Streaming preview of an Anonymizer config.
      operationId: PreviewFunction__route_apis_anonymizer_v2_workspaces__workspace__preview_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: X-Request-ID
        in: header
        required: false
        schema:
          title: X-Request-Id
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
      responses:
        '200':
          description: Newline-delimited JSON stream. Each line is one frame; read
            them incrementally rather than buffering the whole body.
          content:
            application/x-ndjson:
              schema:
                oneOf:
                - $ref: '#/components/schemas/LogFrame'
                - $ref: '#/components/schemas/PreviewDatasetFrame'
                - $ref: '#/components/schemas/TraceDatasetFrame'
                - $ref: '#/components/schemas/FailedRecordsFrame'
                - $ref: '#/components/schemas/Heartbeat'
                - $ref: '#/components/schemas/Done'
                - $ref: '#/components/schemas/Error'
                discriminator:
                  propertyName: kind
                  mapping:
                    log: '#/components/schemas/LogFrame'
                    preview_dataset: '#/components/schemas/PreviewDatasetFrame'
                    trace_dataset: '#/components/schemas/TraceDatasetFrame'
                    failed_records: '#/components/schemas/FailedRecordsFrame'
                    heartbeat: '#/components/schemas/Heartbeat'
                    done: '#/components/schemas/Done'
                    error: '#/components/schemas/Error'
                title: Response Previewfunction  Route Apis Anonymizer V2 Workspaces  Workspace  Preview
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AnnotateRequest:
      properties:
        format_template:
          type: string
          title: Format Template
          description: Template with {text} and {label} placeholders.
          default: <{text}, {label}>
        kind:
          type: string
          const: annotate
          title: Kind
          default: annotate
      type: object
      title: AnnotateRequest
      description: Tag each entity with a readable label token.
    AnonymizerConfigRequest:
      properties:
        detect:
          allOf:
          - $ref: '#/components/schemas/Detect'
          description: Entity detection configuration.
        replace:
          title: Replace
          description: Replacement method (Substitute(), Redact(), Annotate(), or
            Hash()).
          oneOf:
          - $ref: '#/components/schemas/SubstituteRequest'
          - $ref: '#/components/schemas/RedactRequest'
          - $ref: '#/components/schemas/AnnotateRequest'
          - $ref: '#/components/schemas/HashRequest'
          discriminator:
            propertyName: kind
            mapping:
              annotate: '#/components/schemas/AnnotateRequest'
              hash: '#/components/schemas/HashRequest'
              redact: '#/components/schemas/RedactRequest'
              substitute: '#/components/schemas/SubstituteRequest'
        rewrite:
          allOf:
          - $ref: '#/components/schemas/Rewrite'
          description: 'Optional rewrite-mode parameters. '
        emit_telemetry:
          type: boolean
          title: Emit Telemetry
          description: Whether to emit anonymous Anonymizer telemetry events. See
            the Telemetry section in the README for what is collected and how to opt
            out at the environment or CLI level.
          default: true
      type: object
      title: AnonymizerConfigRequest
      description: 'Wire-level mirror of ``AnonymizerConfig``.


        Restates ``replace`` as a proper ``kind``-discriminated union so the

        OpenAPI schema and generated SDK types are self-describing (ASTD-329),

        and so a missing/invalid ``kind`` fails pydantic validation (422)

        instead of the upstream callable discriminator''s bare ``TypeError``

        (ASTD-328). Convert to the upstream type with ``to_anonymizer_config()``

        before handing it to the ``anonymizer`` library.'
    AnonymizerInputSpec:
      properties:
        source:
          type: string
          title: Source
          description: HTTP(S) URL or fileset reference for a CSV/Parquet input file.
        text_column:
          type: string
          minLength: 1
          title: Text Column
          description: Column containing text to anonymize.
          default: text
        id_column:
          title: Id Column
          description: Optional column to use as record identifier.
          type: string
        data_summary:
          title: Data Summary
          description: Short description of the data.
          type: string
      type: object
      required:
      - source
      title: AnonymizerInputSpec
      description: 'Plugin boundary input spec.


        The upstream ``AnonymizerInput`` validates source locations at model

        construction time. The plugin keeps this looser shape at the API boundary

        so HTTP(S) URLs and fileset refs can be accepted and materialized before

        the upstream model is constructed.'
    AnonymizerRequest:
      properties:
        config:
          $ref: '#/components/schemas/AnonymizerConfigRequest'
        data:
          $ref: '#/components/schemas/AnonymizerInputSpec'
        model_configs:
          title: Model Configs
          items:
            $ref: '#/components/schemas/ModelConfig'
          type: array
        selected_models:
          $ref: '#/components/schemas/SelectedModelsOverrides'
      type: object
      required:
      - config
      - data
      title: AnonymizerRequest
      description: "User-facing anonymizer execution request.\n\nFields:\n  config:\
        \           AnonymizerConfigRequest \u2014 replace/rewrite mode + detection\
        \ params.\n  data:             AnonymizerInputSpec \u2014 HTTP(S) URL or fileset\
        \ source + text/id columns.\n  model_configs:    DD ``ModelConfig`` list.\
        \ ``provider`` on each entry must\n                    reference a NeMo Platform\
        \ inference provider name (optionally\n                    ``workspace/provider``).\
        \ Optional on the request model for\n                    compatibility, but\
        \ required by plugin preview/run execution\n                    so requests\
        \ route through NeMo Platform Inference Gateway.\n  selected_models:  Optional\
        \ role->alias overrides. Omitted roles fall back\n                    to the\
        \ upstream library YAML defaults."
    AnonymizerStepConfig:
      properties:
        request:
          $ref: '#/components/schemas/AnonymizerRequest'
        model_configs_yaml:
          type: string
          title: Model Configs Yaml
        dd_model_providers:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Dd Model Providers
      type: object
      required:
      - request
      - model_configs_yaml
      - dd_model_providers
      title: AnonymizerStepConfig
      description: Internal carrier passed to the task container for ``anonymizer.run``.
    ChatCompletionInferenceParams:
      properties:
        generation_type:
          type: string
          const: chat-completion
          title: Generation Type
          default: chat-completion
        max_parallel_requests:
          type: integer
          minimum: 1.0
          title: Max Parallel Requests
          default: 4
        timeout:
          title: Timeout
          type: integer
          minimum: 1.0
        extra_body:
          title: Extra Body
          additionalProperties: true
          type: object
        temperature:
          anyOf:
          - type: number
          - $ref: '#/components/schemas/UniformDistribution'
          - $ref: '#/components/schemas/ManualDistribution'
          title: Temperature
        top_p:
          anyOf:
          - type: number
          - $ref: '#/components/schemas/UniformDistribution'
          - $ref: '#/components/schemas/ManualDistribution'
          title: Top P
        max_tokens:
          title: Max Tokens
          type: integer
          minimum: 1.0
      additionalProperties: false
      type: object
      title: ChatCompletionInferenceParams
      description: "Configuration for LLM inference parameters.\n\nAttributes:\n \
        \   generation_type: Type of generation, always \"chat-completion\" for this\
        \ class.\n    temperature: Sampling temperature (0.0-2.0). Can be a fixed\
        \ value or a distribution for dynamic sampling.\n    top_p: Nucleus sampling\
        \ probability (0.0-1.0). Can be a fixed value or a distribution for dynamic\
        \ sampling.\n    max_tokens: Maximum number of tokens to generate in the response."
    DatetimeFilter:
      additionalProperties: false
      properties:
        $gte:
          description: Filter for results greater than or equal to this datetime.
          title: $Gte
          format: date-time
          type: string
        $lte:
          description: Filter for results less than or equal to this datetime.
          title: $Lte
          format: date-time
          type: string
      title: DatetimeFilter
      type: object
    Detect:
      properties:
        entity_labels:
          title: Entity Labels
          description: Labels to detect. None uses the built-in default detection
            label set. To inspect the default set, use `from anonymizer import DEFAULT_ENTITY_LABELS`.
          items:
            type: string
          type: array
        gliner_threshold:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Gliner Threshold
          description: GLiNER detection confidence threshold (0.0-1.0).
          default: 0.3
        validation_max_entities_per_call:
          type: integer
          exclusiveMinimum: 0.0
          title: Validation Max Entities Per Call
          description: Maximum number of candidate entities included in a single validator
            LLM call. When a row has more candidates than this, validation is split
            into chunks that are dispatched (round-robin) across the validator pool.
          default: 100
        validation_excerpt_window_chars:
          type: integer
          exclusiveMinimum: 0.0
          title: Validation Excerpt Window Chars
          description: Number of characters to include before and after a chunk's
            entity span when building the text excerpt sent to the validator. Bounds
            the prompt context the validator sees per chunk; it is NOT the LLM's context
            window limit.
          default: 500
      type: object
      title: Detect
      description: Configuration for the entity detection stage.
    DistributionType:
      type: string
      enum:
      - uniform
      - manual
      title: DistributionType
      description: Types of distributions for sampling inference parameters.
    Done:
      properties:
        kind:
          type: string
          const: done
          title: Kind
          default: done
      type: object
      required:
      - kind
      title: Done
      description: "Terminator frame for a successful stream.\n\nConvention only \u2014\
        \ yield this as the *last* frame in a stream. The\nroute adapter does not\
        \ synthesise it; if your stream just ends\nwithout a ``Done``, callers see\
        \ a clean EOF instead of an explicit\nsuccess marker. The marker is useful\
        \ when the same stream may end\nwith :class:`Error` instead."
    EmbeddingInferenceParams:
      properties:
        generation_type:
          type: string
          const: embedding
          title: Generation Type
          default: embedding
        max_parallel_requests:
          type: integer
          minimum: 1.0
          title: Max Parallel Requests
          default: 4
        timeout:
          title: Timeout
          type: integer
          minimum: 1.0
        extra_body:
          title: Extra Body
          additionalProperties: true
          type: object
        encoding_format:
          type: string
          enum:
          - float
          - base64
          title: Encoding Format
          default: float
        dimensions:
          title: Dimensions
          type: integer
      additionalProperties: false
      type: object
      title: EmbeddingInferenceParams
      description: "Configuration for embedding generation parameters.\n\nAttributes:\n\
        \    generation_type: Type of generation, always \"embedding\" for this class.\n\
        \    encoding_format: Format of the embedding encoding (\"float\" or \"base64\"\
        ).\n    dimensions: Number of dimensions for the embedding."
    EntityLabelsResponse:
      properties:
        data:
          items:
            type: string
          type: array
          title: Data
      type: object
      required:
      - data
      title: EntityLabelsResponse
      description: The default GLiNER entity labels detected when none are supplied.
    Error:
      properties:
        kind:
          type: string
          const: error
          title: Kind
          default: error
        message:
          type: string
          title: Message
        details:
          title: Details
          additionalProperties: true
          type: object
      type: object
      required:
      - kind
      - message
      title: Error
      description: "Terminator frame for an unsuccessful stream.\n\nConvention only\
        \ \u2014 yield this when an error occurs mid-stream and\nyou want to surface\
        \ a structured failure rather than letting the\nunderlying exception propagate\
        \ (which would close the connection\nabruptly). Pair with raising the underlying\
        \ exception for\nserver-side observability."
    FailedRecordsFrame:
      properties:
        kind:
          type: string
          const: failed_records
          title: Kind
          default: failed_records
        records:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Records
      type: object
      required:
      - kind
      - records
      title: FailedRecordsFrame
      description: Records that failed during the pipeline, with reasons.
    FileStorageType:
      type: string
      enum:
      - fileset
      title: FileStorageType
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HashRequest:
      properties:
        algorithm:
          type: string
          enum:
          - sha256
          - sha1
          - md5
          title: Algorithm
          description: Hash algorithm.
          default: sha256
        digest_length:
          type: integer
          maximum: 64.0
          minimum: 6.0
          title: Digest Length
          description: Number of hex characters to keep from the hash digest.
          default: 12
        format_template:
          type: string
          title: Format Template
          description: Template with {digest} required and optional {label}.
          default: <HASH_{label}_{digest}>
        kind:
          type: string
          const: hash
          title: Kind
          default: hash
      type: object
      title: HashRequest
      description: Replace each entity with a deterministic hash token.
    Heartbeat:
      properties:
        kind:
          type: string
          const: heartbeat
          title: Kind
          default: heartbeat
      type: object
      required:
      - kind
      title: Heartbeat
      description: "Idle-tick frame emitted by the route adapter every ~5 s of silence.\n\
        \nThe route adapter inserts these unconditionally on streams that go\nquiet\
        \ \u2014 they are not produced by user code. Plugins relying on\nstrict frame\
        \ typing on the receiving side should ignore unknown\n``kind`` values or include\
        \ :class:`Heartbeat` in their own\ndiscriminated union."
    ImageInferenceParams:
      properties:
        generation_type:
          type: string
          const: image
          title: Generation Type
          default: image
        max_parallel_requests:
          type: integer
          minimum: 1.0
          title: Max Parallel Requests
          default: 4
        timeout:
          title: Timeout
          type: integer
          minimum: 1.0
        extra_body:
          title: Extra Body
          additionalProperties: true
          type: object
      additionalProperties: false
      type: object
      title: ImageInferenceParams
      description: "Configuration for image generation models.\n\nWorks for both diffusion\
        \ and autoregressive image generation models. Pass all model-specific image\
        \ options via `extra_body`.\n\nAttributes:\n    generation_type: Type of generation,\
        \ always \"image\" for this class.\n\nExample:\n    ```python\n    # OpenAI-style\
        \ (DALL\xB7E): quality and size in extra_body or as top-level kwargs\n   \
        \ dd.ImageInferenceParams(\n        extra_body={\"size\": \"1024x1024\", \"\
        quality\": \"hd\"}\n    )\n\n    # Gemini-style: generationConfig.imageConfig\n\
        \    dd.ImageInferenceParams(\n        extra_body={\n            \"generationConfig\"\
        : {\n                \"imageConfig\": {\n                    \"aspectRatio\"\
        : \"1:1\",\n                    \"imageSize\": \"1024\"\n                }\n\
        \            }\n        }\n    )\n    ```"
    LogFrame:
      properties:
