          title: Instructions
          description: Additional instructions for the rewrite LLM.
          type: string
        risk_tolerance:
          allOf:
          - $ref: '#/components/schemas/RiskTolerance'
          description: Preset controlling repair thresholds and review flagging.
          default: low
        max_repair_iterations:
          type: integer
          minimum: 0.0
          title: Max Repair Iterations
          description: Maximum repair rounds. Set to 0 to disable repair.
          default: 3
        strict_entity_protection:
          type: boolean
          title: Strict Entity Protection
          description: If True, requires every entity to receive a protective disposition
            during sensitivity analysis.
          default: false
