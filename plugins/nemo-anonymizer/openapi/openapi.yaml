    ManualDistribution:
      properties:
        distribution_type:
          allOf:
          - $ref: '#/components/schemas/DistributionType'
          default: manual
        params:
          $ref: '#/components/schemas/ManualDistributionParams'
      additionalProperties: false
      type: object
      required:
      - params
      title: ManualDistribution
      description: "Manual (discrete) distribution for sampling inference parameters.\n\
        \nSamples from a discrete set of values with optional weights. Useful for\
        \ testing\nspecific values or creating custom probability distributions for\
        \ temperature or top_p.\n\nAttributes:\n    distribution_type: Type of distribution\
        \ (\"manual\").\n    params: Distribution parameters (values, weights)."
    ManualDistributionParams:
      properties:
        values:
          items:
            type: number
          type: array
          minItems: 1
          title: Values
        weights:
          title: Weights
          items:
            type: number
          type: array
      additionalProperties: false
      type: object
      required:
      - values
      title: ManualDistributionParams
      description: "Parameters for manual distribution sampling.\n\nAttributes:\n\
        \    values: List of possible values to sample from.\n    weights: Optional\
        \ list of weights for each value. If not provided, all values have equal probability."
    ModelConfig:
      properties:
        alias:
          type: string
          title: Alias
        model:
          type: string
          title: Model
        inference_parameters:
          oneOf:
          - $ref: '#/components/schemas/ChatCompletionInferenceParams'
          - $ref: '#/components/schemas/EmbeddingInferenceParams'
          - $ref: '#/components/schemas/ImageInferenceParams'
          title: Inference Parameters
          discriminator:
            propertyName: generation_type
            mapping:
              chat-completion: '#/components/schemas/ChatCompletionInferenceParams'
              embedding: '#/components/schemas/EmbeddingInferenceParams'
              image: '#/components/schemas/ImageInferenceParams'
        provider:
          type: string
          title: Provider
        skip_health_check:
          type: boolean
          title: Skip Health Check
          default: false
      additionalProperties: false
      type: object
      required:
      - alias
      - model
      - provider
      title: ModelConfig
      description: "Configuration for a model used for generation.\n\nAttributes:\n\
        \    alias: User-defined alias to reference in column configurations.\n  \
        \  model: Model identifier (e.g., from build.nvidia.com or other providers).\n\
        \    inference_parameters: Inference parameters for the model (temperature,\
        \ top_p, max_tokens, etc.).\n        The generation_type is determined by\
        \ the type of inference_parameters.\n    provider: Name of the model provider.\
        \ Must match the ``name`` field of a\n        ``ModelProvider`` registered\
        \ with the surrounding ``DataDesigner`` instance.\n    skip_health_check:\
        \ Whether to skip the health check for this model. Defaults to False."
