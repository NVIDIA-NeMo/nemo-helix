[project]
name = "nemo-switchyard-plugin"
version = "0.1.0"
description = "Switchyard inference middleware plugin for native request routing."
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx>=0.27.0,<1",
    # The router plugin owns the strategy contract (`OptimizationStrategy`), the type of the
    # class variable SwitchyardOptimizeJob declares itself with. Depending on the dispatcher is
    # the allowed direction; the router never names a strategy.
    "nemo-agent-optimization-plugin",
    "nemo-helix-plugin",
    "nemo-switchyard==0.3.0",
    "pyyaml>=6.0.2",
]

[project.entry-points."nemo.inference_middleware"]
nemo-switchyard = "nemo_switchyard.middleware:SwitchyardMiddleware"

# Discovered by `nemo agents optimize` as the `switchyard` strategy, via the
# `nemo_agent_optimization_strategy` class variable on SwitchyardOptimizeJob. The key sits
# under the dispatcher's `agent-optimization` plugin namespace rather than minting a new one:
# plugin allowlists and `nemo plugins list` group `nemo.jobs` entries by that prefix, so a
# deployment that allows the router also gets its strategies. Nothing mounts the key itself,
# so the job stays discoverable, not separately submittable.
[project.entry-points."nemo.jobs"]
"agent-optimization.switchyard" = "nemo_switchyard.jobs.optimize:SwitchyardOptimizeJob"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_switchyard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = ["switchyard_native: native Rust integration"]
