[project]
name = "nemo-switchyard-plugin"
version = "0.1.0"
description = "Switchyard inference middleware plugin for native request routing."
requires-python = ">=3.11,<3.15"
dependencies = [
    "httpx>=0.27.0,<1",
    "nemo-helix-plugin",
    "nemo-switchyard==0.3.0",
]

[project.entry-points."nemo.inference_middleware"]
nemo-switchyard = "nemo_switchyard.middleware:SwitchyardMiddleware"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_switchyard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = ["switchyard_native: native Rust integration"]
