[project]
name = "nemo-data-designer-plugin"
description = "NeMo Data Designer plugin."
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "NVIDIA", email = "nemo@nvidia.com" }]
dependencies = [
    "nemo-helix-plugin",
    "nemo-helix",
    "nhx-customization-common",
    "data-designer==0.9.3",
    "data-designer-nemo",
    "httpx>=0.27",
    "fastapi",
    "pandas",
]
version = "0.0.0"

[project.entry-points."nemo.services"]
data-designer = "nemo_data_designer_plugin.service:DataDesignerService"

[project.entry-points."nemo.cli"]
data-designer = "nemo_data_designer_plugin.cli.main:DataDesignerCLI"

[project.entry-points."nemo.sdk"]
data_designer = "nemo_data_designer_plugin.sdk.resources:data_designer_sdk_resources"

[project.entry-points."nemo.jobs"]
"data-designer.create" = "nemo_data_designer_plugin.jobs.create:CreateJob"
"data-designer.retrieval-generate" = "nemo_data_designer_plugin.jobs.retrieval_generate:RetrievalGenerateJob"
"data-designer.retrieval-prepare" = "nemo_data_designer_plugin.jobs.retrieval_prepare:RetrievalPrepareJob"
"data-designer.retrieval-run" = "nemo_data_designer_plugin.jobs.retrieval_run:RetrievalRunJob"

[project.entry-points."nemo.functions"]
"data-designer.preview" = "nemo_data_designer_plugin.functions.preview:PreviewFunction"
"data-designer.retrieval-preview" = "nemo_data_designer_plugin.functions.retrieval_preview:RetrievalPreviewFunction"

[project.entry-points."nemo.skills"]
data-designer = "nemo_data_designer_plugin.skills:get_skills_path"

[project.entry-points."data_designer.plugins"]
fileset-seed-datasets = "data_designer_nemo.plugins:fileset_seed_datasets_plugin"

[project.optional-dependencies]
retrieval-sdg = [
    "data-designer-retrieval-sdg==0.2.1",
    "huggingface-hub",
]

test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "fastapi>=0.115",
    "duckdb",
]

# Generated from [tool.bundle-package]; do not edit by hand.
data-designer-nemo = [
  "nemo-helix-plugin",
  "data-designer==0.9.3",
  "anyio>=4.0",
  "duckdb",
  "pydantic>=2",
]

# Generated from [tool.bundle-package]; do not edit by hand.
nemo-helix-plugin = [
  "anthropic>=0.88.0",
  "fastapi>=0.115.4",
  "jsonschema>=4.0.0",
  "lark>=1.1.0",
  "openai>=1.109.1",
  "pydantic>=2.12.0",
  "pydantic-settings>=2.8.1",
  "pyyaml>=6.0.2",
  "typer>=0.20.0,<0.26",
]

[build-system]
requires = ["hatchling", "nhx-build-tools"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_data_designer_plugin"]


[tool.uv.sources]
nemo-helix = { workspace = true }
nemo-helix-plugin = { workspace = true }
data-designer-nemo = { workspace = true }
nhx-build-tools = { workspace = true }
nhx-customization-common = { workspace = true }
data-designer-retrieval-sdg = { index = "data-designer-plugins" }

[[tool.uv.index]]
name = "data-designer-plugins"
url = "https://nvidia-nemo.github.io/DataDesignerPlugins/simple/"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "integration: high-level tests that exercise user-facing plugin workflows",
]

[tool.bundle-package]
data-designer-nemo = { source = "../../packages/data_designer_nemo/src/data_designer_nemo", module = "data_designer_nemo" }
nemo-helix-plugin = { source = "../../packages/nemo_helix_plugin/src/nemo_helix_plugin", module = "nemo_helix_plugin" }

# Opt this plugin into OpenAPI spec generation
[tool.nemo.openapi]
data_designer_plugin_allowlist = ["fileset-seed-datasets"]
