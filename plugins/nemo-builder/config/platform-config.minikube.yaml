#
# Platform config for the local minikube verification. Becomes the `nemo-platform-config`
# ConfigMap; see ../deploy/local/platform.yaml.
#
# Differs from ../config/platform-config.example.yaml in exactly the ways a local cluster
# differs, and each one is a thing this environment therefore cannot verify:
#
#   - the registry is in-cluster, anonymous and plain HTTP, so `push`'s credential handling and
#     the reconciler's Bearer-challenge path never execute
#   - the sandbox is sized for a laptop
#   - there is no image pull secret, because every image is side-loaded with `minikube image load`

platform:
  runtime: "kubernetes"
  base_url: "http://nemo-platform.nmp-platform.svc.cluster.local:8080"

service: {}

auth:
  enabled: false
  allow_unsigned_jwt: true
  policy_decision_point_provider: embedded
  policy_decision_point_base_url: "http://127.0.0.1:8080"
  admin_email: "admin@example.com"

entities: {}

secrets:
  allow_key_creation: true
  local_key_creation_path: "/var/lib/nemo/nmp-encryption-key.txt"

files:
  default_storage_config:
    type: local
    path: "/var/lib/nemo/files_storage"

jobs:
  executors:
    # The trust split: three profiles, three ServiceAccounts, one job.
    - provider: cpu
      profile: build-fetch
      backend: kubernetes_job
      config: &build_profile
        namespace: nmp-builds
        service_account_name: nmp-build-fetch
        launcher_image: nmp-jobs-launcher:local
        default_task_image: nmp-build:local
        storage:
          pvc_name: nmp-build-work
        node_selector:
          nmp.nvidia.com/build-node: "true"
        cleanup_completed_jobs_immediately: false
        ttl_seconds_after_finished: 3600
        resources:
          requests:
            cpu: "100m"
            memory: 256Mi

    - provider: cpu
      profile: build-control
      backend: kubernetes_job
      config:
        <<: *build_profile
        service_account_name: nmp-build-control

    - provider: cpu
      profile: build-push
      backend: kubernetes_job
      config:
        <<: *build_profile
        service_account_name: nmp-build-push

  executor_defaults:
    kubernetes_job:
      cleanup_completed_jobs_immediately: false
      ttl_seconds_after_finished: 3600

builder:
  namespace: nmp-builds
  work_pvc: nmp-build-work
  sandbox_image: gcr.io/kaniko-project/executor:debug

  # A Service name, which only resolves inside the cluster -- so this config is not usable from
  # outside it. That is fine here and is the reason the control plane moved in-cluster.
  default_registry: registry.nmp-builds.svc.cluster.local:5000
  repository_prefix: ""

  # Plain HTTP. Never do this against anything holding real artifacts: the digest an HTTP
  # registry reports is unauthenticated, which is the one property reading identity from a
  # registry is supposed to provide.
  registry_insecure: true

  # The compiler requires a push secret to exist even though this registry is anonymous, because
  # a deployment that cannot publish should fail the submit rather than the build. The Secrets
  # entry holds an empty docker config.
  push_secret: local-registry
  signing_key: k8s://nmp-builds/cosign-key
  signature_storage: tag

  # Sized for a laptop. On a real deployment this is the default 2 / 8Gi.
  sandbox_cpu: "500m"
  sandbox_memory: 1Gi

  reconcile_interval_seconds: 5
