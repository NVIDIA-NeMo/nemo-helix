#
# The minikube quickstart's platform config, the `nemo-helix-config` ConfigMap.
#
# LOCAL ONLY. Change each of these before starting a shared cluster from it:
#
#   - auth is off, so every request acts as the admin and no permission check runs: anything that
#     reaches the platform, a build's own `RUN` included, can read every workspace's secrets and mark
#     an image `ready` at a digest of its choosing
#   - `allow_unsigned_jwt` is on: with auth on, the platform would take an unsigned token for anyone
#   - `secrets.allow_key_creation` keeps the encryption key on the pod's own disk
#   - the registry is in-cluster, plain HTTP, and takes one password
#   - `repository_prefix` is empty (see "Configuration" in the README)
#   - finished jobs keep their pods for an hour, and their work directories until someone deletes them
#   - the sandbox is sized for a laptop
#   - the images are side-loaded with `minikube image load`, so there is no image pull secret

platform:
  runtime: "kubernetes"
  base_url: "http://nemo-helix.nhx-platform.svc.cluster.local:8080"

service: {}

auth:
  enabled: false
  allow_unsigned_jwt: true
  policy_decision_point_provider: embedded
  # Unused as deployed: the platform sets NHX_AUTH_POLICY_DECISION_POINT_BASE_URL to its base URL, the
  # Service, unless the deployment sets it. To turn auth on, set it to http://127.0.0.1:8080 in
  # deploy/platform.yaml, or the pod waits on itself and never becomes ready.
  policy_decision_point_base_url: "http://127.0.0.1:8080"
  admin_email: "admin@example.com"

entities: {}

secrets:
  allow_key_creation: true
  local_key_creation_path: "/var/lib/nemo/nhx-encryption-key.txt"

files:
  default_storage_config:
    type: local
    path: "/var/lib/nemo/files_storage"

jobs:
  executors:
    # One profile per step, each with its own ServiceAccount.
    - provider: cpu
      profile: build-fetch
      backend: kubernetes_job
      config: &build_profile
        namespace: nhx-builds
        service_account_name: nhx-build-fetch
        # The platform image ships /tools/jobs-launcher.
        launcher_image: my-registry/nhx-api:local
        storage:
          pvc_name: nhx-build-work
        # The work volume is ReadWriteOnce, so every build pod, sandboxes included, runs on the node
        # labelled in the README's step 1.
        node_selector:
          nhx.nvidia.com/build-node: "true"
        cleanup_completed_jobs_immediately: false
        ttl_seconds_after_finished: 3600
        resources:
          requests:
            cpu: "100m"
            memory: 256Mi

    - provider: cpu
      profile: build-control
      backend: kubernetes_job
      config:
        <<: *build_profile
        service_account_name: nhx-build-control

    - provider: cpu
      profile: build-push
      backend: kubernetes_job
      config:
        <<: *build_profile
        service_account_name: nhx-build-push

  executor_defaults:
    kubernetes_job:
      cleanup_completed_jobs_immediately: false
      ttl_seconds_after_finished: 3600

builder:
  sandbox:
    cpu: "500m"
    memory: 1Gi

  # Plain HTTP, which sends the push step's password, and the images, in the clear. Never against a
  # registry holding real artifacts.
  registry: http://registry.nhx-registry.svc.cluster.local:5000
  repository_prefix: ""

  # The push step's credentials: platform secrets in the submitting workspace, under the default names
  # builder-registry-username, builder-registry-password and builder-signing-key (README, step 5).
