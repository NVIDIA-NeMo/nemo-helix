[project]
name = "nemo-builder-plugin"
description = "In-cluster container image builds for NeMo Helix."
requires-python = ">=3.11,<3.15"
version = "0.1.0"
# `cryptography` parses the public key signatures are verified against.
dependencies = ["nemo-helix-plugin", "pydantic>=2.0.0", "cryptography>=42.0.0"]

[tool.uv.sources]
nemo-helix = { path = "../../packages/nemo_helix", editable = true }
nemo-helix-plugin = { path = "../../packages/nemo_helix_plugin", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_builder_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
