[project]
name = "nemo-builder-plugin"
description = "In-cluster container image builds for NeMo Helix."
requires-python = ">=3.11,<3.15"
version = "0.1.0"
dependencies = [
  "nemo-helix-plugin",
  # The OpenSandbox provider's egress policy. Pydantic only.
  "nhx-sandbox",
  "pydantic>=2.0.0",
  "cryptography>=42.0.0",
  "httpx>=0.27.0",
  "kubernetes>=29.0.0",
]

[project.optional-dependencies]
# Only the API process needs the SDK, for a FastAPI dependency in service.py. No step imports it.
service = ["nemo-helix"]
# Only the build step needs it, when the sandbox provider is opensandbox. The version uv.lock has.
opensandbox = ["opensandbox==0.1.16"]

[tool.uv.sources]
nemo-helix = { workspace = true }
nemo-helix-plugin = { workspace = true }
nhx-sandbox = { workspace = true }

[project.entry-points."nemo.services"]
builder = "nemo_builder_plugin.service:BuilderService"

[project.scripts]
# compile.py emits `nhx-build <step>` as each job step's command.
nhx-build = "nemo_builder_plugin.run.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_builder_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
