#
# The credential broker's namespace, identity and permissions (run/broker.py).
#
# The broker holds the registry credential and the signing key, so it lives in a namespace of its
# own under a ServiceAccount of its own: nothing in `nhx-builds`, where callers' jobs run, can
# read either. It needs exactly two permissions:
#
#   create tokenreviews        -- to ask the API server whose token a step presented, and which
#                                 pod it is bound to;
#   get pods in nhx-builds     -- to read that pod's labels: which job, workspace and step Jobs
#                                 created it for. Granted beside the build namespace itself,
#                                 which this file does not create.
#
# It has no platform identity at all: it reads a job's rows as the submitter, by exchanging the
# step's own token, or anonymously where platform auth is off.
#
# The Deployment itself is deployment-specific -- it mounts the credential, the key and the
# platform's `builder:` config -- so it is not here.
apiVersion: v1
kind: Namespace
metadata:
  name: nhx-build-broker
  labels:
    app.kubernetes.io/managed-by: nemo-builder
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nhx-build-broker
  namespace: nhx-build-broker
  labels:
    app.kubernetes.io/managed-by: nemo-builder
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nhx-build-broker-token-review
  labels:
    app.kubernetes.io/managed-by: nemo-builder
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: nhx-build-broker-token-review
  labels:
    app.kubernetes.io/managed-by: nemo-builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nhx-build-broker-token-review
subjects:
  - kind: ServiceAccount
    name: nhx-build-broker
    namespace: nhx-build-broker
---
# Only a job step may reach the broker: ingress only from pods Jobs created in the build
# namespace. The sandbox, which runs callers' code, must be kept from it from its own side too, by
# an egress policy that denies every cluster address. Enforced only where the CNI enforces
# NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nhx-build-broker-ingress
  namespace: nhx-build-broker
  labels:
    app.kubernetes.io/managed-by: nemo-builder
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: nhx-builds
          podSelector:
            matchLabels:
              nhx.nvidia.com/managed_by: jobs-controller
