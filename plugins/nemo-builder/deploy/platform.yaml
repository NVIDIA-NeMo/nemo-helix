#
# The platform, with only the services the builder uses, in one pod with SQLite: every service,
# as the Helm chart runs them, doesn't fit in a laptop's minikube.
apiVersion: v1
kind: Namespace
metadata:
  name: nhx-platform
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nemo-helix
  namespace: nhx-platform
---
# The jobs controller's, bound here for its default execution profile and in builds.yaml for the
# build jobs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nemo-helix-jobs
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create", "get", "list", "delete", "patch", "update"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nemo-helix-jobs
  namespace: nhx-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nemo-helix-jobs
subjects:
  - kind: ServiceAccount
    name: nemo-helix
    namespace: nhx-platform
---
# Not an emptyDir: the database, the Files store and the Secrets encryption key must survive a
# restart.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nemo-helix-data
  namespace: nhx-platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: nemo-helix
  namespace: nhx-platform
spec:
  selector: { app: nemo-helix }
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nemo-helix
  namespace: nhx-platform
spec:
  # One replica, replaced rather than rolled, because of SQLite.
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: nemo-helix }
  template:
    metadata:
      labels: { app: nemo-helix }
    spec:
      serviceAccountName: nemo-helix
      containers:
        - name: platform
          image: nhx-api-builder:local
          imagePullPolicy: IfNotPresent
          command: ["/app/.venv/bin/nemo"]
          args:
            - services
            - run
            - --services
            - auth,entities,jobs,files,secrets,builder
            - --controllers
            - entities,jobs
            - --host
            - 0.0.0.0
            - --port
            - "8080"
          env:
            # Where the jobs controller runs a profile that names no namespace.
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - { name: NHX_CONFIG_FILE_PATH, value: /etc/nhx/config.yaml }
            - { name: NHX_DATA_DIR, value: /var/lib/nemo }
            - { name: NHX_BASE_URL, value: "http://nemo-helix.nhx-platform.svc.cluster.local:8080" }
            - { name: DATABASE_DIALECT, value: sqlite }
            - { name: DATABASE_PATH, value: /var/lib/nemo/nhx-platform.db }
            - { name: NHX_CONFIG_WARNINGS_DISABLED, value: "1" }
          ports:
            - containerPort: 8080
          volumeMounts:
            - { name: config, mountPath: /etc/nhx }
            - { name: data, mountPath: /var/lib/nemo }
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests: { cpu: "200m", memory: 768Mi }
      volumes:
        - name: config
          configMap: { name: nemo-helix-config }
        - name: data
          persistentVolumeClaim: { claimName: nemo-helix-data }
