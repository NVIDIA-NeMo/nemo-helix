#
# The work volume. `fetch` writes the context here, the sandbox reads it and writes an OCI
# layout back, and `push` reads that. The data path between the trusted plane and the untrusted
# one is a volume rather than a network, which is why step 2 never has to read what it runs.
#
# ACCESS MODE -- a PoC deviation worth reading before copying this file.
#
# The design wants ReadWriteMany: three pods, possibly three nodes, one volume. Many clusters
# have no RWX StorageClass out of the box -- on GKE, for example, only while the Filestore CSI
# driver is not installed.
#
# RWO survives here only because the steps are strictly sequential and the `build` step mounts
# nothing at all, so the volume is attached to one node at a time by construction. To make that
# reliable rather than lucky, every build pod is pinned to a single labelled node (see the
# `node_selector` on all three execution profiles, and on the sandbox pod spec).
#
# A production deployment needs RWX. Pinning every build in a deployment to one node is a
# throughput ceiling, not a security property, and it is the first thing to remove.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nhx-build-work
  namespace: nhx-builds
  labels:
    app.kubernetes.io/managed-by: nemo-builder
spec:
  accessModes:
    - ReadWriteOnce
  # No `storageClassName`, deliberately: the cluster's default class is used.
  #
  # An earlier version pinned `standard-rwo`, which is a GKE name. Applied to any other cluster
  # the claim simply stays `Pending` and every build pod sits unschedulable with
  # "pod has unbound immediate PersistentVolumeClaims" -- a failure that reads as a scheduling
  # problem rather than as a one-word portability bug. Set this explicitly only where a
  # deployment needs a class other than its default, and then it is an operator's edit.
  resources:
    requests:
      storage: 100Gi
