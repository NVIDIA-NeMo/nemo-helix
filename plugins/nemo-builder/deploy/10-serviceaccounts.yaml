#
# Three ServiceAccounts, one per trusted step. The trust split IS these three strings: each
# execution profile names one, and no two of them hold the same thing.
#
#   nhx-build-fetch    reads Files, as the submitter.  May NOT create pods. Holds no credential.
#   nhx-build-control  may create/delete pods.         May NOT read Files.  Holds NO credential.
#   nhx-build-push     holds NO RBAC at all.           Gets a registry token, and a signature, from
#                                                      the credential broker -- for its own job.
#
# None of them can READ a credential, and that is deliberate. `jobs.create` is in the Editor role
# and no execution profile is authorized, so anyone who can submit a build can run a raw job as
# any of these identities. What such a job gets is what the identity can reach: for
# `nhx-build-push`, only what the broker grants a job with pending rows -- which a raw job has not.
#
# The sandbox pod that runs caller-authored RUN gets none of them -- it runs with
# automountServiceAccountToken: false and therefore presents no identity whatsoever.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nhx-build-fetch
  namespace: nhx-builds
  labels:
    app.kubernetes.io/managed-by: nemo-builder
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nhx-build-control
  namespace: nhx-builds
  labels:
    app.kubernetes.io/managed-by: nemo-builder
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nhx-build-push
  namespace: nhx-builds
  labels:
    app.kubernetes.io/managed-by: nemo-builder
