#
# The one new privilege in the design.
#
# `nhx-build-control` -- the `supervise` step -- is the control plane for an untrusted pod. It
# creates the sandbox, watches it, reads its log, and deletes it. That is all it may do, and this
# Role is deliberately the shortest file here: pods in this namespace, and nothing else.
#
# It holds no Files client and no registry credential, so a compromise of this identity buys pod
# creation in a namespace whose NetworkPolicy already denies the cluster -- not a workspace escape.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nhx-build-pod-control
  namespace: nhx-builds
  labels:
    app.kubernetes.io/managed-by: nemo-builder
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nhx-build-pod-control
  namespace: nhx-builds
  labels:
    app.kubernetes.io/managed-by: nemo-builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nhx-build-pod-control
subjects:
  # `nhx-build-control` ONLY. Binding `fetch` or `push` here would hand pod creation to an
  # identity that also holds a credential, which is the confused deputy the step split exists
  # to remove.
  - kind: ServiceAccount
    name: nhx-build-control
    namespace: nhx-builds
---
# The signing key, readable by the one step that signs.
#
# `builder.signing_key` is a `k8s://<namespace>/<secret>` reference, which cosign resolves
# through the Kubernetes API using the pod's own ServiceAccount. So `nhx-build-push` needs `get`
# on exactly that Secret and nothing else -- not `list`, which would let it enumerate every
# secret in the namespace including the registry credential's Kubernetes copy.
#
# `nhx-build-fetch` and `nhx-build-control` get no such binding. A caller cannot choose whether
# its image is signed, and the steps that run closest to caller input cannot reach the key that
# does the signing.
#
# A KMS-backed key (`gcpkms://`) removes this Role entirely, because the private half never
# materialises anywhere a pod could read it. That is `M1-7`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nhx-build-read-signing-key
  namespace: nhx-builds
  labels:
    app.kubernetes.io/managed-by: nemo-builder
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["cosign-key"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nhx-build-read-signing-key
  namespace: nhx-builds
  labels:
    app.kubernetes.io/managed-by: nemo-builder
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nhx-build-read-signing-key
subjects:
  - kind: ServiceAccount
    name: nhx-build-push
    namespace: nhx-builds
