#
# A registry that takes a username and password. Its password file is made by hand (README, step 4),
# from the same credential the default workspace's builder secrets hold.
apiVersion: v1
kind: Namespace
metadata:
  name: nhx-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: nhx-registry
spec:
  replicas: 1
  selector:
    matchLabels: { app: registry }
  template:
    metadata:
      labels: { app: registry }
    spec:
      containers:
        - name: registry
          image: registry:3.0.0
          ports: [{ containerPort: 5000 }]
          env:
            - { name: REGISTRY_STORAGE_DELETE_ENABLED, value: "true" }
            - { name: REGISTRY_AUTH, value: htpasswd }
            - { name: REGISTRY_AUTH_HTPASSWD_REALM, value: nhx-registry }
            - { name: REGISTRY_AUTH_HTPASSWD_PATH, value: /etc/distribution/auth/htpasswd }
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
            - { name: htpasswd, mountPath: /etc/distribution/auth, readOnly: true }
          resources:
            requests: { cpu: "50m", memory: 128Mi }
      volumes:
        - name: data
          emptyDir: {}
        - name: htpasswd
          secret: { secretName: registry-htpasswd }
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: nhx-registry
spec:
  selector: { app: registry }
  ports:
    - port: 5000
      targetPort: 5000
