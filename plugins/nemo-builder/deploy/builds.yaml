#
# The build namespace, where each build's job steps and its sandbox run.
#
# Everything in this namespace is here, including the platform's permissions in it. Each file in
# deploy/ creates its own namespace first, and nothing in any other, so `kubectl apply -f` can take
# them in any order.
apiVersion: v1
kind: Namespace
metadata:
  name: nhx-builds
  labels:
    # Not `restricted`: the sandbox runs as root.
    pod-security.kubernetes.io/enforce: baseline
---
# One per step. None may read a Secret: the push step's credentials are platform secrets, which
# Jobs fetches for it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nhx-build-fetch
  namespace: nhx-builds
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nhx-build-control
  namespace: nhx-builds
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nhx-build-push
  namespace: nhx-builds
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nhx-build-pod-control
  namespace: nhx-builds
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nhx-build-pod-control
  namespace: nhx-builds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: nhx-build-pod-control
subjects:
  - kind: ServiceAccount
    name: nhx-build-control
    namespace: nhx-builds
---
# The platform's jobs controller. Its ClusterRole is in platform.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nemo-helix-jobs
  namespace: nhx-builds
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nemo-helix-jobs
subjects:
  - kind: ServiceAccount
    name: nemo-helix
    namespace: nhx-platform
---
# ReadWriteOnce, so every build pod runs on the node labelled `nhx.nvidia.com/build-node=true`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nhx-build-work
  namespace: nhx-builds
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Gi
