          title: Dockerfile
          description: "Project-relative Dockerfile to build the victim image from,\
            \ instead of a generic one \u2014 for agents needing system packages or\
            \ a custom base image. Requires `binaries`, and a `workflow` (given or\
            \ detected): the image is how the environment is built, the workflow is\
            \ what gets served and hardened. The image must carry a 'sandbox' user/group,\
            \ iproute2, and `nat` on the default PATH."
          type: string
        binaries:
          title: Binaries
          description: 'In-container glob patterns scoping which processes may egress,
            e.g. ''/app/.venv/bin/**''. Required with `dockerfile`: a BYO image''s
            layout is unknown, so the sandbox policy cannot infer it.'
