openapi: 3.1.0
info:
  title: agent-hardener (plugin)
  version: 0.0.0
paths:
  /apis/agent-hardener/v1/healthz:
    get:
      tags:
      - Agent Hardener Plugin
      summary: Healthz
      operationId: healthz_apis_agent_hardener_v1_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Healthz Apis Agent Hardener V1 Healthz Get
  /apis/agent-hardener/v2/workspaces/{workspace}/jobs:
    post:
      tags:
      - Agent Hardener Jobs
      summary: Create Job
      operationId: create_job_apis_agent_hardener_v2_workspaces__workspace__jobs_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WarGameJobRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarGameJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Agent Hardener Jobs
      summary: List Jobs
      operationId: list_jobs_apis_agent_hardener_v2_workspaces__workspace__jobs_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: page
        in: query
        required: false
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Page number.
          default: 1
          title: Page
        description: Page number.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Page size.
          default: 10
          title: Page Size
        description: Page size.
      - name: sort
        in: query
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/WarGameJobsSortField'
          description: The field to sort by. To sort in decreasing order, use `-`
            in front of the field name.
          default: -created_at
        description: The field to sort by. To sort in decreasing order, use `-` in
          front of the field name.
      - in: query
        name: filter
        style: deepObject
        required: false
        explode: true
        schema:
          $ref: '#/components/schemas/WarGameJobsListFilter'
        description: Filter jobs on various criteria.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarGameJobsPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/agent-hardener/v2/workspaces/{workspace}/jobs/{job}/results/{name}:
    get:
      tags:
      - Agent Hardener Jobs
      summary: Get Job Result
      operationId: get_job_result_apis_agent_hardener_v2_workspaces__workspace__jobs__job__results__name__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: job
        in: path
        required: true
        schema:
          type: string
          title: Job
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobResultResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/agent-hardener/v2/workspaces/{workspace}/jobs/{job}/results/{name}/download:
    get:
      tags:
      - Agent Hardener Jobs
      summary: Download Job Result
      operationId: download_job_result_apis_agent_hardener_v2_workspaces__workspace__jobs__job__results__name__download_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: job
        in: path
        required: true
        schema:
          type: string
          title: Job
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/agent-hardener/v2/workspaces/{workspace}/jobs/{name}:
    get:
      tags:
      - Agent Hardener Jobs
      summary: Get Job
      operationId: get_job_apis_agent_hardener_v2_workspaces__workspace__jobs__name__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarGameJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Agent Hardener Jobs
      summary: Delete Job
      operationId: delete_job_apis_agent_hardener_v2_workspaces__workspace__jobs__name__delete
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '204':
          description: Successful Response
        '404':
          description: Job not Found
        '409':
          description: Job is not in a terminal state
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/agent-hardener/v2/workspaces/{workspace}/jobs/{name}/cancel:
    post:
      tags:
      - Agent Hardener Jobs
      summary: Cancel Job
      operationId: cancel_job_apis_agent_hardener_v2_workspaces__workspace__jobs__name__cancel_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarGameJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/agent-hardener/v2/workspaces/{workspace}/jobs/{name}/logs:
    get:
      tags:
      - Agent Hardener Jobs
      summary: Get Job Logs
      operationId: get_job_logs_apis_agent_hardener_v2_workspaces__workspace__jobs__name__logs_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: limit
        in: query
        required: false
        schema:
          title: Limit
          type: integer
      - name: page_cursor
        in: query
        required: false
        schema:
          title: Page Cursor
          type: string
      - name: tail
        in: query
        required: false
        schema:
          title: Tail
          type: integer
          maximum: 10000
          exclusiveMinimum: 0
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobLogPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/agent-hardener/v2/workspaces/{workspace}/jobs/{name}/results:
    get:
      tags:
      - Agent Hardener Jobs
      summary: List Job Results
      operationId: list_job_results_apis_agent_hardener_v2_workspaces__workspace__jobs__name__results_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobListResultResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/agent-hardener/v2/workspaces/{workspace}/jobs/{name}/status:
    get:
      tags:
      - Agent Hardener Jobs
      summary: Get Job Status
      operationId: get_job_status_apis_agent_hardener_v2_workspaces__workspace__jobs__name__status_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/agent-hardener/v2/workspaces/{workspace}/manifests:
    get:
      tags:
      - Agent Hardener Manifests
      summary: List Manifests
      description: List saved manifests in the workspace, with pagination and an ``agent``/``source_type``
        filter.
      operationId: list_manifests_apis_agent_hardener_v2_workspaces__workspace__manifests_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: -created_at
          title: Sort
      - in: query
        name: filter
        style: deepObject
        required: false
        explode: true
        schema:
          $ref: '#/components/schemas/ManifestFilter'
        description: 'Filter results on various criteria. Supports bracket notation
          (?filter[field][$op]=value), JSON ({"field":{"$op":"value"}}), and text
          syntax (field:"value"). Operators: $eq (exact match), $like (substring),
          $lt, $lte, $gt, $gte (comparison), $in, $nin (set membership), $and, $or,
          $not (logical). Default operator is $eq.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Manifests Apis Agent Hardener V2 Workspaces  Workspace  Manifests
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Agent Hardener Manifests
      summary: Create Manifest
      description: '`init`: build a manifest (from a deployed agent or an uploaded
        project) and persist it by ``name``.'
      operationId: create_manifest_apis_agent_hardener_v2_workspaces__workspace__manifests_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManifestInit'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHardenerManifest'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/agent-hardener/v2/workspaces/{workspace}/manifests/inspect:
    post:
      tags:
      - Agent Hardener Manifests
      summary: Inspect Project
      description: "Detect an uploaded NAT project's layout (`agent-hardener inspect`)\
        \ to pre-fill the create wizard.\n\nDownloads the project bundle, expands\
        \ it, and runs the read-only, offline detector \u2014 no code is\nexecuted.\
        \ Returns the discovered workflows, launch mode, name, secrets, and egress\
        \ as defaults."
      operationId: inspect_project_apis_agent_hardener_v2_workspaces__workspace__manifests_inspect_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectProjectRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectProjectResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/agent-hardener/v2/workspaces/{workspace}/manifests/inspect-agent:
    post:
      tags:
      - Agent Hardener Manifests
      summary: Inspect Agent Endpoint
      description: 'Derive the deployed-agent create-form defaults (victim port +
        secret names) for pre-fill.


        Read-only: fetches the stored agent config and its running deployment; nothing
        is materialized.'
      operationId: inspect_agent_endpoint_apis_agent_hardener_v2_workspaces__workspace__manifests_inspect_agent_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InspectAgentRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InspectAgentResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/agent-hardener/v2/workspaces/{workspace}/manifests/{name}:
    get:
      tags:
      - Agent Hardener Manifests
      summary: Get Manifest
      description: Get a single manifest by name.
      operationId: get_manifest_apis_agent_hardener_v2_workspaces__workspace__manifests__name__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHardenerManifest'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Agent Hardener Manifests
      summary: Update Manifest
      description: "Edit a manifest's cached benign suite, victim port, egress, or\
        \ war-game settings.\n\nThe agent source itself is immutable \u2014 re-create\
        \ the manifest to point at a different agent, or\n`POST /manifests/{name}/refresh`\
        \ to re-resolve the one it already targets."
      operationId: update_manifest_apis_agent_hardener_v2_workspaces__workspace__manifests__name__patch
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManifestUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHardenerManifest'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Agent Hardener Manifests
      summary: Delete Manifest
      description: Delete a saved manifest by name, along with the victim bundle the
        service created for it.
      operationId: delete_manifest_apis_agent_hardener_v2_workspaces__workspace__manifests__name__delete
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/agent-hardener/v2/workspaces/{workspace}/manifests/{name}/refresh:
    post:
      tags:
      - Agent Hardener Manifests
      summary: Refresh Manifest
      description: "Re-resolve an agent-source manifest against the agent as it is\
        \ *now*.\n\nA manifest is a frozen target, so edits to the agent \u2014 a\
        \ new model, an added tool, a redeploy \u2014\ndo not reach it on their own.\
        \ This is how you take them, deliberately, when you want the next\nrun to\
        \ measure the current agent rather than the one you saved.\n\nEverything the\
        \ operator chose is kept: egress, secrets, models, defenders, intensity, rounds,\
        \ and\nthe cached benign suite. Only the scaffold and its rendered manifest\
        \ are rebuilt."
      operationId: refresh_manifest_apis_agent_hardener_v2_workspaces__workspace__manifests__name__refresh_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHardenerManifest'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/agent-hardener/v2/workspaces/{workspace}/model-config-defaults:
    get:
      tags:
      - Agent Hardener Manifests
      summary: Get Model Config Defaults
      description: The built-in per-group model defaults (attack/analysis) the create/run
        forms pre-fill.
      operationId: get_model_config_defaults_apis_agent_hardener_v2_workspaces__workspace__model_config_defaults_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelConfigDefaults'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/agent-hardener/v2/workspaces/{workspace}/model-config/validate:
    post:
      tags:
      - Agent Hardener Manifests
      summary: Validate Model Config
      description: "Probe a model choice's endpoint/key (the \"Test connection\" affordance)\
        \ and list reachable models.\n\nResolves the chosen Secret to its value (if\
        \ any) and lists ``{base_url}/models``. Never leaks the key \u2014\nonly the\
        \ boolean verdict + the reachable model ids come back, so the UI can offer\
        \ real options."
      operationId: validate_model_config_apis_agent_hardener_v2_workspaces__workspace__model_config_validate_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateModelRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidateModelResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/agent-hardener/v2/workspaces/{workspace}/runs:
    get:
      tags:
      - Agent Hardener Runs
      summary: List Runs
      description: List war-game runs in the workspace, with pagination and an ``agent``/``status``
        filter.
      operationId: list_runs_apis_agent_hardener_v2_workspaces__workspace__runs_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: -created_at
          title: Sort
      - in: query
        name: filter
        style: deepObject
        required: false
        explode: true
        schema:
          $ref: '#/components/schemas/RunFilter'
        description: 'Filter results on various criteria. Supports bracket notation
          (?filter[field][$op]=value), JSON ({"field":{"$op":"value"}}), and text
          syntax (field:"value"). Operators: $eq (exact match), $like (substring),
          $lt, $lte, $gt, $gte (comparison), $in, $nin (set membership), $and, $or,
          $not (logical). Default operator is $eq.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Runs Apis Agent Hardener V2 Workspaces  Workspace  Runs
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/agent-hardener/v2/workspaces/{workspace}/runs/{name}:
    get:
      tags:
      - Agent Hardener Runs
      summary: Get Run
      description: Get a single war-game run by name.
      operationId: get_run_apis_agent_hardener_v2_workspaces__workspace__runs__name__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentHardenerRun'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Agent Hardener Runs
      summary: Delete Run
      description: Delete a war-game run record. The underlying platform job is cancelled/deleted
        separately.
      operationId: delete_run_apis_agent_hardener_v2_workspaces__workspace__runs__name__delete
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/agent-hardener/v2/workspaces/{workspace}/runs/{name}/apply-mitigation:
    post:
      tags:
      - Agent Hardener Runs
      summary: Apply Mitigation
      description: 'Adopt a run''s hardened workflow: write it onto the run''s target
        agent config (no redeploy).


        Reverses the Inference-Gateway injection so the stored config stays deployment-neutral,
        then updates

        the ``Agent`` entity in place. The user must redeploy the agent for the guardrails
        to take effect.'
      operationId: apply_mitigation_apis_agent_hardener_v2_workspaces__workspace__runs__name__apply_mitigation_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      requestBody:
