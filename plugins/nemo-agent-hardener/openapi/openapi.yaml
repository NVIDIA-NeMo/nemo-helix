            which is what Studio does since it has no TTY.
          type: string
        workflow:
          title: Workflow
          description: Chosen workflow path within the project (project-relative).
          type: string
        launch_mode:
          title: Launch Mode
          description: 'Victim launch mode: ''workflow'' (a generic image built from
            the project) or ''byo'' (built from the project''s own Dockerfile). ''byo''
            needs either a `dockerfile` here or a `manifest_yaml` that already carries
            one. Derived from the manifest when omitted.'
          type: string
