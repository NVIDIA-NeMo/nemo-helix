components:
  schemas:
    AgentHardenerManifest:
      properties:
        name:
          type: string
          title: Name
          description: Entity name within the workspace
          default: ''
        workspace:
          type: string
          pattern: ^[\w\-\+.@:]+$
          title: Workspace
          description: Workspace identifier
        project:
          title: Project
          description: The name of the project associated with this entity.
          type: string
        agent:
          type: string
          title: Agent
          description: Deployed agent reference (workspace/name) this manifest targets.
          default: ''
        source_type:
          type: string
          enum:
          - agent
          - project
          title: Source Type
          description: How the manifest was built ('agent'|'project').
          default: agent
        project_fileset:
          type: string
          title: Project Fileset
          description: Fileset ref holding the uploaded NAT project bundle (source_type
            'project'); the run re-downloads it to a project_dir before launching
            the victim.
          default: ''
        agent_fileset:
          type: string
          title: Agent Fileset
          description: Fileset ref holding the scaffold resolved from the agent (source_type
            'agent'). Empty on manifests created before targets were frozen; those
            re-resolve once, then store a ref.
          default: ''
        workflow:
          type: string
          title: Workflow
          description: Chosen workflow path within the project (project source, display).
          default: ''
        launch_mode:
          type: string
          title: Launch Mode
          description: Victim launch mode ('workflow'|'byo'; project source).
          default: ''
        dockerfile:
          type: string
          title: Dockerfile
          description: Project-relative Dockerfile the victim image is built from
            ('byo' launch mode). Stored alongside launch_mode so a manifest says which
            image it uses, not merely that it brings one.
          default: ''
        binaries:
          items:
            type: string
          type: array
          title: Binaries
          description: In-container glob patterns scoping which processes may egress
            ('byo' launch mode); agent-hardener requires them because a BYO image's
            layout cannot be inferred.
        manifest_yaml:
          type: string
          title: Manifest Yaml
          description: The resolved agent-hardener.yaml content (for display).
          default: ''
        port:
          type: integer
          title: Port
          description: Victim port the war-game will target.
          default: 0
        secrets:
          items:
            type: string
          type: array
          title: Secrets
          description: Secret names the victim agent requires.
        egress:
          items:
            type: string
          type: array
          title: Egress
          description: Allow-listed egress host[:port] entries the victim may reach.
            Config-only agents keep tool hosts in packaged code, so egress discovery
            can't find them; without these the victim's outbound calls are dropped.
        env:
          additionalProperties:
            type: string
          type: object
          title: Env
          description: "Non-secret environment variables for the victim (agent-hardener's\
            \ agent.env) \u2014 a host-backend URL, a feature flag. Stored in plaintext\
            \ on this entity, so never put credentials here: those belong in `secrets`,\
            \ which names them and resolves the values from the platform Secrets store\
            \ at run time."
        warnings:
          items:
            type: string
          type: array
          title: Warnings
          description: Non-fatal notes from scaffolding.
        benign_suite:
          items:
            additionalProperties:
              type: string
            type: object
          type: array
          title: Benign Suite
          description: Cached, reviewed benign test suite (tool,payload,label,rationale,persona
            rows); generated on the first run and reused/edited thereafter. Empty
            until generated.
        benign_interview:
          items:
            additionalProperties:
              type: string
            type: object
          type: array
          title: Benign Interview
          description: Interview Q&A (gap,question,answer rows) captured during the
            last benign-suite generation, kept for display. Empty until generated.
        defenders:
          items:
            type: string
          type: array
          title: Defenders
          description: Enabled defender keys ('guardrails','openshell'); empty means
            agent-hardener's defaults (all applicable). Materialized into the manifest's
            overrides.defenders at run time.
        attack_intensity:
          type: string
          enum:
          - light
          - standard
          - thorough
          title: Attack Intensity
          description: Attacker (garak) effort preset, materialized into the manifest's
            garak block at run time.
          default: standard
        rounds:
          type: integer
          minimum: 1.0
          title: Rounds
          description: Number of iterative attack/defend/validate hardening rounds;
            passed to agent-hardener's `run --rounds` at run time.
          default: 1
        models:
          allOf:
          - $ref: '#/components/schemas/WarGameModels'
          description: Stored default model selection (attack/analysis/agent groups);
            an unset group uses agent-hardener's built-in default. A run may override
            these per-launch.
        id:
          type: string
          title: Id
          readOnly: true
        created_at:
          title: Created At
          readOnly: true
          type: string
          format: date-time
        created_by:
          title: Created By
          readOnly: true
          nullable: true
          type: string
        updated_at:
          title: Updated At
          readOnly: true
          type: string
          format: date-time
        updated_by:
          title: Updated By
          readOnly: true
          nullable: true
          type: string
        entity_id:
          type: string
          title: Entity Id
          description: Alias for id for backwards compatibility.
          readOnly: true
        parent:
          title: Parent
          description: Parent entity ID for nested entities.
          readOnly: true
          type: string
        db_version:
          type: integer
          title: Db Version
          description: Database version of the entity for optimistic locking.
          readOnly: true
      type: object
      required:
      - workspace
      - id
      - created_at
      - created_by
      - updated_at
      - updated_by
      - entity_id
      - parent
      - db_version
      title: AgentHardenerManifest
      description: 'A named, reusable war-game target scaffolded via `init` (its ``name``
        is the user-defined id).


        Both sources persist their victim project as a fileset the run re-downloads,
        so a manifest is a

        frozen target rather than a query re-evaluated each run: ``agent`` stores
        the scaffold resolved

        from a deployed agent ref, ``project`` stores an uploaded NAT project (which
        is also how

        custom-tool agents, unregistrable as config-only agents, are targeted). Editing
        the agent does

        not change an existing manifest until it is refreshed.'
    AgentHardenerRun:
      properties:
        name:
          type: string
          title: Name
          description: Entity name within the workspace
          default: ''
        workspace:
          type: string
          pattern: ^[\w\-\+.@:]+$
          title: Workspace
          description: Workspace identifier
        project:
          title: Project
          description: The name of the project associated with this entity.
          type: string
        agent:
          type: string
          title: Agent
          description: Targeted agent reference (workspace/name).
          default: ''
        job_id:
          type: string
          title: Job Id
          description: Platform job that drove this run (for live status/HITL).
          default: ''
        port:
          type: integer
          title: Port
          description: Victim port the war-game attacked.
          default: 0
        manifest:
          type: string
          title: Manifest
          description: Path to the agent-hardener.yaml manifest used.
          default: ''
        manifest_id:
          type: string
          title: Manifest Id
          description: Manifest this run belongs to (scopes 'replay last run').
          default: ''
        status:
          type: string
          enum:
          - running
          - completed
          - failed
          title: Status
          description: Final run status.
          default: failed
        returncode:
          type: integer
          title: Returncode
          description: Exit code from `agent-hardener run`.
          default: -1
        summary:
          type: string
          title: Summary
          description: Short human-readable outcome summary.
          default: ''
        error_category:
          type: string
          title: Error Category
          description: Classified failure category when status is 'failed' (e.g. sandbox,
            missing_credential, manifest, network); empty for a successful run.
          default: ''
        error_message:
          type: string
          title: Error Message
          description: Operator-facing failure message when the run failed.
          default: ''
        error_remediation:
          type: string
          title: Error Remediation
          description: Suggested next step to resolve the failure; empty for a successful
            run.
          default: ''
        hitlog_fileset:
          type: string
          title: Hitlog Fileset
          description: Fileset ref of the garak hitlog this run produced, if any;
            replay a later run from it.
          default: ''
        events_fileset:
          type: string
          title: Events Fileset
          description: Fileset ref of the run's events.jsonl, uploaded at completion
            for durable history.
          default: ''
        source_run:
          type: string
          title: Source Run
          description: For a validate-only sanity-check run, the name of the harden
            run it was launched from; lets the Harden tab re-attach the scorecard
            on reload. Empty for normal war-game runs.
          default: ''
        id:
          type: string
          title: Id
          readOnly: true
        created_at:
          title: Created At
          readOnly: true
          type: string
          format: date-time
        created_by:
          title: Created By
          readOnly: true
          nullable: true
          type: string
        updated_at:
          title: Updated At
          readOnly: true
          type: string
          format: date-time
        updated_by:
          title: Updated By
          readOnly: true
          nullable: true
          type: string
        entity_id:
          type: string
          title: Entity Id
          description: Alias for id for backwards compatibility.
          readOnly: true
        parent:
          title: Parent
          description: Parent entity ID for nested entities.
          readOnly: true
          type: string
        db_version:
          type: integer
          title: Db Version
          description: Database version of the entity for optimistic locking.
          readOnly: true
      type: object
      required:
      - workspace
      - id
      - created_at
      - created_by
      - updated_at
      - updated_by
      - entity_id
      - parent
      - db_version
      title: AgentHardenerRun
      description: A record of one Agent Hardener war-game run.
    ApplyMitigationRequest:
      properties:
        workflow_yaml:
          type: string
          title: Workflow Yaml
          description: Hardened NAT workflow YAML (the mitigations 'after' document).
      type: object
      required:
      - workflow_yaml
      title: ApplyMitigationRequest
      description: "Body for ``POST /v2/workspaces/{workspace}/runs/{name}/apply-mitigation``\
        \ \u2014 adopt the hardened workflow.\n\nThe client passes the hardened workflow\
        \ YAML from the run's mitigations artifact. The endpoint reverses\nthe Inference-Gateway\
        \ injection and writes it onto the run's target agent config (no redeploy)."
    ApplyMitigationResponse:
      properties:
        applied:
          type: boolean
          title: Applied
          description: True when the agent config was updated.
        agent:
          type: string
          title: Agent
          description: Name of the agent whose config was updated.
        detail:
          type: string
          title: Detail
          description: Human-readable note (e.g. a reminder to redeploy).
      type: object
      required:
      - applied
      - agent
      - detail
      title: ApplyMitigationResponse
      description: Result of applying a hardened workflow to an agent.
    ComposeDefenseRequest:
      properties:
        mitigations:
          additionalProperties: true
          type: object
          title: Mitigations
          description: The run's mitigations artifact (its 'defenses'/workflow/policy).
        selected_defense_ids:
          items:
            type: string
          type: array
          title: Selected Defense Ids
          description: Ids of the defenses to keep (guardrail ids and/or 'openshell_policy').
      type: object
      required:
      - mitigations
      title: ComposeDefenseRequest
      description: "Body for ``POST /v2/workspaces/{workspace}/runs/{name}/compose-defense``\
        \ \u2014 build a chosen defense subset.\n\nThe client passes the run's ``mitigations``\
