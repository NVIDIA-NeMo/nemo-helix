[project]
name = "nemo-insights-plugin"
version = "0.1.0"
description = "Agent telemetry analysis and persistent insights for NeMo Platform."
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115",
  "httpx",
  "nemo-fabric-adapter-contract>=0.3.0,<0.4.0",
  "nemo-fabric-adapters-common>=0.3.0,<0.4.0",
  "nemo-platform",
  "nemo-platform-plugin",
  "nemo-relay>=0.7,<0.8",
  "nooa>=0.0.9",
  "opentelemetry-exporter-otlp>=1.42.1",
  "opentelemetry-sdk>=1.42.1",
  "pydantic>=2.12.0",
  "pyyaml>=6.0.3",
  "typer>=0.20.0",
  "tzdata==2026.2",
]

[project.entry-points."nemo.cli"]
insights = "nemo_insights_plugin.cli:InsightsCLI"

[project.entry-points."nemo.cli.agents"]
analyst = "nemo_insights_plugin.analyst.cli:AnalystCLI"

[project.entry-points."nemo.services"]
insights = "nemo_insights_plugin.service:InsightsService"

[project.entry-points."nemo.controllers"]
insights-analysis = "nemo_insights_plugin.controller:InsightsAnalysisController"

[project.entry-points."nemo.jobs"]
"insights.analyze-job" = "nemo_insights_plugin.jobs.analyze:AnalyzeJob"

[project.entry-points."nemo.agents.execute_extensions"]
"insights.analysis" = "nemo_insights_plugin.execute_extensions:InsightsAnalysisExtension"

[project.entry-points."nemo.sdk"]
insights = "nemo_insights_plugin.sdk:insights_sdk_resources"

[project.entry-points."nemo.skills"]
insights = "nemo_insights_plugin.skills:skills_dir"

[tool.nemo.openapi]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_insights_plugin"]

[tool.hatch.build.targets.wheel.shared-data]
"insights-analyst.fabric-adapter.json" = "share/nemo-fabric/adapters/insights-analyst/insights-analyst.fabric-adapter.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: service integration tests",
]
pythonpath = ["src", "."]
testpaths = ["tests"]
