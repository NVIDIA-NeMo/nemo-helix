          title: Project
          description: The name of the project associated with this entity.
          type: string
        agent:
          type: string
          title: Agent
          description: Name of the agent this analysis config targets.
        enabled:
          type: boolean
          title: Enabled
          description: Whether the periodic insights controller should analyze this
            agent.
          default: true
        default_model:
          type: string
          title: Default Model
          description: Workspace-qualified Model Entity used for quality-critical
            analysis work.
          default: ''
        fast_model:
          type: string
          title: Fast Model
          description: Workspace-qualified Model Entity used for latency-sensitive
            analysis work.
          default: ''
        id:
          type: string
          title: Id
          readOnly: true
        created_at:
          title: Created At
          readOnly: true
          type: string
          format: date-time
        created_by:
          title: Created By
          readOnly: true
          nullable: true
          type: string
        updated_at:
          title: Updated At
          readOnly: true
          type: string
          format: date-time
        updated_by:
          title: Updated By
          readOnly: true
          nullable: true
          type: string
        entity_id:
          type: string
          title: Entity Id
          description: Alias for id for backwards compatibility.
          readOnly: true
        parent:
          title: Parent
          description: Parent entity ID for nested entities.
          readOnly: true
          type: string
        db_version:
          type: integer
          title: Db Version
          description: Database version of the entity for optimistic locking.
          readOnly: true
      type: object
      required:
      - workspace
      - agent
      - id
      - created_at
      - created_by
      - updated_at
      - updated_by
      - entity_id
      - parent
      - db_version
      title: AnalysisConfig
      description: 'Per-agent opt-in state for framework-managed periodic analysis.


        The cadence is intentionally global insights configuration. The model pair

        is captured when analysis is enabled because the controller runs in the

        Platform process and cannot read the operator''s local CLI configuration.

        Machine-written run state lives on :class:`AnalysisRunStatus` so the

        controller never races the running job.'
    AnalysisConfigStatus:
      type: string
      enum:
      - idle
      - running
      - error
      title: AnalysisConfigStatus
      description: Lifecycle state for periodic insights analysis of one agent.
    AnalysisRun:
      properties:
        name:
          type: string
          title: Name
          description: Entity name within the workspace
          default: ''
        workspace:
          type: string
          pattern: ^[\w\-\+.@:]+$
          title: Workspace
          description: Workspace identifier
        project:
          title: Project
          description: The name of the project associated with this entity.
          type: string
        agent:
          type: string
          title: Agent
          description: Agent whose telemetry this run analyzed.
        since:
          title: Since
          description: Lower bound the run enforced on trace/span reads.
          type: string
          format: date-time
        evaluation_id:
          type: string
          title: Evaluation Id
          description: Run scope AND-pinned onto every span read, when one was requested.
          default: ''
        default_model:
          type: string
          title: Default Model
          description: Workspace-qualified Model Entity the run used for analysis
            work.
          default: ''
        fast_model:
          type: string
          title: Fast Model
          description: Workspace-qualified Model Entity the run used for context summarization.
          default: ''
        id:
          type: string
          title: Id
          readOnly: true
        created_at:
          title: Created At
          readOnly: true
          type: string
          format: date-time
        created_by:
          title: Created By
          readOnly: true
          nullable: true
          type: string
        updated_at:
          title: Updated At
          readOnly: true
          type: string
          format: date-time
        updated_by:
          title: Updated By
          readOnly: true
          nullable: true
          type: string
        entity_id:
          type: string
          title: Entity Id
          description: Alias for id for backwards compatibility.
          readOnly: true
        parent:
          title: Parent
          description: Parent entity ID for nested entities.
          readOnly: true
          type: string
        db_version:
          type: integer
          title: Db Version
          description: Database version of the entity for optimistic locking.
          readOnly: true
      type: object
      required:
      - workspace
      - agent
      - id
      - created_at
      - created_by
      - updated_at
      - updated_by
      - entity_id
      - parent
      - db_version
      title: AnalysisRun
      description: "One on-demand Insights analysis run \u2014 what was asked for,\
        \ not how it went.\n\nThe record's ``name`` is also the name of the backing\
        \ ``agents.execute``\njob. Insights mints that name before submitting, so\
        \ the link between a run\nand its job is *derivable* rather than written back\
        \ after the fact. That\nremoves the dual write, and with it the failure mode\
        \ where a job exists\nthat no run points at: a run whose job name 404s simply\
        \ never landed. There\nis no resubmit-under-an-existing-name route yet, so\
        \ such a run is a read\ntoday, not something a caller can drive back to completion.\n\
        \nProgress is deliberately absent. Status, logs, and results belong to the\n\
        Job and are read from it; mirroring them here would go stale immediately.\n\
        Insights owns only what no lower layer knows: that this job was an analysis\n\
        run, over which agent and scope."
    AnalysisRunResponse:
      properties:
        run:
          $ref: '#/components/schemas/AnalysisRun'
        job:
          title: Job
          description: "The backing execute-agent job, or null when no job exists\
            \ under the run's name \u2014 meaning submission never landed and the\
            \ run can be resubmitted."
          additionalProperties: true
          type: object
      type: object
      required:
      - run
      title: AnalysisRunResponse
      description: An analysis run plus the live state of the job backing it.
    AnalysisRunStatus:
      properties:
        name:
          type: string
          title: Name
          description: Entity name within the workspace
          default: ''
        workspace:
          type: string
          pattern: ^[\w\-\+.@:]+$
          title: Workspace
          description: Workspace identifier
        project:
          title: Project
          description: The name of the project associated with this entity.
          type: string
        agent:
          type: string
          title: Agent
          description: Name of the agent this run status targets.
        status:
          allOf:
          - $ref: '#/components/schemas/AnalysisConfigStatus'
          description: Last known periodic analysis state for this agent.
          default: idle
        last_successful_run_at:
          title: Last Successful Run At
          description: Cursor for incremental analysis. Scheduled runs only consider
            telemetry at or after this timestamp.
          type: string
          format: date-time
        last_attempted_at:
          title: Last Attempted At
          description: When the controller or job last attempted analysis.
          type: string
          format: date-time
        last_completed_at:
          title: Last Completed At
          description: When the last analysis attempt reached a terminal state.
          type: string
          format: date-time
        last_submitted_job:
          type: string
          title: Last Submitted Job
          description: Most recent platform job name submitted for this agent.
          default: ''
        last_error:
          type: string
          title: Last Error
          description: Most recent error or skip reason from scheduled analysis.
          default: ''
        id:
          type: string
          title: Id
          readOnly: true
        created_at:
          title: Created At
          readOnly: true
          type: string
          format: date-time
        created_by:
          title: Created By
          readOnly: true
          nullable: true
          type: string
        updated_at:
          title: Updated At
          readOnly: true
          type: string
          format: date-time
        updated_by:
          title: Updated By
          readOnly: true
          nullable: true
          type: string
        entity_id:
          type: string
          title: Entity Id
          description: Alias for id for backwards compatibility.
          readOnly: true
        parent:
          title: Parent
          description: Parent entity ID for nested entities.
          readOnly: true
          type: string
        db_version:
          type: integer
          title: Db Version
          description: Database version of the entity for optimistic locking.
          readOnly: true
      type: object
      required:
      - workspace
      - agent
      - id
      - created_at
      - created_by
      - updated_at
      - updated_by
      - entity_id
      - parent
      - db_version
      title: AnalysisRunStatus
      description: Machine-written run state for periodic analysis of one agent.
    AnalyzeJobJob:
