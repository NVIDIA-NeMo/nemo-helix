openapi: 3.1.0
info:
  title: insights (plugin)
  version: 0.0.0
paths:
  /apis/insights/v2/workspaces/{workspace}/analysis-configs:
    get:
      tags:
      - Insights Analysis Configs
      summary: List Analysis Configs
      description: List periodic analysis opt-in records.
      operationId: list_analysis_configs_apis_insights_v2_workspaces__workspace__analysis_configs_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-indexed).
          default: 1
          title: Page
        description: Page number (1-indexed).
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page.
          default: 20
          title: Page Size
        description: Items per page.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Sort field.
          default: -created_at
          title: Sort
        description: Sort field.
      - name: enabled
        in: query
        required: false
        schema:
          description: Filter by enabled state.
          title: Enabled
          type: boolean
        description: Filter by enabled state.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NemoListResponse_AnalysisConfig_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/analysis-configs/{agent}:
    get:
      tags:
      - Insights Analysis Configs
      summary: Get Analysis Config
      description: Get periodic analysis opt-in state for one agent.
      operationId: get_analysis_config_apis_insights_v2_workspaces__workspace__analysis_configs__agent__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: agent
        in: path
        required: true
        schema:
          type: string
          title: Agent
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Insights Analysis Configs
      summary: Update Analysis Config
      description: Partially update periodic analysis state for one agent.
      operationId: update_analysis_config_apis_insights_v2_workspaces__workspace__analysis_configs__agent__patch
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: agent
        in: path
        required: true
        schema:
          type: string
          title: Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnalysisConfigRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/analysis-configs/{agent}/disable:
    post:
      tags:
      - Insights Analysis Configs
      summary: Disable Analysis Config
      description: Disable periodic insights analysis for one agent.
      operationId: disable_analysis_config_apis_insights_v2_workspaces__workspace__analysis_configs__agent__disable_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: agent
        in: path
        required: true
        schema:
          type: string
          title: Agent
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/analysis-configs/{agent}/enable:
    post:
      tags:
      - Insights Analysis Configs
      summary: Enable Analysis Config
      description: Enable periodic insights analysis for one agent.
      operationId: enable_analysis_config_apis_insights_v2_workspaces__workspace__analysis_configs__agent__enable_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: agent
        in: path
        required: true
        schema:
          type: string
          title: Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableAnalysisConfigRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/analysis-run-statuses:
    get:
      tags:
      - Insights Analysis Run Statuses
      summary: List Analysis Run Statuses
      description: List machine-written periodic analysis run status records.
      operationId: list_analysis_run_statuses_apis_insights_v2_workspaces__workspace__analysis_run_statuses_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-indexed).
          default: 1
          title: Page
        description: Page number (1-indexed).
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page.
          default: 20
          title: Page Size
        description: Items per page.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Sort field.
          default: -updated_at
          title: Sort
        description: Sort field.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NemoListResponse_AnalysisRunStatus_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/analysis-run-statuses/{agent}:
    get:
      tags:
      - Insights Analysis Run Statuses
      summary: Get Analysis Run Status
      description: Get machine-written periodic analysis run status for one agent.
      operationId: get_analysis_run_status_apis_insights_v2_workspaces__workspace__analysis_run_statuses__agent__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: agent
        in: path
        required: true
        schema:
          type: string
          title: Agent
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Insights Analysis Run Statuses
      summary: Update Analysis Run Status
      description: Create or partially update periodic analysis run status for one
        agent.
      operationId: update_analysis_run_status_apis_insights_v2_workspaces__workspace__analysis_run_statuses__agent__patch
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: agent
        in: path
        required: true
        schema:
          type: string
          title: Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnalysisRunStatusRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/analysis-runs:
    post:
      tags:
      - Insights Analysis Runs
      summary: Create Analysis Run
      description: Create an Insights analysis run backed by the generic ``agents.execute``
        job.
      operationId: create_analysis_run_apis_insights_v2_workspaces__workspace__analysis_runs_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnalysisRunRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Insights Analysis Runs
      summary: List Analysis Runs
      description: "List analysis runs. Job state is not joined here \u2014 read a\
        \ run to get it."
      operationId: list_analysis_runs_apis_insights_v2_workspaces__workspace__analysis_runs_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-indexed).
          default: 1
          title: Page
        description: Page number (1-indexed).
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page.
          default: 20
          title: Page Size
        description: Items per page.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Sort field.
          default: -created_at
          title: Sort
        description: Sort field.
      - name: agent
        in: query
        required: false
        schema:
          description: Filter by the agent that was analyzed.
          title: Agent
          type: string
        description: Filter by the agent that was analyzed.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NemoListResponse_AnalysisRun_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/analysis-runs/{name}:
    get:
      tags:
      - Insights Analysis Runs
      summary: Get Analysis Run
      description: Get one analysis run, joined with the live state of its backing
        job.
      operationId: get_analysis_run_apis_insights_v2_workspaces__workspace__analysis_runs__name__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/insights:
    post:
      tags:
      - Insights Insights
      summary: Create Insight
      description: Create a new Insight. The store auto-generates the slug name.
      operationId: create_insight_apis_insights_v2_workspaces__workspace__insights_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInsightRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insight'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Insights Insights
      summary: List Insights
      description: List Insights with pagination, sort, and basic filters.
      operationId: list_insights_apis_insights_v2_workspaces__workspace__insights_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-indexed).
          default: 1
          title: Page
        description: Page number (1-indexed).
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page.
          default: 20
          title: Page Size
        description: Items per page.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Sort field. Prefix with '-' for descending (e.g. '-created_at').
          default: -created_at
          title: Sort
        description: Sort field. Prefix with '-' for descending (e.g. '-created_at').
      - name: agent
        in: query
        required: false
        schema:
          description: Filter by agent name.
          title: Agent
          type: string
        description: Filter by agent name.
      - name: status
        in: query
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/InsightStatus'
          description: Filter by lifecycle status.
          title: Status
        description: Filter by lifecycle status.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NemoListResponse_InsightListItem_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/insights/{insight_id}:
    get:
      tags:
      - Insights Insights
      summary: Get Insight
      description: Get a single Insight by its store-assigned id.
      operationId: get_insight_apis_insights_v2_workspaces__workspace__insights__insight_id__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: insight_id
        in: path
        required: true
        schema:
          type: string
          title: Insight Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insight'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Insights Insights
      summary: Update Insight
      description: Partially update an Insight by id. Omitted fields are unchanged.
      operationId: update_insight_apis_insights_v2_workspaces__workspace__insights__insight_id__patch
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: insight_id
        in: path
        required: true
        schema:
          type: string
          title: Insight Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInsightRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insight'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Insights Insights
      summary: Delete Insight
      description: Delete an Insight by its store-assigned id. Returns 204 on success.
      operationId: delete_insight_apis_insights_v2_workspaces__workspace__insights__insight_id__delete
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: insight_id
        in: path
        required: true
        schema:
          type: string
          title: Insight Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AnalysisConfig:
      properties:
        name:
          type: string
          title: Name
          description: Entity name within the workspace
          default: ''
        workspace:
          type: string
          pattern: ^[\w\-\+.@:]+$
          title: Workspace
          description: Workspace identifier
        project:
          title: Project
          description: The name of the project associated with this entity.
          type: string
        agent:
          type: string
          title: Agent
          description: Name of the agent this analysis config targets.
        enabled:
          type: boolean
          title: Enabled
          description: Whether the periodic insights controller should analyze this
            agent.
          default: true
        default_model:
          type: string
          title: Default Model
          description: Workspace-qualified Model Entity used for quality-critical
            analysis work.
          default: ''
        fast_model:
          type: string
          title: Fast Model
          description: Workspace-qualified Model Entity used for latency-sensitive
            analysis work.
          default: ''
        id:
          type: string
          title: Id
          readOnly: true
        created_at:
          title: Created At
          readOnly: true
          type: string
          format: date-time
        created_by:
          title: Created By
          readOnly: true
          nullable: true
          type: string
        updated_at:
          title: Updated At
          readOnly: true
          type: string
          format: date-time
        updated_by:
          title: Updated By
          readOnly: true
          nullable: true
          type: string
        entity_id:
          type: string
          title: Entity Id
          description: Alias for id for backwards compatibility.
          readOnly: true
        parent:
          title: Parent
          description: Parent entity ID for nested entities.
          readOnly: true
          type: string
        db_version:
          type: integer
          title: Db Version
          description: Database version of the entity for optimistic locking.
          readOnly: true
      type: object
      required:
      - workspace
      - agent
      - id
      - created_at
      - created_by
      - updated_at
      - updated_by
      - entity_id
      - parent
      - db_version
      title: AnalysisConfig
      description: 'Per-agent opt-in state for framework-managed periodic analysis.


        The cadence is intentionally global insights configuration. The model pair

        is captured when analysis is enabled because the controller runs in the

        Platform process and cannot read the operator''s local CLI configuration.

        Machine-written run state lives on :class:`AnalysisRunStatus` so the

        controller never races the running job.'
    AnalysisConfigStatus:
      type: string
      enum:
      - idle
      - running
      - error
      title: AnalysisConfigStatus
      description: Lifecycle state for periodic insights analysis of one agent.
    AnalysisRun:
      properties:
        name:
          type: string
          title: Name
          description: Entity name within the workspace
          default: ''
        workspace:
          type: string
          pattern: ^[\w\-\+.@:]+$
          title: Workspace
          description: Workspace identifier
        project:
          title: Project
          description: The name of the project associated with this entity.
          type: string
        agent:
          type: string
          title: Agent
          description: Agent whose telemetry this run analyzed.
        since:
          title: Since
          description: Lower bound the run enforced on trace/span reads.
          type: string
          format: date-time
        evaluation_id:
          type: string
          title: Evaluation Id
          description: Run scope AND-pinned onto every span read, when one was requested.
          default: ''
        default_model:
          type: string
          title: Default Model
          description: Workspace-qualified Model Entity the run used for analysis
            work.
          default: ''
        fast_model:
          type: string
          title: Fast Model
          description: Workspace-qualified Model Entity the run used for context summarization.
          default: ''
        id:
          type: string
          title: Id
          readOnly: true
        created_at:
          title: Created At
          readOnly: true
          type: string
          format: date-time
        created_by:
          title: Created By
          readOnly: true
          nullable: true
          type: string
        updated_at:
          title: Updated At
          readOnly: true
          type: string
          format: date-time
        updated_by:
          title: Updated By
          readOnly: true
          nullable: true
          type: string
        entity_id:
          type: string
          title: Entity Id
          description: Alias for id for backwards compatibility.
          readOnly: true
        parent:
          title: Parent
          description: Parent entity ID for nested entities.
          readOnly: true
          type: string
        db_version:
          type: integer
          title: Db Version
          description: Database version of the entity for optimistic locking.
          readOnly: true
      type: object
      required:
      - workspace
      - agent
      - id
      - created_at
      - created_by
      - updated_at
      - updated_by
      - entity_id
      - parent
      - db_version
      title: AnalysisRun
      description: "One Insights analysis run \u2014 what was asked for, not how it\
        \ went.\n\nThe record's ``name`` is also the name of the backing ``agents.execute``\n\
        job. Insights mints that name before submitting, so the link between a run\n\
        and its job is *derivable* rather than written back after the fact. That\n\
        removes the dual write, and with it the failure mode where a job exists\n\
        that no run points at: a run whose job name 404s simply never landed. There\n\
        is no resubmit-under-an-existing-name route yet, so such a run is a read\n\
        today, not something a caller can drive back to completion.\n\nProgress is\
        \ deliberately absent. Status, logs, and results belong to the\nJob and are\
        \ read from it; mirroring them here would go stale immediately.\nInsights\
        \ owns only what no lower layer knows: that this job was an analysis\nrun,\
        \ over which agent and scope."
    AnalysisRunResponse:
      properties:
        run:
          $ref: '#/components/schemas/AnalysisRun'
        job:
          title: Job
          description: "The backing execute-agent job, or null when no job exists\
            \ under the run's name \u2014 meaning submission never landed and the\
            \ run can be resubmitted."
          additionalProperties: true
          type: object
      type: object
      required:
      - run
      title: AnalysisRunResponse
      description: An analysis run plus the live state of the job backing it.
    AnalysisRunStatus:
      properties:
        name:
          type: string
          title: Name
          description: Entity name within the workspace
          default: ''
        workspace:
          type: string
          pattern: ^[\w\-\+.@:]+$
          title: Workspace
          description: Workspace identifier
        project:
          title: Project
          description: The name of the project associated with this entity.
          type: string
        agent:
          type: string
          title: Agent
          description: Name of the agent this run status targets.
        status:
          allOf:
          - $ref: '#/components/schemas/AnalysisConfigStatus'
          description: Last known periodic analysis state for this agent.
          default: idle
        last_successful_run_at:
          title: Last Successful Run At
          description: Cursor for incremental analysis. Scheduled runs only consider
            telemetry at or after this timestamp.
          type: string
          format: date-time
        last_attempted_at:
          title: Last Attempted At
          description: When the controller or job last attempted analysis.
          type: string
          format: date-time
        last_completed_at:
          title: Last Completed At
          description: When the last analysis attempt reached a terminal state.
          type: string
          format: date-time
        last_submitted_job:
          type: string
          title: Last Submitted Job
          description: Most recent platform job name submitted for this agent.
          default: ''
        last_error:
          type: string
          title: Last Error
          description: Most recent error or skip reason from scheduled analysis.
          default: ''
        id:
          type: string
          title: Id
          readOnly: true
        created_at:
          title: Created At
          readOnly: true
          type: string
          format: date-time
        created_by:
          title: Created By
          readOnly: true
          nullable: true
          type: string
        updated_at:
          title: Updated At
          readOnly: true
          type: string
          format: date-time
        updated_by:
          title: Updated By
          readOnly: true
          nullable: true
          type: string
        entity_id:
          type: string
          title: Entity Id
          description: Alias for id for backwards compatibility.
          readOnly: true
        parent:
          title: Parent
          description: Parent entity ID for nested entities.
          readOnly: true
          type: string
        db_version:
          type: integer
