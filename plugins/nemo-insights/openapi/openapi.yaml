openapi: 3.1.0
info:
  title: insights (plugin)
  version: 0.0.0
paths:
  /apis/insights/v2/workspaces/{workspace}/analysis-configs:
    get:
      tags:
      - Insights Analysis Configs
      summary: List Analysis Configs
      description: List periodic analysis opt-in records.
      operationId: list_analysis_configs_apis_insights_v2_workspaces__workspace__analysis_configs_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-indexed).
          default: 1
          title: Page
        description: Page number (1-indexed).
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page.
          default: 20
          title: Page Size
        description: Items per page.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Sort field.
          default: -created_at
          title: Sort
        description: Sort field.
      - name: enabled
        in: query
        required: false
        schema:
          description: Filter by enabled state.
          title: Enabled
          type: boolean
        description: Filter by enabled state.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NemoListResponse_AnalysisConfig_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/analysis-configs/{agent}:
    get:
      tags:
      - Insights Analysis Configs
      summary: Get Analysis Config
      description: Get periodic analysis opt-in state for one agent.
      operationId: get_analysis_config_apis_insights_v2_workspaces__workspace__analysis_configs__agent__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: agent
        in: path
        required: true
        schema:
          type: string
          title: Agent
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Insights Analysis Configs
      summary: Update Analysis Config
      description: Partially update periodic analysis state for one agent.
      operationId: update_analysis_config_apis_insights_v2_workspaces__workspace__analysis_configs__agent__patch
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: agent
        in: path
        required: true
        schema:
          type: string
          title: Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnalysisConfigRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/analysis-configs/{agent}/disable:
    post:
      tags:
      - Insights Analysis Configs
      summary: Disable Analysis Config
      description: Disable periodic insights analysis for one agent.
      operationId: disable_analysis_config_apis_insights_v2_workspaces__workspace__analysis_configs__agent__disable_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: agent
        in: path
        required: true
        schema:
          type: string
          title: Agent
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/analysis-configs/{agent}/enable:
    post:
      tags:
      - Insights Analysis Configs
      summary: Enable Analysis Config
      description: Enable periodic insights analysis for one agent.
      operationId: enable_analysis_config_apis_insights_v2_workspaces__workspace__analysis_configs__agent__enable_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: agent
        in: path
        required: true
        schema:
          type: string
          title: Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnableAnalysisConfigRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/analysis-run-statuses:
    get:
      tags:
      - Insights Analysis Run Statuses
      summary: List Analysis Run Statuses
      description: List machine-written periodic analysis run status records.
      operationId: list_analysis_run_statuses_apis_insights_v2_workspaces__workspace__analysis_run_statuses_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-indexed).
          default: 1
          title: Page
        description: Page number (1-indexed).
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page.
          default: 20
          title: Page Size
        description: Items per page.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Sort field.
          default: -updated_at
          title: Sort
        description: Sort field.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NemoListResponse_AnalysisRunStatus_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/analysis-run-statuses/{agent}:
    get:
      tags:
      - Insights Analysis Run Statuses
      summary: Get Analysis Run Status
      description: Get machine-written periodic analysis run status for one agent.
      operationId: get_analysis_run_status_apis_insights_v2_workspaces__workspace__analysis_run_statuses__agent__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: agent
        in: path
        required: true
        schema:
          type: string
          title: Agent
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Insights Analysis Run Statuses
      summary: Update Analysis Run Status
      description: Create or partially update periodic analysis run status for one
        agent.
      operationId: update_analysis_run_status_apis_insights_v2_workspaces__workspace__analysis_run_statuses__agent__patch
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: agent
        in: path
        required: true
        schema:
          type: string
          title: Agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnalysisRunStatusRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunStatus'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/analysis-runs:
    post:
      tags:
      - Insights Analysis Runs
      summary: Create Analysis Run
      description: Create an Insights analysis run backed by the generic ``agents.execute``
        job.
      operationId: create_analysis_run_apis_insights_v2_workspaces__workspace__analysis_runs_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnalysisRunRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Insights Analysis Runs
      summary: List Analysis Runs
      description: "List analysis runs. Job state is not joined here \u2014 read a\
        \ run to get it."
      operationId: list_analysis_runs_apis_insights_v2_workspaces__workspace__analysis_runs_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-indexed).
          default: 1
          title: Page
        description: Page number (1-indexed).
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page.
          default: 20
          title: Page Size
        description: Items per page.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Sort field.
          default: -created_at
          title: Sort
        description: Sort field.
      - name: agent
        in: query
        required: false
        schema:
          description: Filter by the agent that was analyzed.
          title: Agent
          type: string
        description: Filter by the agent that was analyzed.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NemoListResponse_AnalysisRun_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/analysis-runs/{name}:
    get:
      tags:
      - Insights Analysis Runs
      summary: Get Analysis Run
      description: Get one analysis run, joined with the live state of its backing
        job.
      operationId: get_analysis_run_apis_insights_v2_workspaces__workspace__analysis_runs__name__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/insights:
    post:
      tags:
      - Insights Insights
      summary: Create Insight
      description: Create a new Insight. The store auto-generates the slug name.
      operationId: create_insight_apis_insights_v2_workspaces__workspace__insights_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInsightRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insight'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Insights Insights
      summary: List Insights
      description: List Insights with pagination, sort, and basic filters.
      operationId: list_insights_apis_insights_v2_workspaces__workspace__insights_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number (1-indexed).
          default: 1
          title: Page
        description: Page number (1-indexed).
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          description: Items per page.
          default: 20
          title: Page Size
        description: Items per page.
      - name: sort
        in: query
        required: false
        schema:
          type: string
          description: Sort field. Prefix with '-' for descending (e.g. '-created_at').
          default: -created_at
          title: Sort
        description: Sort field. Prefix with '-' for descending (e.g. '-created_at').
      - name: agent
        in: query
        required: false
        schema:
          description: Filter by agent name.
          title: Agent
          type: string
        description: Filter by agent name.
      - name: status
        in: query
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/InsightStatus'
          description: Filter by lifecycle status.
          title: Status
        description: Filter by lifecycle status.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NemoListResponse_InsightListItem_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/insights/{insight_id}:
    get:
      tags:
      - Insights Insights
      summary: Get Insight
      description: Get a single Insight by its store-assigned id.
      operationId: get_insight_apis_insights_v2_workspaces__workspace__insights__insight_id__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: insight_id
        in: path
        required: true
        schema:
          type: string
          title: Insight Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insight'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - Insights Insights
      summary: Update Insight
      description: Partially update an Insight by id. Omitted fields are unchanged.
      operationId: update_insight_apis_insights_v2_workspaces__workspace__insights__insight_id__patch
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: insight_id
        in: path
        required: true
        schema:
          type: string
          title: Insight Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInsightRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Insight'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Insights Insights
      summary: Delete Insight
      description: Delete an Insight by its store-assigned id. Returns 204 on success.
      operationId: delete_insight_apis_insights_v2_workspaces__workspace__insights__insight_id__delete
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: insight_id
        in: path
        required: true
        schema:
          type: string
          title: Insight Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/jobs/analyze-job:
    post:
      tags:
      - Insights Analysis Jobs
      summary: Create Job
      operationId: create_job_apis_insights_v2_workspaces__workspace__jobs_analyze_job_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeJobJobRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeJobJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Insights Analysis Jobs
      summary: List Jobs
      operationId: list_jobs_apis_insights_v2_workspaces__workspace__jobs_analyze_job_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: page
        in: query
        required: false
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Page number.
          default: 1
          title: Page
        description: Page number.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          exclusiveMinimum: 0
          description: Page size.
          default: 10
          title: Page Size
        description: Page size.
      - name: sort
        in: query
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/AnalyzeJobJobsSortField'
          description: The field to sort by. To sort in decreasing order, use `-`
            in front of the field name.
          default: -created_at
        description: The field to sort by. To sort in decreasing order, use `-` in
          front of the field name.
      - in: query
        name: filter
        style: deepObject
        required: false
        explode: true
        schema:
          $ref: '#/components/schemas/AnalyzeJobJobsListFilter'
        description: Filter jobs on various criteria.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeJobJobsPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/jobs/analyze-job/{job}/results/{name}:
    get:
      tags:
      - Insights Analysis Jobs
      summary: Get Job Result
      operationId: get_job_result_apis_insights_v2_workspaces__workspace__jobs_analyze_job__job__results__name__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: job
        in: path
        required: true
        schema:
          type: string
          title: Job
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobResultResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/jobs/analyze-job/{job}/results/{name}/download:
    get:
      tags:
      - Insights Analysis Jobs
      summary: Download Job Result
      operationId: download_job_result_apis_insights_v2_workspaces__workspace__jobs_analyze_job__job__results__name__download_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: job
        in: path
        required: true
        schema:
          type: string
          title: Job
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/jobs/analyze-job/{name}:
    get:
      tags:
      - Insights Analysis Jobs
      summary: Get Job
      operationId: get_job_apis_insights_v2_workspaces__workspace__jobs_analyze_job__name__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeJobJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Insights Analysis Jobs
      summary: Delete Job
      operationId: delete_job_apis_insights_v2_workspaces__workspace__jobs_analyze_job__name__delete
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '204':
          description: Successful Response
        '404':
          description: Job not Found
        '409':
          description: Job is not in a terminal state
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/jobs/analyze-job/{name}/cancel:
    post:
      tags:
      - Insights Analysis Jobs
      summary: Cancel Job
      operationId: cancel_job_apis_insights_v2_workspaces__workspace__jobs_analyze_job__name__cancel_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeJobJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/insights/v2/workspaces/{workspace}/jobs/analyze-job/{name}/logs:
    get:
      tags:
      - Insights Analysis Jobs
      summary: Get Job Logs
      operationId: get_job_logs_apis_insights_v2_workspaces__workspace__jobs_analyze_job__name__logs_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      - name: limit
        in: query
        required: false
        schema:
          title: Limit
          type: integer
      - name: page_cursor
        in: query
        required: false
        schema:
          title: Page Cursor
          type: string
      - name: tail
        in: query
        required: false
        schema:
          title: Tail
          type: integer
          maximum: 10000
          exclusiveMinimum: 0
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformJobLogPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
