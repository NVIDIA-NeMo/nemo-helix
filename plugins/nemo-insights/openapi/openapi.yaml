    CreateAnalysisRunRequest:
      properties:
        agent:
          type: string
          minLength: 1
          title: Agent
          description: Agent whose telemetry should be analyzed.
        default_model:
          type: string
          minLength: 1
          title: Default Model
          description: 'Model Entity the Analyst uses for analysis work, as a name
            or a ''<workspace>/<name>'' ref; a bare name resolves in the run''s workspace
            and is stored qualified. Required: the model pair is the operator''s choice
            and is not persisted anywhere the Platform process can read it.'
        fast_model:
          type: string
          minLength: 1
          title: Fast Model
          description: Model Entity used for context summarization, in the same form
            as default_model. Required for the same reason.
        ethos:
          title: Ethos
          description: 'Optional Ethos Markdown for the agent under test. Sent inline
            rather than as a reference: the execute job''s Fabric adapter has no Files
            access.'
          type: string
          minLength: 1
        since:
          title: Since
          description: Optional lower bound enforced on the Analyst's trace/span reads.
          type: string
          format: date-time
        evaluation_id:
          title: Evaluation Id
          description: Optional run scope AND-pinned onto every span read.
          type: string
          minLength: 1
        timeout_seconds:
          title: Timeout Seconds
          description: Optional execute job timeout.
          type: number
          exclusiveMinimum: 0.0
      type: object
      required:
      - agent
      - default_model
      - fast_model
      title: CreateAnalysisRunRequest
      description: Client-facing request to run the Insights Analyst through ``agents.execute``.
    CreateInsightRequest:
      properties:
        title:
          type: string
          title: Title
          description: A short, human-readable sentence naming the core issue. The
            full problem statement goes in 'description'. The store's slug name is
            auto-generated, so no name is supplied here.
        agent:
          type: string
          title: Agent
          description: Name of the registered agent this insight is about.
        description:
          type: string
          title: Description
          description: 'The problem statement: specific enough to act on. This is
            editable by the developer.'
        status:
          allOf:
          - $ref: '#/components/schemas/InsightStatus'
          default: open
        trace_refs:
          items:
            type: string
          type: array
          title: Trace Refs
      type: object
      required:
      - title
      - agent
      - description
      title: CreateInsightRequest
      description: 'Body for ``POST /insights``.


        ``status`` defaults to :attr:`InsightStatus.OPEN`; callers that want to

        mint an insight already in another lifecycle state set it explicitly.'
