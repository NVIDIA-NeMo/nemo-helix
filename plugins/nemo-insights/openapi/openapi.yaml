    CreateAnalysisRunRequest:
      properties:
        agent:
          type: string
          minLength: 1
          title: Agent
          description: Agent whose telemetry should be analyzed.
        default_model:
          type: string
          minLength: 1
          title: Default Model
          description: 'Model Entity the Analyst uses for analysis work, as a name
            or a ''<workspace>/<name>'' ref; a bare name resolves in the run''s workspace
            and is stored qualified. Required: the model pair is the operator''s choice
            and is not persisted anywhere the Platform process can read it.'
        fast_model:
          type: string
          minLength: 1
          title: Fast Model
          description: Model Entity used for context summarization, in the same form
            as default_model. Required for the same reason.
        ethos:
          title: Ethos
          description: 'Optional Ethos Markdown for the agent under test. Sent inline
            rather than as a reference: the execute job''s Fabric adapter has no Files
