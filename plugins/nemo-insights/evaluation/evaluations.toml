# Evaluation subjects for the analyst harness — one table per subject.
# Top-level keys are shared defaults merged into every subject.
base_url = "https://nemo-helix-freeplay.dev.aire.nvidia.com"
state_s3_endpoint = "https://pdx.s8k.io"
state_s3_region = "us-east-1"
state_s3_bucket = "insights-analyst-evaluation-dataset"

[nvq]
type = "intake"
agent = "content-dedup"
workspace = "nvq"
state = "state-v7"

[kernel-factory]
type = "intake"
agent = "solswarm-campaign"
workspace = "kf-prod-evals"
experiment = "prod-latest-completed"
state = "state-v11"

[glamr]
type = "intake"
agent = "glamr"                                 # the main GLAMR agent (ux-agent); the only agent_name-tagged one
workspace = "default"
state = "state-v8"
base_url = "https://agenthub.aire.nvidia.com"   # host root; the intake prefix is applied by the rewrite
auth = "basic"                                  # this Intake is gated by HTTP basic auth (VPN-only, aire)
intake_path_prefix = "/api/intake"              # this deployment mounts intake here, not at the SDK's /apis/intake
auth_user_env = "GLAMR_INTAKE_USER"             # names the env var holding the basic-auth username (value in evaluation/.env)
auth_password_env = "GLAMR_INTAKE_PASSWORD"     # names the env var holding the basic-auth password (value in evaluation/.env)
since = "7d"                                     # default lookback for --live; override with --since (e.g. --since 1d, or '' for all-time)

[nemo-oo-airline]
# The reproducible-analysis face of the NeMo OO Agents tau2-airline corpus.
# Pinned analyze supports benchmark/intake subjects, so this corpus is
# represented by the intake workspace captured in state-v9.
type = "intake"
agent = "nemo-oo-airline"
workspace = "tau2-airline-20260710-152942-4754"
state = "state-v9"
base_url = "http://localhost:8080"

[tau2-airline]
type = "benchmark"
domain = "airline"
base_url = "https://nemo-helix-freeplay.dev.aire.nvidia.com"  # remote (freeplay) default
workspace = "tau2-airline"
state = "state-v6"
tau2_repo = "../tau2-bench"   # tau2-bench checkout: relative to the repo root (sibling clone), or absolute
agent_llm = "openai/nvidia/nvidia/nemotron-3-super-v3"   # a model your proxy key serves (GET {OPENAI_API_BASE}/v1/models)
user_llm  = "openai/nvidia/nvidia/nemotron-3-super-v3"   # the user simulator
task_split_name = "train"   # dev/iteration split (30 tasks); keep `test` (20) held-out for final eval
num_tasks = 30       # full train split; narrow (e.g. 5) for faster iteration loops
num_trials = 1
max_concurrency = 8
seed = 300
include_rewards = true            # also ingest a "-oracle" workspace (answer key) beside the realistic one (default true; false = realistic only)
# tau2_bin = "/custom/tau2"       # optional: override the derived <tau2_repo>/.venv/bin/tau2
# tau2_data_dir = "/custom/data"  # optional: override the derived <tau2_repo>/data
# timeout = 600                   # optional per-task timeout (seconds)

[tau2-telecom]
type = "benchmark"
domain = "telecom"
base_url = "http://localhost:8080"
workspace = "tau2-telecom"
state = "state-v10"
tau2_repo = "../tau2-bench"
agent_llm = "openai/nvidia/nvidia/nemotron-3-super-v3"
user_llm = "openai/nvidia/nvidia/nemotron-3-super-v3"
task_split_name = "small"  # curated 20-task telecom split
num_tasks = 20
num_trials = 1
max_concurrency = 8
seed = 300
include_rewards = true
# tau2_bin = "/custom/tau2"
# tau2_data_dir = "/custom/data"
# timeout = 600

[tau2-retail]
type = "benchmark"
domain = "retail"
base_url = "http://localhost:8080"
workspace = "tau2-retail"
state = "state-v10"
tau2_repo = "../tau2-bench"   # tau2-bench checkout: relative to the repo root (sibling clone), or absolute
agent_llm = "openai/nvidia/nvidia/nemotron-3-super-v3"   # a model your proxy key serves (GET {OPENAI_API_BASE}/v1/models)
user_llm  = "openai/nvidia/nvidia/nemotron-3-super-v3"   # the user simulator
task_split_name = "test"
num_tasks = 40       # full retail test split
num_trials = 1
max_concurrency = 8
seed = 300
include_rewards = true            # also ingest a "-oracle" workspace (answer key) beside the realistic one (default true; false = realistic only)
# tau2_bin = "/custom/tau2"       # optional: override the derived <tau2_repo>/.venv/bin/tau2
# tau2_data_dir = "/custom/data"  # optional: override the derived <tau2_repo>/data
# timeout = 600                   # optional per-task timeout (seconds)
