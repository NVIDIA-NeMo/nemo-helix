#
# A component package written the way someone outside this repository would write one.
# It depends on the plugin, not on the monorepo, and ships one entry point.
[project]
name = "acme-strategies"
version = "0.1.0"
description = "An out-of-tree Experimentalist strategy, used to prove the plugin mechanism."
requires-python = ">=3.12,<3.15"
dependencies = ["nemo-experimentalist-plugin"]

# The entry point's only job is to import the module, so the class registers itself.
[project.entry-points."nemo.experimentalist.components"]
"strategy.random-search" = "acme_strategies.random_search"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["acme_strategies"]
