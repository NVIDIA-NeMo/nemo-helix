[project]
name = "nemo-distillation-plugin"
description = "Distillation workflow entity and DAG executor for NeMo Helix."
requires-python = ">=3.11,<3.15"
version = "0.1.0"
dependencies = [
  "nemo-helix-plugin",
  "nemo-customizer-plugin",
  "nhx-customization-common",
  "pydantic>=2.0.0",
  "pyyaml>=6.0.2",
]

[tool.uv.sources]
nemo-helix-plugin = { workspace = true }
nemo-customizer-plugin = { workspace = true }
nhx-customization-common = { workspace = true }

[project.entry-points."nemo.services"]
distillation = "nemo_distillation_plugin.service:DistillationService"

[project.entry-points."nemo.controllers"]
distillation-workflows = "nemo_distillation_plugin.controller:DistillationWorkflowController"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_distillation_plugin"]

[dependency-groups]
dev = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
