  /apis/evaluator/v2/workspaces/{workspace}/tasksets/{name}:
    post:
      tags:
      - Evaluator Plugin Tasksets Routes
      summary: Create Taskset
      description: "Store a new taskset, addressed by workspace/name, and publish\
        \ it as revision 1.\n\nStrict create \u2014 409 if the name is taken. Use\
        \ ``PUT`` to publish a further revision."
      operationId: create_taskset_apis_evaluator_v2_workspaces__workspace__tasksets__name__post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[\w\-\.]+$
          title: Name
