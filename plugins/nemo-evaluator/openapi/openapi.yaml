  /apis/evaluator/v2/workspaces/{workspace}/tasks/{name}/revisions/{revision}:
    get:
      tags:
      - Evaluator Plugin Tasks Routes
      summary: Get Task Revision
      description: "Get a task's content as of a published revision.\n\n``revision``\
        \ is a content digest or a tag \u2014 exactly what a reference's ``#fragment``\
        \ carries,\nso a consumer holding ``workspace/task-a#<digest>`` reads what\
        \ was published rather than\nwhatever is current. Returns the full task DTO;\
        \ the collection route above is a thin index of\nwhat can be pinned to."
      operationId: get_task_revision_apis_evaluator_v2_workspaces__workspace__tasks__name__revisions__revision__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[\w\-\.]+$
          title: Name
      - name: revision
        in: path
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[\w\-\.]+$
          title: Revision
      responses:
        '200':
          description: Return the task's content as of a published revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task or revision not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/evaluator/v2/workspaces/{workspace}/tasks/{name}/tags/{tag}:
    put:
      tags:
      - Evaluator Plugin Tasks Routes
      summary: Tag Task Revision
      description: 'Point a tag at an already-published revision.


        Separate from publishing because blessing a revision usually happens *after*
        it has been

        evaluated. ``latest`` is reserved: it is machine-managed, always names the
        most recent publish,

        and moving it by hand would break the forward-only guarantee that keeps concurrent
        publishes

        consistent.'
      operationId: tag_task_revision_apis_evaluator_v2_workspaces__workspace__tasks__name__tags__tag__put
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[\w\-\.]+$
          title: Name
      - name: tag
        in: path
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[\w\-\.]+$
          title: Tag
      - name: revision
        in: query
        required: true
        schema:
          type: string
          description: "Revision to tag \u2014 a content digest, or another tag."
          title: Revision
        description: "Revision to tag \u2014 a content digest, or another tag."
      responses:
        '200':
          description: Point a tag at an existing revision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task or revision not found
        '422':
          description: Tag is reserved
