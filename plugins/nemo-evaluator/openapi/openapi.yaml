    Revision:
      properties:
        revision:
          type: integer
          title: Revision
          description: Monotonic 1-based ordinal within the record.
        content_hash:
          type: string
          title: Content Hash
          description: 'Full 64-char hex SHA-256 of the revision''s content. This
            is what a pinned reference carries: ''workspace/name#<content_hash>''.'
        tags:
          items:
            type: string
          type: array
          title: Tags
