            to evaluate.
        params:
          anyOf:
          - $ref: '#/components/schemas/RunConfig'
          - $ref: '#/components/schemas/RunConfigOnline'
          - $ref: '#/components/schemas/RunConfigOnlineModel'
          title: Params
          description: Optional evaluator SDK execution parameters.
        target:
          anyOf:
          - $ref: '#/components/schemas/Model'
          - oneOf:
            - $ref: '#/components/schemas/GenericAgent'
            - $ref: '#/components/schemas/NemoAgentToolkitAgent'
            discriminator:
              propertyName: format
              mapping:
                generic: '#/components/schemas/GenericAgent'
                nemo_agent_toolkit: '#/components/schemas/NemoAgentToolkitAgent'
          title: Target
          description: Optional model or agent target for online evaluation.
        prompt_template:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          title: Prompt Template
          description: Optional prompt template for online target generation.
        field_mapping:
          allOf:
          - $ref: '#/components/schemas/FieldMapping'
          description: Optional mapping from canonical evaluator fields to dataset
            columns.
        publication:
          allOf:
          - $ref: '#/components/schemas/RowPublicationSpec'
          description: Where the completed run publishes its results, beyond its own
            result artifacts. Omit to publish nowhere.
        metrics:
          items:
            $ref: '#/components/schemas/MetricInline'
          type: array
          minItems: 1
          title: Metrics
          description: Inline metrics with all references resolved.
      additionalProperties: false
      type: object
      required:
      - dataset
      - metrics
      title: EvaluateSpec
      description: Canonical SDK evaluation spec with platform model and metric references
        resolved.
    EvaluatorTaskDefinition:
      properties:
        kind:
          type: string
          const: evaluator
          title: Kind
          description: Task kind discriminator.
        intent:
          type: string
          title: Intent
          description: Human-readable description of the desired agent behavior.
        inputs:
          allOf:
          - $ref: '#/components/schemas/TaskInputs'
          description: Inputs supplied to the task.
        metrics:
          items:
            anyOf:
            - $ref: '#/components/schemas/MetricInline'
            - $ref: '#/components/schemas/MetricRef'
          type: array
          title: Metrics
          description: "Metrics that score this task \u2014 stored-metric references,\
            \ and inline bundles on create (normalized to derived stored metrics before\
            \ the task is persisted)."
        reference:
          additionalProperties: true
          type: object
          title: Reference
          description: 'Grader-only ground truth (held-out tests, expected outputs,
            rubric data). Surfaced to metrics but never seeded into the agent''s workspace
            or shown to the agent, so a metric can grade against artifacts the agent
            cannot influence. Held out from the *agent*, not from the API: anyone
            who can read the task can read this.'
        views:
          additionalProperties:
            $ref: '#/components/schemas/SemanticView'
          type: object
          title: Views
          description: Optional reporting views mapping metric outputs into named
            semantic scores.
      additionalProperties: false
      type: object
      required:
      - kind
      - intent
      title: EvaluatorTaskDefinition
      description: "What the agent should do, and how the platform scores it.\n\n\
        ``metrics`` accepts inline bundles on the way in and holds references once\
        \ stored: the service\noffloads an inline metric to a content-addressed *derived*\
        \ metric on create, so a persisted task\nonly ever names metrics it does not\
        \ own. That narrowing is a service invariant rather than a\ntype-level one\
        \ \u2014 a single model keeps the API surface small, at the cost of this field\
        \ being\nwider than what a stored task actually contains.\n\nEvery field here\
        \ is covered by the revision digest, ``reference`` included: it decides what\
        \ a\nmetric grades against, so two revisions that score differently must not\
        \ share a digest. Pinning\na revision therefore fixes the grading, not just\
        \ the prompt."
    EvidenceDescriptor:
      anyOf:
      - required:
        - ref
      - required:
        - data
      properties:
        kind:
          type: string
          title: Kind
          description: Evidence type, e.g. 'filesystem', 'trace', 'log_bundle', or
            'review'.
        ref:
          title: Ref
          description: Reference to externally stored evidence (e.g. a local path
            or storage ref).
          type: string
        format:
          title: Format
          description: Parser hint for the evidence payload, e.g. 'atif' for normalized
            traces.
          type: string
        data:
          allOf:
          - $ref: '#/components/schemas/JsonValue'
          description: Small inline evidence payload; at least one of ref or data
            must be set.
        description:
          title: Description
          description: Human-readable description of this evidence artifact.
          type: string
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
          description: Free-form metadata associated with the evidence descriptor.
      additionalProperties: false
      type: object
      required:
      - kind
      title: EvidenceDescriptor
      description: Descriptor for a candidate trace, source, or artifact.
    FabricRunnerTarget:
      properties:
        kind:
          type: string
          const: fabric
          title: Kind
          default: fabric
        config:
          additionalProperties: true
          type: object
          title: Config
          description: Inline NeMo Fabric agent config (an ``agent.yaml`` as a JSON-shaped
            mapping). Its ``harness.adapter_id`` selects the harness, e.g. ``nvidia.fabric.codex``
            for Codex.
        model:
          title: Model
          description: Optional ``provider/model`` slug applied as the config's default
            model; the harness default is used when omitted.
          type: string
        timeout_s:
          type: integer
          minimum: 1.0
          title: Timeout S
          description: Per-task timeout for the Fabric run, in seconds.
          default: 600
        capture_trajectory:
          type: boolean
          title: Capture Trajectory
          description: Capture the agent trajectory as ATIF via NeMo Relay and attach
            it to trial evidence. Requires the NeMo Relay gateway in the run environment.
          default: true
      additionalProperties: false
      type: object
      required:
      - config
      title: FabricRunnerTarget
      description: "Generate trials by driving an agent harness through the NeMo Fabric\
        \ runtime.\n\nFabric is harness-agnostic: the harness (Codex, Hermes, ...)\
        \ is selected by the supplied\nconfig's ``harness.adapter_id`` and is never\
        \ inferred from ``model``. ``model`` is applied as the\nconfig's default model\
        \ when given.\n\nA run is described by exactly one complete ``config``. Fabric\
        \ 0.1.0rc2 removed profile overlays,\nso the former ``profiles`` field is\
        \ gone \u2014 fold any overlay you were passing into ``config``."
    FieldMapping:
      properties:
        input:
          title: Input
          description: Binding for the canonical 'input' evaluator field.
          type: string
          minLength: 1
          pattern: ^[^\[\]]*$
        output:
          title: Output
          description: Binding for the canonical 'output' evaluator field.
          type: string
          minLength: 1
          pattern: ^[^\[\]]*$
        context:
          title: Context
          description: Binding for the canonical 'context' evaluator field.
          type: string
          minLength: 1
          pattern: ^[^\[\]]*$
        reference:
          title: Reference
          description: Binding for the canonical 'reference' evaluator field.
          type: string
          minLength: 1
          pattern: ^[^\[\]]*$
        trajectory:
          title: Trajectory
          description: Binding for the canonical 'trajectory' evaluator field.
          type: string
          minLength: 1
          pattern: ^[^\[\]]*$
        messages:
          title: Messages
          description: Binding for the canonical 'messages' evaluator field.
          type: string
          minLength: 1
          pattern: ^[^\[\]]*$
        tool_calls:
          title: Tool Calls
          description: Binding for the canonical 'tool_calls' evaluator field.
          type: string
          minLength: 1
          pattern: ^[^\[\]]*$
        tools:
          title: Tools
          description: Binding for the canonical 'tools' evaluator field.
          type: string
          minLength: 1
          pattern: ^[^\[\]]*$
        custom:
          additionalProperties:
            type: string
            minLength: 1
            pattern: ^[^\[\]]*$
          type: object
          title: Custom
          description: Additional evaluator field bindings keyed by canonical field
            name.
      additionalProperties: false
      type: object
      title: FieldMapping
      description: 'Maps canonical evaluator fields to raw dataset column paths.

        Example: {''input'': ''question'', ''output'': ''answer'', ''reference'':
        ''gold'', ''trajectory'': ''steps''}'
    FileStorageType:
      type: string
      enum:
      - fileset
      title: FileStorageType
    FilesetRef:
      type: string
      title: FilesetRef
      description: Reference to a persisted platform fileset, optionally with a file
        fragment.
    GenericAgent:
      properties:
        url:
          type: string
          title: Url
          description: Base URL of the agent endpoint.
        name:
          type: string
          title: Name
          description: Agent name / identifier.
        api_key_secret:
          allOf:
          - $ref: '#/components/schemas/SecretRef'
          description: 'API key secret reference for the agent. Format: workspace/secret_name
            or secret_name within the job workspace.'
        format:
          type: string
          const: generic
          title: Format
          default: generic
        body:
          additionalProperties: true
          type: object
          title: Body
          description: Jinja template for the request payload.
        response_path:
          type: string
          title: Response Path
          description: JSONPath expression used to extract the response value.
        trajectory_path:
          title: Trajectory Path
          description: Optional JSONPath expression used to extract trajectory data.
          type: string
        stream:
          type: boolean
          title: Stream
          description: Read JSON SSE data frames instead of a single JSON response
            body.
          default: false
        response_aggregation:
          type: string
          enum:
          - last
          - concat
          title: Response Aggregation
          description: How to combine matched data-frame values when 'stream' is true.
            'last' keeps the final matched value (endpoints that emit a full snapshot
            per frame); 'concat' joins matched string values in arrival order (token-delta
            endpoints).
          default: last
      additionalProperties: false
      type: object
      required:
      - url
      - name
      - body
      - response_path
      - format
      title: GenericAgent
      description: Configurable HTTP agent with optional JSON SSE response handling.
    GymRunnerTarget:
      properties:
        kind:
          type: string
          const: gym
          title: Kind
          default: gym
        environment:
          allOf:
          - $ref: '#/components/schemas/FilesetRef'
          description: Environment FileSet containing a native-v1 or wheels-v1 Gym
            package. The complete FileSet is staged read-only; file fragments are
            not supported.
        agent:
          type: string
          title: Agent
          description: Agent name to collect rollouts with, e.g. 'simple_agent'.
        agent_config:
          title: Agent Config
          description: Repo-relative built-in agent config. Required without an environment
            FileSet; with a FileSet it is used only when the package does not declare
            the selected agent instance.
          type: string
        resources_server:
          type: string
          title: Resources Server
          description: Resources-server (environment) name, e.g. 'mcqa' (--resources-server).
        model_type:
          type: string
          title: Model Type
          description: Model-type config (--model-type). `inference_provider` speaks
            OpenAI-compatible chat; `openai_model` uses the OpenAI Responses API.
          default: inference_provider
        bind_resources_server:
          type: boolean
          title: Bind Resources Server
          description: Auto-bind the agent's `resources_server.name` via a Hydra override.
            Set False for self-contained agents that already bind their own resources-server.
          default: true
        hydra_params:
          additionalProperties: true
          type: object
          title: Hydra Params
          description: "Parameters merged into Gym's Hydra config, as nested data\
            \ \u2014 {'model': {'temperature': 0.7}} rather than pre-serialized Hydra\
            \ strings \u2014 so a spec survives being sent as JSON. Flattened to Hydra's\
            \ grammar at invocation, after the auto-derived resources-server binding.\
            \ Distinct from `env_vars`: these configure the Gym environment, not the\
            \ OS environment."
        env_vars:
          additionalProperties:
            type: string
          type: object
          title: Env Vars
          description: "Environment variables set on the `gym` invocation. Some Gym\
            \ environments are configurable only this way \u2014 `wmt_translation`\
            \ reads `WMT_TRANSLATION_COMET_PY_CACHE` for its model-cache root and\
            \ defaults to a container-only path \u2014 and a job spec has no ambient\
            \ environment to inherit from, so whatever the environment needs has to\
            \ travel in the spec."
        agent_ref_name:
          title: Agent Ref Name
          description: Gym agent instance rollouts are routed to when running against
            a sandboxed host, stamped as each row's `agent_ref`. Defaults to `agent`.
            Set it when the environment's config defines the agent under a different
            name -- `mcqa` registers `mcqa_simple_agent`, and routing to `simple_agent`
            there does not answer.
          type: string
        env_secrets:
          additionalProperties:
            $ref: '#/components/schemas/SecretRef'
          type: object
          title: Env Secrets
          description: 'Environment variables sourced from the secrets service, as
            {ENV_NAME: secret-ref}. The reference travels in the spec; the service
            resolves it into the job''s environment at compile time, so no credential
            is stored on the spec or written to a run bundle. Use this rather than
            `env_vars` for anything secret -- a Gym model API key belongs here.'
        num_repeats:
          type: integer
          minimum: 1.0
          title: Num Repeats
          description: Attempts per row; each attempt becomes one trial.
          default: 1
        concurrency:
          type: integer
          minimum: 1.0
          title: Concurrency
          description: Concurrent rollouts for `gym eval run`.
          default: 4
        startup_timeout_s:
          type: number
          exclusiveMinimum: 0.0
          title: Startup Timeout S
          description: Max wait for `gym env start` readiness.
          default: 240.0
        collection_timeout_s:
          title: Collection Timeout S
          description: Max wait for `gym eval run` collection; None = unbounded.
          type: number
          exclusiveMinimum: 0.0
        shutdown_grace_s:
          type: number
          exclusiveMinimum: 0.0
          title: Shutdown Grace S
          description: Grace period for the Gym subprocess group to exit on SIGTERM
            before escalating to SIGKILL.
          default: 30.0
        reward_key:
          type: string
          title: Reward Key
          description: Key read from each rollout record.
          default: reward
      additionalProperties: false
      type: object
      required:
      - agent
      - resources_server
      title: GymRunnerTarget
      description: "Generate trials by driving a NeMo Gym environment through the\
        \ SDK's :class:`GymAgentTaskRunner`.\n\nThe deployment chooses colocated execution\
        \ in the Gym task container or a separate sandboxed\nGym host. An environment\
        \ FileSet requires the sandboxed path. The environment dataset is\nrecovered\
        \ from the tasks at run time \u2014 ``discover_gym_tasks`` records the source\
        \ row data needed\nto materialize the selected tasks for rollout collection."
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HarborRunnerTarget:
      properties:
        kind:
          type: string
          const: harbor
          title: Kind
          default: harbor
        agent_name:
          title: Agent Name
          description: Built-in Harbor agent to run (e.g. 'oracle'). Ignored when
            `agent_import_path` is set.
          default: oracle
          type: string
        agent_import_path:
          title: Agent Import Path
          description: Custom Harbor agent import path (e.g. 'harbor_wrapper:WrappedAgent');
            overrides `agent_name`. The module must already be importable in the run
            environment.
          type: string
        agent_model_name:
          title: Agent Model Name
          description: Optional model slug passed to the Harbor agent.
          type: string
        agent_kwargs:
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
          type: object
          title: Agent Kwargs
          description: 'Keyword arguments forwarded to the Harbor agent''s constructor,
            the equivalent of Harbor''s `--ak key=value`. Not for secrets: Harbor
            persists them unredacted in the job dir''s `config.json`; use `env_secrets`
            instead.'
        env_secrets:
          additionalProperties:
            $ref: '#/components/schemas/SecretRef'
          type: object
          title: Env Secrets
          description: 'Environment variables for the Harbor agent, sourced from the
            secrets service, as {ENV_NAME: secret-ref}. The reference travels in the
            spec; the service resolves it into the job''s environment at compile time,
            and Harbor receives a `${ENV_NAME}` template it expands when the agent
            is created, so no credential is stored on the spec, the run bundle, or
            the job dir''s `config.json`.'
        n_attempts:
          type: integer
          minimum: 1.0
          title: N Attempts
          description: Number of attempts Harbor runs per task.
          default: 1
        n_concurrent_trials:
          type: integer
          minimum: 1.0
          title: N Concurrent Trials
          description: Maximum concurrent Harbor trials.
          default: 4
        max_retries:
          type: integer
          minimum: 0.0
          title: Max Retries
          description: Harbor per-trial retry attempts on transient failures.
          default: 0
        artifacts:
          items:
            type: string
          type: array
          title: Artifacts
          description: Harbor artifact sources to collect per trial.
        trace_dir:
          title: Trace Dir
          description: Container path of agent traces to collect as the 'traces' artifact
            (e.g. '/app/traces').
          type: string
        reward_key:
          type: string
          title: Reward Key
          description: Key read from Harbor's per-trial rewards mapping to score against.
          default: reward
      additionalProperties: false
      type: object
      title: HarborRunnerTarget
      description: 'Generate trials by driving a Harbor job through the SDK''s :class:`HarborAgentTaskRunner`.


        Runs in *native* mode: Harbor builds and runs its own ``JobConfig`` (executing
        each task in a

        Docker environment, retrying, and writing a per-trial results tree), then
        the runtime adapts that

        tree into SDK trials. The dataset Harbor runs against is recovered from each
        task''s

        ``harbor_dataset_path`` metadata, so it is not configured here. The runtime-only
        jobs directory is

        injected from the job''s storage at run time; only the harness-selection and
        run knobs live here.'
    HarborTaskDefinition:
      properties:
        kind:
          type: string
          const: harbor
          title: Kind
          description: Task kind discriminator.
        archive_ref:
          type: string
          pattern: ^[\w\-.]+/[\w\-.]+#[\w\-./]+$
          title: Archive Ref
          description: 'Files reference to the task''s packaged directory (format:
            workspace/fileset#path).'
        archive_digest:
          type: string
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-f]{64}$
          title: Archive Digest
          description: "Content hash Harbor computed over the task directory. This\
            \ is the authoritative identity of a Harbor task's content \u2014 every\
            \ file, including task.toml."
        instruction:
          title: Instruction
          description: The task's instruction text, when it has one (multi-step tasks
            may not).
          type: string
        config:
          additionalProperties: true
          type: object
          title: Config
          description: "Harbor's own task configuration (verifier, agent, environment,\
            \ steps), as published. A queryable projection of task.toml \u2014 inspect\
            \ a task's verifier without downloading the archive. Opaque here: Harbor\
            \ owns this schema."
      additionalProperties: false
      type: object
      required:
      - kind
      - archive_ref
      - archive_digest
      title: HarborTaskDefinition
      description: "A reference to the task's packaged files, plus a projection of\
        \ Harbor's own config.\n\nHarbor identifies a task by a *directory* \u2014\
        \ ``task.toml``, an instruction, an environment \u2014 so\nwhat is stored\
        \ is a reference to that directory's archive in the Files service, not the\
        \ files\nthemselves. One fileset per task, so a task shared by several tasksets\
        \ is stored once. The\narchive is materialized back into ``<dir>/<task-name>/``\
        \ at run time, which is the layout\nHarbor's own discovery expects.\n\nWhich\
        \ agent runs the task is *not* stored here. That comes from the run's target\n\
        (``HarborRunnerTarget``), so the same stored task can be evaluated against\
        \ different agents.\nHarbor's own ``[agent]`` block \u2014 carried inside\
        \ ``config`` \u2014 configures how the agent *phase*\nruns (timeout, user,\
        \ network policy), not which agent it is."
    HelloResponse:
      properties:
        message:
          type: string
          title: Message
      type: object
      required:
      - message
      title: HelloResponse
    Histogram:
      properties:
        bins:
          items:
            $ref: '#/components/schemas/HistogramBin'
          type: array
          title: Bins
          description: Histogram bins.
      additionalProperties: false
      type: object
      required:
      - bins
      title: Histogram
      description: Histogram of score distribution.
    HistogramBin:
      properties:
        lower_bound:
          anyOf:
          - type: number
          - type: integer
          title: Lower Bound
          description: Lower bound of the bin (inclusive).
        upper_bound:
          anyOf:
          - type: number
          - type: integer
          title: Upper Bound
          description: Upper bound of the bin (exclusive for all but last bin).
        count:
          type: integer
          title: Count
          description: Number of values in this bin.
      additionalProperties: false
      type: object
      required:
      - lower_bound
      - upper_bound
      - count
      title: HistogramBin
      description: A single bin in a histogram.
    InferenceParams:
      properties:
        temperature:
          title: Temperature
          description: Float value between 0 and 1. temp of 0 indicates greedy decoding,
            where the token with highest prob is chosen. Temperature can't be set
            to 0.0 currently
          type: number
          maximum: 2.0
          minimum: 0.0
        max_tokens:
          title: Max Tokens
          description: Max tokens to generate
          type: integer
          minimum: 1.0
        max_completion_tokens:
          title: Max Completion Tokens
          description: Max tokens to generate
          type: integer
          minimum: 1.0
        top_p:
          title: Top P
          description: Float value between 0 and 1; limits to the top tokens within
            a certain probability. top_p=0 means the model will only consider the
            single most likely token for the next prediction
          type: number
          maximum: 1.0
          minimum: 0.0
        stop:
          title: Stop
          items:
            type: string
          type: array
      additionalProperties: true
      type: object
      title: InferenceParams
      description: Parameters for model inference. Extra fields can be supplied for
        additional options applied to the inference request directly. Fields not supported
        by the model may cause inference errors during evaluation.
    InlineMetricPayload:
      properties:
        kind:
          type: string
          const: inline
          title: Kind
          description: Payload format discriminator.
        metric:
          additionalProperties: true
          type: object
          title: Metric
          description: JSON-serialized built-in metric configuration, discriminated
            by its own `type`.
        digest:
          title: Digest
          description: SHA-256 digest of the canonical metric JSON. Informational;
            recomputed server-side.
          type: string
      additionalProperties: false
      type: object
      required:
      - kind
      - metric
      title: InlineMetricPayload
      description: 'Wire schema for an inline (config-serialized) metric payload.


        Mirrors the runtime ``InlineMetricPayload``. The metric is stored as its own

        JSON configuration and reconstructed from the metric type union at execution,

        so no code is shipped or executed on load. Used for platform-recognized

        built-in metric types.'
    IntakePublicationSpec:
      properties:
        evaluation_id:
          type: string
          minLength: 1
          title: Evaluation Id
          description: Name of the existing Evaluation to publish under. Must already
            exist; the job does not create it.
        agent_name:
          title: Agent Name
          description: Agent name recorded on each published trajectory. Derived from
            the target when it names one; required otherwise.
          type: string
          minLength: 1
        agent_version:
          type: string
          minLength: 1
          title: Agent Version
          description: Agent version recorded on each published trajectory. Neither
            a Model nor an Agent carries a version, so this defaults to 'unknown'
            unless the submitter supplies one.
          default: unknown
        required:
          type: boolean
          title: Required
          description: Fail the job when publication fails. Defaults to True so a
            run that asked to publish does not report success with nothing in Experiments.
            The result bundle is saved before publication runs, so a failed job still
            leaves the results intact to re-publish. Set False to keep the job successful
            and report the failure in its output instead.
          default: true
      additionalProperties: false
      type: object
      required:
      - evaluation_id
      title: IntakePublicationSpec
      description: "Publish this run's trials and scores to Intake, under an Evaluation\
        \ that already exists.\n\n``evaluation_id`` is the *name* of a ``client.evaluations``\
        \ record. Intake stores that record as\nits ``Experiment`` entity and the\
        \ SDK's ``publish_to_intake`` calls the argument\n``experiment_id``, but the\
        \ value is the same one either way \u2014 the parent ``client.experiments``\n\
        group is a different resource and is not what goes here. The job never creates\
        \ the Evaluation: a\nmissing one is an error, because nothing in an eval spec\
        \ can supply the dataset identity\n``evaluations.create`` requires."
    JsonValue:
      title: JsonValue
    MetadataItem:
      properties:
        key:
          type: string
          title: Key
          description: Annotation key.
        value:
          allOf:
          - $ref: '#/components/schemas/JsonValue'
          description: JSON-serializable annotation value.
      additionalProperties: false
      type: object
      required:
      - key
      - value
      title: MetadataItem
      description: A single key/value annotation on a task.
    Metric:
      properties:
        id:
          type: string
          title: Id
          description: Unique identifier for the stored metric.
        name:
          type: string
          title: Name
          description: Name of the metric, unique within its workspace.
        workspace:
          type: string
          title: Workspace
          description: Workspace the metric belongs to.
        project:
          title: Project
          description: The project associated with this metric.
          type: string
        metric_type:
          type: string
          title: Metric Type
          description: Runtime metric type name.
        description:
          title: Description
