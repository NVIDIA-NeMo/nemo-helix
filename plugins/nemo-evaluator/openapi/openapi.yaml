      - created_at
      title: Revision
      description: "A published revision of a task or taskset.\n\nDeliberately thin:\
        \ it identifies a revision and says when it was cut, without repeating the\n\
        content. Listing a record's history is a \"what can I pin to?\" question,\
        \ and answering it with\nfull content on every entry would make the response\
        \ large for no benefit \u2014 fetch the record at\na specific revision to\
        \ get its content."
    RevisionsPage:
      properties:
