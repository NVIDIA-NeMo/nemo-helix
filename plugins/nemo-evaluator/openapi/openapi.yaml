        name:
          type: string
          title: Name
          description: "Task name \u2014 the stable task id, unique within its workspace."
        workspace:
          type: string
          title: Workspace
          description: Workspace the task belongs to.
        project:
          title: Project
          description: The project associated with this task.
          type: string
        spec:
          oneOf:
          - $ref: '#/components/schemas/EvaluatorTaskDefinition'
          - $ref: '#/components/schemas/HarborTaskDefinition'
          title: Spec
          description: The task's content, discriminated by which runner executes
            it.
          discriminator:
            propertyName: kind
            mapping:
              evaluator: '#/components/schemas/EvaluatorTaskDefinition'
              harbor: '#/components/schemas/HarborTaskDefinition'
        metadata:
          items:
            $ref: '#/components/schemas/MetadataItem'
          type: array
          title: Metadata
          description: Key/value annotations for the task.
        revision:
          type: integer
          title: Revision
          description: "Ordinal of the published revision this content corresponds\
            \ to. Every stored task has at least one revision \u2014 creating a task\
            \ publishes revision 1 \u2014 so this is never 0."
        tags:
          additionalProperties:
            type: integer
          type: object
          title: Tags
          description: "Tag \u2192 revision-ordinal pointers. Reading the record's\
            \ current content returns every tag, including 'latest'. Reading a *specific*\
            \ revision returns only the tags pointing at that revision, which may\
            \ be none \u2014 so do not assume 'latest' is present."
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Timestamp the task was created.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Timestamp the task was last updated.
      type: object
      required:
      - id
      - name
      - workspace
      - spec
      - revision
      - created_at
      - updated_at
      title: Task
      description: "API representation of a stored agent-eval task.\n\nMaps to the\
        \ SDK :class:`~nemo_evaluator_sdk.agent_eval.tasks.AgentEvalTask` \u2014 the\
        \ task's stable\n``id`` is the record ``name`` (unique within its workspace).\
        \ Metrics are stored in their wire form\n(inline bundles and/or references\
        \ to stored metrics); references resolve to inline at run time."
    TaskFilter:
      additionalProperties: false
      description: Filter for task queries (top-level entity columns only; custom-field
        filtering is a follow-up).
      properties:
        workspace:
          description: Filter by workspace.
          title: Workspace
          type: string
        name:
          description: Filter by name.
          title: Name
          type: string
        created_at:
          allOf:
          - $ref: '#/components/schemas/DatetimeFilter'
          description: Filter by creation date.
        updated_at:
          allOf:
          - $ref: '#/components/schemas/DatetimeFilter'
          description: Filter by update date.
      title: TaskFilter
      type: object
    TaskInput:
      properties:
        spec:
          oneOf:
          - $ref: '#/components/schemas/EvaluatorTaskDefinition'
          - $ref: '#/components/schemas/HarborTaskDefinition'
          title: Spec
          description: The task's content, discriminated by which runner executes
            it.
          discriminator:
            propertyName: kind
            mapping:
              evaluator: '#/components/schemas/EvaluatorTaskDefinition'
              harbor: '#/components/schemas/HarborTaskDefinition'
        metadata:
          items:
            $ref: '#/components/schemas/MetadataItem'
          type: array
          title: Metadata
          description: Key/value annotations for the task.
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Tags to point at the revision this request publishes. 'latest'
            is always applied server-side and need not be listed.
      additionalProperties: false
      type: object
      required:
      - spec
      title: TaskInput
      description: "Create/replace body for a stored task (the name comes from the\
        \ path).\n\nThe authorable subset of :class:`Task` \u2014 the SDK ``AgentEvalTask``\
        \ shape minus server-owned\nfields (id, name, workspace, timestamps)."
    TaskInputs:
      properties:
        instruction:
          title: Instruction
          description: The agent's instruction (its prompt). Falls back to the task
            `intent` when unset.
          type: string
      additionalProperties: true
      type: object
      title: TaskInputs
      description: 'Inputs supplied to a task.


        ``instruction`` is the agent''s prompt; the runtime falls back to the task
        ``intent`` when it is unset.

        Additional task- or runtime-specific inputs, such as `gym_row` for Gym tasks,
        are also accepted fields.'
    TaskRef:
      type: string
      pattern: ^[\w\-.]+(/[\w\-.]+)?(#[\w\-.]+)?$
      title: TaskRef
      description: "Reference to a persisted task (format: ``workspace/name``, ``name``,\
        \ or either with a\n``#revision`` fragment).\n\nA taskset points at its member\
        \ tasks by reference (there are no inline tasks), so a stored\ntaskset only\
        \ ever holds refs. Unlike :class:`MetricRef`, a task ref may address a specific\n\
        revision via the platform's standard ``#`` sub-entity fragment.\n\nThe fragment\
        \ is optional *on input* and means :data:`LATEST_TAG` when absent \u2014 a\
        \ bare\n``workspace/name`` is \"the current revision\", not \"unpinned\".\
        \ It may name a tag or a content\ndigest. Anything **persisted** as a published\
        \ snapshot must carry a resolved digest: tags move,\nand a stored tag fragment\
        \ would silently re-point published membership."
    TaskSort:
      type: string
      enum:
      - name
      - -name
      - created_at
      - -created_at
      - updated_at
      - -updated_at
      title: TaskSort
      description: Sort fields for task queries.
    TasksPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Task'
          type: array
          title: Data
        pagination:
          allOf:
          - $ref: '#/components/schemas/PaginationData'
          description: Pagination information.
        sort:
          title: Sort
          description: The field on which the results are sorted.
          type: string
        filter:
          title: Filter
          description: Filtering information.
          additionalProperties: true
          type: object
      type: object
      required:
      - data
      title: TasksPage
    Taskset:
      properties:
        id:
          type: string
          title: Id
          description: Unique identifier for the stored taskset record.
        name:
          type: string
          title: Name
          description: "Taskset name \u2014 the stable id, unique within its workspace."
        workspace:
          type: string
          title: Workspace
          description: Workspace the taskset belongs to.
        project:
          title: Project
          description: The project associated with this taskset.
          type: string
        description:
          title: Description
          description: Human-readable description of the grouping.
          type: string
        tasks:
          items:
            $ref: '#/components/schemas/TaskRef'
          type: array
          title: Tasks
          description: References to the member tasks (set semantics; duplicates rejected).
        files_ref:
          title: Files Ref
          description: "Files reference to the taskset's own files \u2014 shared by\
            \ its members, owned by none."
          type: string
          pattern: ^[\w\-.]+/[\w\-.]+#[\w\-./]+$
        metadata:
          items:
            $ref: '#/components/schemas/MetadataItem'
          type: array
          title: Metadata
          description: Key/value annotations for the taskset.
        revision:
          type: integer
          title: Revision
          description: Ordinal of the published revision this content corresponds
            to. Every stored taskset has at least one revision, so this is never 0.
        tags:
          additionalProperties:
            type: integer
          type: object
          title: Tags
          description: "Tag \u2192 revision-ordinal pointers. Reading the record's\
            \ current content returns every tag, including 'latest'. Reading a *specific*\
            \ revision returns only the tags pointing at that revision, which may\
            \ be none \u2014 so do not assume 'latest' is present."
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Timestamp the taskset was created.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Timestamp the taskset was last updated.
      type: object
      required:
      - id
      - name
      - workspace
      - revision
      - created_at
      - updated_at
      title: Taskset
      description: "API representation of a stored taskset \u2014 a flexible grouping\
        \ of tasks with metadata.\n\nMembers are referenced by ``workspace/name``\
        \ (there are no inline tasks). Membership is a set:\norder is not significant\
        \ and duplicate references are rejected."
    TasksetFilter:
      additionalProperties: false
      description: Filter for taskset queries (top-level entity columns only; custom-field
        filtering is a follow-up).
      properties:
        workspace:
          description: Filter by workspace.
          title: Workspace
          type: string
        name:
          description: Filter by name.
          title: Name
          type: string
        created_at:
          allOf:
          - $ref: '#/components/schemas/DatetimeFilter'
          description: Filter by creation date.
        updated_at:
          allOf:
          - $ref: '#/components/schemas/DatetimeFilter'
          description: Filter by update date.
      title: TasksetFilter
      type: object
    TasksetInput:
      properties:
        description:
          title: Description
          description: Human-readable description of the grouping.
          type: string
        tasks:
          items:
            $ref: '#/components/schemas/TaskRef'
          type: array
          title: Tasks
          description: 'References to the member tasks (set semantics; duplicates
            rejected). Each may be bare, tag-pinned (''task-a#latest''), or digest-pinned;
            all are resolved to an exact digest when stored, so the grouping cannot
            change underneath you when a member republishes. Because membership is
            a set, the stored order is canonical rather than the submitted order:
            reordering the same members is not a content change and publishes no revision.'
        files_ref:
          title: Files Ref
          description: "Files reference to the taskset's own files \u2014 shared by\
            \ its members, owned by none. Upload them to the Files service first and\
            \ point here ('workspace/fileset#prefix'). The reference is part of the\
            \ taskset's content, so repointing it publishes a revision; pin the content\
            \ by referencing a location that is not rewritten."
          type: string
          pattern: ^[\w\-.]+/[\w\-.]+#[\w\-./]+$
        metadata:
          items:
            $ref: '#/components/schemas/MetadataItem'
          type: array
          title: Metadata
          description: Key/value annotations for the taskset.
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Tags to point at the revision this request publishes. 'latest'
            is always applied server-side and need not be listed.
      additionalProperties: false
      type: object
      title: TasksetInput
      description: "Create/replace body for a stored taskset (the name comes from\
        \ the path).\n\nThe authorable subset of :class:`Taskset` \u2014 minus server-owned\
        \ fields (id, name, workspace,\ntimestamps)."
    TasksetRef:
      type: string
      pattern: ^[\w\-.]+(/[\w\-.]+)?(#[\w\-.]+)?$
      title: TasksetRef
      description: "Reference to a persisted taskset (format: ``workspace/name`` or\
        \ ``name``, optionally ``#rev``).\n\nSame shape and charset as :class:`TaskRef`.\
        \ Lets an evaluation reference a stored taskset in place\nof an inline task\
        \ list; the taskset's member tasks are loaded and expanded during spec resolution.\n\
        \nAn optional ``#`` fragment pins the taskset revision to expand \u2014 a\
        \ tag or a full content digest,\nwith an absent fragment meaning ``latest``.\n\
        \nWhat each form guarantees, precisely. A taskset revision pins its members\
        \ by digest, so a member\ntask publishing new content never changes what *any*\
        \ ref expands to. A **bare** ref still tracks\nthe taskset's own revisions,\
        \ and republishing the taskset re-resolves its members on write \u2014 so\
        \ a\n``replace`` can change both which members are named and the content they\
        \ resolve to, even if the\nsubmitted member names were identical. A **pinned**\
        \ ref is fixed against that too, and is what an\nevaluation needs to stay\
        \ comparable across a ``replace``."
    TasksetSort:
      type: string
      enum:
      - name
      - -name
      - created_at
      - -created_at
      - updated_at
      - -updated_at
      title: TasksetSort
      description: Sort fields for taskset queries.
    TasksetsPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Taskset'
          type: array
          title: Data
        pagination:
          allOf:
          - $ref: '#/components/schemas/PaginationData'
          description: Pagination information.
        sort:
          title: Sort
          description: The field on which the results are sorted.
          type: string
        filter:
          title: Filter
          description: Filtering information.
          additionalProperties: true
          type: object
      type: object
      required:
      - data
      title: TasksetsPage
    TrialError:
      properties:
        type:
          type: string
          title: Type
          description: Error class name as the producer reported it, e.g. 'RuntimeError'.
            Rollup key for AgentEvalSummary.error_trial_ids. Falls back to 'UnknownException'
            when the producer reported a failure without a usable type.
        message:
          title: Message
          description: Short error message, when the producer supplied one.
          type: string
        traceback:
          title: Traceback
          description: 'Formatted traceback, when the producer supplied one. May be
            truncated by the adapter that captured it. Note run bundles are portable:
            this can carry absolute filesystem paths and other diagnostic text from
            the machine that ran the trial.'
          type: string
        occurred_at:
          type: string
          title: Occurred At
          description: "When the producer recorded the failure, as it reported it.\
            \ The SDK does not rewrite this: an aware value (UTC, offset) is kept,\
            \ and a naive value stays naive. Harbor's clock is naive local, e.g. '2026-08-13T17:22:32',\
            \ while that trial's start in result.json is UTC ('2026-08-14T00:22:25Z')\
            \ \u2014 the same instant on two clocks, so do not subtract them or attach\
            \ a zone Harbor never wrote. A runner that recorded an offset keeps it.\
            \ Not RFC 3339 date-time: the offset may be absent."
      additionalProperties: false
      type: object
      required:
      - type
      title: TrialError
      description: 'What went wrong producing one trial, as the producer reported
        it.


        Present means the *producer* reported a failure. It does **not** imply ``status
        is FAILED``: an

        errored trial can be marked as :attr:`AgentEvalTrialStatus.PARTIAL` so it
        is still scored (ex: HarborRuntime).

        It is also unrelated to a score diagnostic''s ``exception_type`` detail, which
        records that the

        *metric* raised - a different event.


        Frozen so callers cannot rewrite ``type`` after construction. These objects
        are returned as-is

        (not copied), and ``AgentEvalSummary.error_trial_ids`` groups trial ids by
        that string. Mutating

        ``type`` on a live object would leave the summary keyed on the old value while
        the trial reports

        a new one.'
    TrialMeasurements:
      properties:
        prompt_tokens:
          title: Prompt Tokens
          type: integer
          minimum: 0.0
        completion_tokens:
          title: Completion Tokens
          type: integer
          minimum: 0.0
        total_tokens:
          title: Total Tokens
          type: integer
          minimum: 0.0
        cache_creation_tokens:
          title: Cache Creation Tokens
          type: integer
