        in: query
        required: false
        schema:
          description: Optional project to associate with the taskset.
          title: Project
          type: string
        description: Optional project to associate with the taskset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TasksetInput'
      responses:
        '201':
          description: Store a new taskset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Taskset'
        '409':
          description: Taskset already exists
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Evaluator Plugin Tasksets Routes
      summary: Replace Taskset
      description: "Replace a taskset's membership and publish the result, creating\
        \ it if it does not exist.\n\nMembers are re-resolved to exact revision digests\
        \ on every write, so re-submitting the *same*\nmember names can still publish\
        \ a new revision \u2014 if a member task published in the meantime,\nthis\
        \ grouping now names different content and genuinely differs. A taskset's\
        \ identity is the\nexact revisions it names, not the names alone."
      operationId: replace_taskset_apis_evaluator_v2_workspaces__workspace__tasksets__name__put
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[\w\-\.]+$
          title: Name
      - name: project
        in: query
        required: false
        schema:
          description: Optional project to associate with the taskset.
          title: Project
          type: string
        description: Optional project to associate with the taskset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TasksetInput'
      responses:
        '200':
          description: Content already published; no new revision was cut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Taskset'
        '201':
          description: A new revision was published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Taskset'
        '409':
          description: Concurrent write; refresh and retry
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Evaluator Plugin Tasksets Routes
      summary: Get Taskset
      description: 'Get a stored taskset''s current membership.


        Use ``GET /tasksets/{name}/revisions/{revision}`` to read it as of a published
        revision.'
