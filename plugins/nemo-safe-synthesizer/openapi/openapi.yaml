    PiiColumnPlan:
      properties:
        column_name:
          type: string
          title: Column Name
          description: Name of the dataframe column to replace or scan.
        entity_type:
          allOf:
          - $ref: '#/components/schemas/EntityType'
          description: Entity this column holds. Identify-only entity types are not
            allowed here.
        pattern:
          title: Pattern
          description: Optional whole-value format using the grammar associated with
            this entity type. Only entity types that define a pattern syntax may set
            this. When provided, the whole column is replaced with the pattern if
            it covers at least 99% of non-null values (checked against the dataframe,
            not here).
          type: string
        depends_on:
          items:
            $ref: '#/components/schemas/ConditioningColumn'
          type: array
          title: Depends On
          description: Columns that condition the replacement of this column. Only
            entity types in ALLOWED_DEPENDS_ON may set this. Can omit ConditioningColumn.entity_type
            when the conditioner is listed in columns_to_replace. Matrix checks for
            explicit entity_type run here; omitted types and exclusive-group checks
            are resolved on PiiReplacementPlan.
      type: object
      required:
      - column_name
      - entity_type
      title: PiiColumnPlan
      description: "Replacement spec for one named column.\n\n``entity_type`` must\
        \ have action ``REPLACE`` or ``REPLACE_IN_TEXT``, not\n``IDENTIFY_ONLY``.\n\
        Identify-only types (``date``, ``gender``, ``city``, \u2026) are invalid here.\n\
        ``depends_on`` is allowed only for types in ``ALLOWED_DEPENDS_ON``."
    PiiSamplerBackend:
      type: string
      enum:
      - nemotron-personas
      - faker
      title: PiiSamplerBackend
      description: Source of synthetic values for names and related person-like fields.
    PiiSamplerConfig:
      properties:
        backend:
          allOf:
          - $ref: '#/components/schemas/PiiSamplerBackend'
          description: 'Person sampler backend: downloaded Nemotron-Personas assets
            or Faker.'
          default: nemotron-personas
        nemotron_personas_path:
          title: Nemotron Personas Path
          description: Root directory containing downloaded Nemotron-Personas files
            as datasets/{locale}.parquet. Defaults to NSS_NEMOTRON_PERSONAS_PATH or
            ~/.data-designer/managed-assets.
          type: string
      type: object
      title: PiiSamplerConfig
      description: Settings for Nemotron-Personas or Faker-backed person sampling.
    PreflightParameters:
      properties:
        disabled_checks:
          items:
            type: string
          type: array
          title: Disabled Checks
          description: Names of preflight checks to skip at runtime (e.g. ``gpu.vram``).
            Disabled checks are dropped from the report entirely.
      type: object
      title: PreflightParameters
      description: User-controllable overrides for the preflight validation layer.
    QuantizationScheme:
      type: string
      enum:
      - bnb-4bit
      - bnb-8bit
      - fp8
      - nvfp4
      - mxfp4
      title: QuantizationScheme
      description: "Quantization schemes supported when ``quantize_model=True``.\n\
        \nMembers are string values so they serialize cleanly through pydantic\nand\
        \ JSON configs. The enum also owns construction of the corresponding\ntransformers\
        \ ``quantization_config`` object; optional ML dependencies stay\nlocally imported\
        \ in that construction path.\n\nSelection guide:\n- ``bnb-4bit`` / ``bnb-8bit``:\
        \ bitsandbytes NF4 / int8. Widest hardware\n  support (Ampere+), works with\
        \ QLoRA and LoftQ. ``bnb-8bit`` is the default.\n- ``fp8``: transformers ``FineGrainedFP8Config``.\
        \ Float8 with block-wise\n  scaling. Requires Hopper (sm_90+) or Blackwell.\
        \ Inference-leaning.\n- ``nvfp4``: NVIDIA FP4 via ``torchao.prototype.mx_formats.NVFP4WeightOnlyConfig``\n\
        \  wrapped in ``TorchAoConfig``. Requires Blackwell (sm_100+). Weight-only.\n\
        - ``mxfp4``: OCP Microscaling FP4 via transformers ``Mxfp4Config``.\n  Hardware\
        \ support varies by torch/torchao version."
    ReplacePiiConfigInput:
      properties:
        schema_version:
          type: integer
          const: 3
          title: Schema Version
          description: Version of this replace_pii configuration schema. Missing versions
            are treated as version 3; this release accepts only version 3.
          default: 3
        locale:
          type: string
          title: Locale
          description: Locale for generated names and addresses, for reading phone
            numbers written without a country code, and of the Nemotron-Personas dataset
            (datasets/{locale}.parquet).
          default: en_US
        seed:
          title: Seed
          description: Seed for synthetic value generation. When unset, each run draws
            a random seed and saves it in the resolved configuration. Anyone who knows
            the seed can test guesses for original values in the replaced data, so
            keep a configuration that contains it as private as the input data.
          type: integer
        sampler:
          allOf:
          - $ref: '#/components/schemas/PiiSamplerConfig'
          description: 'Sampler that generates names and addresses: Nemotron-Personas
            or Faker. When sampler is not set, NSS uses Nemotron-Personas, or Faker
            with a warning when the Nemotron-Personas data for locale is missing and
            the plan maps no ethnicity values. A relative nemotron_personas_path is
            resolved against the directory of the configuration file.'
        replacement_plan:
          anyOf:
          - properties:
              columns_to_replace:
                items:
                  $ref: '#/components/schemas/PiiColumnPlan'
                type: array
                title: Columns To Replace
                description: Columns to replace or (for free_text) scan for PII spans
                  to rewrite.
              data_to_sampler_value_mapping:
                additionalProperties:
                  additionalProperties:
                    items:
                      type: string
                    type: array
                  type: object
                type: object
                title: Data To Sampler Value Mapping
                description: 'Maps dataset values in depends_on columns to the values
                  used by replace_pii.sampler. Unlike most NSS settings, all matching
                  here ignores case: dataset values, mapping keys, and sampler values,
                  so Female, female, and FEMALE are the same value. For example, {sex:
                  {Woman: [female], Non-binary: [female, male]}} makes rows where
                  sex is Woman sample a female persona and rows where sex is Non-binary
                  sample either. Gender values are female and male for every sampler;
                  Nemotron-Personas also accepts its locale''s own words, such as
                  femme in fr_FR. Ethnicity values need Nemotron-Personas in a locale
                  with ethnicity data. A dataset value without an entry is looked
                  up in the sampler as is; a value that has no entry and matches no
                  sampler value is an error. When replace_pii.replacement_plan is
                  ''auto_discovery'', NSS generates this mapping for you.'
            type: object
            title: PiiReplacementPlan
            description: 'Dataset-specific replacement plan: the part of ``replace_pii``
              a person reviews.


              ``data_to_sampler_value_mapping`` targets the values of ``replace_pii.sampler``

              in ``replace_pii.locale``, so a plan is checked against the sampler
              of each

              run that uses it. ``columns_to_replace`` is a flat list whose

              cross-column relationships are ``depends_on`` edges (a DAG). Context-free

              dependency and graph checks are enforced here; plan-vs-dataframe checks

              live in ``pii_replacer.planning.validation``.'
          - type: string
          title: Replacement Plan
          description: '''auto_discovery'' to discover the plan from the data; an
            inline plan; or the path of a YAML plan file. A relative path is resolved
            against the directory of the configuration file.'
          default: auto_discovery
        llm:
          allOf:
          - $ref: '#/components/schemas/LLMConfig'
          description: Inference behavior for LLM-assisted plan discovery; the defaults
            run a local vLLM server. The endpoint is configured at runtime through
            NSS_INFERENCE_ENDPOINT or --inference-endpoint-url. An inline plan makes
            no LLM request.
        free_text_detection:
          allOf:
          - $ref: '#/components/schemas/FreeTextDetectionConfig'
          description: GLiNER2 and deterministic built-in regex settings for detecting
            PII spans in free-text columns.
      type: object
      title: ReplacePiiConfigInput
      description: 'Top-level ``replace_pii`` config.


        ``replacement_plan`` holds what a person reviews: the columns to replace

        and the value mapping. It is ``"auto_discovery"`` (the default), an inline

        plan, or the path of a YAML plan file, resolved relative to the

        configuration file that names it. ``locale``, ``seed``, and ``sampler``

        configure generation; a plan''s value mapping is checked against the

        ``sampler`` and ``locale`` of each run. ``llm`` and ``free_text_detection``

        configure how NSS finds PII.


        Auto-discovery classifies columns with the LLM configured by ``llm``, which

        defaults to the NSS inference defaults. An inline plan bypasses discovery,

        so it makes no LLM request; that is the way to replace PII without an LLM.

        The API key remains a runtime secret supplied through ``NSS_INFERENCE_KEY``

        or the corresponding CLI option; it is never stored in this model.


        v2 fields ``globals`` and ``steps`` are rejected with a removal error.'
    SafeSynthesizerJobConfig:
      properties:
        data_source:
          type: string
          title: Data Source
          description: The data source for the job.
        config:
          allOf:
          - $ref: '#/components/schemas/SafeSynthesizerParameters'
          description: The Safe Synthesizer parameters configuration.
        hf_token_secret:
          title: Hf Token Secret
          description: Name of platform secret containing the HuggingFace token. Must
            exist in the same workspace as the job.
          type: string
        pretrained_model_job:
          title: Pretrained Model Job
          description: Optional previous NSS job whose stored adapter artifact is
            reused for generation-only synthesis. Accepts either '<job>' in the current
            workspace or '<workspace>/<job>'. The plugin resolves the prior job's
            'adapter' result from Files.
          type: string
        pii_model_provider:
          title: Pii Model Provider
          description: Inference Gateway model provider, as '<workspace>/<provider>',
            that PII replacement uses to find PII. Required when PII replacement discovers
            its plan automatically; set the model it serves in config.replace_pii.llm.model_id.
          type: string
      type: object
      required:
      - data_source
      - config
      title: SafeSynthesizerJobConfig
      description: 'Configuration model for Safe Synthesizer jobs.


        Used primarily internally to configure a run submitted to the NeMo Jobs

        Microservice.'
    SafeSynthesizerParameters:
      properties:
        data:
          allOf:
          - $ref: '#/components/schemas/DataParameters'
          description: Configuration controlling how input data is grouped and split
            for training and evaluation.
        evaluation:
          allOf:
          - $ref: '#/components/schemas/EvaluationParameters'
          description: Parameters for evaluating the quality of generated synthetic
            data.
        training:
          allOf:
          - $ref: '#/components/schemas/TrainingHyperparams'
          description: Hyperparameters for model training such as learning rate, batch
            size, and LoRA adapter settings.
        generation:
          allOf:
          - $ref: '#/components/schemas/GenerateParameters'
          description: Parameters governing synthetic data generation including temperature,
            top-p, and number of records to produce.
        privacy:
          allOf:
          - $ref: '#/components/schemas/DifferentialPrivacyHyperparams'
          description: Differential-privacy hyperparameters. When ``None``, differential
            privacy is disabled entirely.
        time_series:
          allOf:
          - $ref: '#/components/schemas/TimeSeriesParameters'
          description: Configuration for time-series mode. Time-series pipeline is
            currently experimental.
        replace_pii:
          allOf:
          - $ref: '#/components/schemas/ReplacePiiConfigInput'
          description: PII replacement configuration. When ``None``, PII replacement
            is skipped.
        preflight:
          allOf:
          - $ref: '#/components/schemas/PreflightParameters'
          description: Preflight validation overrides, including checks to skip via
            ``disabled_checks``.
        emit_telemetry:
          type: boolean
          title: Emit Telemetry
          description: Whether to emit anonymous Safe Synthesizer telemetry events.
            Defaults from NEMO_TELEMETRY_ENABLED when unset.
        unknown_fields:
          type: string
          enum:
          - ignore
          - reject
          title: Unknown Fields
          description: How unknown configuration keys are handled recursively. Use
            'ignore' only for compatibility with stale configurations and notebooks
            or mismatched client and service versions.
          default: reject
        enable_synthesis:
          type: boolean
          title: Enable Synthesis
          description: Whether to run LLM training and generation phases. When false
            the task only performs PII replacement and returns the processed data.
          default: true
        enable_replace_pii:
          type: boolean
          title: Enable Replace Pii
          description: Whether to run the default PII replacement pipeline before
            synthesis.
          default: true
      type: object
      title: SafeSynthesizerParameters
      description: NHX-facing Safe Synthesizer parameters with SDK convenience flags.
    SafeSynthesizerSummary:
      properties:
        synthetic_data_quality_score:
          title: Synthetic Data Quality Score
          description: Weighted composite of the five sub-scores below (SQS). Higher
            is better (0--10 scale).
          type: number
        column_correlation_stability_score:
          title: Column Correlation Stability Score
          description: How closely pairwise column correlations in synthetic data
            match the original for numeric and categorical columns.
          type: number
        deep_structure_stability_score:
          title: Deep Structure Stability Score
          description: PCA-based comparison of multivariate structure between real
            and synthetic data for numeric and categorical columns.
          type: number
        column_distribution_stability_score:
          title: Column Distribution Stability Score
          description: Per-column Jensen-Shannon distance between training and synthetic
            distributions averaged across all numeric and categorical columns.
          type: number
        text_semantic_similarity_score:
          title: Text Semantic Similarity Score
          description: Embedding-based semantic closeness between real and synthetic
            free-text columns.
          type: number
        text_structure_similarity_score:
          title: Text Structure Similarity Score
          description: Jensen-Shannon divergence over sentence count, words-per-sentence,
            and characters-per-word distributions between real and synthetic free-text
            columns.
          type: number
        autocorrelation_similarity_score:
          title: Autocorrelation Similarity Score
          description: How closely lagged self-correlation in synthetic time-series
            sequences matches the training sequences.
          type: number
        window_membership_inference_protection_score:
          title: Window Membership Inference Protection Score
          description: Resistance to attacks that use short windows of consecutive
            values to determine whether a time-series sequence was in the training
            set. Reported on its own; not part of the Data Privacy Score.
          type: number
        data_privacy_score:
          title: Data Privacy Score
          description: Composite of MIA and AIA protection scores.
          type: number
        membership_inference_protection_score:
          title: Membership Inference Protection Score
          description: Resistance to attacks that try to determine whether a record
            was in the training set.
          type: number
        attribute_inference_protection_score:
          title: Attribute Inference Protection Score
          description: Resistance to attacks that try to infer sensitive attributes
            from quasi-identifiers.
          type: number
        num_valid_records:
          title: Num Valid Records
          description: Count of synthetic records that passed schema and format validation.
          type: integer
        num_invalid_records:
          title: Num Invalid Records
          description: Count of synthetic records filtered out during validation.
          type: integer
        num_prompts:
          title: Num Prompts
          description: Total LLM generation prompts issued.
          type: integer
        valid_record_fraction:
          title: Valid Record Fraction
          description: 'Ratio of valid records: ``num_valid_records / (num_valid_records
            + num_invalid_records)``.'
          type: number
        num_completion_tokens:
          title: Num Completion Tokens
          description: Total tokens generated by the LLM across all completions.
          type: integer
        num_valid_record_tokens:
          title: Num Valid Record Tokens
          description: Tokens in records that passed validation.
          type: integer
        num_invalid_record_tokens:
          title: Num Invalid Record Tokens
          description: Tokens in records that failed validation.
          type: integer
        num_non_record_tokens:
          title: Num Non Record Tokens
          description: Tokens not part of any recognized record.
          type: integer
        valid_record_token_fraction:
          title: Valid Record Token Fraction
          description: Fraction of total completion tokens in valid records.
          type: number
        tokens_per_prompt:
          title: Tokens Per Prompt
          description: 'Average completion tokens per prompt: num_completion_tokens
            / num_prompts.'
          type: number
        tokens_per_second:
          title: Tokens Per Second
          description: Total completion tokens divided by generation wall-clock time.
          type: number
        valid_tokens_per_second:
          title: Valid Tokens Per Second
          description: Valid record tokens divided by generation wall-clock time.
          type: number
        tokenization_overhead_sec:
          title: Tokenization Overhead Sec
          description: Wall-clock seconds spent on tokenization for statistics tracking.
          type: number
        timing:
          allOf:
          - $ref: '#/components/schemas/SafeSynthesizerTiming'
          description: Per-stage wall-clock durations.
      type: object
      required:
      - timing
      title: SafeSynthesizerSummary
      description: "Aggregated quality, privacy, and record-count metrics for a pipeline\
        \ run.\n\nToken-field invariants (when all referenced fields are populated):\n\
        \n* ``num_non_record_tokens == num_completion_tokens\n  - num_valid_record_tokens\
        \ - num_invalid_record_tokens``\n  (clamped to 0 if slight tokenizer-boundary\
        \ drift makes the\n  subtraction negative).\n* ``tokens_per_prompt == num_completion_tokens\
        \ / num_prompts``.\n* ``valid_record_token_fraction == num_valid_record_tokens\n\
        \  / num_completion_tokens``."
    SafeSynthesizerTiming:
      properties:
        total_time_sec:
          title: Total Time Sec
          description: Total end-to-end pipeline duration in seconds.
          type: number
        pii_replacer_time_sec:
          title: Pii Replacer Time Sec
          description: Time spent on PII replacement.
          type: number
        training_time_sec:
          title: Training Time Sec
          description: Time spent on model training.
          type: number
        generation_time_sec:
          title: Generation Time Sec
          description: Time spent generating synthetic records.
          type: number
        evaluation_time_sec:
          title: Evaluation Time Sec
          description: Time spent evaluating synthetic data quality.
          type: number
      type: object
      title: SafeSynthesizerTiming
      description: Wall-clock durations for each pipeline stage.
    StringFilter:
      additionalProperties: false
      properties:
        $eq:
          description: Filter for results equal to this value.
          title: $Eq
          type: string
        $like:
          description: Filter for results matching this pattern.
          title: $Like
          type: string
        $in:
          description: Filter for results in this list of values.
          title: $In
          items:
            type: string
          type: array
        $nin:
          description: Filter for results not in this list of values.
          title: $Nin
          items:
            type: string
          type: array
      title: StringFilter
      type: object
    StructuredGenerationParameters:
      properties:
        enabled:
          type: boolean
          title: enabled
          description: Whether to use structured generation for better format control.
          default: false
        backend:
          type: string
          enum:
          - auto
          - xgrammar
          - guidance
          - outlines
          - lm-format-enforcer
          title: backend
          description: 'The backend used by vLLM when structured generation is enabled.
            Supported backends: ''outlines'', ''guidance'', ''xgrammar'', ''lm-format-enforcer''.
            ''auto'' will allow vLLM to choose the backend.'
          default: auto
        schema_method:
          type: string
          enum:
          - auto
          - regex
          - json_schema
          - structural_tag
          title: schema_method
          description: The method used to generate the schema from your dataset and
            pass it to the generation backend. 'auto' picks 'structural_tag' on xgrammar-capable
            backends and 'regex' otherwise. 'regex' uses a custom regex construction
            method that tends to be more comprehensive than 'json_schema' at the cost
            of speed. 'structural_tag' uses XGrammar Structural Tag to compose schema-constrained
            JSONL output.
          default: auto
        use_single_sequence:
          type: boolean
          title: use_single_sequence
          description: Whether to use a regex that matches exactly one sequence or
            record if ``max_sequences_per_example`` is 1.
          default: false
        max_records_per_sequence:
          title: max_records_per_sequence
          description: Max records per grouped sequence under structured generation.
            None uses the largest training group size. Must be None or >= 1.
          type: integer
      type: object
      title: StructuredGenerationParameters
      description: 'Configuration for vLLM structured generation.


        These parameters control whether generation is constrained to schema-shaped

        output, which backend enforces the constraint, and how the constraint schema

        is built.'
    TimeSeriesEvaluationParameters:
      properties:
        enabled:
          title: Enabled
          description: Enable time-series evaluation metrics. Defaults to None, which
            follows time_series.is_timeseries. True requires top-level time-series
            mode.
          type: boolean
        autocorrelation:
          allOf:
          - $ref: '#/components/schemas/AutocorrelationSimilarityParameters'
          description: Autocorrelation similarity metric parameters.
        window_group_mia:
          allOf:
          - $ref: '#/components/schemas/WindowGroupMIAParameters'
          description: Window membership inference protection metric parameters.
      type: object
      title: TimeSeriesEvaluationParameters
      description: 'Metric-specific time-series evaluation configuration.


        Each metric''s parameters are one ``TimeSeriesMetricParameters`` field.'
    TimeSeriesParameters:
      properties:
        is_timeseries:
          type: boolean
          title: Is Timeseries
          description: Whether to treat the dataset as time series. When enabled,
            either ``timestamp_column`` or ``timestamp_interval_seconds`` is required.
            For grouped time series, ``group_training_examples_by`` needs to be set.
          default: false
        timestamp_column:
          title: Timestamp Column
          description: Name of the column containing timestamps used to order records
            when ``is_timeseries`` is ``True``. Required only when ``is_timeseries``
            is ``True`` and ``timestamp_interval_seconds`` is not provided.
          type: string
        timestamp_interval_seconds:
          title: Timestamp Interval Seconds
          description: Positive whole-number interval in seconds between timestamps.
            If not provided, the timestamp column will be used to infer the interval.
          type: integer
        timestamp_format:
          title: Timestamp Format
          description: 'Format of the timestamp column. Accepts either: (1) Python
            strftime format codes for string timestamps (e.g., ''%Y-%m-%d %H:%M:%S'',
            ''%m/%d/%Y''), or (2) ''elapsed_seconds'' for numeric (int/float) timestamps
            representing seconds as an increasing counter (e.g., 0, 60, 120 for 1-minute
            intervals). If not provided, the format will be inferred from the data.'
          type: string
        start_timestamp:
          anyOf:
          - type: string
          - type: integer
          title: Start Timestamp
          description: Start timestamp. If not provided, the first timestamp in the
            timestamp column will be used.
        stop_timestamp:
          anyOf:
          - type: string
          - type: integer
          title: Stop Timestamp
          description: Stop timestamp. If not provided, the last timestamp in the
            timestamp column will be used.
      type: object
      title: TimeSeriesParameters
      description: 'Configuration for time-series mode in the Safe Synthesizer pipeline.


        Controls whether a dataset is treated as time-series data, including

        timestamp column selection, interval inference, and format validation.

        The time-series pipeline is currently experimental.'
    TrainingHyperparams:
      properties:
        num_input_records_to_sample:
          anyOf:
          - type: string
            const: auto
          - type: integer
          title: num_input_records_to_sample
          description: Number of records the model will see during training. This
            parameter is a proxy for training time. For example, if its value is the
            same size as the input dataset, this is like training for a single epoch.
            If its value is larger, this is like training for multiple (possibly fractional)
            epochs. If its value is smaller, this is like training for a fraction
            of an epoch. Supports 'auto' where a reasonable value is chosen based
            on other config params and data.
          default: auto
        batch_size:
          type: integer
          title: batch_size
          description: The batch size per device for training. Must be >= 1.
          default: 1
        gradient_accumulation_steps:
          type: integer
          title: gradient_accumulation_steps
          description: Number of update steps to accumulate the gradients for, before
            performing a backward/update pass. This technique increases the effective
            batch size that will fit into GPU memory. Must be >= 1.
          default: 8
        weight_decay:
          type: number
          title: weight_decay
          description: The weight decay to apply to all layers except all bias and
            LayerNorm weights in the AdamW optimizer. Must be in (0, 1).
          default: 0.01
        warmup_steps:
          type: number
          title: warmup_steps
          description: Linear warmup from 0 to the learning rate. A whole number of
            1 or more sets the exact number of warmup steps; a float in (0, 1) is
            treated as a ratio of total training steps; 0 disables warmup. Must be
            finite and >= 0, and cannot be fractional at or above 1.
          default: 0.05
        lr_scheduler:
          type: string
          title: lr_scheduler
          description: The scheduler type to use. See the HuggingFace documentation
            of ``SchedulerType`` for all possible values.
          default: cosine
        learning_rate:
          anyOf:
          - type: string
            const: auto
          - type: number
          title: learning_rate
          description: The initial learning rate for `AdamW` optimizer. Must be in
            (0, 1). Setting to 'auto' uses a model-specific default if one exists.
          default: auto
        lora_r:
          type: integer
          title: lora_r
          description: The rank of the LoRA update matrices. Lower rank results in
            smaller update matrices with fewer trainable parameters. Must be > 0.
          default: 32
        lora_alpha_over_r:
          type: number
          title: lora_alpha_over_r
          description: The ratio of the LoRA scaling factor (alpha) to the LoRA rank.
            Empirically, this parameter works well when set to 0.5, 1, or 2. Must
            be in [0.5, 3].
          default: 1.0
        lora_target_modules:
          items:
            type: string
          type: array
          title: lora_target_modules
          description: 'The list of transformer modules to apply LoRA to. Possible
            modules: ''q_proj'', ''k_proj'', ''v_proj'', ''o_proj'', ''gate_proj'',
            ''up_proj'', ''down_proj''.'
          default:
          - q_proj
          - k_proj
          - v_proj
          - o_proj
        rope_scaling_factor:
          anyOf:
          - type: string
            const: auto
          - type: integer
          title: rope_scaling_factor
          description: Scale the base LLM's context length by this factor using RoPE
            scaling. Must be >= 1 or 'auto'.
          default: auto
        validation_ratio:
          type: number
          title: validation_ratio
          description: The fraction of the training data used for validation. Must
            be in [0, 1]. If set to 0, no validation will be performed. If set larger
            than 0, validation loss will be computed and reported throughout training.
          default: 0.0
        validation_steps:
          type: integer
          title: validation_steps
          description: The number of steps between validation checks for the HF Trainer
            arguments. Must be > 0.
          default: 15
        pretrained_model:
          type: string
          title: pretrained_model
          description: Pretrained model to use for fine-tuning. Defaults to SmolLM3.
            May be a Hugging Face model ID (loaded from the Hugging Face Hub or cache)
            or a local path. See security note in docs before using untrusted sources.
          default: HuggingFaceTB/SmolLM3-3B
        quantize_model:
          type: boolean
          title: quantize_model
          description: Whether to quantize the model during training. This can reduce
            memory usage and potentially speed up training, but may also impact model
            accuracy.
          default: false
        quantization_scheme:
          allOf:
          - $ref: '#/components/schemas/QuantizationScheme'
          title: quantization_scheme
          description: Quantization scheme to use when ``quantize_model=True``. Accepts
            ``bnb-4bit``, ``bnb-8bit``, ``fp8``, ``nvfp4``, or ``mxfp4``. Non-bitsandbytes
            schemes are incompatible with ``peft_implementation='loftq'``.
          default: bnb-8bit
        peft_implementation:
          type: string
          title: peft_implementation
          description: 'The PEFT (Parameter-Efficient Fine-Tuning) implementation
            to use. Options: ''lora'' for Low-Rank Adaptation, ''QLORA'' for Quantized
            LoRA.'
          default: QLORA
        max_vram_fraction:
          type: number
          title: max_vram_fraction
          description: The fraction of the total VRAM to use for training. Modify
            this to allow longer sequences. Must be in [0, 1].
          default: 0.8
        attn_implementation:
          type: string
          title: attn_implementation
          description: 'The attention implementation to use for model loading. Default
            uses ''sdpa'' (PyTorch scaled dot product attention) for broad compatibility.
            Other common values: ''flash_attention_2'' (requires flash-attn pip package),
            ''flash_attention_3'' (requires flash-attn-3 support), ''eager'' (standard
            PyTorch). Custom HuggingFace Kernels Hub paths (e.g. ''kernels-community/flash-attn2'')
            are also supported.'
          default: sdpa
      type: object
      title: TrainingHyperparams
      description: 'Hyperparameters that control the training process behavior.


        This class contains all the fine-tuning hyperparameters that control how the
        model

        learns, including learning rates, batch sizes, LoRA configuration, and optimization

        settings. These parameters directly affect training performance and quality.'
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
          additionalProperties: true
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ValidationParameters:
      properties:
        group_by_accept_no_delineator:
          type: boolean
          title: group_by_accept_no_delineator
          description: Whether to accept completions without both beginning and end
            of sequence delineators as a single sequence.
          default: false
        group_by_ignore_invalid_records:
          type: boolean
          title: group_by_ignore_invalid_records
          description: Whether to ignore invalid records in a sequence and proceed
            with the valid records.
          default: false
        group_by_fix_non_unique_value:
          type: boolean
          title: group_by_fix_non_unique_value
          description: Whether to automatically fix non-unique group-by values in
            a sequence by using the first unique value for all records.
          default: false
        group_by_fix_unordered_records:
          type: boolean
          title: group_by_fix_unordered_records
          description: Whether to automatically fix unordered records in a sequence
            by sorting the records.
          default: false
        enforce_numeric_range:
          type: boolean
          title: enforce_numeric_range
          description: When True, reject floats outside the training-observed min/max.
            Set False to skip float range checks (integers/enums still enforced).
          default: true
      type: object
      title: ValidationParameters
      description: 'Configuration for record and sequence validation.


        These parameters control the validation and automatic fixes when going

        from LLM output to tabular data.'
    WindowGroupMIAParameters:
      properties:
        value_columns:
          title: Value Columns
          description: Numeric value columns combined into each window. Defaults to
            all shared columns inferred as numeric, up to max_columns. Changing this
            selection changes the meaning of the score.
          items:
            type: string
          type: array
        window_size:
          type: integer
          minimum: 2.0
          title: Window Size
          description: Number of consecutive observations compared as one window.
            Training and holdout windows use a stride of half the window_size, and
            synthetic windows use a stride of 1. Shorter windows detect partial copies
            in shorter sequences, and longer windows detect copies blurred by noise.
            Scores computed with different windows are not directly comparable.
          default: 10
        max_windows:
          type: integer
          minimum: 20.0
          title: Max Windows
          description: Maximum training and holdout windows compared, each, using
            a reproducible sample across groups to bound runtime. Fewer windows make
            the score noisier but faster to compute. The score needs at least 20 of
            each.
          default: 1000
        max_columns:
          type: integer
          minimum: 1.0
          title: Max Columns
          description: Maximum automatically selected numeric columns combined into
            each window, chosen with a reproducible sample to bound runtime. Explicit
            value_columns are always used in full.
          default: 12
      type: object
      title: WindowGroupMIAParameters
      description: 'Control window membership inference protection evaluation.


        Timestamp ordering and sequence grouping use the top-level time-series and

        data settings. The score needs grouped data and a holdout of at least two

        whole groups, which the pipeline creates when

        ``data.group_training_examples_by`` is set. Without them, only copy

        diagnostics are reported.'
