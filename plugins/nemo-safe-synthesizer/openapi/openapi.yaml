        spec.


        The attempt spec stays the immutable snapshot of what a run executes. Rerun

        copies the job spec into the next attempt and keeps using this object. In
        a

        control update, an omitted or null value keeps the job''s current value.'
    LLMConfig:
      properties:
        model_id:
          title: Model Id
          description: Model identifier for PII inference. When unset, uses NSS_INFERENCE_MODEL.
            Without an inference endpoint, selects the bundled local vLLM profile
            and defaults to nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16; with
            an endpoint, a model ID is required.
          type: string
        max_workers:
          type: integer
          minimum: 1.0
          title: Max Workers
          description: Maximum concurrent requests for LLM-assisted plan discovery.
            Must be at least 1.
          default: 8
      type: object
      title: LLMConfig
      description: 'Inference behavior for LLM-assisted PII plan discovery.


        Automatic discovery always uses the LLM. Without an endpoint, NSS runs the

        model in a managed local vLLM server. An

        OpenAI-compatible endpoint is supplied at runtime through

        ``NSS_INFERENCE_ENDPOINT`` or ``--inference-endpoint-url`` rather than persisted

        in NSS configuration.'
