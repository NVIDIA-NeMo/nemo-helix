components:
  schemas:
    AutocorrelationSimilarityParameters:
      properties:
        value_columns:
          title: Value Columns
          description: Numeric value columns to evaluate. Defaults to all shared columns
            inferred as numeric. Changing this selection changes the meaning of the
            aggregate score.
          items:
            type: string
          type: array
        max_lag:
          type: integer
          minimum: 1.0
          title: Max Lag
          description: Maximum requested lag; short sequences use a smaller stable
            lag cap. Scores computed with different lag horizons are not directly
            comparable.
          default: 20
        min_points:
          type: integer
          minimum: 4.0
          title: Min Points
          description: Minimum finite observations required in each sequence.
          default: 4
        max_groups:
          type: integer
          minimum: 1.0
          title: Max Groups
          description: Maximum shared groups to evaluate using a reproducible sample
            to bound runtime.
          default: 128
      type: object
      title: AutocorrelationSimilarityParameters
      description: 'Control autocorrelation similarity evaluation.


        Timestamp ordering and sequence grouping use the top-level time-series and

        data settings. The requested lag is capped automatically for short

        sequences, and undersized or constant training profiles are skipped. A

        constant synthetic profile paired with varying training data receives zero

        similarity.'
    ConditioningColumn:
      properties:
        column_name:
          type: string
          title: Column Name
          description: Existing dataframe column that supplies the conditioning value.
        entity_type:
          allOf:
          - $ref: '#/components/schemas/EntityType'
          description: 'Entity this conditioning column holds. Required for read-only
            conditioners. Optional when this column_name is also in columns_to_replace:
            it is filled in from that entry''s entity_type, and an explicit value
            must match it.'
      type: object
      required:
      - column_name
      title: ConditioningColumn
      description: "An existing column that conditions the replacement of another\
        \ column.\n\n``entity_type`` is required for read-only conditioners (``gender``,\n\
        ``ethnic_background``, ``city``, \u2026) that are not listed under\n``columns_to_replace``.\n\
        \nWhen the conditioner is itself a replace target (e.g. email depends on\n\
        ``first_name``), ``entity_type`` may be omitted: the plan fills it in from\
        \ that\ncolumn's entry, and an explicit value must match it. Downstream nodes\
        \ see the\ncell after upstream replacements."
    DataParameters:
      properties:
        group_training_examples_by:
          title: Group Training Examples By
          description: Column to group training examples by. This is useful when you
            want the model to learn inter-record correlations for a given grouping
            of records.
          type: string
        order_training_examples_by:
          title: Order Training Examples By
          description: Column to order training examples by. This is useful when you
            want the model to learn sequential relationships for a given ordering
            of records. If you provide this parameter, you must also provide ``group_training_examples_by``.
          type: string
        max_sequences_per_example:
          anyOf:
          - type: string
            const: auto
          - type: integer
          title: Max Sequences Per Example
          description: If specified, adds at most this number of sequences per example.
            Supports 'auto', which resolves to 1 when differential privacy is enabled,
            None for time-series mode (each example fills the context window), and
            10 otherwise. If set to None, fills up the context window. Required for
            DP to limit contribution of each example.
          default: auto
        holdout:
          type: number
          title: Holdout
          description: Amount of records to hold out for evaluation. If this is a
            float between 0 and 1, that ratio of records is held out. If an integer
            greater than 1, that number of records is held out. If the value is equal
            to zero, no holdout will be performed. Must be >= 0.
          default: 0.05
        max_holdout:
          type: integer
          title: Max Holdout
          description: Maximum number of records to hold out. Overrides any behavior
            set by ``holdout``. Must be >= 0.
          default: 2000
        random_state:
          title: Random State
          description: Random state for holdout split to ensure reproducibility.
          type: integer
      type: object
      title: DataParameters
      description: Configuration for grouping, ordering, and splitting input data
        for training and evaluation.
    DatetimeFilter:
      additionalProperties: false
      properties:
        $gte:
          description: Filter for results greater than or equal to this datetime.
          title: $Gte
          format: date-time
          type: string
        $lte:
          description: Filter for results less than or equal to this datetime.
          title: $Lte
          format: date-time
          type: string
      title: DatetimeFilter
      type: object
    DifferentialPrivacyHyperparams:
      properties:
        dp_enabled:
          type: boolean
          title: dp_enabled
          description: Enable differentially-private training with DP-SGD.
          default: false
        epsilon:
          type: number
          title: epsilon
          description: Target privacy budget -- lower values provide stronger privacy.
            Must be > 0.
          default: 8.0
        delta:
          anyOf:
          - type: string
            const: auto
          - type: number
          title: delta
          description: Probability of accidentally leaking information. Should be
            much smaller than 1/n where n is the number of training records. Setting
            to 'auto' uses delta of 1/n^1.2. Must be in [0, 1) or 'auto'.
          default: auto
        per_sample_max_grad_norm:
          type: number
          title: per_sample_max_grad_norm
          description: Maximum L2 norm for per-sample gradient clipping. Must be >
            0.
          default: 1.0
      type: object
      title: DifferentialPrivacyHyperparams
      description: 'Hyperparameters for differential privacy during training.


        These parameters configure differential privacy (DP) training using DP-SGD
        algorithm.

        When enabled, they provide formal privacy guarantees by adding calibrated
        noise

        during training.'
    EntityType:
      type: string
      enum:
      - first_name
      - middle_name
      - last_name
      - full_name
      - email
      - phone_number
      - date_of_birth
      - street_address
      - national_id
      - credit_debit_card
      - api_key
      - ipv4
      - ipv6
      - unique_identifier
      - free_text
      - date
      - gender
      - ethnic_background
      - city
      - state
      - zipcode
      - country
      - organization
      title: EntityType
      description: 'Closed vocabulary for discovery and plan ``entity_type`` fields.


        ``FREE_TEXT`` marks columns whose accepted PII spans are detected by

        GLiNER2 and applicable deterministic regex rules, then replaced without

        changing the surrounding text.'
    EvaluationParameters:
      properties:
        mia_enabled:
          type: boolean
          title: mia_enabled
          description: Enable membership inference attack evaluation for privacy assessment.
          default: true
        mia_excluded_columns:
          title: mia_excluded_columns
          description: Columns to leave out of the membership inference attack. Useful
            when identifiers were already replaced outside Safe Synthesizer, or are
            expected to repeat verbatim in the synthetic data.
          items:
            type: string
          type: array
        aia_enabled:
          type: boolean
          title: aia_enabled
          description: Enable attribute inference attack evaluation for privacy assessment.
          default: true
        sqs_report_columns:
          type: integer
          title: Sqs Report Columns
          description: Number of columns to include in statistical quality reports.
          default: 250
        sqs_report_rows:
          type: integer
          title: Sqs Report Rows
          description: Number of rows to include in statistical quality reports.
          default: 5000
        mandatory_columns:
          title: mandatory_columns
          description: Number of mandatory columns that must be used in evaluation.
          type: integer
        enabled:
          type: boolean
          title: enabled
          description: Enable or disable evaluation.
          default: true
        quasi_identifier_count:
          type: integer
          title: Quasi Identifier Count
          description: Number of quasi-identifiers to sample for privacy attacks.
          default: 3
        pii_replay_enabled:
          type: boolean
          title: pii_replay_enabled
          description: Enable PII Replay detection.
          default: true
        pii_replay_entities:
          title: Pii Replay Entities
          description: List of entities for PII Replay. If not provided, default entities
            will be used.
          items:
            type: string
          type: array
        pii_replay_columns:
          title: Pii Replay Columns
          description: List of columns for PII Replay. If not provided, only entities
            will be used.
          items:
            type: string
          type: array
        time_series:
          allOf:
          - $ref: '#/components/schemas/TimeSeriesEvaluationParameters'
          description: Time-series-specific evaluation settings.
      type: object
      title: EvaluationParameters
      description: 'Configuration for evaluating synthetic data quality and privacy.


        This class controls which evaluation metrics are computed and how they are
        configured.

        It includes privacy attack evaluations, statistical quality metrics, and downstream

        machine learning performance assessments.'
    FileStorageType:
      type: string
      enum:
      - fileset
      title: FileStorageType
    FreeTextDetectionConfig:
      properties:
        model_id:
          type: string
          minLength: 1
          title: Model Id
          description: GLiNER2 model identifier used to detect PII spans in free-text
            columns. Must be nonempty.
          default: fastino/gliner2-privacy-filter-PII-multi
        model_revision:
          title: Model Revision
          description: Hugging Face revision (commit, branch, or tag) of model_id
            to load. Defaults to the commit of the default model that the default
            thresholds were tuned on. When model_id is changed and model_revision
            is not set, the latest revision is loaded. Set null to load the latest
            revision.
          default: c153999da5f4c509df4322b0c6a1baf3d2c284d7
          type: string
          minLength: 1
        entity_thresholds:
          additionalProperties:
            type: number
            maximum: 1.0
            minimum: 0.0
          propertyNames:
            $ref: '#/components/schemas/EntityType'
          type: object
          title: Entity Thresholds
          description: 'Minimum GLiNER2 confidence score per entity type. Entity types
            left out use the defaults: 0.944 for first_name; 0.7 for middle_name;
            0.614 for last_name; 0.963 for full_name; 0.992 for phone_number; 0.9998
            for date_of_birth; 0.987 for street_address; 0.979 for national_id; 0.991
            for api_key; and 0.946 for unique_identifier. Email, credit_debit_card,
            ipv4, and ipv6 are detected by regex and take no threshold.'
        checked_national_id_threshold:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Checked National Id Threshold
          description: Minimum GLiNER2 confidence score for a detected national ID
            that python-stdnum accepts as a personal ID of replace_pii.locale's country,
            such as a US Social Security number for en_US. It replaces entity_thresholds.national_id
            for those values, since the check rather than the score tells them apart.
            Locales without a check, such as en_GB, use only the national_id threshold.
          default: 0.733
        name_exclusion_thresholds:
          additionalProperties:
            type: number
            maximum: 1.0
            minimum: 0.0
          type: object
          title: Name Exclusion Thresholds
          description: Extra GLiNER2 labels, with their minimum confidence, for terms
            often mistaken for names, such as medical conditions or family relationships.
            A detected name that overlaps one of these spans is not replaced, and
            find_and_replace does not replace text inside them. Labels you set are
            merged into the defaults; set a label to null to drop it, and it stays
            null in the configuration. Dropping every label turns exclusion off, which
            finds more real names at the cost of more false names in clinical text.
        find_and_replace:
          type: boolean
          title: Find And Replace
          description: Search free text for values already known in the same record
            or group and replace the occurrences the detectors missed. Detected spans
            reuse a known value's replacement either way; this setting only adds the
            search. Known values are original values of structured replacement columns,
            including the words of a plain full name, and values detected elsewhere
            in free text. Only whole words are matched, ignoring case. Values shorter
            than three characters, one-word values that are common English words,
            such as 'Will' or 'Brown', and missing-value placeholders such as 'Unknown'
            are not searched for, and text inside a name-exclusion span, such as a
            medical condition, is never replaced this way. Set false to replace only
            detected spans, for example to measure what the search adds. The search
            runs only when replace_pii.locale is en_US, because the common-word list
            is English.
          default: true
        batch_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Batch Size
          description: Number of text chunks processed in one GLiNER2 inference batch.
            Must be positive.
          default: 8
        chunk_length:
          type: integer
          exclusiveMinimum: 0.0
          title: Chunk Length
          description: Maximum length of each GLiNER2 text chunk. Must be positive.
          default: 384
        chunk_overlap:
          type: integer
          minimum: 0.0
          title: Chunk Overlap
          description: Overlap between adjacent GLiNER2 text chunks. Must be nonnegative
            and smaller than chunk_length.
          default: 128
      type: object
      title: FreeTextDetectionConfig
      description: GLiNER2 and deterministic regex settings for free-text PII detection.
