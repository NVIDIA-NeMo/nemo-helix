        required: true
        schema:
          type: string
          title: Name
      - name: sort
        in: query
        required: false
        schema:
          enum:
          - seq
          - -seq
          type: string
          default: -seq
          title: Sort
      - name: filter
        in: query
        required: false
        schema:
          title: Filter
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number.
          default: 1
          title: Page
        description: Page number.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Page size.
          default: 25
