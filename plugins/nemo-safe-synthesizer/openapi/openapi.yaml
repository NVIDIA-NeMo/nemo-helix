openapi: 3.1.0
info:
  title: safe-synthesizer (plugin)
  version: 0.0.0
paths:
  /apis/safe-synthesizer/v2/workspaces/{workspace}/jobs:
    post:
      tags:
      - Safe Synthesizer
      summary: Create Job
      operationId: create_job_apis_safe_synthesizer_v2_workspaces__workspace__jobs_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateJobRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateJob'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Safe Synthesizer
      summary: List Jobs
      operationId: list_jobs_apis_safe_synthesizer_v2_workspaces__workspace__jobs_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: sort
        in: query
        required: false
        schema:
          allOf:
          - $ref: '#/components/schemas/GenerateJobsSortField'
          description: The field to sort by. To sort in decreasing order, use `-`
            in front of the field name.
          default: -created_at
        description: The field to sort by. To sort in decreasing order, use `-` in
          front of the field name.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: Page number.
          default: 1
          title: Page
        description: Page number.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Page size.
          default: 10
          title: Page Size
        description: Page size.
      - in: query
        name: filter
        style: deepObject
        required: false
        explode: true
        schema:
          $ref: '#/components/schemas/GenerateJobsListFilter'
        description: Filter jobs on various criteria.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateJobsPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/safe-synthesizer/v2/workspaces/{workspace}/jobs/{job}/results/adapter/download:
    get:
      tags:
      - Safe Synthesizer
      summary: Download Job Result Adapter
      operationId: download_job_result_adapter_apis_safe_synthesizer_v2_workspaces__workspace__jobs__job__results_adapter_download_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: job
        in: path
        required: true
        schema:
          type: string
          title: Job
      responses:
        '200':
          description: Successful Response
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/safe-synthesizer/v2/workspaces/{workspace}/jobs/{job}/results/evaluation-report/download:
    get:
      tags:
      - Safe Synthesizer
      summary: Download Job Result Evaluation-Report
