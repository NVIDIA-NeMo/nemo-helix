[project]
name = "nemo-user-sim-plugin"
version = "0.1.0"
description = "Population-grounded user simulation for agents and models on NeMo Helix."
requires-python = ">=3.11,<3.15"
dependencies = [
    "nemo-helix-plugin",
    "nemo-helix",
    "nemo-agents-plugin[deepagents]",
    "usersim==0.2.0",
    "nemo-fabric>=0.6.0,<0.7.0",
    "mcp>=1.28.1,<2",
    "openai>=1.0",
    "uvicorn",
    "pydantic>=2.10.6",
    "typer>=0.20.0",
]

[project.entry-points."nemo.services"]
user-sim = "nemo_user_sim_plugin.service:UserSimService"

[project.entry-points."nemo.cli"]
user-sim = "nemo_user_sim_plugin.cli:UserSimCLI"

[project.entry-points."nemo.sdk"]
user_sim = "nemo_user_sim_plugin.sdk:user_sim_sdk_resources"

[project.entry-points."nemo.jobs"]
"user-sim.simulate" = "nemo_user_sim_plugin.jobs.simulate:SimulateJob"
"user-sim.export" = "nemo_user_sim_plugin.jobs.export:ExportJob"

[project.entry-points."nemo.skills"]
user-sim = "nemo_user_sim_plugin.skills:get_skills_path"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_user_sim_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = ["live: calls real model endpoints; needs NVIDIA_API_KEY"]
