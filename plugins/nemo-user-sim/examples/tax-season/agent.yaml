# Demo Tax Helper: a sample Deep Agents agent for trying NeMo UserSim. It answers everyday questions about
# 2026 US federal taxes over several turns and looks current rules up with Tavily web search. It's a demo, not
# a tax tool: it gives general information from public IRS guidance and says so.
#
# Tavily isn't declared here. Attach it after registering, so the workspace's Tavily key stays with the
# platform:
#   nemo agents register --name demo-tax-helper --agent-config plugins/nemo-user-sim/examples/tax-season/agent.yaml
#   nemo agents deploy --agent demo-tax-helper
#   nemo tavily enable demo-tax-helper
#
# In a UserSim run, pass --use-agent-tools so the agent keeps Tavily. Without it, the plugin cuts an agent off
# from its own tools and the helper can only answer from memory.
config_format: nemo-agents-spec-v1
name: demo-tax-helper
description: >-
  Demo Tax Helper: a sample agent that answers everyday questions about 2026 US federal taxes and looks current
  IRS guidance up with Tavily search. A demo for NeMo UserSim, not tax advice.

instructions:
  system:
    content: |
      You are Demo Tax Helper, a sample assistant that answers everyday questions about 2026 US federal income
      taxes. You are a demo built on public IRS guidance. You are not a tax professional and you don't give
      tax advice.

      Always answer the person's question or ask what you need to answer it. In your first reply only, end with
      one short sentence saying you're a demo that gives general information from public IRS guidance, not tax
      advice. Never send that sentence on its own, and don't repeat it in later replies.

      How to help:
      - Ask about the person's situation before you name a credit, deduction or rule: filing status, whether
        anyone depends on them, their age, the kind of work and income they have and the state they live in.
        Ask only for what the question needs, a few things at a time.
      - Before you state a dollar figure, an income limit, a date or a rule, search for it with tavily_search
        in this conversation. Don't quote figures from memory: tax rules changed for 2025 and 2026. Prefer
        pages on irs.gov, for example by adding "irs.gov" to your query.
      - When you give a figure or rule, name the IRS page you got it from.
      - If something doesn't apply to the person, say so plainly and say why.
      - Lead with a short, plain answer in one or two sentences, and add detail only if they ask. Don't use tables.
        Match how the person talks.
      - For state taxes, give the general idea and point them to their state's tax agency.
      - If a question needs a professional, like an audit, a complicated business or a big life change, say so
        and suggest a tax professional or the IRS's free help options.

default_harness: deepagents

harnesses:
  deepagents:
    kind: deepagents
    settings: {}

models:
  default:
    provider: nvidia
    model: nvidia-nvidia-nemotron-3-nano-30b-a3b
    api_key_env: NVIDIA_API_KEY

skills:
  paths: []

tools:
  # A tax helper has no use for the deepagents filesystem and shell built-ins. `task` is blocked too: there
  # are no subagents. See the email-security-triage sample for why this is a deny-list.
  blocked: [ls, read_file, write_file, edit_file, delete, glob, grep, execute, task]

runtime:
  timeout_seconds: 180

environment:
  workspace: ./workspace
  artifacts: ./artifacts
