[project]
name = "nemo-scaled-evals-plugin"
description = "Ephemeral scaled-evals control-plane plugin for NeMo Helix (Phase 1)."
requires-python = ">=3.12,<3.15"
version = "0.98.1"
dependencies = [
  "nemo-helix-plugin",
  "nemo-helix",
  "nhx-sandbox",
  "boto3>=1.35.0",
  "click>=8.1.0",
  "docker>=7.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "tomlkit>=0.15.0,<0.15.1",
  "uvicorn[standard]>=0.32.0",
]

[project.scripts]
scaled-evals = "scaled_evals.cli.main:cli"

[project.entry-points."nemo.services"]
scaled-evals = "nemo_scaled_evals_plugin.service:ScaledEvalsService"

[project.entry-points."nemo.jobs"]
"scaled-evals.task-image-build" = "nemo_scaled_evals_plugin.jobs.task_image_build:TaskImageBuildJob"
"scaled-evals.evaluation-execution" = "nemo_scaled_evals_plugin.jobs.evaluation_execution:EvaluationExecutionJob"
"scaled-evals.benchmark-archive-build" = "nemo_scaled_evals_plugin.jobs.benchmark_archive_build:BenchmarkArchiveBuildJob"

[project.entry-points."nemo.controllers"]
scaled-evals-jobs = "nemo_scaled_evals_plugin.controller:ScaledEvalsJobsController"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scaled_evals", "src/nemo_scaled_evals_plugin"]

[tool.uv.sources]
nemo-helix = { path = "../../packages/nemo_helix", editable = true }
nemo-helix-plugin = { path = "../../packages/nemo_helix_plugin", editable = true }
nhx-sandbox = { path = "../../packages/nhx_sandbox", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "opensandbox_ext"]
