[project]
name = "nemo-scaled-evals-plugin"
description = "Ephemeral scaled-evals control-plane plugin for NeMo Platform (Phase 1)."
requires-python = ">=3.12,<3.15"
version = "0.98.1"
dependencies = [
  "nemo-platform-plugin",
  "nemo-platform",
  "boto3>=1.35.0",
  "click>=8.1.0",
  "cryptography>=43.0.0",
  "docker>=7.0.0",
  "fastapi>=0.115.0",
  "httpx>=0.28.0",
  "psycopg[binary]>=3.2.0",
  "psycopg-pool>=3.2.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "tomlkit>=0.15.0,<0.15.1",
  "uvicorn[standard]>=0.32.0",
]

[project.scripts]
scaled-evals = "scaled_evals.cli.main:cli"
scaled-evals-dispatch-worker = "scaled_evals.dispatch.main:main"
scaled-evals-build-worker = "scaled_evals.api.build.main:main"
scaled-evals-rotate-credential-key = "scaled_evals.api.rotate_credential_key:main"
scaled-evals-migrate = "nemo_scaled_evals_plugin.migrations:main"

[project.entry-points."nemo.services"]
scaled-evals = "nemo_scaled_evals_plugin.service:ScaledEvalsService"

[project.entry-points."nemo.jobs"]
"scaled-evals.task-image-build" = "nemo_scaled_evals_plugin.jobs.task_image_build:TaskImageBuildJob"
"scaled-evals.evaluation-execution" = "nemo_scaled_evals_plugin.jobs.evaluation_execution:EvaluationExecutionJob"

[project.entry-points."nemo.controllers"]
scaled-evals-jobs = "nemo_scaled_evals_plugin.controller:ScaledEvalsJobsController"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scaled_evals", "src/nemo_scaled_evals_plugin"]

# The SQL lives outside src/ to keep the vendored tree diffable against the
# standalone repo, so ship it as package data or a wheel install has no schema.
[tool.hatch.build.targets.wheel.force-include]
"db" = "scaled_evals/db"

[tool.uv.sources]
nemo-platform = { workspace = true }
nemo-platform-plugin = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
