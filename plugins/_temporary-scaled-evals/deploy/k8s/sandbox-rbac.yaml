#
# Permissions the dispatch worker needs to run an evaluation. Harbor's
# K8sSandboxEnvironment creates a Sandbox, then the agent-sandbox controller
# reconciles it into a Pod; the worker reads that pod's logs, execs into it, and
# tears the whole set down afterwards.
#
# Sandboxes run in the SAME namespace as the control plane. That keeps this file
# to namespace-scoped Roles, at the cost of no isolation between the control
# plane and the code under evaluation — acceptable for a Phase-1 lab namespace,
# not for anything multi-tenant.
#
# This file does not install the CRDs or the controller; see README.md.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scaled-evals-sandbox-access
rules:
  # The Platform Jobs controller creates the outer task-build and evaluation
  # Jobs. The task pods use the remaining rules for their sandbox children.
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  # The plugin creates and observes Sandbox CRs directly. Keep this baseline
  # grant deployment-owned instead of depending on optional installation roles.
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "delete", "get", "list", "watch"]
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims"]
    verbs: ["create", "delete", "get", "list", "watch"]
  # The pods the controller creates from each Sandbox.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list", "watch"]
  # Harbor copies the task, tests and solution into the sandbox over exec.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
  # Sandbox supporting objects, plus per-run egress restriction.
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  # Surfaced in dispatch logs when a sandbox never reaches Ready — without this
  # a scheduling or image-pull failure looks like a bare timeout.
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: scaled-evals-sandbox-access
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: scaled-evals-sandbox-access
subjects:
  - kind: ServiceAccount
    name: scaled-evals-control-plane
