#
# The dispatch worker now owns only cleanup, provenance, and SBOM queues.
# Platform Jobs owns task-build and evaluation process lifecycle.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaled-evals-dispatch-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: dispatch-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/component: dispatch-worker
    spec:
      serviceAccountName: scaled-evals-control-plane
      initContainers:
        # Harbor's sandbox adapter authenticates with a kubeconfig file, not the
        # in-cluster client, so turn the projected ServiceAccount token into one.
        # The context name must match SANDBOX_CONTEXT in sandbox.env.
        - name: kubeconfig-from-sa
          image: scaled-evals-app
          command: ["sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /sa-kube/.kube
              namespace="$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)"
              cat > /sa-kube/.kube/config <<EOF
              apiVersion: v1
              kind: Config
              clusters:
                - name: incluster
                  cluster:
                    server: https://kubernetes.default.svc
                    certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
              contexts:
                - name: incluster
                  context:
                    cluster: incluster
                    namespace: ${namespace}
                    user: incluster
              current-context: incluster
              users:
                - name: incluster
                  user:
                    tokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              EOF
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: sa-kube
              mountPath: /sa-kube
      containers:
        - name: dispatch-worker
          image: scaled-evals-app
          command: ["scaled-evals-dispatch-worker"]
          envFrom:
            - configMapRef:
                name: scaled-evals-env
          env:
            # The Harbor config resolves kubeconfig_path through ${HOME}, and
            # this also keeps `nemo`/tooling state off the read-only root.
            - name: HOME
              value: /sa-kube
            - name: KUBECONFIG
              value: /sa-kube/.kube/config
            # See api.yaml: libpq takes the password from PGPASSWORD, keeping it out
            # of the DSN.
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: scaled-evals-postgres
                  key: password
            - name: SCALED_EVALS_DATABASE_URL
              value: postgresql://scaled_evals@postgres:5432/scaled_evals
            - name: CREDENTIALS_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: scaled-evals-credential-encryption
                  key: CREDENTIALS_ENCRYPTION_KEY
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          # TASK_IMAGE_REGISTRY_AUTH_FILE is set for all three processes, and
          # dispatch resolves the task image digest before launching, so it
          # needs these credentials too — not just the build worker.
          volumeMounts:
            - name: registry-auth
              mountPath: /var/run/scaled-evals/registry-auth
              readOnly: true
            - name: sa-kube
              mountPath: /sa-kube
            - name: target-env
              mountPath: /run/target
              readOnly: true
            # /opt/harbor and /harness are read-only image content; everything
            # Harbor writes per evaluation has to land on one of these two.
            - name: work
              mountPath: /tmp/sandbox-k8s
            - name: harbor-jobs
              mountPath: /var/lib/scaled-evals/harbor-jobs
      volumes:
        - name: registry-auth
          secret:
            secretName: scaled-evals-gar-registry-auth
        - name: sa-kube
          emptyDir: {}
        - name: target-env
          configMap:
            name: scaled-evals-sandbox-target
        - name: work
          emptyDir: {}
        - name: harbor-jobs
          emptyDir: {}
