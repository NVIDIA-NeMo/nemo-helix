# API-only example. For the UI, register http://127.0.0.1:6007/plugin.yaml:
# the independent adapter adds the actual built bundle's SHA-256 and sidecar.
# Helix starts no process and imports no adapter Python.
schema_version: 1
plugin:
  name: phoenix
  title: Phoenix traces (Intake)
  endpoints:
    - method: GET
      path: /v2/workspaces/{workspace}/projects
      access: read
      upstream_url: http://127.0.0.1:6007/v1/workspaces/{workspace}/projects
    - method: GET
      path: /v2/workspaces/{workspace}/spans
      access: read
      upstream_url: http://127.0.0.1:6007/v1/workspaces/{workspace}/spans
    - method: POST
      path: /v2/workspaces/{workspace}/spans
      access: write
      upstream_url: http://127.0.0.1:6007/v1/workspaces/{workspace}/spans
  credential:
    secret_name: phoenix-traces-adapter-key
    scheme: bearer
