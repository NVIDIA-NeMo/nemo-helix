# ASSUMED community-plugin manifest (UI-side draft; the backend shape is Matt's call,
# see AIRE-2330). The mock gateway in ./mock reads this file to stand in for the
# platform's plugin registry and proxy.

name: phoenix
displayName: Phoenix Traces

# The external API. Studio never sees this URL; it only calls
# /apis/plugins/<name>/<endpoint> and the gateway maps it back to the upstream.
upstream: http://127.0.0.1:6007

# Built JS bundle (and its plugin.manifest.json sidecar), served by the platform at
# /plugin-ui/<name>/index.js after the platform has pinned it.
bundle: ./dist/index.js

# Only declared endpoints are reachable. `path` is what Studio calls; `upstream` is
# the upstream path it maps to. GET/HEAD are read, everything else write.
endpoints:
  - method: GET
    path: /projects
    upstream: /v1/projects
  - method: GET
    path: /projects/{project}/spans
    upstream: /v1/projects/{project}/spans
