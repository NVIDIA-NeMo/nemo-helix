[project]
name = "nemo-agent-optimization-plugin"
version = "0.1.0"
description = "`nemo agents optimize` — routes an optimization run to the installed strategy job that implements it."
requires-python = ">=3.11,<3.15"
# No strategy plugin is listed here on purpose: strategies are discovered through the
# `nemo.jobs` entry points of whatever is installed, so depending on one would invert that
# relationship and drag optuna, matplotlib, and the evaluator SDK into every install of the
# router.
dependencies = [
  "fastapi>=0.115",
  "nemo-helix",
  "nemo-helix-plugin",
  "pydantic>=2.12.0",
  "typer>=0.20.0",
]

# Mounts the `optimize` command group at `nemo agents optimize`. The agents plugin does not
# need to know this exists — installing this distribution is what makes the group appear.
[project.entry-points."nemo.cli.agents"]
optimize = "nemo_agent_optimization_plugin.cli:AgentOptimizeCLI"

[project.entry-points."nemo.services"]
agent-optimization = "nemo_agent_optimization_plugin.service:AgentOptimizationService"

# The `agent-optimization.` prefix is deliberate: it keeps the router's route under this
# plugin's own `/apis/agent-optimization` segment, and it keeps the generic job → CLI
# machinery (which mounts `<plugin>.<job>` at `nemo <plugin> <job>`) from also registering
# this job somewhere else. The CLI surface is assembled by `AgentOptimizeCLI` instead.
[project.entry-points."nemo.jobs"]
"agent-optimization.run-strategy" = "nemo_agent_optimization_plugin.jobs.run_strategy:RunStrategyJob"

[tool.nemo.openapi]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_agent_optimization_plugin"]

[tool.uv.sources]
nemo-helix = { workspace = true }
nemo-helix-plugin = { workspace = true }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
