[project]
name = "prompt-master-plugin"
version = "0.1.0"
description = "The `prompt-master` strategy for `nemo agents optimize`: rewrites an agent's system prompt with the vendored Prompt Master skill in one Fabric run."
requires-python = ">=3.12,<3.15"
dependencies = [
  "nemo-agent-optimization-plugin",
  "nemo-agents-plugin",
  "nemo-helix",
  "nemo-helix-plugin",
  "pydantic>=2.12.0",
  "pyyaml>=6.0.3",
]

[project.entry-points."nemo.jobs"]
"agent-optimization.prompt-master" = "prompt_master_plugin.jobs.optimize:PromptMasterOptimizeJob"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_master_plugin"]

# Not a member of the root uv workspace (see README, "Install"), so sibling packages are
# resolved by path the way plugins/example-plugin does it.
[tool.uv.sources]
nemo-agent-optimization-plugin = { path = "../nemo-agent-optimization", editable = true }
nemo-agents-plugin = { path = "../nemo-agents", editable = true }
nemo-helix = { path = "../../packages/nemo_helix", editable = true }
nemo-helix-plugin = { path = "../../packages/nemo_helix_plugin", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
