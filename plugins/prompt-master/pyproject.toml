[project]
name = "prompt-master-plugin"
version = "0.1.0"
description = "The `prompt-master` strategy for `nemo agents optimize`: rewrites an agent's system prompt with the vendored Prompt Master skill in one Fabric run."
requires-python = ">=3.12,<3.15"
dependencies = [
  # The router plugin owns the strategy contract: `OptimizationStrategy`, the type of the
  # class variable PromptMasterOptimizeJob declares itself with.  Depending on the dispatcher
  # is the allowed direction; the router never names a strategy, and neither does this plugin
  # name a sibling strategy.
  "nemo-agent-optimization-plugin",
  # Fabric one-shot invocation, the Platform agent config model, and fileset staging helpers.
  "nemo-agents-plugin",
  "nemo-helix",
  "nemo-helix-plugin",
  "pydantic>=2.12.0",
  "pyyaml>=6.0.3",
]

# Discovered by `nemo agents optimize` as the `prompt-master` strategy through the
# `nemo_agent_optimization_strategy` class variable on PromptMasterOptimizeJob.  The key sits
# under the dispatcher's `agent-optimization` namespace, like the `legacy` strategy's: plugin
# allowlists and `nemo plugins list` group `nemo.jobs` entries by that prefix, so a deployment
# that allows the router also gets its strategies.  Nothing mounts the key on its own -- the job
# runs as the step of a `run-strategy` record, not as a separately submittable job.
[project.entry-points."nemo.jobs"]
"agent-optimization.prompt-master" = "prompt_master_plugin.jobs.optimize:PromptMasterOptimizeJob"

# The vendored Prompt Master skill library, for platforms that enumerate plugin-owned skills.
[project.entry-points."nemo.skills"]
prompt-master = "prompt_master_plugin.skills:skills_dir"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_master_plugin"]

# Not a member of the root uv workspace (see README, "Install"), so sibling packages are
# resolved by path the way plugins/example-plugin does it.
[tool.uv.sources]
nemo-agent-optimization-plugin = { path = "../nemo-agent-optimization", editable = true }
nemo-agents-plugin = { path = "../nemo-agents", editable = true }
nemo-helix = { path = "../../packages/nemo_helix", editable = true }
nemo-helix-plugin = { path = "../../packages/nemo_helix_plugin", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
