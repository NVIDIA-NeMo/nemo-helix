# Smallest Fabric (LangChain Deep Agents) agent that proves the sandbox path.
# Keep this file alone in its directory: the directory is both the Docker build
# context for `nemo agents package` and the bundle `nemo agents create` uploads.

config_format: nemo-agents-spec-v1
name: sandbox-hello
description: Small Deep Agents assistant used to prove an OpenShell sandbox deployment on Kubernetes.

instructions:
  system:
    content: |
      You are a concise assistant running inside a NeMo Platform sandbox.
      Answer in one or two sentences. If asked where you run, say you are a
      sandboxed NeMo agent and that you cannot reach the public internet.

default_harness: deepagents

harnesses:
  deepagents:
    kind: deepagents
    settings:
      deepagents: {}

models:
  default:
    # "nvidia" for a build.nvidia.com provider, "openai" for OpenAI. Both are
    # routed through the platform Inference Gateway at deploy time, so no
    # api_key_env or base_url is needed here.
    provider: nvidia
    # The platform model id from `nemo models list`, for example default/qwen35-9b.
    model: MODEL_ID

skills:
  paths: []

mcp:
  servers: {}

tools:
  blocked: []

environment:
  workspace: ./workspace
