[openshell]
version = 2

[openshell.gateway]
# Bind port lives in docker-compose.yml (the image's baked flag wins over this
# file). health_bind_address has no baked flag, so it is honored here.
health_bind_address = "127.0.0.1:17671"
log_level = "info"
compute_driver = "docker"
disable_tls = true
credential_drivers = ["nemo"]

# Advertised URL for a service:
# http://<workspace>--<sandbox>--<service>.<domain>:<gateway-port>/, where
# <domain> is the first wildcard in server_sans below minus its "*.", else
# openshell.localhost (host-local only). The platform does not resolve this
# host; it sends the request to the gateway with that host as the Host header,
# so <domain> only matters cross-machine:
# server_sans = ["*.agents.example.com"]

[openshell.gateway.auth]
# Local-dev escape hatch: accept CLI/API calls without mTLS or OIDC. Sandbox
# supervisors still authenticate with the gateway-minted JWTs below. Never set
# this true on a shared gateway.
allow_unauthenticated_users = true

[openshell.gateway.gateway_jwt]
# Docker sandboxes REQUIRE the gateway to mint sandbox JWTs, so these signing
# keys must exist. Generate them once before `docker compose up` (see the
# docker-compose.yml header / DEMO.ipynb prerequisites for the generate-certs
# command that writes them under /var/lib/openshell/tls/jwt).
signing_key_path = "/var/lib/openshell/tls/jwt/signing.pem"
public_key_path = "/var/lib/openshell/tls/jwt/public.pem"
kid_path = "/var/lib/openshell/tls/jwt/kid"
# OpenShell JWT identity; separate from the Helix registration-ticket audience.
gateway_id = "docker-dev"
ttl_secs = 3600

[openshell.drivers.docker]
# Runtime and supervisor images must match the gateway's OpenShell release; a
# mismatched supervisor exits at startup. The supervisor binary is extracted on
# first start, cached to XDG_DATA_HOME, and reused on restart.
default_image = "ghcr.io/nvidia/openshell-community/sandboxes/base:latest"
sandbox_runtime_image = "ghcr.io/nvidia/openshell/sandbox:0.1.6"
supervisor_image = "ghcr.io/nvidia/openshell/supervisor:0.1.6"
image_pull_policy = "if_not_present"
sandbox_label = "openshell"
app_armor_profile = "Unconfined"
# grpc_endpoint left unset: the supervisor runs on the host network and derives
# its callback as http://127.0.0.1:<gateway bind port>, so the gateway must
# publish the same port on host loopback. A hostname like host.openshell.internal
# does not resolve on the host network and would leave sandboxes unable to call home.

[openshell.credential_drivers.nemo]
transport = "uds"
socket_path = "/run/nemo-credential-driver/private/driver.sock"
