# Apply after docker-compose.credentials.yml only when Helix auth is disabled.
# Compose replaces command lists, retaining the base mounts and isolation.
services:
  credential-init:
    command: [init, --source, /mounted-credentials, --destination, /run/nemo-driver-credentials/private, --auth-disabled]
  credential-driver:
    command:
      - --socket-path
      - /run/nemo-credential-driver/private/driver.sock
      - --state-path
      - /var/lib/nemo-credential-driver/private/bindings.db
      - --gateway-id
      - ${NEMO_DRIVER_GATEWAY_ID:-docker-dev}
      - --registration-key-file
      - /run/nemo-driver-credentials/private/registration.key
      - --helix-url
      - ${NEMO_DRIVER_HELIX_URL:?Set the HTTPS URL reachable from this container}
      - --auth-disabled
      - --cache-lifetime-seconds
      - ${NEMO_DRIVER_CACHE_LIFETIME_SECONDS:-300}
