# Opt-in overlay; see credential-driver.md. Requires a Helix API image built
# from this checkout, not a separately published credential-driver image.
services:
  gateway:
    depends_on:
      credential-driver:
        condition: service_healthy
    volumes:
      - type: bind
        source: ./gateway-credentials.toml
        target: /etc/openshell/gateway.toml
        read_only: true
      - credential-driver-socket:/run/nemo-credential-driver:ro

  credential-init:
    image: ${NEMO_HELIX_IMAGE:?Set NEMO_HELIX_IMAGE to your current Helix API image}
    user: "0"
    restart: "no"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    # Read host-owned 0600 files through the read-only input mount. The long-lived
    # driver has no capabilities; only this short initialization step needs it.
    cap_add: [DAC_READ_SEARCH]
    security_opt: [no-new-privileges:true]
    entrypoint: [python, -m, nemo_deployments_plugin.backends.openshell.credential_driver.sidecar]
    command: [init, --source, /mounted-credentials, --destination, /run/nemo-driver-credentials/private]
    healthcheck:
      disable: true
    volumes:
      - type: bind
        source: ${NEMO_DRIVER_CREDENTIALS_DIR:?Set an absolute directory containing registration.key and helix.token}
        target: /mounted-credentials
        read_only: true
        bind:
          create_host_path: false
      - credential-driver-credentials:/run/nemo-driver-credentials

  credential-driver:
    image: ${NEMO_HELIX_IMAGE:?Set NEMO_HELIX_IMAGE to your current Helix API image}
    init: true
    # Same trusted UID as the local-development gateway, for the private socket.
    user: "0"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
    depends_on:
      credential-init:
        condition: service_completed_successfully
    entrypoint: [python, -m, nemo_deployments_plugin.backends.openshell.credential_driver.server]
    command:
      - --socket-path
      - /run/nemo-credential-driver/private/driver.sock
      - --state-path
      - /var/lib/nemo-credential-driver/private/bindings.db
      - --gateway-id
      - ${NEMO_DRIVER_GATEWAY_ID:-docker-dev}
      - --registration-key-file
      - /run/nemo-driver-credentials/private/registration.key
      - --helix-url
      - ${NEMO_DRIVER_HELIX_URL:?Set the HTTPS URL reachable from this container}
      - --helix-token-file
      - /run/nemo-driver-credentials/private/helix.token
      - --cache-lifetime-seconds
      - ${NEMO_DRIVER_CACHE_LIFETIME_SECONDS:-300}
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
    tmpfs:
      - /tmp:mode=1777
    volumes:
      - credential-driver-socket:/run/nemo-credential-driver
      - credential-driver-state:/var/lib/nemo-credential-driver
      - credential-driver-credentials:/run/nemo-driver-credentials:ro
    healthcheck:
      test: [CMD, python, -m, nemo_deployments_plugin.backends.openshell.credential_driver.sidecar, healthcheck, --socket-path, /run/nemo-credential-driver/private/driver.sock]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  credential-driver-socket:
  credential-driver-state:
  credential-driver-credentials:
