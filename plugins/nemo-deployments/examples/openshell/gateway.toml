# OpenShell gateway config for the NeMo sandbox-deployment demo (Docker driver).
#
# Adapted from OpenShell's deploy/docker/gateway.toml, with one deliberate
# change: the gateway is pinned to :17670 (OpenShell's documented docker
# default) instead of :8080, because the NeMo platform owns :8080 and running
# the gateway there collides with it. Mounted read-only into the gateway
# container by docker-compose.yml and loaded via OPENSHELL_GATEWAY_CONFIG.

[openshell]
version = 1

[openshell.gateway]
# NOTE: the main bind is set by docker-compose.yml's `command:` override, not
# here. The image bakes `--port 8080` as a CLI flag that beats this TOML
# (CLI > env > TOML), and `command: []` does not clear it, so set it there.
# health_bind_address has no baked flag, so it is honored from this file.
health_bind_address = "127.0.0.1:17671"
log_level = "info"
compute_drivers = ["docker"]
disable_tls = true

# Advertised deployment URLs. ExposeService returns
# http://<workspace>--<sandbox>--<service>.<domain>:17670/ where <domain> is the
# first wildcard DNS SAN below with its "*." stripped, else openshell.localhost,
# which resolves only on this host. The platform never resolves it (it dials this
# gateway and sends that host as the Host header), so this only matters for people
# and tools reaching a deployment from another machine:
# server_sans = ["*.agents.example.com"]

[openshell.gateway.auth]
# Local-dev escape hatch: accept CLI/API calls without mTLS or OIDC. Sandbox
# supervisors still authenticate with the gateway-minted JWTs below. Never set
# this true on a shared gateway.
allow_unauthenticated_users = true

[openshell.gateway.gateway_jwt]
# Docker sandboxes REQUIRE the gateway to mint sandbox JWTs, so these signing
# keys must exist. Generate them once before `docker compose up` (see the
# docker-compose.yml header / DEMO.ipynb prerequisites for the generate-certs
# command that writes them under /var/lib/openshell/tls/jwt).
signing_key_path = "/var/lib/openshell/tls/jwt/signing.pem"
public_key_path = "/var/lib/openshell/tls/jwt/public.pem"
kid_path = "/var/lib/openshell/tls/jwt/kid"
gateway_id = "docker-dev"
ttl_secs = 3600

[openshell.drivers.docker]
# Default image for `openshell sandbox create` without --from.
default_image = "ghcr.io/nvidia/openshell-community/sandboxes/base:latest"
# Supervisor image the openshell-sandbox binary is extracted from on first
# start. Cached to XDG_DATA_HOME and reused on restart (no manual extract).
supervisor_image = "ghcr.io/nvidia/openshell/supervisor:latest"
image_pull_policy = "IfNotPresent"
sandbox_namespace = "openshell"
# Sandbox callback address. The Docker driver keeps only the scheme and swaps
# in host.openshell.internal + the gateway bind port, so the gateway must be
# published on 17670 on the host (see docker-compose.yml).
grpc_endpoint = "http://host.openshell.internal:17670"
