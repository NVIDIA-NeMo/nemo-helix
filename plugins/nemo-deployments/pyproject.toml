[project]
name = "nemo-deployments-plugin"
description = "NeMo Deployments Plugin — substrate-agnostic deployment lifecycle on the NeMo Helix."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "nemo-helix-sdk",
    "nemo-helix-plugin",
    "pydantic>=2.10.6",
    "pyyaml>=6.0",
]
version = "0.0.0"

[project.optional-dependencies]
docker = ["docker>=7.0"]
k8s = ["kubernetes>=30.1.0"]
openshell = ["grpcio>=1.78.0", "openshell>=0.0.92", "protobuf>=6.31.1"]

[project.entry-points."nemo.services"]
deployments = "nemo_deployments_plugin.service:DeploymentsService"

[project.entry-points."nemo.sandbox_profiles"]
openshell = "nemo_deployments_plugin.backends.openshell.sandbox_profile:PROFILE"

[project.entry-points."nemo.skills"]
deployments = "nemo_deployments_plugin.skills:skills_dir"

[project.entry-points."nemo.controllers"]
deployments = "nemo_deployments_plugin.controller:DeploymentsController"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_deployments_plugin"]


[tool.uv.sources]
nemo-helix-sdk = { workspace = true }
nemo-helix-plugin = { workspace = true }


[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.3",
  "httpx>=0.27",
  "fastapi>=0.115",
  "docker>=7.0",
  "kubernetes>=30.1.0",
  # openshell/grpcio/protobuf are intentionally NOT in this dev group. openshell is a
  # platform-restricted wheel (manylinux_2_39 / macOS 13 arm64, no sdist); a dev-group
  # entry would make `uv sync --all-packages` (bootstrap) hard-fail on any host with
  # glibc < 2.39 or older macOS, because the lock marker gates arch/OS but cannot
  # express glibc. They live in the `[openshell]` extra instead, and the dedicated CI
  # job (make test-deployments-openshell) installs that extra to cover the backend.
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "tests/unit", "tests/integration"]

[tool.nemo.openapi]
