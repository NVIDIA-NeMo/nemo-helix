    K8sDeploymentConfig:
      properties:
        namespace:
          title: Namespace
          type: string
        serviceAccount:
          title: Serviceaccount
          type: string
        nodeSelector:
          additionalProperties:
            type: string
          type: object
          title: Nodeselector
        tolerations:
          items:
            $ref: '#/components/schemas/Toleration'
          type: array
          title: Tolerations
        affinity:
          $ref: '#/components/schemas/Affinity'
        topologySpreadConstraints:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Topologyspreadconstraints
          description: Pod topology spread constraints applied to every Job/Deployment
            pod rendered from this config. Each entry is a raw Kubernetes topologySpreadConstraint
            object (maxSkew, topologyKey, whenUnsatisfiable, labelSelector, ...).
            k8s-only.
        securityContext:
          $ref: '#/components/schemas/PodSecurityContext'
        podAnnotations:
          additionalProperties:
            type: string
          type: object
          title: Podannotations
          description: Annotations stamped onto the pod-template metadata for every
            Job/Deployment pod rendered from this config (e.g. an Istio native-sidecar
            annotation so a mesh-injected proxy terminates when a puller Job's main
            container exits). k8s-only; ignored on docker/openshell backends.
        jobTtlSecondsAfterFinished:
          title: Jobttlsecondsafterfinished
          description: Per-deployment override for ttlSecondsAfterFinished on a finite
            (Never/OnFailure) Job, such as the weight-puller. When set, wins over
            the executor default; when unset, the executor default applies. Controls
            how quickly a completed Job's pod (and its ReadWriteOnce volume attachment)
            is reaped. A set value must be at least 10s so the reconciler can observe
            Job completion before the pod is reaped. k8s-only.
          type: integer
          minimum: 10.0
      type: object
      title: K8sDeploymentConfig
