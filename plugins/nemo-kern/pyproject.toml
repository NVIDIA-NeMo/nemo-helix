[project]
name = "nemo-kern-plugin"
description = "NeMo Studio plugin that surfaces the kern agent-fleet substrate (gate decisions, sleep flags, memory, sessions)."
requires-python = ">=3.11,<3.15"
dependencies = ["nemo-helix-plugin", "nemo-helix", "pydantic>=2.0.0"]
version = "0.0.0"

[tool.uv.sources]
nemo-helix = { path = "../../packages/nemo_helix", editable = true }
nemo-helix-plugin = { path = "../../packages/nemo_helix_plugin", editable = true }

[project.entry-points."nemo.services"]
kern = "nemo_kern.service:KernService"

[project.entry-points."nemo.controllers"]
"kern-session-controller" = "nemo_kern.controller:KernSessionController"

[project.entry-points."nemo.studio"]
kern = "nemo_kern.studio:get_studio_spec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_kern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
