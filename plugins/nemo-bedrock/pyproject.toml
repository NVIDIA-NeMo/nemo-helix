[project]
name = "nemo-bedrock-plugin"
version = "0.1.0"
description = "Model metadata for Amazon Bedrock models from Bedrock's foundation model catalog."
requires-python = ">=3.11,<3.15"
dependencies = ["httpx>=0.27.0,<1", "nemo-helix-plugin", "pydantic>=2.0.0"]

[project.entry-points."nemo.models.metadata_sources"]
bedrock = "nemo_bedrock_plugin.metadata:BedrockMetadataSource"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_bedrock_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
