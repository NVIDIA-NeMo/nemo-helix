schema_version = "1.1"

# Collected into the trial's artifacts/ directory on the host after the agent
# phase. The Experimentalist separately injects /app/traces -> artifacts/traces.
artifacts = [{ source = "/app/artifacts", destination = "output" }]

[task]
name = "hello/sum-three"
authors = [{ name = "NVIDIA" }]
keywords = ["hello", "onboarding"]

[metadata]
difficulty = "easy"
category = "smoke"

[agent]
timeout_sec = 300.0

[verifier]
timeout_sec = 60.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
