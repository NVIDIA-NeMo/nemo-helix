    GenericAgent:
      properties:
        url:
          type: string
          title: Url
          description: Base URL of the agent endpoint.
        name:
          type: string
          title: Name
          description: Agent name / identifier.
        api_key_secret:
          allOf:
          - $ref: '#/components/schemas/SecretRef'
          description: 'API key secret reference for the agent. Format: workspace/secret_name
            or secret_name within the job workspace.'
        format:
          type: string
          const: generic
          title: Format
          default: generic
        body:
          additionalProperties: true
          type: object
          title: Body
          description: Jinja template for the request payload.
        response_path:
          type: string
          title: Response Path
          description: JSONPath expression used to extract the response value.
        trajectory_path:
          title: Trajectory Path
          description: Optional JSONPath expression used to extract trajectory data.
          type: string
        stream:
          type: boolean
          title: Stream
          description: Read JSON SSE data frames instead of a single JSON response
            body.
          default: false
        response_aggregation:
          type: string
          enum:
          - last
          - concat
          title: Response Aggregation
          description: How to combine matched data-frame values when 'stream' is true.
            'last' keeps the final matched value (endpoints that emit a full snapshot
            per frame); 'concat' joins matched string values in arrival order (token-delta
            endpoints).
          default: last
      additionalProperties: false
      type: object
      required:
      - url
      - name
      - body
      - response_path
      - format
      title: GenericAgent
      description: Configurable HTTP agent with optional JSON SSE response handling.
    GymAgentSource:
      properties:
        component:
          type: string
          title: Component
          description: Gym agent component to collect rollouts with, e.g. `simple_agent`
            (--agent).
        config:
          title: Config
          description: Repo-relative agent config passed to `gym env start` (--config).
            Required without an environment FileSet; with a FileSet it is used only
            when the package does not declare the selected instance.
          type: string
        instance:
          title: Instance
          description: 'Gym agent *instance*, as distinct from the `component` it
            configures. Defaults to `component`. Set it whenever the two differ, which
            is common in stock Gym: `rewoo_agent` is an instance of the `langgraph_agent`
            component, as are the whole `anyswe_*` and `anyterminal_*` families of
            theirs. It keys the resources-server binding, decides whether an environment
            package declares the agent, and is stamped as each row''s `agent_ref`.
            Requires sandboxed execution.'
          type: string
      additionalProperties: false
      type: object
      required:
      - component
      title: GymAgentSource
      description: 'A Gym agent, selected the way ``gym`` selects one: a component,
        its config, and the instance.


        The keys are Gym''s words rather than the target''s former ``agent`` / ``agent_config``
        /

        ``agent_ref_name``: a sibling source member names a platform agent under ``agent``,
        and the union''s

        members must share no required key.'
    GymRunnerTarget:
      properties:
        kind:
          type: string
          const: gym
          title: Kind
          default: gym
        environment:
          allOf:
          - $ref: '#/components/schemas/FilesetRef'
          description: Environment FileSet containing a native-v1 or wheels-v1 Gym
            package. The complete FileSet is staged read-only; file fragments are
            not supported.
        source:
          anyOf:
          - $ref: '#/components/schemas/GymAgentSource'
          - $ref: '#/components/schemas/RegisteredAgentSource'
          title: Source
          description: "The agent Gym collects rollouts with: a Gym agent by `component`\
            \ (with its `config` and optionally the `instance` the package registers\
            \ it under), or a registered platform `agent` (with an optional `environment`).\
            \ A registered agent is resolved at submit into `resolved_config`; the\
            \ job's staging step turns that into an environment package running the\
            \ platform's Gym agent component, so the agent runs as registered \u2014\
            \ identity, skills, MCP servers \u2014 with its model on Gym's policy\
            \ server."
        resolved_config:
          title: Resolved Config
          description: 'Set by submit-time resolution of a registered `agent`, never
            by the submitter: the Fabric config the agent resolved to, which the staging
            step writes into the Gym environment package.'
          additionalProperties: true
          type: object
        resources_server:
          type: string
          title: Resources Server
          description: Resources-server (environment) name, e.g. 'mcqa' (--resources-server).
        model_type:
          type: string
          title: Model Type
          description: Model-type config (--model-type). `inference_provider` speaks
            OpenAI-compatible chat; `openai_model` uses the OpenAI Responses API.
          default: inference_provider
        bind_resources_server:
          type: boolean
          title: Bind Resources Server
          description: Auto-bind the agent's `resources_server.name` via a Hydra override.
            Set False for self-contained agents that already bind their own resources-server.
          default: true
        hydra_params:
          additionalProperties: true
          type: object
          title: Hydra Params
          description: "Parameters merged into Gym's Hydra config, as nested data\
            \ \u2014 {'model': {'temperature': 0.7}} rather than pre-serialized Hydra\
            \ strings \u2014 so a spec survives being sent as JSON. Flattened to Hydra's\
            \ grammar at invocation, after the auto-derived resources-server binding.\
            \ Distinct from `env_vars`: these configure the Gym environment, not the\
            \ OS environment."
        env_vars:
          additionalProperties:
            type: string
          type: object
          title: Env Vars
          description: "Environment variables set on the `gym` invocation. Some Gym\
            \ environments are configurable only this way \u2014 `wmt_translation`\
            \ reads `WMT_TRANSLATION_COMET_PY_CACHE` for its model-cache root and\
            \ defaults to a container-only path \u2014 and a job spec has no ambient\
            \ environment to inherit from, so whatever the environment needs has to\
            \ travel in the spec."
        env_secrets:
          additionalProperties:
            $ref: '#/components/schemas/SecretRef'
          type: object
          title: Env Secrets
          description: 'Environment variables sourced from the secrets service, as
            {ENV_NAME: secret-ref}. The reference travels in the spec; the service
            resolves it into the job''s environment at compile time, so no credential
            is stored on the spec or written to a run bundle. Use this rather than
            `env_vars` for anything secret -- a Gym model API key belongs here.'
        num_repeats:
          type: integer
          minimum: 1.0
          title: Num Repeats
          description: Attempts per row; each attempt becomes one trial.
          default: 1
        concurrency:
          type: integer
          minimum: 1.0
          title: Concurrency
          description: Concurrent rollouts for `gym eval run`.
          default: 4
        startup_timeout_s:
          type: number
          exclusiveMinimum: 0.0
          title: Startup Timeout S
          description: 'Max wait for the Gym servers to report ready: `gym env start`
            colocated, the host''s bootstrap when sandboxed. Excludes pulling a sandboxed
            host''s image.'
          default: 240.0
        collection_timeout_s:
          title: Collection Timeout S
          description: Max wait for rollout collection, measured from when it starts;
            exceeding it fails the run. None = unbounded, though a sandboxed host
            still stops at the end of its lifetime.
          type: number
          exclusiveMinimum: 0.0
        shutdown_grace_s:
          type: number
          exclusiveMinimum: 0.0
          title: Shutdown Grace S
          description: Grace period for the Gym subprocess group to exit on SIGTERM
            before escalating to SIGKILL.
          default: 30.0
        reward_key:
          type: string
          title: Reward Key
          description: Key read from each rollout record.
          default: reward
      additionalProperties: false
      type: object
      required:
      - source
      - resources_server
      title: GymRunnerTarget
      description: "Generate trials by driving a NeMo Gym environment through the\
        \ SDK's :class:`GymAgentTaskRunner`.\n\nThe deployment chooses colocated execution\
        \ in the Gym task container or a separate sandboxed\nGym host. An environment\
        \ FileSet requires the sandboxed path. The environment dataset is\nrecovered\
        \ from the tasks at run time \u2014 ``discover_gym_tasks`` records the source\
        \ row data needed\nto materialize the selected tasks for rollout collection."
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HarborArchiveSource:
      properties:
        kind:
          type: string
          const: fileset-archive
          title: Kind
          default: fileset-archive
        fileset_ref:
          type: string
          pattern: ^[\w\-.]+/[\w\-.]+#[\w\-./]+$
          title: Fileset Ref
          description: "Exact qualified archive object reference: workspace/fileset#relative/path.\
            \ Workspace, fileset name, and path must each be NFC-normalized and at\
            \ most 4096 UTF-8 bytes. Path segments must be nonempty, must not be '.'\
            \ or '..', and must not end in a space or dot. Control characters (U+0000\u2013\
            U+001F and U+007F), backslashes, %, ?, #, and : are forbidden within each\
            \ component. Absolute paths, a//b, a/../b, and trailing slashes are rejected.\
            \ These canonicalization constraints are enforced by the server in addition\
            \ to the pattern."
          examples:
          - default/harbor-tasks#suite/task/task_archive
        files_hash:
          type: string
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-f]{64}$
          title: Files Hash
          description: SHA-256 of the exact compressed archive bytes.
        archive_format:
          type: string
          const: tar-gzip-v1
          title: Archive Format
          default: tar-gzip-v1
      additionalProperties: false
      type: object
      required:
      - fileset_ref
      - files_hash
      title: HarborArchiveSource
    HarborBuiltinAgentSource:
      properties:
        name:
          type: string
          title: Name
          description: Built-in Harbor agent to run, e.g. `oracle`.
        model:
          title: Model
          description: 'Optional model for the agent: `{"name": ...}` passes a model
            slug as-is, `{"ref": ...}` calls a model the Inference Gateway serves.'
          oneOf:
          - $ref: '#/components/schemas/HarborModelName'
          - $ref: '#/components/schemas/HarborGatewayModel'
      additionalProperties: false
      type: object
      required:
      - name
      title: HarborBuiltinAgentSource
      description: One of Harbor's built-in agents, selected by name.
    HarborGatewayModel:
      properties:
        ref:
          allOf:
          - $ref: '#/components/schemas/ModelRef'
          description: 'A model the Inference Gateway serves, as `workspace/name`:
            a model or a VirtualModel. The agent must declare an OpenAI- or Anthropic-style
            model connection, or take its provider from the model name, as `codex`,
            `claude-code`, `aider`, `goose` and `openhands` do; an agent of that last
            kind calls the gateway''s OpenAI-style route and is given the model as
            `openai/<name>`. Other agents are refused.'
      additionalProperties: false
      type: object
      required:
      - ref
      title: HarborGatewayModel
      description: A model the Inference Gateway serves. Evals sets the agent's model
        name, base URL and API key variables.
    HarborImportedAgentSource:
      properties:
        import_path:
          type: string
          title: Import Path
          description: Harbor agent import path, e.g. `harbor_wrapper:WrappedAgent`.
            The module must already be importable in the run environment.
        model_name:
          title: Model Name
          description: Optional model slug passed to the agent.
          type: string
      additionalProperties: false
      type: object
      required:
      - import_path
      title: HarborImportedAgentSource
      description: A Harbor agent class the run environment can already import.
    HarborModelName:
      properties:
        name:
          type: string
          title: Name
          description: Model slug passed to the agent as-is, e.g. `openai/gpt-5`.
      additionalProperties: false
      type: object
      required:
      - name
      title: HarborModelName
      description: A model the agent calls by name, through whatever endpoint its
        environment gives it.
    HarborRunnerTarget:
      properties:
        kind:
          type: string
          const: harbor
          title: Kind
          default: harbor
        source:
          anyOf:
          - $ref: '#/components/schemas/HarborBuiltinAgentSource'
          - $ref: '#/components/schemas/HarborImportedAgentSource'
          - $ref: '#/components/schemas/RegisteredAgentSource'
          title: Source
          description: "The agent Harbor runs in each task container: a built-in agent\
            \ by `name` (with an optional `model`, by name or as a gateway model ref),\
            \ your own by `import_path`, or a registered platform `agent` (with an\
            \ optional `environment`). A registered agent is resolved at submit into\
            \ the SDK's installed Fabric agent with the agent's translated config\
            \ in `agent_kwargs.fabric_config`, so it runs as registered \u2014 identity,\
            \ skills, MCP servers, and telemetry included \u2014 and stays, qualified,\
            \ as the run's provenance."
        agent_kwargs:
          additionalProperties:
            $ref: '#/components/schemas/JsonValue'
          type: object
          title: Agent Kwargs
          description: "Keyword arguments forwarded to the Harbor agent's constructor,\
            \ the equivalent of Harbor's `--ak key=value`. Not for secrets: Harbor\
            \ persists these unredacted across the job dir. Credential-shaped plaintext\
            \ is rejected, but that check is a heuristic \u2014 use `env_secrets`\
            \ regardless."
        env_secrets:
          additionalProperties:
            $ref: '#/components/schemas/SecretRef'
          type: object
          title: Env Secrets
          description: 'Environment variables for the Harbor agent, sourced from the
            secrets service, as {ENV_NAME: secret-ref}. The reference travels in the
            spec; the service resolves it into the job''s environment at compile time,
            and Harbor receives a `${ENV_NAME}` template it expands when the agent
            is created, so no credential is stored on the spec, the run bundle, or
            the job dir''s `config.json`. A bare ref resolves in the job''s workspace.'
        env_vars:
          additionalProperties:
            type: string
          type: object
          title: Env Vars
          description: Non-secret environment variables for the Harbor agent, as literal
            values that travel in the spec and reach only the agent. Keys Harbor treats
            as secrets (matching KEY, SECRET, TOKEN but not TOKENS, PASSWORD, CREDENTIAL
            or AUTH) are rejected; use `env_secrets` for credentials.
        n_attempts:
          type: integer
          minimum: 1.0
          title: N Attempts
          description: Number of attempts Harbor runs per task.
          default: 1
        n_concurrent_trials:
          title: N Concurrent Trials
          description: Maximum concurrent Harbor trials. Native Harbor's default parallelism
            is 4; unset or null uses that default on Docker. Must be unset or null
            on Kubernetes runs, which run trials one at a time.
          nullable: true
          type: integer
          minimum: 1.0
        max_retries:
          type: integer
          minimum: 0.0
          title: Max Retries
          description: Harbor per-trial retry attempts on transient failures.
          default: 0
        artifacts:
          items:
            type: string
          type: array
          title: Artifacts
          description: Harbor artifact sources to collect per trial.
        trace_dir:
          title: Trace Dir
          description: Container path of agent traces to collect as the 'traces' artifact
            (e.g. '/app/traces').
          type: string
        reward_key:
          type: string
          title: Reward Key
          description: Key read from Harbor's per-trial rewards mapping to score against.
          default: reward
        agent_setup_timeout_multiplier:
          title: Agent Setup Timeout Multiplier
          description: Harbor agent-setup timeout multiplier. An agent that installs
            itself into the task container (a Fabric harness, a registered agent)
            needs several times Harbor's default, which is tuned for prebuilt agents.
          type: number
          exclusiveMinimum: 0.0
        agent_timeout_multiplier:
          title: Agent Timeout Multiplier
          description: Harbor agent-phase timeout multiplier, applied to every trial.
          type: number
          exclusiveMinimum: 0.0
      additionalProperties: false
      type: object
      title: HarborRunnerTarget
      description: 'Generate trials by driving a Harbor job through the SDK''s :class:`HarborAgentTaskRunner`.


        Runs in *native* mode: Harbor builds and runs its own ``JobConfig`` (executing
        each task in a

        Docker environment, retrying, and writing a per-trial results tree), then
        the runtime adapts that

        tree into SDK trials. The dataset Harbor runs against is recovered from each
        task''s

        ``harbor_dataset_path`` metadata, so it is not configured here. The runtime-only
        jobs directory is

        injected from the job''s storage at run time; only the harness-selection and
        run knobs live here.'
    HarborTaskDefinition:
      properties:
        kind:
          type: string
          const: harbor
          title: Kind
        native_task_id:
          type: string
          minLength: 1
          title: Native Task Id
          description: Native task identity, independently verified from the archive.
        source:
          $ref: '#/components/schemas/HarborArchiveSource'
        harbor_hash:
          $ref: '#/components/schemas/HarborTaskHash'
        instruction:
          title: Instruction
          type: string
        config:
          additionalProperties: true
          type: object
          title: Config
        views:
          additionalProperties:
            $ref: '#/components/schemas/SemanticView'
          type: object
          title: Views
          description: Reporting views over the primary Harbor reward and declared
            additional metric outputs.
        metrics:
          items:
            anyOf:
            - $ref: '#/components/schemas/MetricInline'
            - $ref: '#/components/schemas/MetricRef'
          type: array
          title: Metrics
          description: Additional metrics, appended to the mandatory HarborRewardMetric.
            Inline bundles are normalized to stored metric references on registration.
            Do not include HarborRewardMetric here.
      additionalProperties: false
      type: object
      required:
      - kind
      - native_task_id
      - source
      - harbor_hash
      title: HarborTaskDefinition
    HarborTaskHash:
      properties:
        digest:
          type: string
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-f]{64}$
          title: Digest
        method:
          type: string
          const: harbor-packager-content-v1
          title: Method
          default: harbor-packager-content-v1
        harbor_version:
          type: string
          maxLength: 128
          minLength: 1
          title: Harbor Version
        source_commit:
          title: Source Commit
          type: string
          maxLength: 128
      additionalProperties: false
      type: object
      required:
      - digest
      - harbor_version
      title: HarborTaskHash
      description: Producer fingerprint for future use; never an integrity or execution
        gate.
    HarborTaskJobsExecutionInput:
      properties:
        kind:
          type: string
          const: harbor-task-jobs
          title: Kind
          description: 'Execution strategy: one Kubernetes Job per Harbor task. Future
            strategies add new kinds.'
          default: harbor-task-jobs
        dispatcher_profile:
          title: Dispatcher Profile
          description: Name of a Jobs Service profile that decides where task Jobs
            run and what resources they get. Operators define the available profiles;
            omitted uses the first one they list.
          examples:
          - local-k8s
          type: string
        max_concurrent_task_jobs:
          title: Max Concurrent Task Jobs
          description: Maximum number of this run's task Jobs running at once. Omit
            to rely only on the job controller's admission limits.
          examples:
          - 5
          type: integer
          minimum: 1.0
        sandbox:
          allOf:
          - $ref: '#/components/schemas/SandboxSelection'
          description: 'Sandbox for every task. profile names an operator sandbox
            profile: isolation, egress and resource ceilings; omitted uses the operator''s
            default. cpus, memory_mb and storage_mb size each task''s agent sandbox,
            over its task.toml [environment]; a separate verifier keeps task.toml''s
            resources. Unset cpus and memory_mb default to 1 CPU and 2048 MB, capped
            by the ceilings. Every sandbox''s values must stay within the profile''s
            ceilings, or submit fails with 422. Omit the whole object for the default
            profile and each task''s own resources.'
          examples:
          - cpus: 4
            memory_mb: 8192
            storage_mb: 20480
          - memory_mb: 4096
            profile: harbor-open
      additionalProperties: false
      type: object
      title: HarborTaskJobsExecutionInput
      description: 'Settings that run a Harbor taskset as many independent task Jobs
        instead of one Job.


        Passing it as ``execution`` selects the Kubernetes taskset-run path: submit
        pins

        the taskset revision and returns a durable run handle. Later execution stages

        register one Jobs Service Job per task and combine the per-task results.


        It exists because these settings mean nothing on the Docker path: where task
        Jobs are

        placed, which sandbox they may use, and how many run at once. Keeping them
        in their

        own model, selected by ``kind``, lets future execution strategies add new
        models rather

        than new ``submit`` methods. It never changes benchmark content or which agent
        runs.


        Submit validates this input and freezes the ``sandbox`` profile, with its
        resource

        overrides checked against the profile''s ceilings, the ``dispatcher_profile``,
        the pinned

        dispatcher image and the concurrency cap into the run''s plan, so operator
        config edits

        never reach a running run. Earlier development runs are deleted rather than
        migrated.'
