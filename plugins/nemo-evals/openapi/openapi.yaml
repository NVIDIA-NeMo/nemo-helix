          format: date-time
          title: Accepted At
          description: When submit accepted the run.
        timeout_seconds:
          type: integer
          title: Timeout Seconds
          description: Execution budget in seconds, counted from started_at.
        started_at:
          title: Started At
          description: When the run's first task got a slot and its execution clock
            started; None while it waits.
          type: string
          format: date-time
        execution_deadline_at:
          type: string
          format: date-time
          title: Execution Deadline At
          description: Unfinished tasks expire then. Until the run starts, accepted_at
            plus the queue timeout; from its first slot, started_at plus timeout_seconds.
            Retries do not reset it.
        finalization_deadline_at:
          type: string
          format: date-time
          title: Finalization Deadline At
          description: execution_deadline_at plus the operator grace at submit; the
            final result must be saved by then.
        cancel_requested_at:
          title: Cancel Requested At
          description: When a caller requested cancellation; None if never requested.
          type: string
          format: date-time
        error:
          title: Error
          description: Why the run failed or expired; None otherwise.
          type: string
        created_by:
          title: Created By
          description: Principal ID of the caller who created the run; None when creator
