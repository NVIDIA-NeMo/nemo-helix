components:
  schemas:
    AgentEvalInputSpec:
      oneOf:
      - properties:
          target:
            not:
              type: 'null'
        required:
        - target
      - properties:
          trials:
            not:
              type: 'null'
        required:
        - trials
      properties:
        target:
          anyOf:
          - $ref: '#/components/schemas/ModelTarget'
          - $ref: '#/components/schemas/AgentTarget'
          - $ref: '#/components/schemas/FabricRunnerTarget'
          - $ref: '#/components/schemas/GymRunnerTarget'
          - $ref: '#/components/schemas/HarborRunnerTarget'
          title: Target
          description: 'What generates trials online: a Model or Agent endpoint, or
            an agent runner (e.g. a Fabric harness). Endpoint targets carry their
            own request config (prompt template / inference params). Mutually exclusive
            with `trials`.'
        trials:
          title: Trials
          description: Precomputed trials to score directly (offline eval), instead
            of generating them from a `target`. Mutually exclusive with `target`.
          items:
            $ref: '#/components/schemas/AgentEvalTrial'
          type: array
        max_concurrent_tasks:
          type: integer
          minimum: 1.0
          title: Max Concurrent Tasks
          description: 'Concurrency for this evaluation''s SDK work. Harbor and Gym:
            concurrent scoring calls only (trials are bounded by the runner). Other
            runners: concurrent trials and scoring calls. For model and agent targets,
            target.params.parallelism bounds concurrent inference requests during
            trial generation. On Kubernetes runs it applies per task Job; the task-Job
            cap is execution.max_concurrent_task_jobs.'
          default: 4
        fail_fast:
          type: boolean
          title: Fail Fast
          description: Fail on the first metric error instead of recording an errored
            score. On Kubernetes runs it fails that task's Job.
          default: false
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
          description: Caller-supplied tags recorded on the run's metadata (e.g. benchmark,
            mode, backend).
        publication:
          allOf:
          - $ref: '#/components/schemas/PublicationSpec'
          description: Where the completed run publishes its results, beyond its own
            result bundle. Omit to publish nowhere.
        tasks:
          anyOf:
          - $ref: '#/components/schemas/TasksetRef'
          - items:
              $ref: '#/components/schemas/AgentEvalTaskInput'
            type: array
            minItems: 1
          - items:
              $ref: '#/components/schemas/TaskRef'
            type: array
            minItems: 1
          title: Tasks
          description: 'Tasks to evaluate: a nonempty list containing only inline
            tasks or only task references, or a stored taskset reference.'
      additionalProperties: false
      type: object
      required:
      - tasks
      title: AgentEvalInputSpec
      description: 'Submitter-facing agent-evaluation input.


        ``tasks`` accepts inline tasks, stored task references, or a stored taskset
        reference.

        Stored definitions and scoring expand at submission; Harbor archives are prepared
        on the worker.'
    AgentEvalMetricOutputCoverage:
      properties:
        total:
          type: integer
          title: Total
          description: Total scores considered for this metric output.
          default: 0
        scored:
          type: integer
          title: Scored
          description: Scores that produced this output successfully.
          default: 0
        failed:
          type: integer
          title: Failed
          description: Scores where the metric failed to run.
          default: 0
        missing:
          type: integer
          title: Missing
          description: Scores where the output was expected but absent.
          default: 0
      additionalProperties: false
      type: object
      title: AgentEvalMetricOutputCoverage
      description: Coverage counts for one metric output across scored trials.
    AgentEvalResult:
      properties:
        id:
          type: string
          title: Id
          description: Unique identifier for the stored result record.
        name:
          type: string
          title: Name
          description: Result record name (equals the producing job's id).
        workspace:
          type: string
          title: Workspace
          description: Workspace the result belongs to.
        project:
          title: Project
          description: The project associated with this result.
          type: string
        job_id:
          type: string
          title: Job Id
          description: Identifier of the job run that produced this result.
        target_kind:
          title: Target Kind
          description: 'Target discriminator: ''model'', ''agent'', or a runner kind.'
          type: string
        target_name:
          title: Target Name
          description: Model/agent entity name, or the runner's model.
          type: string
        target_url:
          title: Target Url
          description: Endpoint URL, when the target is an HTTP model/agent.
          type: string
        scores:
          allOf:
          - $ref: '#/components/schemas/AggregatedMetricResult'
          description: Aggregated metric scores for the run.
        bundle_ref:
          type: string
          title: Bundle Ref
          description: Reference to the full result bundle in the Files service.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Timestamp the result was created.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Timestamp the result was last updated.
        summary:
          allOf:
          - $ref: '#/components/schemas/AgentEvalResultSummary'
          description: Run rollup from the bundle summary; None for records stored
            before it existed.
      type: object
      required:
      - id
      - name
      - workspace
      - job_id
      - scores
      - bundle_ref
      - created_at
      - updated_at
      title: AgentEvalResult
      description: API representation of a persisted agent-evaluation result record.
    AgentEvalResultSummary:
      properties:
        task_count:
          type: integer
          minimum: 0.0
          title: Task Count
          description: Tasks represented in the run.
        trial_count:
          type: integer
          minimum: 0.0
          title: Trial Count
          description: Trial records in the run.
        score_count:
          type: integer
          minimum: 0.0
          title: Score Count
          description: Metric scores computed for the run.
        error_count:
          type: integer
          minimum: 0.0
          title: Error Count
          description: Trials that reported a producer error.
        metric_coverage:
          additionalProperties:
            additionalProperties:
              $ref: '#/components/schemas/AgentEvalMetricOutputCoverage'
            type: object
          type: object
          title: Metric Coverage
          description: Per-metric, per-output coverage counts (total/scored/failed/missing).
      additionalProperties: false
      type: object
      required:
      - task_count
      - trial_count
      - score_count
      - error_count
      title: AgentEvalResultSummary
      description: 'The queryable part of an agent-eval bundle''s ``summary.json``,
        under the same field names.


        The per-trial tables (``task_metric_values``, ``error_trial_ids``) stay in
        the bundle because

        they scale with trial count; ``scores`` lives on the result record itself.'
    AgentEvalResultsPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/AgentEvalResult'
          type: array
          title: Data
        pagination:
          allOf:
          - $ref: '#/components/schemas/PaginationData'
          description: Pagination information.
        sort:
          title: Sort
          description: The field on which the results are sorted.
          type: string
        filter:
          title: Filter
          description: Filtering information.
          additionalProperties: true
          type: object
      type: object
      required:
      - data
      title: AgentEvalResultsPage
    AgentEvalSpec:
      oneOf:
      - properties:
          target:
            not:
              type: 'null'
        required:
        - target
      - properties:
          trials:
            not:
              type: 'null'
        required:
        - trials
      properties:
        target:
          anyOf:
          - $ref: '#/components/schemas/ModelTarget'
          - $ref: '#/components/schemas/AgentTarget'
          - $ref: '#/components/schemas/FabricRunnerTarget'
          - $ref: '#/components/schemas/GymRunnerTarget'
          - $ref: '#/components/schemas/HarborRunnerTarget'
          title: Target
          description: 'What generates trials online: a Model or Agent endpoint, or
            an agent runner (e.g. a Fabric harness). Endpoint targets carry their
            own request config (prompt template / inference params). Mutually exclusive
            with `trials`.'
        trials:
          title: Trials
          description: Precomputed trials to score directly (offline eval), instead
            of generating them from a `target`. Mutually exclusive with `target`.
          items:
            $ref: '#/components/schemas/AgentEvalTrial'
          type: array
        max_concurrent_tasks:
          type: integer
          minimum: 1.0
          title: Max Concurrent Tasks
          description: 'Concurrency for this evaluation''s SDK work. Harbor and Gym:
            concurrent scoring calls only (trials are bounded by the runner). Other
            runners: concurrent trials and scoring calls. For model and agent targets,
            target.params.parallelism bounds concurrent inference requests during
            trial generation. On Kubernetes runs it applies per task Job; the task-Job
            cap is execution.max_concurrent_task_jobs.'
          default: 4
        fail_fast:
          type: boolean
          title: Fail Fast
          description: Fail on the first metric error instead of recording an errored
            score. On Kubernetes runs it fails that task's Job.
          default: false
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
          description: Caller-supplied tags recorded on the run's metadata (e.g. benchmark,
            mode, backend).
        publication:
          allOf:
          - $ref: '#/components/schemas/PublicationSpec'
          description: Where the completed run publishes its results, beyond its own
            result bundle. Omit to publish nowhere.
        tasks:
          items:
            $ref: '#/components/schemas/ResolvedTask'
          type: array
          minItems: 1
          title: Tasks
          description: Resolved task snapshots in execution order. Only archive materialization
            remains on the worker.
      additionalProperties: false
      type: object
      required:
      - tasks
      title: AgentEvalSpec
      description: Canonical evaluation containing self-contained, resolved task snapshots.
