  /apis/evals/v2/workspaces/{workspace}/evaluate/live:
    post:
      tags:
      - Evals Plugin Live Evaluation Route
      summary: Run Live Evaluation
      description: 'Run a synchronous evaluation on a single dataset row.


        Scores the given row with the given metrics and returns the results immediately.
        Use this for

        quick, interactive checks of an evaluation config before saving it. For anything
        larger, use

        the async job-based evaluation endpoints.


        Creates no job and stores no result: nothing is persisted and nothing is published
        to Intake.


        The dataset must be provided inline and hold exactly one row. Each metric
        is either an inline

        definition or a reference to a stored metric (`workspace/metric-name`). Supply
        at most 24

        metrics, of which at most 4 may be model-backed (an LLM judge or a RAGAS metric),
        since each

        model-backed metric costs an upstream inference call.


        By default the row carries the model output already, and is scored offline.
        Supplying a

        `target` instead makes the server generate that output first, in which case
        `prompt_template`

        is required.


        **Per-metric results:**

        Every requested metric appears in the response, in request order, with either
        its scores or

        the error that stopped it -- so one failing metric out of several is identifiable
        rather than

        collapsing the whole response into a single error. A request in which no metric
        scored at all

        fails with 502.


        Past the concurrency cap the request is rejected with 429 rather than queued;
        past the overall

        time limit it fails with 504.'
      operationId: run_live_evaluation_apis_evals_v2_workspaces__workspace__evaluate_live_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveScoreRequest'
      responses:
        '200':
          description: Score one row inline, without creating a job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveScoreResponse'
        '429':
          description: Too many concurrent live evaluations
        '504':
          description: Live evaluation did not finish in time
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
