  /apis/evals/v2/workspaces/{workspace}/tasks/{name}:
    post:
      tags:
      - Evals Plugin Tasks Routes
      summary: Create Task
      description: "Store a new task, addressed by workspace/name, and publish it\
        \ as revision 1.\n\nStrict create \u2014 409 if the name is taken. Use ``PUT``\
        \ to publish a further revision of an\nexisting task."
      operationId: create_task_apis_evals_v2_workspaces__workspace__tasks__name__post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[\w\-\.]+$
          title: Name
      - name: project
        in: query
        required: false
        schema:
          description: Optional project to associate with the task.
          title: Project
          type: string
        description: Optional project to associate with the task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Store a new task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '409':
          description: Task already exists
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Evals Plugin Tasks Routes
      summary: Replace Task
      description: "Replace a task's content and publish the result, creating the\
        \ task if it does not exist.\n\nUpsert rather than 404-on-missing so a publisher\
        \ can issue one idempotent call without first\nchecking existence \u2014 that\
        \ check is both an extra round trip and a race between two publishers.\n\n\
        Idempotent in the strict sense: submitting content that matches the current\
        \ revision publishes\nnothing and returns **200**, while a genuine change\
        \ returns **201**. Tags in the body are\napplied either way, so re-PUTting\
        \ unchanged content is how you tag an existing revision."
      operationId: replace_task_apis_evals_v2_workspaces__workspace__tasks__name__put
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[\w\-\.]+$
          title: Name
      - name: project
        in: query
        required: false
        schema:
          description: Optional project to associate with the task.
          title: Project
          type: string
        description: Optional project to associate with the task.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '200':
          description: Content already published; no new revision was cut
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '201':
          description: A new revision was published
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '409':
          description: Concurrent write; refresh and retry
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Evals Plugin Tasks Routes
      summary: Get Task
      description: 'Get a stored task''s current content.


        Use ``GET /tasks/{name}/revisions/{revision}`` to read it as of a specific
        published revision.'
      operationId: get_task_apis_evals_v2_workspaces__workspace__tasks__name__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '200':
          description: Return stored task details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Evals Plugin Tasks Routes
      summary: Delete Task
      description: Delete a stored task by workspace and name.
      operationId: delete_task_apis_evals_v2_workspaces__workspace__tasks__name__delete
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          title: Name
      responses:
        '204':
          description: Delete a stored task
        '404':
          description: Task not found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/evals/v2/workspaces/{workspace}/tasks/{name}/revisions:
    get:
      tags:
      - Evals Plugin Tasks Routes
      summary: List Task Revisions
      description: 'List a task''s published revisions.


        This is how a caller discovers what it can pin to: each entry carries the
        ``content_hash`` that

        goes in a reference''s ``#fragment``.'
