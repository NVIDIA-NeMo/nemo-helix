      - finalization_deadline_at
      title: TasksetRunSubmitResponse
      description: Return the accepted run with advisory warnings for this submission
        only.
    TasksetRunTask:
      properties:
        task:
          type: string
          title: Task
          description: Member name within the run, for example task-7.
        task_index:
          type: integer
          minimum: 0.0
          title: Task Index
          description: Zero-based index of the task in the run's resolved task list.
        phase:
          allOf:
          - $ref: '#/components/schemas/MemberPhase'
          description: Stored image preparation and execution progress of this task.
        job:
          title: Job
          description: Name of this task's Jobs Service Job; set when the create is
            first attempted.
          type: string
        job_status:
          allOf:
          - $ref: '#/components/schemas/HelixJobStatus'
          description: The Job's status as the controller last read it; omitted until
            the task's Job is registered.
        error:
          title: Error
          description: Stored reason the task failed, was cancelled or expired.
          type: string
        publication:
          allOf:
          - $ref: '#/components/schemas/PublicationOutcome'
          description: What the task published to Intake, as its Job reported it when
            the task settled; omitted when it reported nothing.
      additionalProperties: false
      type: object
      required:
      - task
      - task_index
      - phase
      title: TasksetRunTask
      description: 'Expose one stored member''s task identity, progress and optional
        Job/error.


        Construction takes the public fields only. Instances contain no parent,

        persistence metadata or live Job state; read routes omit unset details.'
    TasksetRunTasksPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/TasksetRunTask'
