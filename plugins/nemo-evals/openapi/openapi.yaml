        signals:
          items:
            $ref: '#/components/schemas/ViewSignal'
          type: array
          minItems: 1
          title: Signals
          description: Ordered metric outputs contributing to this view; at least
            one is required.
      additionalProperties: false
      type: object
      required:
      - reducer
      - signals
      title: SemanticView
      description: Task-scoped reporting view that maps a task's own metric outputs
        into a named score.
    StringFilter:
      additionalProperties: false
      properties:
        $eq:
          description: Filter for results equal to this value.
          title: $Eq
          type: string
        $like:
          description: Filter for results matching this pattern.
          title: $Like
          type: string
        $in:
          description: Filter for results in this list of values.
          title: $In
          items:
            type: string
          type: array
        $nin:
          description: Filter for results not in this list of values.
          title: $Nin
          items:
            type: string
          type: array
      title: StringFilter
      type: object
    Task:
      properties:
        id:
          type: string
          title: Id
          description: Unique identifier for the stored task record.
        name:
          type: string
          title: Name
          description: "Task name \u2014 the stable task id, unique within its workspace."
        workspace:
          type: string
          title: Workspace
          description: Workspace the task belongs to.
        project:
          title: Project
          description: The project associated with this task.
          type: string
        spec:
          oneOf:
          - $ref: '#/components/schemas/EvaluatorTaskDefinition'
          - $ref: '#/components/schemas/HarborTaskDefinition'
          title: Spec
          description: The task's content, discriminated by which runner executes
            it.
          discriminator:
            propertyName: kind
            mapping:
              evaluator: '#/components/schemas/EvaluatorTaskDefinition'
              harbor: '#/components/schemas/HarborTaskDefinition'
        metadata:
          items:
            $ref: '#/components/schemas/MetadataItem'
          type: array
          title: Metadata
          description: Key/value annotations for the task.
        revision:
          type: integer
          title: Revision
          description: "Ordinal of the published revision this content corresponds\
            \ to. Every stored task has at least one revision \u2014 creating a task\
            \ publishes revision 1 \u2014 so this is never 0."
        tags:
          additionalProperties:
            type: integer
          type: object
          title: Tags
          description: "Tag \u2192 revision-ordinal pointers. Reading the record's\
            \ current content returns every tag, including 'latest'. Reading a *specific*\
            \ revision returns only the tags pointing at that revision, which may\
            \ be none \u2014 so do not assume 'latest' is present."
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Timestamp the task was created.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Timestamp the task was last updated.
      type: object
      required:
      - id
      - name
      - workspace
      - spec
      - revision
      - created_at
      - updated_at
      title: Task
      description: "API representation of a stored agent-eval task.\n\nMaps to the\
        \ SDK :class:`~nhx_evals_sdk.agent_eval.tasks.AgentEvalTask` \u2014 the task's\
        \ stable\n``id`` is the record ``name`` (unique within its workspace). Metrics\
        \ are stored in their wire form\n(inline bundles and/or references to stored\
        \ metrics); references resolve to inline at run time."
    TaskFilter:
      additionalProperties: false
      description: Filter for task queries.
      properties:
        metadata:
          description: 'Filter by metadata annotations: `metadata.<key>` (or `metadata[<key>]`)
            matches records whose metadata has that key with a matching value. Supports
            `$eq`, `$in`, `$nin`, `$like`, `$startsWith`, `$endsWith`, `$lt`, `$lte`,
            `$gt`, and `$gte`.'
          title: Metadata
          additionalProperties:
            anyOf:
            - type: string
            - type: integer
            - type: number
            - type: boolean
          type: object
        tags:
          description: 'Filter by revision tag: matches records carrying the tag,
            e.g. `stable`. Supports `$eq` and `$in`.'
          title: Tags
          type: string
        workspace:
          description: Filter by workspace.
          title: Workspace
          type: string
        name:
          description: Filter by name.
          title: Name
          type: string
        kind:
          description: Filter by task kind (the runner that executes it), e.g. `harbor`.
          title: Kind
          type: string
        intent:
          description: Filter by an evaluator task's intent, e.g. `$like` for text
            search.
          title: Intent
          type: string
        native_task_id:
          description: Filter by a Harbor task's native task id.
          title: Native Task Id
          type: string
        metrics:
          description: 'Filter by metric: matches tasks that use the metric `workspace/name`.
            Supports `$eq` and `$in`.'
          title: Metrics
          type: string
        created_at:
          allOf:
          - $ref: '#/components/schemas/DatetimeFilter'
          description: Filter by creation date.
        updated_at:
          allOf:
          - $ref: '#/components/schemas/DatetimeFilter'
          description: Filter by update date.
      title: TaskFilter
      type: object
    TaskInput:
      properties:
        spec:
          oneOf:
          - $ref: '#/components/schemas/EvaluatorTaskDefinition'
          - $ref: '#/components/schemas/HarborTaskDefinition'
          title: Spec
          description: The task's content, discriminated by which runner executes
            it.
          discriminator:
            propertyName: kind
            mapping:
              evaluator: '#/components/schemas/EvaluatorTaskDefinition'
              harbor: '#/components/schemas/HarborTaskDefinition'
        metadata:
          items:
            $ref: '#/components/schemas/MetadataItem'
          type: array
          title: Metadata
          description: Key/value annotations for the task.
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Tags to point at the revision this request publishes. 'latest'
            is always applied server-side and need not be listed.
      additionalProperties: false
      type: object
      required:
      - spec
      title: TaskInput
      description: "Create/replace body for a stored task (the name comes from the\
        \ path).\n\nThe authorable subset of :class:`Task` \u2014 the SDK ``AgentEvalTask``\
        \ shape minus server-owned\nfields (id, name, workspace, timestamps)."
    TaskInputs:
      properties:
        instruction:
          title: Instruction
          description: The agent's instruction (its prompt). Falls back to the task
            `intent` when unset.
          type: string
      additionalProperties: true
      type: object
      title: TaskInputs
      description: 'Inputs supplied to a task.


        ``instruction`` is the agent''s prompt; the runtime falls back to the task
        ``intent`` when it is unset.

        Additional task- or runtime-specific inputs, such as `gym_row` for Gym tasks,
        are also accepted fields.'
    TaskProvenance:
      properties:
        entity_name:
          type: string
          title: Entity Name
        revision_digest:
          type: string
          maxLength: 64
          minLength: 64
          pattern: ^[0-9a-f]{64}$
          title: Revision Digest
      additionalProperties: false
      type: object
      required:
      - entity_name
      - revision_digest
      title: TaskProvenance
      description: The digest identifies the published revision, not its expanded
        job snapshot.
    TaskRef:
      type: string
      pattern: ^[\w\-.]+(/[\w\-.]+)?(#[\w\-.]+)?$
      title: TaskRef
      description: "Reference to a persisted task (format: ``workspace/name``, ``name``,\
        \ or either with a\n``#revision`` fragment).\n\nA taskset points at its member\
        \ tasks by reference (there are no inline tasks), so a stored\ntaskset only\
        \ ever holds refs. Unlike :class:`MetricRef`, a task ref may address a specific\n\
        revision via the platform's standard ``#`` sub-entity fragment.\n\nThe fragment\
        \ is optional *on input* and means :data:`LATEST_TAG` when absent \u2014 a\
        \ bare\n``workspace/name`` is \"the current revision\", not \"unpinned\".\
        \ It may name a tag or a content\ndigest. Anything **persisted** as a published\
        \ snapshot must carry a resolved digest: tags move,\nand a stored tag fragment\
        \ would silently re-point published membership."
    TaskSort:
      type: string
      enum:
      - name
      - -name
      - created_at
      - -created_at
      - updated_at
      - -updated_at
      title: TaskSort
      description: Sort fields for task queries.
    TasksPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Task'
          type: array
          title: Data
        pagination:
          allOf:
          - $ref: '#/components/schemas/PaginationData'
          description: Pagination information.
        sort:
          title: Sort
          description: The field on which the results are sorted.
          type: string
        filter:
          title: Filter
          description: Filtering information.
          additionalProperties: true
          type: object
      type: object
      required:
      - data
      title: TasksPage
    Taskset:
      properties:
        id:
          type: string
          title: Id
          description: Unique identifier for the stored taskset record.
        name:
          type: string
          title: Name
          description: "Taskset name \u2014 the stable id, unique within its workspace."
        workspace:
          type: string
          title: Workspace
          description: Workspace the taskset belongs to.
        project:
          title: Project
          description: The project associated with this taskset.
          type: string
        description:
          title: Description
          description: Human-readable description of the grouping.
          type: string
        tasks:
          items:
            $ref: '#/components/schemas/TaskRef'
          type: array
          title: Tasks
          description: References to the member tasks (set semantics; duplicates rejected).
        files_ref:
          title: Files Ref
          description: Reference to taskset-level files shared across member tasks,
            such as a common scoring script.
          type: string
          pattern: ^[\w\-.]+/[\w\-.]+#[\w\-./]+$
        metadata:
          items:
            $ref: '#/components/schemas/MetadataItem'
          type: array
          title: Metadata
          description: Key/value annotations for the taskset.
        revision:
          type: integer
          title: Revision
          description: Ordinal of the published revision this content corresponds
            to. Every stored taskset has at least one revision, so this is never 0.
        tags:
          additionalProperties:
            type: integer
          type: object
          title: Tags
          description: "Tag \u2192 revision-ordinal pointers. Reading the record's\
            \ current content returns every tag, including 'latest'. Reading a *specific*\
            \ revision returns only the tags pointing at that revision, which may\
            \ be none \u2014 so do not assume 'latest' is present."
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Timestamp the taskset was created.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Timestamp the taskset was last updated.
      type: object
      required:
      - id
      - name
      - workspace
      - revision
      - created_at
      - updated_at
      title: Taskset
      description: "API representation of a stored taskset \u2014 a flexible grouping\
        \ of tasks with metadata.\n\nMembers are referenced by ``workspace/name``\
        \ (there are no inline tasks). Membership is a set:\norder is not significant\
        \ and duplicate references are rejected."
    TasksetFilter:
      additionalProperties: false
      description: Filter for taskset queries.
      properties:
        metadata:
          description: 'Filter by metadata annotations: `metadata.<key>` (or `metadata[<key>]`)
            matches records whose metadata has that key with a matching value. Supports
            `$eq`, `$in`, `$nin`, `$like`, `$startsWith`, `$endsWith`, `$lt`, `$lte`,
            `$gt`, and `$gte`.'
          title: Metadata
          additionalProperties:
            anyOf:
            - type: string
            - type: integer
            - type: number
            - type: boolean
          type: object
        tags:
          description: 'Filter by revision tag: matches records carrying the tag,
            e.g. `stable`. Supports `$eq` and `$in`.'
          title: Tags
          type: string
        workspace:
          description: Filter by workspace.
          title: Workspace
          type: string
        name:
          description: Filter by name.
          title: Name
          type: string
        description:
          description: Filter by description, e.g. `$like` for text search.
          title: Description
          type: string
        tasks:
          description: 'Filter by member task: `workspace/name` matches it at any
            revision, `workspace/name#<digest>` at that pinned revision. Supports
            `$eq` and `$in`.'
          title: Tasks
          type: string
        created_at:
          allOf:
          - $ref: '#/components/schemas/DatetimeFilter'
          description: Filter by creation date.
        updated_at:
          allOf:
          - $ref: '#/components/schemas/DatetimeFilter'
          description: Filter by update date.
      title: TasksetFilter
      type: object
    TasksetInput:
      oneOf:
      - required:
        - tasks
      - required:
        - task_ids
      properties:
        description:
          title: Description
          description: Human-readable description of the grouping.
          type: string
        tasks:
          items:
            $ref: '#/components/schemas/TaskRef'
          type: array
          title: Tasks
          description: 'References to the member tasks (set semantics; duplicates
            rejected). Each may be bare, tag-pinned (''task-a#latest''), or digest-pinned;
            all are resolved to an exact digest when stored, so the grouping cannot
            change underneath you when a member republishes. Because membership is
            a set, the stored order is canonical rather than the submitted order:
            reordering the same members is not a content change and publishes no revision.'
        task_ids:
          items:
            type: string
            minLength: 1
          type: array
          title: Task Ids
          description: Stored task record IDs; mutually exclusive with tasks. Resolved
            on write.
        files_ref:
          title: Files Ref
          description: "Files reference to the taskset's own files \u2014 shared by\
            \ its members, owned by none. Upload them to the Files service first and\
            \ point here ('workspace/fileset#prefix'). The reference is part of the\
            \ taskset's content, so repointing it publishes a revision; pin the content\
            \ by referencing a location that is not rewritten."
          type: string
          pattern: ^[\w\-.]+/[\w\-.]+#[\w\-./]+$
        metadata:
          items:
            $ref: '#/components/schemas/MetadataItem'
          type: array
          title: Metadata
          description: Key/value annotations for the taskset.
        tags:
          items:
            type: string
          type: array
          title: Tags
          description: Tags to point at the revision this request publishes. 'latest'
            is always applied server-side and need not be listed.
      additionalProperties: false
      type: object
      title: TasksetInput
      description: "Create/replace body for a stored taskset (the name comes from\
        \ the path).\n\nThe authorable subset of :class:`Taskset` \u2014 minus server-owned\
        \ fields (id, name, workspace,\ntimestamps)."
    TasksetRef:
      type: string
      pattern: ^[\w\-.]+(/[\w\-.]+)?(#[\w\-.]+)?$
      title: TasksetRef
      description: "Reference to a persisted taskset (format: ``workspace/name`` or\
        \ ``name``, optionally ``#rev``).\n\nSame shape and charset as :class:`TaskRef`.\
        \ Lets an evaluation reference a stored taskset in place\nof an inline task\
        \ list; the taskset's member tasks are loaded and expanded during spec resolution.\n\
        \nAn optional ``#`` fragment pins the taskset revision to expand \u2014 a\
        \ tag or a full content digest,\nwith an absent fragment meaning ``latest``.\n\
        \nWhat each form guarantees, precisely. A taskset revision pins its members\
        \ by digest, so a member\ntask publishing new content never changes what *any*\
        \ ref expands to. A **bare** ref still tracks\nthe taskset's own revisions,\
        \ and republishing the taskset re-resolves its members on write \u2014 so\
        \ a\n``replace`` can change both which members are named and the content they\
        \ resolve to, even if the\nsubmitted member names were identical. A **pinned**\
        \ ref is fixed against that too, and is what an\nevaluation needs to stay\
        \ comparable across a ``replace``."
    TasksetRunInput:
      properties:
        spec:
          allOf:
          - $ref: '#/components/schemas/AgentEvalInputSpec'
          description: 'Evaluation inputs: a stored taskset reference and Harbor runner
            target. Inline tasks and precomputed trials are not supported for Kubernetes
            runs.'
        execution:
          allOf:
          - $ref: '#/components/schemas/HarborTaskJobsExecutionInput'
          description: 'Kubernetes task Job settings: sandbox profile and resources,
            dispatcher profile and run-wide task Job concurrency.'
        idempotency_key:
          title: Idempotency Key
          description: Optional key, scoped to workspace and caller, so retries of
            the same request return the accepted run. When omitted, submit generates
            one and returns it as the run's idempotency_key.
          type: string
          maxLength: 256
          minLength: 1
        publication:
          allOf:
          - $ref: '#/components/schemas/TasksetRunPublicationInput'
          description: Publish the run's trials to an Intake Experiment. Omit to publish
            nowhere.
        timeout_seconds:
          title: Timeout Seconds
          description: Execution budget in seconds, counted from when the run's first
            task gets a slot. Omit to use evals.runs.default_timeout_seconds. Must
            not exceed evals.runs.max_timeout_seconds. Until its first slot, the run
            waits at most evals.runs.queue_timeout_seconds.
          type: integer
          exclusiveMinimum: 0.0
      additionalProperties: false
      type: object
      required:
      - spec
      - execution
      title: TasksetRunInput
      description: "Validate a stored Harbor taskset request for independent Kubernetes\
        \ task Jobs.\n\nConstruction produces a validated request without resolving\
        \ references or doing\nservice I/O. Submit uses it to derive request identity\
        \ and acceptance budgets.\n\nRaises:\n    ValidationError: Fields are invalid\
        \ or the spec violates Kubernetes run rules."
    TasksetRunIntakeInput:
      properties:
        experiment:
          type: string
          minLength: 1
          title: Experiment
          description: Name of an existing Intake Experiment. Submit creates one Evaluation
            in it per run, named after the run; each task Job publishes its trials
            there when it finishes.
          examples:
          - swe-agent-tuning
        agent_name:
          title: Agent Name
          description: Agent name recorded on each published trajectory. Defaults
            to the Harbor agent.
          type: string
          minLength: 1
        dataset_name:
          title: Dataset Name
          description: The Evaluation's dataset, such as the Harbor Hub dataset the
            tasks came from. Defaults to the taskset (workspace/name).
          examples:
          - datacurve/deep-swe
          type: string
          minLength: 1
        dataset_version:
          title: Dataset Version
          description: The dataset's version, such as a Harbor Hub dataset digest.
            Defaults to the pinned taskset's content digest.
          examples:
          - sha256:aaa82ceb8404dccc17689c9383f93dbcbc8f029a7601d2e3856a416f2cb89269
          type: string
          minLength: 1
      additionalProperties: false
      type: object
      required:
      - experiment
      title: TasksetRunIntakeInput
      description: Publish the run's trials to an existing Intake Experiment, as one
        Evaluation named after the run.
    TasksetRunPhase:
      type: string
      enum:
      - accepted
      - running
      - completed
      - failed
      - cancelled
      - expired
      title: TasksetRunPhase
      description: 'Encode execution progress as stable string values for persisted
        run records.


        Controllers move from accepted to running or a terminal phase; result

        finalization is tracked separately by ``ResultState`` so execution completion

        does not imply that combined results are already available.'
    TasksetRunProgress:
      properties:
        tasks:
          type: integer
          title: Tasks
          description: Members created; the plan's task count from the controller's
            first cycle on.
        members:
          additionalProperties:
            type: integer
          propertyNames:
            $ref: '#/components/schemas/MemberPhase'
          type: object
          title: Members
          description: Members by phase, settled phases included; a phase with no
            members is left out.
        queued:
          type: integer
          title: Queued
          description: 'Members waiting for a task-Job slot: image_ready without a
            create intent.'
        task_jobs:
          additionalProperties:
            type: integer
          propertyNames:
            $ref: '#/components/schemas/HelixJobStatus'
          type: object
          title: Task Jobs
          description: 'Registered members by their task Job''s status as the controller
            last read it, for example {"active": 18, "pending": 2}.'
      type: object
      required:
      - tasks
      - members
      - queued
      - task_jobs
      title: TasksetRunProgress
      description: How far a run's tasks got, as of the controller's last writes to
        its members.
    TasksetRunPublicationInput:
      properties:
        intake:
          allOf:
          - $ref: '#/components/schemas/TasksetRunIntakeInput'
          description: Publish trials and scores to an Intake Experiment.
      additionalProperties: false
      type: object
      required:
      - intake
      title: TasksetRunPublicationInput
      description: Where the run publishes its results, beyond its result bundle and
        record.
    TasksetRunStatus:
      properties:
        run_id:
          type: string
          title: Run Id
          description: Run name used to address the accepted run in API routes.
        workspace:
          type: string
          title: Workspace
          description: Workspace containing the run.
        taskset_ref:
          type: string
          title: Taskset Ref
          description: Pinned taskset revision this run evaluates, for example default/sort-suite#<64-hex
            digest>.
        phase:
          allOf:
          - $ref: '#/components/schemas/TasksetRunPhase'
          description: Execution progress. Starts accepted; terminal phases never
            change.
        result_state:
          allOf:
          - $ref: '#/components/schemas/ResultState'
          description: 'Availability of the combined results, tracked independently
            of phase. An expired or cancelled run can be ready: its result covers
            the tasks that finished.'
        accepted_at:
          type: string
          format: date-time
          title: Accepted At
          description: When submit accepted the run.
        timeout_seconds:
          type: integer
          title: Timeout Seconds
          description: Execution budget in seconds, counted from started_at.
        started_at:
          title: Started At
          description: When the run's first task got a slot and its execution clock
            started; None while it waits.
          type: string
          format: date-time
        execution_deadline_at:
          type: string
          format: date-time
          title: Execution Deadline At
          description: Unfinished tasks expire then. Until the run starts, accepted_at
            plus the queue timeout; from its first slot, started_at plus timeout_seconds.
            Retries do not reset it.
        finalization_deadline_at:
          type: string
          format: date-time
          title: Finalization Deadline At
          description: execution_deadline_at plus the operator grace at submit; the
            final result must be saved by then.
        cancel_requested_at:
          title: Cancel Requested At
          description: When a caller requested cancellation; None if never requested.
          type: string
          format: date-time
        error:
          title: Error
          description: Why the run failed or expired; None otherwise.
          type: string
        created_by:
          title: Created By
          description: Principal ID of the caller who created the run; None when creator
            metadata is unavailable.
          type: string
        idempotency_key:
          title: Idempotency Key
          description: 'Submit key: the caller''s, or the one submit generated when
            the request omitted it.'
          type: string
        progress:
          allOf:
          - $ref: '#/components/schemas/TasksetRunProgress'
          description: Counted from the run's members on each GET of this run; None
            before the controller creates them, and in run lists and submit responses.
      additionalProperties: false
      type: object
      required:
      - run_id
      - workspace
      - taskset_ref
      - phase
      - result_state
      - accepted_at
      - timeout_seconds
      - execution_deadline_at
      - finalization_deadline_at
      title: TasksetRunStatus
      description: 'Represent public run state for submit, read and cancellation responses.


        Instances expose stored domain state and caller identity while excluding plan

        bindings, request digests and Entity Store persistence metadata.'
    TasksetRunStatussPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/TasksetRunStatus'
          type: array
          title: Data
        pagination:
          allOf:
          - $ref: '#/components/schemas/PaginationData'
          description: Pagination information.
        sort:
          title: Sort
          description: The field on which the results are sorted.
          type: string
        filter:
          title: Filter
          description: Filtering information.
          additionalProperties: true
          type: object
      type: object
      required:
      - data
      title: TasksetRunStatussPage
    TasksetRunSubmitResponse:
      properties:
        run_id:
          type: string
          title: Run Id
          description: Run name used to address the accepted run in API routes.
        workspace:
          type: string
          title: Workspace
          description: Workspace containing the run.
        taskset_ref:
          type: string
          title: Taskset Ref
          description: Pinned taskset revision this run evaluates, for example default/sort-suite#<64-hex
            digest>.
        phase:
