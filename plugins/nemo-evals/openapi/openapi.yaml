      title: HelloResponse
    Histogram:
      properties:
        bins:
          items:
            $ref: '#/components/schemas/HistogramBin'
          type: array
          title: Bins
          description: Histogram bins.
      additionalProperties: false
      type: object
      required:
      - bins
      title: Histogram
      description: Histogram of score distribution.
    HistogramBin:
      properties:
        lower_bound:
          anyOf:
          - type: number
          - type: integer
          title: Lower Bound
          description: Lower bound of the bin (inclusive).
        upper_bound:
          anyOf:
          - type: number
          - type: integer
          title: Upper Bound
          description: Upper bound of the bin (exclusive for all but last bin).
        count:
          type: integer
          title: Count
          description: Number of values in this bin.
      additionalProperties: false
      type: object
      required:
      - lower_bound
      - upper_bound
      - count
      title: HistogramBin
      description: A single bin in a histogram.
    ImageBuild:
      properties:
        id:
          type: string
          title: Id
          description: The build's attempt number for this revision.
        task:
          type: string
          title: Task
        revision:
          type: string
          title: Revision
          description: Digest of the task revision being built.
        status:
          type: string
          enum:
          - pending
          - running
          - ready
          - failed
          title: Status
        job:
          type: string
          title: Job
        allowed_registries:
          items:
            type: string
          type: array
          title: Allowed Registries
        platform:
          title: Platform
          type: string
        images:
          items:
            $ref: '#/components/schemas/BuildImage'
          type: array
          title: Images
        error:
          title: Error
          type: string
        created_at:
          title: Created At
          type: string
          format: date-time
        updated_at:
          title: Updated At
          type: string
          format: date-time
      type: object
      required:
      - id
      - task
      - revision
      - status
      - job
      - allowed_registries
      - images
      title: ImageBuild
      description: An image build of one task revision.
    ImageBuildRequest:
      properties:
        allowed_registries:
          items:
            type: string
          type: array
          title: Allowed Registries
          description: Registry hosts, such as `docker.io`, that a prebuilt image
            named by the task may be copied from. Narrows the registries the deployment
            allows; empty allows all of those. A prebuilt image from any other registry
            fails the build.
        platform:
          title: Platform
          description: 'The platform to build every image for, as `os/architecture`,
            such as `linux/arm64`. Omit to follow the task: an image whose Dockerfile
            or compose service pins a platform is built for it, a prebuilt image published
            for one platform is copied for that one, and anything else follows the
            deployment''s default. An image pinned to another platform fails the build.
            BuildKit''s spellings, such as `linux/x86_64`, are taken and named as
            it names them.'
          type: string
          pattern: ^[A-Za-z0-9_-]+/[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)?$
        rebuild:
          type: boolean
          title: Rebuild
          description: 'Start a new attempt even when the newest build is ready, so
            the request reaches Builder again: after the deployment''s default platform
            changes, this builds for the new one. A build still running is returned
            as it is. Builder reuses any image it already has for an unchanged request.'
          default: false
      additionalProperties: false
      type: object
      title: ImageBuildRequest
      description: Options for an image build of one task revision.
    ImageBuildsPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/ImageBuild'
          type: array
          title: Data
        pagination:
          allOf:
          - $ref: '#/components/schemas/PaginationData'
          description: Pagination information.
        sort:
          title: Sort
          description: The field on which the results are sorted.
          type: string
        filter:
          title: Filter
          description: Filtering information.
          additionalProperties: true
          type: object
      type: object
      required:
      - data
      title: ImageBuildsPage
    ImageRuntimeConfig:
      properties:
        entrypoint:
          title: Entrypoint
          description: The image's `ENTRYPOINT`, or None when it has none.
          items:
            type: string
          type: array
          maxItems: 256
        cmd:
          title: Cmd
          description: 'The image''s `CMD`: the default arguments to its `ENTRYPOINT`,
            or None when it has none.'
          items:
            type: string
          type: array
          maxItems: 256
        working_dir:
          title: Working Dir
          description: The image's `WORKDIR`, or None when it sets none.
          type: string
          maxLength: 4096
      type: object
      title: ImageRuntimeConfig
      description: 'How the image starts by default, from its image config, including
        what it inherits from its base image.


        A runtime that replaces the container''s entrypoint, such as OpenSandbox,
        reads this to start the image''s own.'
    InferenceParams:
      properties:
        temperature:
          title: Temperature
          description: Float value between 0 and 1. temp of 0 indicates greedy decoding,
            where the token with highest prob is chosen. Temperature can't be set
            to 0.0 currently
          type: number
          maximum: 2.0
          minimum: 0.0
        max_tokens:
          title: Max Tokens
          description: Max tokens to generate
          type: integer
          minimum: 1.0
        max_completion_tokens:
          title: Max Completion Tokens
          description: Max tokens to generate
          type: integer
          minimum: 1.0
        top_p:
          title: Top P
          description: Float value between 0 and 1; limits to the top tokens within
            a certain probability. top_p=0 means the model will only consider the
            single most likely token for the next prediction
          type: number
          maximum: 1.0
          minimum: 0.0
        stop:
          title: Stop
          items:
            type: string
          type: array
      additionalProperties: true
      type: object
      title: InferenceParams
      description: Parameters for model inference. Extra fields can be supplied for
        additional options applied to the inference request directly. Fields not supported
        by the model may cause inference errors during evaluation.
    InlineMetricPayload:
      properties:
        kind:
          type: string
          const: inline
          title: Kind
          description: Payload format discriminator.
        metric:
          additionalProperties: true
          type: object
          title: Metric
          description: JSON-serialized built-in metric configuration, discriminated
            by its own `type`.
        digest:
          title: Digest
          description: SHA-256 digest of the canonical metric JSON. Informational;
            recomputed server-side.
          type: string
      additionalProperties: false
      type: object
      required:
      - kind
      - metric
      title: InlineMetricPayload
      description: 'Wire schema for an inline (config-serialized) metric payload.


        Mirrors the runtime ``InlineMetricPayload``. The metric is stored as its own

        JSON configuration and reconstructed from the metric type union at execution,

        so no code is shipped or executed on load. Used for platform-recognized

        built-in metric types.'
    IntakePublicationSpec:
      properties:
        evaluation_id:
          type: string
          minLength: 1
          title: Evaluation Id
          description: Name of the existing Evaluation to publish under. Must already
            exist; the job does not create it.
        agent_name:
          title: Agent Name
          description: Agent name recorded on each published trajectory. Derived from
            the target when it names one; required otherwise.
          type: string
          minLength: 1
        agent_version:
          type: string
          minLength: 1
          title: Agent Version
          description: Agent version recorded on each published trajectory. Neither
            a Model nor an Agent carries a version, so this defaults to the version
            the agent's own trajectory records (a Harbor agent's, such as codex's),
            else 'unknown'.
          default: unknown
        required:
          type: boolean
          title: Required
          description: Fail the job when publication fails. Defaults to True so a
            run that asked to publish does not report success with nothing in Experiments.
            The result bundle is saved before publication runs, so a failed job still
            leaves the results intact to re-publish. Set False to keep the job successful
            and report the failure in its output instead.
          default: true
        max_otlp_request_bytes:
          type: integer
          exclusiveMinimum: 0.0
          title: Max Otlp Request Bytes
          description: Largest serialized OTLP request, envelope included, sent to
            Intake for one trial's trace. A larger trace is split into several requests
            in span order, keeping each span's ids, parent, and resource and scope
            metadata. Defaults to 4 MiB. Keep it within Intake's and any proxy's request
            body limits; this setting does not change those limits. A trial with a
            single span too large to fit fails publication before any of its trace
            is sent.
          default: 4194304
      additionalProperties: false
      type: object
      required:
      - evaluation_id
      title: IntakePublicationSpec
      description: "Publish this run's trials and scores to Intake, under an Evaluation\
        \ that already exists.\n\n``evaluation_id`` is the *name* of a ``client.evaluations``\
        \ record. Intake stores that record as\nits ``Experiment`` entity and the\
        \ SDK's ``publish_to_intake`` calls the argument\n``experiment_id``, but the\
        \ value is the same one either way \u2014 the parent ``client.experiments``\n\
        group is a different resource and is not what goes here. The job never creates\
        \ the Evaluation: a\nmissing one is an error, because nothing in an eval spec\
        \ can supply the dataset identity\n``evaluations.create`` requires."
    JobControl:
      properties:
        pause_ttl_seconds:
          title: Pause Ttl Seconds
          description: How long this job keeps storage after it pauses, measured from
            stopped_at. When the job has no value, the platform paused-storage TTL
            applies. Cannot exceed the platform maximum. 0 reclaims on the next retention
            pass. In a control update, an omitted or null value keeps the current
            value. Changing this value does not move the start time.
          nullable: true
          type: integer
          minimum: 0.0
      type: object
      title: JobControl
      description: 'Mutable job behavior, stored on the job and kept off the execution
        spec.


        The attempt spec stays the immutable snapshot of what a run executes. Rerun

        copies the job spec into the next attempt and keeps using this object. In
        a

        control update, an omitted or null value keeps the job''s current value.'
    JsonValue:
      title: JsonValue
    LiveMetricResult:
      properties:
        metric:
          type: string
          title: Metric
          description: The metric's runtime type name, matching the request order.
        scores:
          items:
            anyOf:
            - $ref: '#/components/schemas/AggregateRangeScore'
            - $ref: '#/components/schemas/AggregateRubricScore'
            - $ref: '#/components/schemas/AggregateScalarScore'
          type: array
          title: Scores
          description: Aggregated scores for this metric. Empty when it failed.
        error:
          title: Error
          description: Why this metric produced no scores. Null when it succeeded.
          type: string
      additionalProperties: false
      type: object
      required:
      - metric
      title: LiveMetricResult
      description: 'One requested metric''s outcome: its scores, or why it produced
        none.'
    LiveScoreRequest:
      properties:
        dataset:
          items:
            additionalProperties: true
            type: object
          type: array
          maxItems: 1
          minItems: 1
          title: Dataset
          description: The single row to evaluate. Offline requests carry the model
            output on the row.
        metrics:
          items:
            anyOf:
            - $ref: '#/components/schemas/MetricInline'
            - $ref: '#/components/schemas/MetricRef'
          type: array
          maxItems: 24
          minItems: 1
          title: Metrics
          description: Metrics to score the row with, given as inline definitions
            and/or references to stored metrics (`workspace/metric-name`).
        target:
          anyOf:
          - $ref: '#/components/schemas/Model'
          - $ref: '#/components/schemas/ModelRef'
          title: Target
          description: Optional model to generate the row's output before scoring,
            inline or as a `workspace/model` reference to a platform model. Omit to
            score an output already present on the row. Agent targets are not supported
            on this route.
        prompt_template:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          title: Prompt Template
          description: Optional prompt template applied to online target generation.
        field_mapping:
          allOf:
          - $ref: '#/components/schemas/FieldMapping'
          description: Optional mapping from canonical evaluator fields to dataset
            columns.
        params:
          anyOf:
          - $ref: '#/components/schemas/RunConfig'
          - $ref: '#/components/schemas/RunConfigOnlineModel'
          title: Params
          description: Optional execution parameters. Single-row, no-retry and timeout
            settings are pinned by the route and cannot be overridden.
      additionalProperties: false
      type: object
      required:
      - dataset
      - metrics
      title: LiveScoreRequest
      description: 'One row, the metrics to score it with, and an optional model to
        generate it.


        Deliberately not a subclass of the job''s ``EvaluateInputSpec``: this route
        persists nothing, so

        the publication field and its identity validator have no meaning here, and
        a ``FilesetRef``

        dataset would reintroduce the file I/O the route exists to avoid.'
    LiveScoreResponse:
      properties:
        output:
          title: Output
          description: The candidate text that was scored. Generated server-side for
            an online target; echoed from the row for an offline request.
          type: string
        metrics:
          items:
            $ref: '#/components/schemas/LiveMetricResult'
          type: array
          title: Metrics
          description: One entry per requested metric, in request order.
      additionalProperties: false
      type: object
      required:
      - output
      - metrics
      title: LiveScoreResponse
      description: 'Per-metric outcomes for the row, plus whatever text was scored.


        Every requested metric appears, in request order, whether or not it succeeded.
        A failing metric

        reports its own error and leaves its siblings'' scores intact, so one broken
        metric out of eight

        is identifiable rather than collapsing the whole response into a single error.'
    McpFulfillment:
      properties:
        url:
          type: string
          title: Url
          description: Endpoint the environment provides for this MCP server.
        env:
          additionalProperties:
            type: string
          type: object
          title: Env
          description: Non-secret env for the MCP server.
        secrets:
          additionalProperties:
            type: string
          type: object
          title: Secrets
          description: ENV_NAME -> Secrets-service ref, merged into the MCP server
            env at compile.
      type: object
      required:
      - url
      title: McpFulfillment
      description: 'EnvironmentSpec-side fulfillment for one MCP server the Agent
        declares.


        The Agent DECLARES an MCP dependency by name; the EnvironmentSpec PROVIDES

        the url + env + secrets for that same name. Matched by server-name key at

        compile time; ``secrets`` are merged into the server''s ``env``.'
    MemberPhase:
      type: string
      enum:
      - image_preparing
      - image_ready
      - registered
      - succeeded
      - failed
      - cancelled
      - expired
      title: MemberPhase
      description: 'Encode preparation and execution progress for an individual run
        member.


        String values persist image preparation, Job registration, and settled task

        outcomes so controllers can track each task without changing the run''s plan.'
    MetadataItem:
      properties:
        key:
          type: string
          title: Key
          description: Annotation key.
        value:
          allOf:
          - $ref: '#/components/schemas/JsonValue'
          description: JSON-serializable annotation value.
      additionalProperties: false
      type: object
      required:
      - key
      - value
      title: MetadataItem
      description: A single key/value annotation on a task.
    Metric:
      properties:
        id:
          type: string
          title: Id
          description: Unique identifier for the stored metric.
        name:
          type: string
          title: Name
          description: Name of the metric, unique within its workspace.
        workspace:
          type: string
          title: Workspace
          description: Workspace the metric belongs to.
        project:
          title: Project
          description: The project associated with this metric.
          type: string
        metric_type:
          type: string
          title: Metric Type
          description: Runtime metric type name.
        description:
          title: Description
          description: Description captured from the metric's metadata.
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
          description: Labels captured from the metric's metadata.
        outputs:
          items:
            $ref: '#/components/schemas/BundledMetricOutputSpec'
          type: array
          title: Outputs
          description: The metric's output contracts.
        secrets:
          additionalProperties:
            $ref: '#/components/schemas/SecretRef'
          type: object
          title: Secrets
          description: Secret references required to execute the metric.
        payload_kind:
          type: string
          title: Payload Kind
          description: Payload discriminator of the stored bundle.
        payload_digest:
          type: string
          title: Payload Digest
          description: Digest of the stored payload.
        bundle_ref:
          type: string
          title: Bundle Ref
          description: Files reference to the canonical serialized bundle.
        derived:
          type: boolean
          title: Derived
          description: True for a content-addressed metric auto-stored from an inline
            task metric (excluded from the default metric listing).
          default: false
        created_at:
          type: string
          format: date-time
          title: Created At
          description: Timestamp the metric was created.
        updated_at:
          type: string
          format: date-time
          title: Updated At
          description: Timestamp the metric was last updated.
      type: object
      required:
      - id
      - name
      - workspace
      - metric_type
      - outputs
      - secrets
      - payload_kind
      - payload_digest
      - bundle_ref
      - created_at
      - updated_at
      title: Metric
      description: 'API representation of a stored metric.


        The canonical executable bundle lives in the Files service; the fields here

        are the queryable projection plus the reference and digest needed to load
        it.'
    MetricFilter:
      additionalProperties: false
      description: Filter for metric queries.
      properties:
        workspace:
          description: Filter by workspace.
          title: Workspace
          type: string
        name:
          description: Filter by name.
          title: Name
          type: string
        metric_type:
          description: Filter by metric type.
          title: Metric Type
          type: string
        description:
          description: Filter by description.
          title: Description
          type: string
        derived:
          description: Filter by derived flag.
          title: Derived
          type: boolean
        created_at:
          allOf:
          - $ref: '#/components/schemas/DatetimeFilter'
          description: Filter by creation date.
        updated_at:
          allOf:
          - $ref: '#/components/schemas/DatetimeFilter'
          description: Filter by update date.
      title: MetricFilter
      type: object
    MetricInline:
      properties:
        bundle_kind:
          type: string
          const: metric-bundle
          title: Bundle Kind
          default: metric-bundle
        bundle_format_version:
          type: string
          const: v1
          title: Bundle Format Version
          default: v1
        metric_type:
          type: string
          minLength: 1
          title: Metric Type
          description: Runtime metric type name.
        metadata:
          allOf:
          - $ref: '#/components/schemas/MetricMetadata'
          description: User-facing metric metadata.
        outputs:
          items:
            $ref: '#/components/schemas/BundledMetricOutputSpec'
          type: array
          minItems: 1
          title: Outputs
          description: The metric's output contracts.
        secrets:
          additionalProperties:
            $ref: '#/components/schemas/SecretRef'
          type: object
          title: Secrets
          description: Secret references required to execute the metric.
        payload:
          oneOf:
          - $ref: '#/components/schemas/CloudpickleMetricPayload'
          - $ref: '#/components/schemas/InlineMetricPayload'
          title: Payload
          description: Format-specific serialized metric.
          discriminator:
            propertyName: kind
            mapping:
              cloudpickle: '#/components/schemas/CloudpickleMetricPayload'
              inline: '#/components/schemas/InlineMetricPayload'
      additionalProperties: false
      type: object
      required:
      - metric_type
      - outputs
      - payload
      title: MetricInline
      description: "An executable metric submitted to the platform.\n\nCarries the\
        \ bundled metric \u2014 type, metadata, output contracts, secret\nreferences,\
        \ and a format-specific payload \u2014 used both as the create-request\nbody\
        \ and as an inline metric in an evaluation job."
    MetricMetadata:
      properties:
        description:
          title: Description
          type: string
        labels:
          additionalProperties:
            type: string
          type: object
          title: Labels
      additionalProperties: true
      type: object
      title: MetricMetadata
      description: User-facing metadata captured with a bundled metric.
    MetricRef:
      type: string
      pattern: ^[\w\-.]+(/[\w\-.]+)?$
      title: MetricRef
      description: 'Reference to a persisted metric (format: ``workspace/name`` or
        ``name``).'
    MetricSort:
      type: string
      enum:
      - name
      - -name
      - created_at
      - -created_at
      - updated_at
      - -updated_at
      title: MetricSort
      description: Sort fields for metric queries.
    MetricsPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/Metric'
          type: array
          title: Data
        pagination:
          allOf:
          - $ref: '#/components/schemas/PaginationData'
          description: Pagination information.
        sort:
          title: Sort
          description: The field on which the results are sorted.
          type: string
        filter:
          title: Filter
          description: Filtering information.
          additionalProperties: true
          type: object
      type: object
      required:
      - data
      title: MetricsPage
    Model:
      properties:
        url:
          type: string
          title: Url
          description: URL of the model.
        name:
          type: string
          title: Name
          description: Name of the model.
        served_model_name:
          title: Served Model Name
          description: Provider model identifier preserved when resolving a ModelRef.
          nullable: true
          type: string
        inference:
          title: Inference
          description: Capability-specific invocation metadata. Ranking is the only
            variant today.
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RankingInference'
          discriminator:
            propertyName: type
            mapping:
              ranking: '#/components/schemas/RankingInference'
        api_key_secret:
          allOf:
          - $ref: '#/components/schemas/SecretRef'
          description: 'API key secret reference for the model. Format: workspace/secret_name
            or secret_name within the job workspace.'
        format:
          type: string
          enum:
          - nim
          - openai
          - llama_stack
          title: Format
          description: Deprecated and ignored. Previously selected the structured
            output encoding; that is now detected per endpoint, because support is
            a property of the endpoint rather than of the label attached to the model.
          default: openai
          deprecated: true
      additionalProperties: false
      type: object
      required:
      - url
      - name
      title: Model
      description: Model definition for use without persisting to the Models API.
    ModelProviderOverride:
      properties:
        base_url:
          type: string
          title: Base Url
          description: External model-provider endpoint.
        api_key:
          title: Api Key
          description: Secrets-service ref for the provider API key (only needed for
            external providers).
          type: string
        provider:
          title: Provider
          description: Provider selector (e.g. "openai", "anthropic").
          type: string
      type: object
      required:
      - base_url
      title: ModelProviderOverride
      description: 'Exceptional external model-provider override.


        Null in the normal case: model selection is on the Agent and the provider

        URL is the Inference Gateway (auto-injected). Set ONLY to point the agent
        at

        a non-IGW external provider endpoint.'
    ModelRef:
      type: string
      pattern: ^[a-z](?:[a-z0-9@.+_]|-[a-z0-9@.+_]){1,62}/[a-z](?:[a-z0-9@.+_]|-[a-z0-9@.+_]){1,62}$
      title: ModelRef
      description: Reference to a model that can be resolved by an evaluator backend.
      examples:
      - workspace/model_name
    ModelTarget:
      properties:
        kind:
          type: string
          const: model
          title: Kind
          default: model
        model:
          allOf:
          - $ref: '#/components/schemas/Model'
          description: The model endpoint to generate trials against.
        prompt_template:
          anyOf:
          - type: string
          - additionalProperties: true
            type: object
          title: Prompt Template
          description: How each task maps to the chat/completion request. Defaults
            to a single user message carrying the task prompt when omitted.
        params:
          allOf:
          - $ref: '#/components/schemas/RunConfigOnlineModel'
          description: Optional online-inference parameters for trial generation.
      additionalProperties: false
      type: object
      required:
      - model
      title: ModelTarget
      description: 'Generate trials by calling a Model (OpenAI-compatible) endpoint.


        The prompt template *is* the request sent to the model, so it lives here with
        the endpoint.'
    NatAgentConfig:
      properties:
        endpoint:
          type: string
          title: Endpoint
          description: Relative path below agent.url, or an absolute NAT endpoint
            URL.
          default: /generate/full
        request_mode:
          type: string
          enum:
          - input_message
          - passthrough
          title: Request Mode
          description: Derive the legacy input_message payload or send the rendered
            request unchanged.
          default: input_message
        query_params:
          additionalProperties:
            type: string
          type: object
          title: Query Params
          description: Query parameters sent to the NAT endpoint.
        response_path:
          type: string
          title: Response Path
          description: JSONPath applied to each data-channel payload to extract its
            emitted value.
          default: $.value
        response_aggregation:
          type: string
          enum:
          - last
          - concat
          title: Response Aggregation
          description: How to combine matched data-frame values into the final output.
            NAT /generate/full emits token-level deltas, so 'concat' reconstructs
            the complete response; 'last' keeps only the final matched value (for
            endpoints that emit a full snapshot per frame).
          default: concat
      additionalProperties: false
      type: object
      title: NatAgentConfig
      description: NeMo Agent Toolkit request and stream handling configuration.
    NemoAgentToolkitAgent:
      properties:
        url:
          type: string
          title: Url
          description: Base URL of the agent endpoint.
        name:
