            the target when it names one; required otherwise.
          type: string
          minLength: 1
        agent_version:
          type: string
          minLength: 1
          title: Agent Version
          description: Agent version recorded on each published trajectory. Neither
            a Model nor an Agent carries a version, so this defaults to the version
            the agent's own trajectory records (a Harbor agent's, such as codex's),
            else 'unknown'.
          default: unknown
        required:
          type: boolean
          title: Required
          description: Fail the job when publication fails. Defaults to True so a
            run that asked to publish does not report success with nothing in Experiments.
            The result bundle is saved before publication runs, so a failed job still
            leaves the results intact to re-publish. Set False to keep the job successful
            and report the failure in its output instead.
          default: true
        max_otlp_request_bytes:
          type: integer
          exclusiveMinimum: 0.0
          title: Max Otlp Request Bytes
          description: Largest serialized OTLP request, envelope included, sent to
            Intake for one trial's trace. A larger trace is split into several requests
            in span order, keeping each span's ids, parent, and resource and scope
            metadata. Defaults to 4 MiB. Keep it within Intake's and any proxy's request
            body limits; this setting does not change those limits. A trial with a
            single span too large to fit fails publication before any of its trace
            is sent.
          default: 4194304
        test_case_id_field:
          title: Test Case Id Field
          description: "Dataset column identifying each row, recorded as the published\
            \ test case id. Defaults to a hash of the row's content, which keeps a\
            \ row's id stable across dataset reorderings and revisions so the same\
            \ test case can be compared run over run; editing a row makes it a new\
            \ test case. Name a column here when the dataset has a real identifier\
            \ \u2014 it reads better and survives content edits. Values must be unique\
            \ per row; the run is rejected if they are not."
          type: string
          minLength: 1
      additionalProperties: false
      type: object
      required:
      - evaluation_id
      title: RowIntakePublicationSpec
      description: Intake publication for a dataset-driven evaluation, where a trial
        is a dataset row.
    RowPublicationSpec:
      properties:
        intake:
          allOf:
          - $ref: '#/components/schemas/RowIntakePublicationSpec'
          description: Publish scored rows to Intake. Omit to publish nowhere.
      additionalProperties: false
      type: object
      title: RowPublicationSpec
      description: Where a completed dataset-driven evaluation publishes its results.
    RubricScoreStat:
      properties:
        label:
          type: string
          title: Label
          description: The label to use for the level of the rubric grading criteria.
        description:
          title: Description
          description: Describe the semantic meaning of each criteria for the given
            rubric.
          type: string
        value:
          anyOf:
          - type: number
          - type: integer
          title: Value
          description: The score value to assign for the criteria.
        count:
          type: integer
          title: Count
          description: The number of samples evaluated with the rubric level.
          default: 0
      type: object
      required:
      - label
      - value
      title: RubricScoreStat
      description: Rubric score with count statistics.
    RunConfig:
      properties:
        parallelism:
          type: integer
          minimum: 1.0
          title: Parallelism
          description: Parallelism to be used for the evaluation job. Typically, this
            represents the maximum number of concurrent requests made to the model.
          default: 8
        limit_samples:
          title: Limit Samples
          description: Limit number of evaluation samples, taking the first `limit`
            samples from the dataset.
          type: integer
          minimum: 1.0
      additionalProperties: false
      type: object
      title: RunConfig
      description: Job parameters.
    RunConfigOnline:
      properties:
        parallelism:
          type: integer
          minimum: 1.0
          title: Parallelism
          description: Parallelism to be used for the evaluation job. Typically, this
            represents the maximum number of concurrent requests made to the model.
          default: 8
        limit_samples:
          title: Limit Samples
          description: Limit number of evaluation samples, taking the first `limit`
            samples from the dataset.
          type: integer
          minimum: 1.0
        ignore_request_failure:
          type: boolean
          title: Ignore Request Failure
          description: If True, request failures will be ignored and the result will
            be marked as NaN. If False (default), request failures will raise an exception.
          default: false
        request_timeout:
          title: Request Timeout
          description: The timeout to be used for requests made to the model.
          type: integer
        max_retries:
          type: integer
          minimum: 0.0
          title: Max Retries
          description: Maximum number of retries for failed requests.
          default: 3
      additionalProperties: false
      type: object
      title: RunConfigOnline
      description: Job parameters for online evaluation.
    RunConfigOnlineModel:
      properties:
        parallelism:
          type: integer
          minimum: 1.0
          title: Parallelism
          description: Parallelism to be used for the evaluation job. Typically, this
            represents the maximum number of concurrent requests made to the model.
          default: 8
        limit_samples:
          title: Limit Samples
          description: Limit number of evaluation samples, taking the first `limit`
            samples from the dataset.
          type: integer
          minimum: 1.0
        ignore_request_failure:
          type: boolean
          title: Ignore Request Failure
          description: If True, request failures will be ignored and the result will
            be marked as NaN. If False (default), request failures will raise an exception.
          default: false
        request_timeout:
          title: Request Timeout
          description: The timeout to be used for requests made to the model.
          type: integer
        max_retries:
          type: integer
          minimum: 0.0
          title: Max Retries
          description: Maximum number of retries for failed requests.
          default: 3
        inference:
          allOf:
          - $ref: '#/components/schemas/InferenceParams'
          description: Custom settings that control the model's text generation behavior.
        system_prompt:
          title: System Prompt
          description: Initial instructions that define the model's role and behavior
            for the conversation.
          type: string
        reasoning:
          allOf:
          - $ref: '#/components/schemas/ReasoningParams'
          description: Custom settings that control the model's reasoning behavior.
        structured_output:
          title: Structured Output
          description: JSON schema to apply structured output for the model.
          additionalProperties: true
          type: object
      additionalProperties: false
      type: object
      title: RunConfigOnlineModel
      description: Job parameters for model online evaluation.
    SandboxSelection:
      properties:
        cpus:
          title: Cpus
          type: integer
          exclusiveMinimum: 0.0
        memory_mb:
          title: Memory Mb
          type: integer
          exclusiveMinimum: 0.0
        storage_mb:
          title: Storage Mb
          type: integer
          exclusiveMinimum: 0.0
        profile:
          title: Profile
          description: 'Name of an operator sandbox profile: the sandbox''s isolation
            and egress rules and its resource ceilings. Omit for the operator''s default
            profile.'
          examples:
          - harbor-standard
          type: string
          minLength: 1
      additionalProperties: false
      type: object
      title: SandboxSelection
      description: '``execution.sandbox``: an operator sandbox profile by name, and
        resource overrides within its ceilings.'
    SecretRef:
      type: string
      pattern: ^[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)?$
      title: SecretRef
      description: 'Reference to a platform secret or local environment variable.
        Format: ''secret_name'' (uses request workspace) or ''workspace/secret_name''
        (explicit workspace).'
      examples:
      - my-secret
      - my-workspace/my-secret
      - NVIDIA_API_KEY
    SemanticReducer:
      type: string
      enum:
      - single
      - all
      - any
      - mean
      - weighted_mean
      title: SemanticReducer
      description: Reduction strategy used to combine task-scoped view signals into
        one score.
    SemanticView:
      properties:
        reducer:
          allOf:
          - $ref: '#/components/schemas/SemanticReducer'
          description: Strategy used to reduce this view's signals into a single task-level
