        job.


        This submission-time snapshot is distinct from a persisted task revision:
        it contains the

        runtime identity, metadata, and execution-ready definition with metric references
        expanded.

        For a stored task, ``spec.provenance`` identifies the immutable revision from
        which the

        snapshot was derived. Expanding metric/model references does not rewrite that

        provenance digest; an inline task has no stored revision or provenance.'
