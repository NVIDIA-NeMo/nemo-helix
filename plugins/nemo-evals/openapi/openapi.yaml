    TrialError:
      properties:
        type:
          type: string
          title: Type
          description: Error class name as the producer reported it, e.g. 'RuntimeError'.
            Rollup key for AgentEvalSummary.error_trial_ids. Falls back to 'UnknownException'
            when the producer reported a failure without a usable type.
        message:
          title: Message
          description: Short error message, when the producer supplied one.
          type: string
        traceback:
          title: Traceback
          description: 'Formatted traceback, when the producer supplied one. May be
            truncated by the adapter that captured it. Note run bundles are portable:
            this can carry absolute filesystem paths and other diagnostic text from
            the machine that ran the trial.'
          type: string
        occurred_at:
          type: string
          title: Occurred At
          description: "When the producer recorded the failure, as it reported it.\
            \ The SDK does not rewrite this: an aware value (UTC, offset) is kept,\
            \ and a naive value stays naive. Harbor's clock is naive local, e.g. '2026-08-13T17:22:32',\
            \ while that trial's start in result.json is UTC ('2026-08-14T00:22:25Z')\
            \ \u2014 the same instant on two clocks, so do not subtract them or attach\
            \ a zone Harbor never wrote. A runner that recorded an offset keeps it.\
            \ Not RFC 3339 date-time: the offset may be absent."
      additionalProperties: false
      type: object
      required:
      - type
      title: TrialError
      description: 'What went wrong producing one trial, as the producer reported
        it.


        Present means the *producer* reported a failure. It does **not** imply ``status
        is FAILED``: an

        errored trial can be marked as :attr:`AgentEvalTrialStatus.PARTIAL` so it
        is still scored (ex: HarborRuntime).

        It is also unrelated to a score diagnostic''s ``exception_type`` detail, which
        records that the

        *metric* raised - a different event.


        Frozen so callers cannot rewrite ``type`` after construction. These objects
        are returned as-is

        (not copied), and ``AgentEvalSummary.error_trial_ids`` groups trial ids by
        that string. Mutating

        ``type`` on a live object would leave the summary keyed on the old value while
        the trial reports

        a new one.'
    TrialMeasurements:
      properties:
        prompt_tokens:
          title: Prompt Tokens
          type: integer
          minimum: 0.0
        completion_tokens:
          title: Completion Tokens
          type: integer
          minimum: 0.0
        total_tokens:
          title: Total Tokens
          type: integer
          minimum: 0.0
        cache_creation_tokens:
          title: Cache Creation Tokens
          type: integer
          minimum: 0.0
        cache_read_tokens:
          title: Cache Read Tokens
          type: integer
          minimum: 0.0
        runtime_sec:
          title: Runtime Sec
          type: number
          minimum: 0.0
        cost_usd:
          title: Cost Usd
          type: number
          minimum: 0.0
      additionalProperties: false
      type: object
      title: TrialMeasurements
      description: Validated usage, runtime, and cost measurements for one trial.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
          additionalProperties: true
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    ViewSignal:
      properties:
        metric:
          type: string
          title: Metric
          description: Task-local metric type (metric.type) whose output feeds this
            signal.
        output:
          type: string
          title: Output
          description: Name of the metric output, as declared by the metric's output_spec().
        weight:
          title: Weight
          description: Relative weight for this signal when the view reducer is 'weighted_mean';
            unused otherwise.
          type: number
      additionalProperties: false
      type: object
      required:
      - metric
      - output
      title: ViewSignal
      description: Task-scoped metric output that contributes to a semantic view.
