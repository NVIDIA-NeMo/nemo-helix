          type: string
        progress:
          allOf:
          - $ref: '#/components/schemas/TasksetRunProgress'
          description: Counted from the run's members on each GET of this run; None
            before the controller creates them, and in run lists and submit responses.
        warnings:
          items:
            type: string
          type: array
          title: Warnings
          description: Advisory notices about this caller's overlapping active runs
            on the same taskset revision.
      additionalProperties: false
      type: object
      required:
