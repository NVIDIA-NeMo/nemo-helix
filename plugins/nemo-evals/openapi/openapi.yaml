  /apis/evals/v2/workspaces/{workspace}/agent-evaluate/runs:
    post:
      tags:
      - Evals Plugin Taskset Run Routes
      summary: Submit Taskset Run
      description: "Freeze and accept a Harbor run, returning its original status\
        \ on a keyed retry.\n\nThe caller must be able to read every source: the taskset,\
        \ its member tasks, their metrics and\nmetric models. Submission copies those\
        \ definitions into a plan stored in this workspace, so\nanyone who can read\
        \ this workspace's files or jobs can read the copy, even without access to\n\
        the source workspaces.\n\nArgs:\n    workspace: Workspace that owns the run.\n\
        \    req: Validated stored Harbor taskset and execution inputs.\n    response:\
        \ HTTP response whose status distinguishes acceptance from replay.\n    caller:\
        \ Effective authenticated principal, supplied by the platform dependency.\n\
        \    service: Caller-delegated request-scoped acceptance service.\n\nReturns:\n\
        \    Public run status with advisory notices; 201 for acceptance or 200 for\
        \ replay. Submission starts\n    no task Jobs (the run controller does) and\
        \ no image builds: a task whose image isn't built yet is\n    rejected (422).\
        \ A keyed replay returns the stored status.\n\nRaises:\n    RequestValidationError:\
        \ The execution budget exceeds the operator maximum.\n    HTTPException: Source\
        \ denial (403), conflicting key or Evaluation dataset (409), resolution rejection\n\
        \        (422), an unavailable image build service before acceptance (503,\
        \ safe to resend), an Intake\n        Evaluation that couldn't be created\
        \ before acceptance (503), an Intake Evaluation refused\n        before acceptance\
        \ (403, not retried), or a sanitized unexpected failure (500).\n        When\
        \ the request omits idempotency_key, submit generates one. A 5xx then names\
        \ it in the\n        detail and the ``x-idempotency-key`` header and says\
        \ not to retry automatically: the SDK\n        would resend the keyless request\
        \ and accept a second run. Resubmit with that key instead."
      operationId: submit_taskset_run_apis_evals_v2_workspaces__workspace__agent_evaluate_runs_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TasksetRunInput'
      responses:
        '201':
          description: Accept a new run with frozen taskset and agent inputs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksetRunSubmitResponse'
        '200':
          description: Replay an identical existing run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksetRunSubmitResponse'
        '409':
          description: The idempotency key already belongs to a different request,
            or the run's Intake Evaluation exists with different dataset metadata.
        '422':
          description: Invalid request, excessive timeout, missing or incompatible
            source, unconfigured execution, or a task without images.
        '503':
          description: Reading image builds, or Intake, failed before the run was
            accepted; retry the same request.
    get:
      tags:
      - Evals Plugin Taskset Run Routes
      summary: List Taskset Runs
      description: "Read a newest-first workspace run page with independent active/mine\
        \ filters.\n\nArgs:\n    workspace: Workspace containing the records.\n  \
        \  active: Restrict to accepted and running phases when True.\n    mine: Restrict\
        \ to the effective caller's records when True.\n    page: One-based page number,\
        \ validated by FastAPI.\n    page_size: Maximum page size, from 1 to 1000.\n\
        \    caller: Effective principal supplied by the platform dependency.\n  \
        \  service: Shared request-scoped run service.\n\nReturns:\n    Stored statuses\
        \ and filtered pagination counts, excluding null optionals.\n\nRaises:\n \
        \   HTTPException: Unexpected storage or projection failure, sanitized to\
        \ 500."
      operationId: list_taskset_runs_apis_evals_v2_workspaces__workspace__agent_evaluate_runs_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: active
        in: query
        required: false
        schema:
          type: boolean
          description: Include only accepted and running runs.
          default: false
          title: Active
        description: Include only accepted and running runs.
      - name: mine
        in: query
        required: false
        schema:
          type: boolean
          description: Include only runs created by the effective caller.
          default: false
          title: Mine
        description: Include only runs created by the effective caller.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          description: One-based page number.
          default: 1
          title: Page
        description: One-based page number.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          description: Maximum runs on the requested page.
          default: 100
          title: Page Size
        description: Maximum runs on the requested page.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksetRunStatussPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/evals/v2/workspaces/{workspace}/agent-evaluate/runs/{run_id}:
    get:
      tags:
      - Evals Plugin Taskset Run Routes
      summary: Get Taskset Run
      description: "Read one stored run and its progress, counted from its members,\
        \ without loading its plan or reading Jobs.\n\nArgs:\n    workspace: Workspace\
        \ that scopes the record lookup.\n    run_id: Public run name in that workspace.\n\
        \    service: Shared request-scoped run service.\n\nReturns:\n    Current\
        \ stored status with ``progress`` (omitted while the run has no members),\
        \ excluding null\n    optionals and internal metadata.\n\nRaises:\n    HTTPException:\
        \ The record is absent (404), or an unexpected storage or\n        projection\
        \ failure occurs (sanitized 500)."
      operationId: get_taskset_run_apis_evals_v2_workspaces__workspace__agent_evaluate_runs__run_id__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksetRunStatus'
        '404':
          description: Run not found in this workspace.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/evals/v2/workspaces/{workspace}/agent-evaluate/runs/{run_id}/cancel:
    post:
      tags:
      - Evals Plugin Taskset Run Routes
      summary: Cancel Taskset Run
      description: "Record the intent to cancel a run and return its status; the phase\
        \ changes on the controller's next pass.\n\nWrites only ``cancel_requested_at``:\
        \ never the phase, members, Jobs or the Intake Evaluation. A repeat keeps\
        \ the\nfirst request's time. The write goes through the evals service, after\
        \ the caller's permission check, so it never\nerases a field only the service\
        \ reads back.\n\nArgs:\n    workspace: Workspace that scopes the record lookup.\n\
        \    run_id: Public run name in that workspace.\n    store: Run store acting\
        \ as the evals service.\n\nReturns:\n    The stored status with ``cancel_requested_at``\
        \ set, excluding null optionals.\n\nRaises:\n    HTTPException: The record\
        \ is absent (404), the run already finished (409), every write lost to a concurrent\n\
        \        one (503, safe to retry), or an unexpected failure (sanitized 500)."
      operationId: cancel_taskset_run_apis_evals_v2_workspaces__workspace__agent_evaluate_runs__run_id__cancel_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      responses:
        '200':
          description: Cancel requested now or earlier; the run controller stops the
            run on its next pass.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TasksetRunStatus'
        '404':
          description: Run not found in this workspace.
        '409':
          description: The run already finished; there is nothing to cancel.
        '503':
          description: The run kept changing while the cancel was recorded; retry.
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
