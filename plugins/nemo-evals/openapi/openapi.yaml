              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /apis/evals/v2/workspaces/{workspace}/tasks/{name}/revisions/{revision}:
    get:
      tags:
      - Evals Plugin Tasks Routes
      summary: Get Task Revision
      description: "Get a task's content as of a published revision.\n\n``revision``\
        \ is a content digest or a tag \u2014 exactly what a reference's ``#fragment``\
        \ carries,\nso a consumer holding ``workspace/task-a#<digest>`` reads what\
        \ was published rather than\nwhatever is current. Returns the full task DTO;\
        \ the collection route above is a thin index of\nwhat can be pinned to."
      operationId: get_task_revision_apis_evals_v2_workspaces__workspace__tasks__name__revisions__revision__get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: name
        in: path
        required: true
        schema:
          type: string
          maxLength: 255
          pattern: ^[\w\-\.]+$
          title: Name
      - name: revision
        in: path
        required: true
