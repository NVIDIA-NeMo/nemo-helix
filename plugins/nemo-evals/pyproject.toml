[project]
name = "nemo-evals-plugin"
description = "Evals plugin scaffold for NeMo Helix."
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "cloudpickle>=3.1.1",
    "filesets",
    "nemo-agents-plugin",
    "nhx-evals-sdk[harbor]",
    "nemo-helix-plugin",
    "pydantic>=2.12.0",
    "typer>=0.20.0",
]
version = "0.0.0"

[project.entry-points."nemo.services"]
evals = "nemo_evals.service:EvaluatorPluginService"

[project.entry-points."nemo.cli"]
evals = "nemo_evals.cli:EvaluatorPluginCLI"

[project.entry-points."nemo.sdk"]
evals = "nemo_evals.sdk.resources:evaluator_sdk_resources"

[project.entry-points."nemo.jobs"]
"evals.evaluate" = "nemo_evals.jobs.evaluate:EvaluateJob"
"evals.agent-evaluate" = "nemo_evals.jobs.agent_evaluate:AgentEvalJob"
"evals.retrieve-eval" = "nemo_evals.jobs.retrieve_eval:RetrieveEvalJob"

[project.entry-points."nemo.skills"]
evals = "nemo_evals.skills:get_skills_path"

[project.optional-dependencies]
harbor = [
    "nhx-evals-sdk[harbor]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_evals"]


[tool.uv.sources]
filesets = { workspace = true }
nemo-agents-plugin = { workspace = true }
nhx-evals-sdk = { workspace = true }
nemo-helix-plugin = { workspace = true }
nhx-testing = { workspace = true }


[dependency-groups]
dev = ["pytest>=8.3.4", "pytest-asyncio>=0.25.3", "ruff>=0.11.8", "nhx-testing"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "integration: live service integration tests (opt-in; spin up a real platform — subprocess/docker backends — or gated by e.g. RUN_INTAKE_INTEGRATION=1); deselect with -m 'not integration'",
]

# Opt this plugin into OpenAPI spec generation
[tool.nemo.openapi]

[tool.pyright]
extraPaths = ["src"]
