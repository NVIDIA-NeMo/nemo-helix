openapi: 3.1.0
info:
  title: garak-plugin (plugin)
  version: 0.0.0
paths:
  /apis/garak-plugin/v1/healthz:
    get:
      tags:
      - Garak Plugin
      summary: Healthz
      operationId: healthz_apis_garak_plugin_v1_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Healthz Apis Garak Plugin V1 Healthz Get
  /apis/garak-plugin/v2/workspaces/{workspace}/configs:
    post:
      tags:
      - Garak Plugin Configs
      summary: Create Config
      description: Create a new scan config.
      operationId: create_config_apis_garak_plugin_v2_workspaces__workspace__configs_post
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScanConfigRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanConfigOutput'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - Garak Plugin Configs
      summary: List Configs
      description: List scan configs in the workspace with pagination and filter support.
      operationId: list_configs_apis_garak_plugin_v2_workspaces__workspace__configs_get
      parameters:
      - name: workspace
        in: path
        required: true
        schema:
          type: string
          title: Workspace
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: -created_at
          title: Sort
      - in: query
        name: filter
        style: deepObject
        required: false
        explode: true
        schema:
          $ref: '#/components/schemas/ConfigFilter'
        description: 'Filter results on various criteria. Supports bracket notation
          (?filter[field][$op]=value), JSON ({"field":{"$op":"value"}}), and text
          syntax (field:"value"). Operators: $eq (exact match), $like (substring),
          $lt, $lte, $gt, $gte (comparison), $in, $nin (set membership), $and, $or,
          $not (logical). Default operator is $eq.'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                title: Response List Configs Apis Garak Plugin V2 Workspaces  Workspace  Configs
                  Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
