components:
  schemas:
    ConfigFilter:
      additionalProperties: false
      description: Query filter for ``GET /v2/workspaces/{workspace}/configs``.
      properties:
        description:
          description: Filter to configs with this description.
          title: Description
          type: string
        project:
          description: Filter to configs in this project.
          title: Project
          type: string
        created_at:
          allOf:
          - $ref: '#/components/schemas/DatetimeFilter'
          description: Filter on creation time (supports $gte / $lte).
        updated_at:
          allOf:
          - $ref: '#/components/schemas/DatetimeFilter'
          description: Filter on last-update time (supports $gte / $lte).
      title: ConfigFilter
      type: object
    CreateScanConfigRequest:
      properties:
        name:
          type: string
          title: Name
          description: Unique config name within the workspace.
        description:
          title: Description
          description: Human-readable description.
          type: string
        system:
          $ref: '#/components/schemas/ScanSystemData'
        run:
          $ref: '#/components/schemas/ScanRunData'
        plugins:
          $ref: '#/components/schemas/ScanPluginsData'
        reporting:
          $ref: '#/components/schemas/ScanReportData'
      type: object
      required:
      - name
      title: CreateScanConfigRequest
      description: Request body for ``POST /v2/workspaces/{workspace}/configs``.
    CreateScanTargetRequest:
      properties:
        name:
          type: string
          title: Name
          description: Unique target name within the workspace.
        description:
          title: Description
          type: string
        type:
          type: string
          title: Type
          description: Target type (e.g., 'nim', 'openai').
        model:
          type: string
          title: Model
          description: Model identifier.
        options:
          additionalProperties: true
          type: object
          title: Options
      type: object
      required:
      - name
      - type
      - model
      title: CreateScanTargetRequest
      description: Request body for ``POST /v2/workspaces/{workspace}/targets``.
    DatetimeFilter:
      additionalProperties: false
      properties:
        $gte:
          description: Filter for results greater than or equal to this datetime.
          title: $Gte
          format: date-time
          type: string
        $lte:
          description: Filter for results less than or equal to this datetime.
          title: $Lte
          format: date-time
          type: string
      title: DatetimeFilter
      type: object
    FileStorageType:
      type: string
      enum:
      - fileset
      title: FileStorageType
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HelixJobListResultResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/HelixJobResultResponse'
          type: array
          title: Data
      type: object
      required:
      - data
      title: HelixJobListResultResponse
    HelixJobLog:
      properties:
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        job:
          type: string
          title: Job
        job_step:
          type: string
          title: Job Step
        job_task:
          type: string
          title: Job Task
        message:
          type: string
          title: Message
      type: object
      required:
      - timestamp
      - job
      - job_step
      - job_task
      - message
      title: HelixJobLog
    HelixJobLogPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/HelixJobLog'
          type: array
          title: Data
        total:
          type: integer
          title: Total
        next_page:
          title: Next Page
          type: string
        prev_page:
          title: Prev Page
          type: string
      type: object
      required:
      - data
      - total
      - next_page
      - prev_page
      title: HelixJobLogPage
    HelixJobResultResponse:
      properties:
        name:
          type: string
          title: Name
        job:
          type: string
          title: Job
        workspace:
          type: string
          title: Workspace
        project:
          title: Project
