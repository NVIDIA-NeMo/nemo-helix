      - created_at
      - -created_at
      - updated_at
      - -updated_at
      title: RlJobsJobsSortField
    RlLoRAParams:
      properties:
        rank:
          type: integer
          exclusiveMinimum: 0.0
          title: Rank
          description: LoRA rank (r); maps to NeMo-RL lora_cfg.dim.
          default: 16
        alpha:
          type: integer
          exclusiveMinimum: 0.0
          title: Alpha
          description: LoRA scaling factor (effective lr multiplier = alpha/rank).
          default: 32
        dropout:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Dropout
          description: LoRA dropout probability.
          default: 0.0
        target_modules:
          title: Target Modules
          description: Module names to adapt. Empty/None with match_all_linear applies
            to all linear layers.
          items:
            type: string
          type: array
        exclude_modules:
          title: Exclude Modules
          description: Module name patterns to exclude from LoRA.
          items:
            type: string
          type: array
        use_triton:
          title: Use Triton
          description: 'Use Automodel''s Triton LoRA kernels: faster, but incompatible
            with tensor_parallel_size > 1 (they take raw tensors, and TP makes the
            adapter weights DTensors). Unset lets the compiler pick -- true at TP
            1, false above. Setting it true with TP > 1 is rejected, not silently
            downgraded.'
          type: boolean
      additionalProperties: false
      type: object
      title: RlLoRAParams
      description: LoRA hyperparameters for GRPO (DTensor ``lora_cfg``). No merge-at-export.
    RlOutputRequest:
      properties:
        name:
          title: Name
          type: string
          maxLength: 255
      additionalProperties: false
      type: object
      title: RlOutputRequest
      description: Submitter-facing output preferences. ``name`` is auto-derived if
        omitted.
    RlOutputResponse:
      properties:
        name:
          type: string
          maxLength: 255
          title: Name
          examples:
          - my-dpo-llama
        type:
          allOf:
          - $ref: '#/components/schemas/OutputNameType'
          default: model
        fileset:
          type: string
          maxLength: 255
          title: Fileset
      additionalProperties: false
      type: object
      required:
      - name
      - fileset
      title: RlOutputResponse
      description: Resolved output artifact details.
    RlParallelismParams:
      properties:
        num_gpus_per_node:
          type: integer
          exclusiveMinimum: 0.0
          title: Num Gpus Per Node
          description: Number of GPUs per node.
          default: 1
        num_nodes:
          type: integer
          exclusiveMinimum: 0.0
          title: Num Nodes
          description: "Number of nodes (>1 \u2192 multi-node Ray cluster)."
          default: 1
        tensor_parallel_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Tensor Parallel Size
          description: Tensor parallel size.
          default: 1
        pipeline_parallel_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Pipeline Parallel Size
          description: Pipeline parallel size.
          default: 1
        context_parallel_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Context Parallel Size
          description: Context parallel size.
          default: 1
        expert_parallel_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Expert Parallel Size
          description: Expert parallel size for MoE models. GRPO only, and implemented
            only by policy_backend='automodel'.
          default: 1
        sequence_parallel:
          type: boolean
          title: Sequence Parallel
          description: Enable sequence parallelism.
          default: false
      additionalProperties: false
      type: object
      title: RlParallelismParams
      description: Distributed training parallelism configuration.
    RlRewardScalingParams:
      properties:
        source_min:
          type: number
          title: Source Min
          description: Low end of the incoming reward range.
          default: 0.0
        source_max:
          type: number
          title: Source Max
          description: High end of the incoming reward range.
          default: 1.0
        target_min:
          type: number
          title: Target Min
          description: Low end of the rescaled range.
          default: 0.0
        target_max:
          type: number
          title: Target Max
          description: High end of the rescaled range.
          default: 1.0
      additionalProperties: false
      type: object
      title: RlRewardScalingParams
      description: 'Linear reward rescaling (NeMo-RL ``grpo.reward_scaling``).


        Each reward is clamped to ``[source_min, source_max]`` and mapped onto

        ``[target_min, target_max]``. The DAPO recipes use it to move a binary verifier''s

        ``[0, 1]`` onto ``[-1, 1]``, so a wrong answer carries negative reward rather
        than

        merely less positive reward.'
    RlRewardShapingParams:
      properties:
        overlong_buffer_length:
          title: Overlong Buffer Length
          description: Tokens before max_response_length over which the penalty ramps
            to full.
          type: integer
          exclusiveMinimum: 0.0
        overlong_buffer_penalty:
          title: Overlong Buffer Penalty
          description: Penalty applied at the end of the buffer.
          type: number
          minimum: 0.0
        max_response_length:
          title: Max Response Length
          description: Length beyond which a response is penalised. Usually the generation
            cap.
          type: integer
          exclusiveMinimum: 0.0
        stop_properly_penalty_coef:
          title: Stop Properly Penalty Coef
          description: Scale factor on the reward of a truncated response. 0 zeroes
            it, 1 is no penalty.
          type: number
          maximum: 1.0
          minimum: 0.0
      additionalProperties: false
      type: object
      title: RlRewardShapingParams
      description: 'DAPO-style reward shaping (NeMo-RL ``grpo.reward_shaping``).


        Both penalties act on responses the generation cap cut off, which score zero
        on a

        verifier that needs a complete answer. ``overlong_*`` ramps a penalty in over
        the last

        ``overlong_buffer_length`` tokens before ``max_response_length``; ``stop_properly_penalty_coef``

        scales the reward of anything truncated outright.'
    SecretRef:
      type: string
      pattern: ^[a-z0-9_-]+(/[a-z0-9_-]+)?$
      title: SecretRef
      description: 'Reference to a secret. Format: ''secret_name'' (uses request workspace)
        or ''workspace/secret_name'' (explicit workspace).'
      examples:
      - my-secret
      - my-workspace/my-secret
    StringFilter:
      additionalProperties: false
      properties:
        $eq:
          description: Filter for results equal to this value.
          title: $Eq
          type: string
        $like:
          description: Filter for results matching this pattern.
          title: $Like
          type: string
        $in:
          description: Filter for results in this list of values.
          title: $In
          items:
            type: string
          type: array
        $nin:
          description: Filter for results not in this list of values.
          title: $Nin
          items:
            type: string
          type: array
      title: StringFilter
      type: object
    UnslothBatchSpec:
      properties:
        per_device_train_batch_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Per Device Train Batch Size
          default: 1
        gradient_accumulation_steps:
          type: integer
          exclusiveMinimum: 0.0
          title: Gradient Accumulation Steps
          default: 1
      additionalProperties: false
      type: object
      title: UnslothBatchSpec
    UnslothDatasetSpec:
      properties:
        path:
          type: string
          title: Path
          description: 'Training fileset reference: ''name'' (uses the job''s workspace)
            or ''workspace/name''. Resolved to a local path by the plugin run.'
        text_field:
          type: string
          title: Text Field
          description: Row field consumed by SFTTrainer.
          default: text
        apply_chat_template:
          type: boolean
          title: Apply Chat Template
          description: If True, expects rows with a 'messages' field and applies tokenizer.apply_chat_template
            at training time.
          default: false
        validation_path:
          title: Validation Path
          description: Optional validation fileset reference (same format as 'path').
            Downloaded under the same scheme.
          type: string
        packing:
          type: boolean
          title: Packing
          description: trl.SFTTrainer packing flag.
          default: false
      additionalProperties: false
      type: object
      required:
      - path
      title: UnslothDatasetSpec
      description: 'Training data location + shape.


        ``path`` and ``validation_path`` are platform fileset references

        (``"name"`` or ``"workspace/name"``). The plugin''s run downloads

        each fileset before training; ``train_sft`` only ever sees a local

        filesystem path.'
    UnslothDeploymentParams:
      properties:
        gpu:
          type: integer
          title: Gpu
          description: Number of GPUs required for the deployment.
          default: 1
        additional_envs:
          title: Additional Envs
          description: Additional environment variables for the deployment.
          additionalProperties:
            type: string
          type: object
        disk_size:
          title: Disk Size
          description: Disk size for the deployment.
          type: string
        image_name:
          title: Image Name
          description: Container image name from NGC. If not specified, defaults to
            multi-llm.
          type: string
        image_tag:
          title: Image Tag
          description: Container image tag from NGC.
          type: string
        lora_enabled:
          type: boolean
          title: Lora Enabled
          description: When auto-deploying a full SFT training, setting this true
            allows subsequent LoRA adapters to be deployed against it.
          default: true
        tool_call_config:
          allOf:
          - $ref: '#/components/schemas/UnslothToolCallParams'
          description: Tool calling configuration override for the NIM deployment.
      additionalProperties: false
      type: object
      title: UnslothDeploymentParams
      description: 'Inline deployment parameters for auto-deploying a trained model.


        Used in :class:`UnslothJobInput.deployment_config` and passed through to

        the model_entity task at compile time. When unset, no deployment is launched.'
    UnslothHardwareSpec:
      properties:
        gpus:
          title: Gpus
          description: Comma-separated GPU indices ('0' or '0,1') for CUDA_VISIBLE_DEVICES.
            Selection, not reservation.
          type: string
        precision:
          type: string
          enum:
          - bf16
          - fp16
          title: Precision
          description: Mixed-precision dtype for training. bf16 recommended for Ampere+.
          default: bf16
      additionalProperties: false
      type: object
      title: UnslothHardwareSpec
    UnslothJobInput:
      properties:
        name:
          title: Name
