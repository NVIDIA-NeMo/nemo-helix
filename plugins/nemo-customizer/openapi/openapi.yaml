components:
  schemas:
    AutomodelBatchSpec:
      properties:
        global_batch_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Global Batch Size
          default: 8
        micro_batch_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Micro Batch Size
          default: 1
        sequence_packing:
          type: boolean
          title: Sequence Packing
          default: false
        sequence_packing_max_samples:
          type: integer
          exclusiveMinimum: 0.0
          title: Sequence Packing Max Samples
          description: Samples analyzed to estimate the optimal pack size when packing
            is enabled.
          default: 1000
      additionalProperties: false
      type: object
      title: AutomodelBatchSpec
    AutomodelDatasetSpec:
      properties:
        training:
          type: string
          title: Training
          description: Training fileset as 'name' or 'workspace/name'.
        validation:
          title: Validation
          type: string
        prompt_template:
          title: Prompt Template
          type: string
      additionalProperties: false
      type: object
      required:
      - training
      title: AutomodelDatasetSpec
    AutomodelEmbeddingSpec:
      properties:
        train_n_passages:
          type: integer
          minimum: 2.0
          title: Train N Passages
          default: 5
        eval_negative_size:
          title: Eval Negative Size
          type: integer
          minimum: 1.0
        do_gradient_checkpointing:
          type: boolean
          title: Do Gradient Checkpointing
          default: false
        query_max_length:
          type: integer
          minimum: 1.0
          title: Query Max Length
          default: 512
        passage_max_length:
          type: integer
          minimum: 1.0
          title: Passage Max Length
          default: 512
        query_prefix:
          type: string
          title: Query Prefix
          description: Collator-side prefix; BiEncoderCollator adds a space.
          default: 'query:'
        passage_prefix:
          type: string
          title: Passage Prefix
          description: Collator-side prefix; BiEncoderCollator adds a space.
          default: 'passage:'
      additionalProperties: false
      type: object
      title: AutomodelEmbeddingSpec
      description: Collator and dataset knobs for bi_encoder / cross_encoder recipes.
    AutomodelJobInput:
      properties:
        name:
          title: Name
          type: string
        model:
          type: string
          title: Model
        dataset:
          $ref: '#/components/schemas/AutomodelDatasetSpec'
        training:
          $ref: '#/components/schemas/AutomodelTrainingSpec'
        schedule:
          $ref: '#/components/schemas/AutomodelScheduleSpec'
        batch:
          $ref: '#/components/schemas/AutomodelBatchSpec'
        optimizer:
          $ref: '#/components/schemas/AutomodelOptimizerSpec'
        parallelism:
          $ref: '#/components/schemas/AutomodelParallelismSpec'
        output:
          $ref: '#/components/schemas/AutomodelOutputRequest'
        integrations:
          $ref: '#/components/schemas/IntegrationsSpec'
      additionalProperties: false
      type: object
      required:
      - model
      - dataset
      - training
      title: AutomodelJobInput
      description: POST body / CLI JSON.
    AutomodelJobOutput:
      properties:
        name:
          title: Name
          type: string
        model:
          type: string
          title: Model
        dataset:
          $ref: '#/components/schemas/AutomodelDatasetSpec'
        training:
          $ref: '#/components/schemas/AutomodelTrainingSpec'
        schedule:
          $ref: '#/components/schemas/AutomodelScheduleSpec'
        batch:
          $ref: '#/components/schemas/AutomodelBatchSpec'
        optimizer:
          $ref: '#/components/schemas/AutomodelOptimizerSpec'
        parallelism:
          $ref: '#/components/schemas/AutomodelParallelismSpec'
        output:
          $ref: '#/components/schemas/AutomodelOutputResponse'
        integrations:
          $ref: '#/components/schemas/IntegrationsSpec'
      additionalProperties: false
      type: object
      required:
      - model
      - dataset
      - training
      - schedule
      - batch
      - optimizer
      - parallelism
      - output
      title: AutomodelJobOutput
      description: Stored canonical spec after ``to_spec()``.
    AutomodelJobsJob:
      properties:
        id:
          title: Id
          type: string
        name:
          type: string
          title: Name
        description:
          title: Description
          type: string
        project:
          title: Project
          type: string
        workspace:
          title: Workspace
          type: string
        created_at:
          title: Created At
          type: string
          format: date-time
        updated_at:
          title: Updated At
          type: string
          format: date-time
        spec:
          $ref: '#/components/schemas/AutomodelJobOutput'
        status:
          $ref: '#/components/schemas/PlatformJobStatus'
        status_details:
          title: Status Details
          additionalProperties: true
          type: object
        error_details:
          title: Error Details
          additionalProperties: true
          type: object
        ownership:
          title: Ownership
          additionalProperties: true
          type: object
        custom_fields:
          title: Custom Fields
          additionalProperties: true
          type: object
      type: object
      required:
      - name
      - spec
      title: AutomodelJobsJob
    AutomodelJobsJobRequest:
      properties:
        name:
          title: Name
          type: string
        description:
          title: Description
          type: string
        project:
          title: Project
          type: string
        spec:
          $ref: '#/components/schemas/AutomodelJobInput'
        profile:
          title: Profile
          type: string
        options:
          title: Options
          additionalProperties: true
          type: object
        ownership:
          title: Ownership
          additionalProperties: true
          type: object
        custom_fields:
          title: Custom Fields
          additionalProperties: true
          type: object
        output_location:
          title: Output Location
          type: string
      type: object
      required:
      - spec
      title: AutomodelJobsJobRequest
    AutomodelJobsJobsListFilter:
      additionalProperties: false
      properties:
        created_at:
          allOf:
          - $ref: '#/components/schemas/DatetimeFilter'
          description: Jobs created at 'gte' datetime or 'lte' datetime.
        name:
          anyOf:
          - $ref: '#/components/schemas/StringFilter'
          - type: string
          description: Name of the job.
          title: Name
        workspace:
          description: Workspace of the job.
          title: Workspace
          type: string
        project:
          description: Project containing the job.
          title: Project
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/PlatformJobStatus'
          description: The current status.
        spec:
          description: Filter on a path within the job's spec, e.g. `spec.target.format`.
          title: Spec
          additionalProperties: true
          type: object
        updated_at:
          allOf:
          - $ref: '#/components/schemas/DatetimeFilter'
          description: Jobs updated at 'gte' datetime or 'lte' datetime.
      title: AutomodelJobsJobsListFilter
      type: object
    AutomodelJobsJobsPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/AutomodelJobsJob'
          type: array
          title: Data
        pagination:
          allOf:
          - $ref: '#/components/schemas/PaginationData'
          description: Pagination information.
        sort:
          title: Sort
          description: The field on which the results are sorted.
          type: string
        filter:
          title: Filter
          description: Filtering information.
          additionalProperties: true
          type: object
      type: object
      required:
      - data
      title: AutomodelJobsJobsPage
    AutomodelJobsJobsSortField:
      type: string
      enum:
      - created_at
      - -created_at
      - updated_at
      - -updated_at
      title: AutomodelJobsJobsSortField
    AutomodelLoRAParams:
      properties:
        rank:
          type: integer
          exclusiveMinimum: 0.0
          title: Rank
          default: 16
        alpha:
          type: integer
          exclusiveMinimum: 0.0
          title: Alpha
          default: 32
        dropout:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Dropout
          description: LoRA dropout probability for regularization.
          default: 0.0
        merge:
          type: boolean
          title: Merge
          default: false
        target_modules:
          title: Target Modules
          items:
            type: string
          type: array
        exclude_modules:
          title: Exclude Modules
          description: Module name patterns to exclude from LoRA (e.g. ['*.out_proj']).
          items:
            type: string
          type: array
        use_triton:
          type: boolean
          title: Use Triton
          description: Use the optimized Triton LoRA kernel.
          default: true
      additionalProperties: false
      type: object
      title: AutomodelLoRAParams
    AutomodelOptimizerSpec:
      properties:
        learning_rate:
          type: number
          exclusiveMinimum: 0.0
          title: Learning Rate
          default: 5.0e-06
        min_learning_rate:
          title: Min Learning Rate
          description: Minimum learning rate for the cosine decay schedule.
          type: number
          minimum: 0.0
        weight_decay:
          type: number
          minimum: 0.0
          title: Weight Decay
          default: 0.01
        adam_beta1:
          type: number
          exclusiveMaximum: 1.0
          minimum: 0.0
          title: Adam Beta1
          description: Adam optimizer beta1.
          default: 0.9
        adam_beta2:
          type: number
          exclusiveMaximum: 1.0
          minimum: 0.0
          title: Adam Beta2
          description: Adam optimizer beta2.
          default: 0.999
        warmup_steps:
          type: integer
          minimum: 0.0
          title: Warmup Steps
          default: 0
        adam_eps:
          type: number
          exclusiveMinimum: 0.0
          title: Adam Eps
          description: Adam/AdamW epsilon for numerical stability.
          default: 1.0e-08
        optimizer:
          type: string
          enum:
          - auto
          - Adam
          - AdamW
          - FusedAdam
          title: Optimizer
          description: Optimizer algorithm. 'auto' selects Transformer Engine FusedAdam
            for retrieval recipes and torch Adam for SFT.
          default: auto
        lr_decay_style:
          type: string
          enum:
          - cosine
          - linear
          - constant
          title: Lr Decay Style
          description: Learning-rate decay schedule.
          default: cosine
      additionalProperties: false
      type: object
      title: AutomodelOptimizerSpec
    AutomodelOutputRequest:
      properties:
        name:
          type: string
          title: Name
        description:
          title: Description
          type: string
      additionalProperties: false
      type: object
      required:
      - name
      title: AutomodelOutputRequest
    AutomodelOutputResponse:
      properties:
        name:
          type: string
          title: Name
        type:
          type: string
          enum:
          - model
          - adapter
          title: Type
        fileset:
          type: string
          title: Fileset
        description:
          title: Description
          type: string
      additionalProperties: false
      type: object
      required:
      - name
      - type
      - fileset
      title: AutomodelOutputResponse
    AutomodelParallelismSpec:
      properties:
        num_nodes:
          type: integer
          exclusiveMinimum: 0.0
          title: Num Nodes
          default: 1
        num_gpus_per_node:
          type: integer
          exclusiveMinimum: 0.0
          title: Num Gpus Per Node
          default: 1
        tensor_parallel_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Tensor Parallel Size
          default: 1
        pipeline_parallel_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Pipeline Parallel Size
          default: 1
        context_parallel_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Context Parallel Size
          default: 1
        expert_parallel_size:
          title: Expert Parallel Size
          type: integer
          exclusiveMinimum: 0.0
        sequence_parallel:
          type: boolean
          title: Sequence Parallel
          description: Enable sequence parallelism.
          default: false
      additionalProperties: false
      type: object
      title: AutomodelParallelismSpec
    AutomodelScheduleSpec:
      properties:
        epochs:
          type: integer
          exclusiveMinimum: 0.0
          title: Epochs
          default: 1
        max_steps:
          title: Max Steps
          type: integer
          exclusiveMinimum: 0.0
        val_check_interval:
          title: Val Check Interval
          type: number
        seed:
          title: Seed
          type: integer
        progress_reporting:
          $ref: '#/components/schemas/ProgressReportingConfig'
      additionalProperties: false
      type: object
      title: AutomodelScheduleSpec
    AutomodelTrainingSpec:
      properties:
        training_type:
          type: string
          enum:
          - sft
          - distillation
          title: Training Type
          default: sft
        recipe:
          type: string
          enum:
          - auto
          - sft
          - bi_encoder
          - cross_encoder
          title: Recipe
          description: Training recipe. 'auto' uses the model checkpoint head; explicit
            encoder recipes can wrap a causal-LM backbone for retrieval training.
          default: auto
        finetuning_type:
          type: string
          enum:
          - lora
          - all_weights
          - lora_merged
          title: Finetuning Type
          default: lora
        lora:
          $ref: '#/components/schemas/AutomodelLoRAParams'
        max_seq_length:
          type: integer
          exclusiveMinimum: 0.0
          title: Max Seq Length
          default: 2048
        precision:
          title: Precision
          description: Model precision for training. Auto-detected from the checkpoint
            when unset.
          type: string
          enum:
          - bf16
          - fp16
          - fp32
          - fp8
        attn_implementation:
          type: string
          enum:
          - sdpa
          - flash_attention_2
          - eager
          title: Attn Implementation
          description: 'Attention backend: ''sdpa'' (PyTorch native), ''flash_attention_2'',
            or ''eager''.'
          default: sdpa
        execution_profile:
          title: Execution Profile
          type: string
          minLength: 1
        teacher_model:
          title: Teacher Model
          type: string
        distillation_ratio:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Distillation Ratio
          default: 0.5
        distillation_temperature:
          type: number
          exclusiveMinimum: 0.0
          title: Distillation Temperature
          default: 1.0
        teacher_precision:
          type: string
          enum:
          - bf16
          - fp16
          - fp32
          title: Teacher Precision
          default: bf16
        offload_teacher:
          type: boolean
          title: Offload Teacher
          default: false
        embedding:
          allOf:
          - $ref: '#/components/schemas/AutomodelEmbeddingSpec'
          description: Retrieval collator/dataset knobs. Used when recipe is bi_encoder
            or cross_encoder.
      additionalProperties: false
      type: object
      title: AutomodelTrainingSpec
    BatchingStrategy:
      type: string
      enum:
      - static
      - dynamic
      - sequence_packing
      title: BatchingStrategy
      description: 'How the trainer groups rollouts into micro-batches.


        One enum, not two flags: NeMo-RL asserts the modes are mutually exclusive
        in

        ``lm_policy`` and ``BatchedDataDict.shard_by_batch_size``.'
    DatetimeFilter:
      additionalProperties: false
      properties:
        $gte:
          description: Filter for results greater than or equal to this datetime.
          title: $Gte
          format: date-time
          type: string
        $lte:
          description: Filter for results less than or equal to this datetime.
          title: $Lte
          format: date-time
          type: string
      title: DatetimeFilter
      type: object
    FileStorageType:
      type: string
      enum:
      - fileset
      title: FileStorageType
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    IntegrationsSpec:
      properties:
        wandb:
          allOf:
          - $ref: '#/components/schemas/WandbIntegration'
          description: Weights & Biases integration configuration.
        mlflow:
          allOf:
          - $ref: '#/components/schemas/MlflowIntegration'
          description: MLflow integration configuration.
      additionalProperties: false
      type: object
      title: IntegrationsSpec
      description: 'Third-party experiment-tracking integrations for a job spec.


        Each integration is requested by presence: omit or set a field to ``null``
        to

        disable it. Activation at training time still requires credentials/URIs

        (see compile-time warnings and runtime builders).'
    MlflowIntegration:
      properties:
        experiment_name:
          title: Experiment Name
          description: MLflow experiment name (groups related runs). Defaults to output.name
            if not set.
          type: string
        name:
          title: Name
          description: MLflow run name. Defaults to job_id if not provided.
          type: string
        tags:
          title: Tags
          description: MLflow tags as key-value pairs for filtering runs.
          additionalProperties:
            type: string
          type: object
        description:
          title: Description
          description: MLflow run description.
          type: string
        tracking_uri:
          title: Tracking Uri
          description: MLflow tracking server URI (e.g., 'http://mlflow.mycompany.com:5000').
            Can also be set via MLFLOW_TRACKING_URI environment variable.
          type: string
      additionalProperties: false
      type: object
      title: MlflowIntegration
      description: 'MLflow integration configuration.


        To enable MLflow, provide a non-null ``mlflow`` object on :class:`IntegrationsSpec`.'
    OptimizerType:
      type: string
      enum:
      - adamw_with_cosine_annealing
      - adam_with_cosine_annealing
      - adamw_with_flat_lr
      - adam_with_flat_lr
      title: OptimizerType
      description: Optimizer and scheduler combination types.
    OutputNameType:
      type: string
      enum:
      - adapter
      - model
      title: OutputNameType
      description: "Output artifact type \u2014 adapter (LoRA only) or model (merged\
        \ / full)."
    PaginationData:
      properties:
        page:
          type: integer
          title: Page
          description: The current page number.
        page_size:
          type: integer
          title: Page Size
          description: The page size used for the query.
        current_page_size:
          type: integer
          title: Current Page Size
          description: The size for the current page.
        total_pages:
          type: integer
          title: Total Pages
          description: The total number of pages.
        total_results:
          type: integer
          title: Total Results
          description: The total number of results.
      type: object
      required:
      - page
      - page_size
      - current_page_size
      - total_pages
      - total_results
      title: PaginationData
    PlatformJobListResultResponse:
      properties:
        data:
          items:
            $ref: '#/components/schemas/PlatformJobResultResponse'
          type: array
          title: Data
      type: object
      required:
      - data
      title: PlatformJobListResultResponse
    PlatformJobLog:
      properties:
        timestamp:
          type: string
          format: date-time
          title: Timestamp
        job:
          type: string
          title: Job
        job_step:
          type: string
          title: Job Step
        job_task:
          type: string
          title: Job Task
        message:
          type: string
          title: Message
      type: object
      required:
      - timestamp
      - job
      - job_step
      - job_task
      - message
      title: PlatformJobLog
    PlatformJobLogPage:
      properties:
        data:
          items:
            $ref: '#/components/schemas/PlatformJobLog'
          type: array
          title: Data
        total:
          type: integer
          title: Total
        next_page:
          title: Next Page
          type: string
        prev_page:
          title: Prev Page
          type: string
      type: object
      required:
      - data
      - total
      - next_page
      - prev_page
      title: PlatformJobLogPage
    PlatformJobResultResponse:
      properties:
        name:
          type: string
          title: Name
        job:
          type: string
          title: Job
        workspace:
          type: string
          title: Workspace
        project:
          title: Project
          type: string
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        artifact_url:
          type: string
          title: Artifact Url
        artifact_storage_type:
          $ref: '#/components/schemas/FileStorageType'
        download_url:
          title: Download Url
          type: string
      type: object
      required:
      - name
      - job
      - workspace
      - artifact_url
      - artifact_storage_type
      title: PlatformJobResultResponse
    PlatformJobStatus:
      type: string
      enum:
      - created
      - pending
      - active
      - cancelled
      - cancelling
      - error
      - completed
      - paused
      - pausing
      - resuming
      title: PlatformJobStatus
      description: 'Enumeration of possible job statuses.


        This enum represents the various states a job can be in during its lifecycle,

        from creation to a terminal state.'
    PlatformJobStatusResponse:
      properties:
        id:
          type: string
          title: Id
        name:
          type: string
          title: Name
        status:
          $ref: '#/components/schemas/PlatformJobStatus'
        status_details:
          additionalProperties: true
          type: object
          title: Status Details
        error_details:
          title: Error Details
          additionalProperties: true
          type: object
        steps:
          items:
            $ref: '#/components/schemas/PlatformJobStepStatusResponse'
          type: array
          title: Steps
        created_at:
          type: string
          format: date-time
