    PolicyBackend:
      type: string
      enum:
      - dtensor
      - automodel
      title: PolicyBackend
      description: 'Which NeMo-RL policy worker trains the model.


        The value picks the worker class, which picks the Ray actor''s venv and kernels.

        Asking for a capability the backend lacks is a validation error, not a silent
        upgrade.'
    ProgressReportingConfig:
      properties:
        min_report_interval_seconds:
          type: number
          minimum: 0.0
          title: Min Report Interval Seconds
          description: Least number of seconds between progress reports reaching the
            Jobs service. Every metric the training library logs is still recorded
            at full resolution -- this only buffers them in memory and decides how
            often the accumulated set is sent, which is what the reporting actually
            costs. 0 sends a report for every step the library logs. Raising it reduces
            the time training spends blocked on reporting, at the cost of a progress
            bar and charts that update less often.
          default: 10.0
        time_series_metrics:
          title: Time Series Metrics
          description: 'Which metrics are recorded as a time series, named exactly
            as they appear in the job''s status details and so qualified by phase:
            ''train_loss'', ''val_accuracy''. Glob patterns are accepted, so ''*_loss''
            covers every loss on both phases and ''*'' records everything. Omit the
            field to take the backend''s default, which keeps the loss, learning rate
            and gradient norm. Every metric the run produces is reported either way
            -- one not matched here is still sent as a current value on every report,
            it simply has no history, so a throughput counter like ''train_tps'' costs
            one number rather than several hundred. The job log names what was matched
            and what was not.'
          items:
            type: string
          type: array
      additionalProperties: false
      type: object
      title: ProgressReportingConfig
      description: 'How a training job reports its progress to the Jobs service.


        Two controls over what lands in the job''s status details: how often an update

        is sent, and which metrics keep a full history rather than just their latest

        value. Both have defaults that suit most jobs.'
    RlDPOTraining:
      properties:
        optimizer_type:
          allOf:
          - $ref: '#/components/schemas/OptimizerType'
          description: "Optimizer + LR-scheduler combination (AdamW/Adam \xD7 cosine-annealing/flat-LR).\
            \ Defaults to AdamW with cosine annealing."
        learning_rate:
          type: number
          exclusiveMinimum: 0.0
          title: Learning Rate
          description: Peak learning rate.
          default: 0.0001
        min_learning_rate:
          title: Min Learning Rate
          description: Minimum LR for cosine decay.
          type: number
          minimum: 0.0
        weight_decay:
          type: number
          minimum: 0.0
          title: Weight Decay
          description: Weight decay coefficient.
          default: 0.01
        adam_beta1:
          type: number
          exclusiveMaximum: 1.0
          minimum: 0.0
          title: Adam Beta1
          description: Adam beta1.
          default: 0.9
        adam_beta2:
          type: number
          exclusiveMaximum: 1.0
          minimum: 0.0
          title: Adam Beta2
          description: Adam beta2.
          default: 0.999
        adam_eps:
          type: number
          exclusiveMinimum: 0.0
          title: Adam Eps
          description: Adam epsilon (numerical stability term).
          default: 1.0e-05
        warmup_steps:
          type: integer
          minimum: 0.0
          title: Warmup Steps
          description: Linear warmup steps.
          default: 0
        epochs:
          type: integer
          exclusiveMinimum: 0.0
          title: Epochs
          description: Number of passes through the dataset.
          default: 1
        max_steps:
          title: Max Steps
          description: Max training steps (overrides epochs if set).
          type: integer
          exclusiveMinimum: 0.0
        val_check_interval:
          title: Val Check Interval
          description: Validation interval. Float <= 1.0 is fraction of epoch; > 1.0
            is step count.
          type: number
        val_at_end:
          type: boolean
          title: Val At End
          description: Run a final validation pass after the last training step. Keep
            enabled so the final checkpoint carries validation metrics and best-checkpoint
            selection works; set False only to skip the extra eval. GRPO ignores this
            when the dataset ships no validation.jsonl.
          default: true
        progress_reporting:
          $ref: '#/components/schemas/ProgressReportingConfig'
        keep_top_k:
          type: integer
          exclusiveMinimum: 0.0
          title: Keep Top K
          description: Number of best checkpoints to retain (ranked by validation
            loss).
          default: 1
        batch_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Batch Size
          description: Global batch size across all GPUs.
          default: 32
        micro_batch_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Micro Batch Size
          description: Per-GPU micro batch size.
          default: 1
        activation_checkpointing:
          type: boolean
          title: Activation Checkpointing
          description: Recompute activations during the backward pass to reduce memory
            at the cost of compute. Enable to fit larger models or longer sequences.
          default: false
        max_seq_length:
          type: integer
          exclusiveMinimum: 0.0
          title: Max Seq Length
          description: Maximum token sequence length for training.
          default: 2048
        seed:
          title: Seed
          description: Random seed for reproducibility.
          type: integer
        parallelism:
          $ref: '#/components/schemas/RlParallelismParams'
        execution_profile:
          title: Execution Profile
          description: Execution profile for the GPU training step (operator-configured).
            Falls back to the service default when omitted.
          type: string
          minLength: 1
        type:
          type: string
          const: dpo
          title: Type
        ref_policy_kl_penalty:
          type: number
          minimum: 0.0
          title: Ref Policy Kl Penalty
          description: KL penalty coefficient (beta in the DPO paper).
          default: 0.05
        preference_average_log_probs:
          type: boolean
          title: Preference Average Log Probs
          description: Average log probabilities for preference loss calculation.
          default: false
        sft_average_log_probs:
          type: boolean
          title: Sft Average Log Probs
          description: Average log probabilities for SFT regularization loss.
          default: false
        preference_loss_weight:
          type: number
          minimum: 0.0
          title: Preference Loss Weight
          description: Weight for the preference (DPO) loss term.
          default: 1.0
        sft_loss_weight:
          type: number
          minimum: 0.0
          title: Sft Loss Weight
          description: Weight for SFT regularization loss (0 = disabled).
          default: 0.0
        max_grad_norm:
          type: number
          minimum: 0.0
          title: Max Grad Norm
          description: Maximum gradient norm for clipping.
          default: 1.0
      additionalProperties: false
      type: object
      required:
      - type
      title: RlDPOTraining
      description: "Direct Preference Optimization (full-weight only \u2014 PEFT unsupported)."
    RlGRPOTraining:
      properties:
        optimizer_type:
          allOf:
          - $ref: '#/components/schemas/OptimizerType'
          description: "Optimizer + LR-scheduler combination (AdamW/Adam \xD7 cosine-annealing/flat-LR).\
            \ Defaults to AdamW with cosine annealing."
        learning_rate:
          type: number
          exclusiveMinimum: 0.0
          title: Learning Rate
          description: Peak learning rate.
          default: 0.0001
        min_learning_rate:
          title: Min Learning Rate
          description: Minimum LR for cosine decay.
          type: number
          minimum: 0.0
        weight_decay:
          type: number
          minimum: 0.0
          title: Weight Decay
          description: Weight decay coefficient.
          default: 0.01
        adam_beta1:
          type: number
          exclusiveMaximum: 1.0
          minimum: 0.0
          title: Adam Beta1
          description: Adam beta1.
          default: 0.9
        adam_beta2:
          type: number
          exclusiveMaximum: 1.0
          minimum: 0.0
          title: Adam Beta2
          description: Adam beta2.
          default: 0.999
        adam_eps:
          type: number
          exclusiveMinimum: 0.0
          title: Adam Eps
          description: Adam epsilon (numerical stability term).
          default: 1.0e-05
        warmup_steps:
          type: integer
          minimum: 0.0
          title: Warmup Steps
          description: Linear warmup steps.
          default: 0
        epochs:
          type: integer
          exclusiveMinimum: 0.0
          title: Epochs
          description: Number of passes through the dataset.
          default: 1
        max_steps:
          title: Max Steps
          description: Max training steps (overrides epochs if set).
          type: integer
          exclusiveMinimum: 0.0
        val_check_interval:
          title: Val Check Interval
          description: Validation interval. Float <= 1.0 is fraction of epoch; > 1.0
            is step count.
          type: number
        val_at_end:
          type: boolean
          title: Val At End
          description: Run a final validation pass after the last training step. Keep
            enabled so the final checkpoint carries validation metrics and best-checkpoint
            selection works; set False only to skip the extra eval. GRPO ignores this
            when the dataset ships no validation.jsonl.
          default: true
        progress_reporting:
          $ref: '#/components/schemas/ProgressReportingConfig'
        keep_top_k:
          type: integer
          exclusiveMinimum: 0.0
          title: Keep Top K
          description: Number of best checkpoints to retain (ranked by validation
            loss).
          default: 1
        batch_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Batch Size
          description: Global batch size across all GPUs.
          default: 32
        micro_batch_size:
          type: integer
          exclusiveMinimum: 0.0
          title: Micro Batch Size
          description: Per-GPU micro batch size.
          default: 1
        activation_checkpointing:
          type: boolean
          title: Activation Checkpointing
          description: Recompute activations during the backward pass to reduce memory
            at the cost of compute. Enable to fit larger models or longer sequences.
          default: false
        max_seq_length:
          type: integer
          exclusiveMinimum: 0.0
          title: Max Seq Length
          description: Maximum token sequence length for training.
          default: 2048
        seed:
          title: Seed
          description: Random seed for reproducibility.
          type: integer
        parallelism:
          $ref: '#/components/schemas/RlParallelismParams'
        execution_profile:
          title: Execution Profile
          description: Execution profile for the GPU training step (operator-configured).
            Falls back to the service default when omitted.
          type: string
          minLength: 1
        type:
          type: string
          const: grpo
          title: Type
        finetuning_type:
          type: string
          enum:
          - all_weights
          - lora
          title: Finetuning Type
          description: Full-weight GRPO or LoRA adapter training. lora_merged is not
            supported.
          default: all_weights
        lora:
          allOf:
          - $ref: '#/components/schemas/RlLoRAParams'
          description: LoRA hyperparameters. Defaults applied when finetuning_type
            is lora.
        policy_backend:
          allOf:
          - $ref: '#/components/schemas/PolicyBackend'
          description: NeMo-RL policy worker that trains the model. `lora` requires
            `automodel` (NeMo Automodel + Transformer Engine, Hopper or newer; the
            only backend with expert parallelism and automodel_kwargs). `all_weights`
            defaults to `dtensor` (stock HuggingFace on PyTorch FSDP2, also the pre-Hopper
            option) and may be set to `automodel` for a consolidated HuggingFace export.
            Omit it to get the default for the finetuning type.
        v4_compatible:
          type: boolean
          title: V4 Compatible
          description: Keep the base checkpoint's transformers-v4 config.json on the
            trained export. The platform's vLLM cannot read the v5 config Automodel
            otherwise writes. Set false to export that v5 config instead.
          default: true
        val_at_start:
          type: boolean
          title: Val At Start
          description: 'Run a validation pass before the first training step. Enable
            it to measure uplift: the baseline and the trained result then come from
            one job, on the same data with the same generation settings, instead of
            a separate baseline run that has to be kept in sync. Off by default because
            a GRPO baseline costs a full rollout pass. Ignored when the dataset ships
            no validation.jsonl. DPO always validates at step 0 and has no such knob,
            since its validation needs no generation.'
          default: false
        num_generations_per_prompt:
          type: integer
          exclusiveMinimum: 0.0
          title: Num Generations Per Prompt
          description: 'Group size: rollouts sampled per prompt, used for relative
            advantages.'
          default: 8
        num_prompts_per_step:
          title: Num Prompts Per Step
          description: Prompts sampled per training step. Derived from batch_size
            / num_generations_per_prompt when omitted; the product of the two must
            be a multiple of batch_size.
          type: integer
          exclusiveMinimum: 0.0
        temperature:
          type: number
          maximum: 2.0
          exclusiveMinimum: 0.0
          title: Temperature
          description: 'Sampling temperature for rollout generation. Must be greater
            than 0: GRPO''s advantage is the spread of rewards inside a prompt group,
            so greedy sampling makes every rollout in a group identical, the spread
            zero, and the whole run a no-op. Applies to validation rollouts too, which
            are generated with the same settings.'
          default: 1.0
        max_new_tokens:
          title: Max New Tokens
          description: 'Cap on tokens generated per rollout turn. Defaults to max_seq_length,
            which lets a rollout run until the context is exhausted; vLLM clamps it
            to whatever the prompt leaves. Cannot exceed max_seq_length. NOTE: NeMo
            Gym''s verifiers_agent does not yet honour this -- it reads max_tokens
            from its own environment config and drops the per-row value, so the effective
            cap is min(agent max_tokens, max_seq_length - prompt_len). Until that
            is fixed, bound response length through max_seq_length or the environment''s
            own max_tokens.'
          type: integer
          exclusiveMinimum: 0.0
        top_k:
          title: Top K
          description: 'Restrict rollout sampling to the k most likely tokens at each
            step. Omit to sample from the full distribution, which is what standard
            GRPO does. Narrowing this has the same risk as lowering temperature: the
            rollouts in a prompt group become more alike, and GRPO learns from how
            much they differ.'
          type: integer
          exclusiveMinimum: 0.0
        normalize_rewards:
          type: boolean
          title: Normalize Rewards
          description: Divide each group's advantages by their standard deviation.
          default: true
        use_leave_one_out_baseline:
          type: boolean
          title: Use Leave One Out Baseline
          description: Compare each rollout against the mean of the *other* rollouts
            in its group rather than against the group mean including itself. Excluding
            a rollout from its own baseline removes the bias that comparing it to
            itself introduces.
          default: true
        advantage_clip_low:
          title: Advantage Clip Low
          description: Lower bound applied to advantages after normalization. Omit
            for no bound. Bounding both ends limits how much one unusual rollout can
            move the policy.
          type: number
        advantage_clip_high:
          title: Advantage Clip High
          description: Upper bound applied to advantages after normalization. Omit
            for no bound.
          type: number
        overlong_filtering:
          type: boolean
          title: Overlong Filtering
          description: Zero the loss contribution of rollouts truncated by the generation
            limit. Enable when a low max_new_tokens truncates many rollouts, so the
            policy is not penalised for responses it was cut off from finishing.
          default: false
        max_rollout_turns:
          type: integer
          exclusiveMinimum: 0.0
          title: Max Rollout Turns
          description: Maximum agent turns per rollout. Single-turn environments use
            1.
          default: 1
        ref_policy_kl_penalty:
          type: number
          minimum: 0.0
          title: Ref Policy Kl Penalty
          description: KL penalty coefficient against the reference policy.
          default: 0.0
        ratio_clip_min:
          type: number
          minimum: 0.0
          title: Ratio Clip Min
          description: Lower PPO-style importance ratio clip bound.
          default: 0.2
        ratio_clip_max:
          type: number
          minimum: 0.0
          title: Ratio Clip Max
          description: Upper PPO-style importance ratio clip bound.
          default: 0.28
        ratio_clip_c:
          title: Ratio Clip C
          description: Dual-clip bound. Puts a floor under the loss for tokens whose
            advantage is negative, so a single badly-scored rollout cannot dominate
            the update. Must be greater than 1; 3 is the usual choice. Omit to leave
            dual clipping off.
          type: number
          exclusiveMinimum: 1.0
        use_on_policy_kl_approximation:
          type: boolean
          title: Use On Policy Kl Approximation
          description: Estimate the KL term against the policy that generated the
            rollouts rather than the one currently training. The two differ once a
            rollout batch is reused across several optimizer steps.
          default: true
        use_importance_sampling_correction:
          type: boolean
          title: Use Importance Sampling Correction
          description: Reweight each token by how much more or less likely the training
            policy is to produce it than the rollout policy was. Corrects for the
            drift that builds up when a rollout batch is reused, at the cost of higher
            variance.
          default: true
        max_grad_norm:
          type: number
          minimum: 0.0
          title: Max Grad Norm
          description: Maximum gradient norm for clipping.
          default: 1.0
        truncated_importance_sampling_type:
          title: Truncated Importance Sampling Type
          description: 'Bound the rollout-vs-training importance weights, so a policy
            that has drifted from the one that generated the batch cannot dominate
            the update. Watch `token_mult_prob_error`: a value climbing past ~1.05
            is the drift this corrects. `tis` clamps weights into the range; `icepop`
            zeroes out-of-range tokens (reference bounds 0.5-5); `seq-mask-tis` zeroes
            whole sequences by their geometric-mean ratio (reference bounds 0.999-1.002).
            None leaves it off, which is NeMo-RL''s default.'
          type: string
          enum:
          - tis
          - icepop
          - seq-mask-tis
        truncated_importance_sampling_ratio:
          title: Truncated Importance Sampling Ratio
          description: Upper bound on the importance weight. Required whenever `truncated_importance_sampling_type`
            is set.
          type: number
          exclusiveMinimum: 0.0
        truncated_importance_sampling_ratio_min:
          title: Truncated Importance Sampling Ratio Min
          description: Lower bound on the importance weight. Required for `icepop`
            and `seq-mask-tis`; optional for `tis`, which floors at 0 when unset.
          type: number
          minimum: 0.0
        use_dynamic_sampling:
          type: boolean
          title: Use Dynamic Sampling
          description: Discard prompt groups whose rewards have zero standard deviation,
            and keep generating until the step has a full batch of groups that do
            not. Those groups contribute exactly no gradient, so on a dataset the
            model finds too hard (or too easy) most of a step is otherwise wasted
            -- watch `baseline_reward/pct_mixed` for how much. Costs roughly `1 /
            pct_mixed` times the generation per step.
          default: false
        dynamic_sampling_max_gen_batches:
          type: integer
          exclusiveMinimum: 0.0
          title: Dynamic Sampling Max Gen Batches
          description: How many generation batches one step may consume trying to
            fill itself before the run fails. Only read when `use_dynamic_sampling`
            is true.
          default: 10
        batch_multiplier:
          type: number
          exclusiveMinimum: 0.0
          title: Batch Multiplier
          description: Over-generate each step by this factor so dynamic sampling
            has candidates to filter. Set it near `1 / pct_mixed`. Rejected above
            1.0 unless `use_dynamic_sampling` is true, which is what NeMo-RL asserts
            at startup.
          default: 1.0
        reward_shaping:
          allOf:
          - $ref: '#/components/schemas/RlRewardShapingParams'
          description: Penalise over-long and improperly-terminated responses before
            the loss sees the reward. None leaves shaping off.
        reward_scaling:
          allOf:
          - $ref: '#/components/schemas/RlRewardScalingParams'
          description: Linearly rescale each reward before advantages are computed.
            None leaves scaling off. The DAPO recipes set target_min to -1.0, which
            turns a binary verifier's 0 into a negative reward instead of a merely
            smaller positive one.
        batching_strategy:
          allOf:
          - $ref: '#/components/schemas/BatchingStrategy'
          description: How rollouts are grouped into training micro-batches. `dynamic`
            fills each micro-batch to a token budget so short rollouts share a batch
            instead of each paying for a full-length pad. `sequence_packing` concatenates
            rollouts into packed sequences; it is rejected for context_parallel_size
            > 1. `static` is one rollout per slot.
          default: dynamic
        train_mb_tokens:
          title: Train Mb Tokens
          description: Token budget per training micro-batch, read by `dynamic` and
            `sequence_packing`. Defaults to max_seq_length * micro_batch_size, the
            peak `static` already provisions for. Lower it if you OOM.
          type: integer
          exclusiveMinimum: 0.0
        sequence_length_round:
          type: integer
          exclusiveMinimum: 0.0
          title: Sequence Length Round
          description: Round bucketed micro-batch sequence lengths up to a multiple
            of this. Only read by `dynamic`.
          default: 64
        automodel_kwargs:
          title: Automodel Kwargs
          description: 'Passed to policy.dtensor_cfg.automodel_kwargs; requires policy_backend=''automodel''.
            {''force_hf'': true} loads the stock HuggingFace modules; a {''backend'':
            {...}} block picks the Transformer-Engine / DeepEP MoE implementation.
            Unset means Automodel auto-detects.'
          additionalProperties: true
          type: object
        router_aux_loss_coef:
          title: Router Aux Loss Coef
          description: "MoE router auxiliary-loss coefficient, applied as a top-level\
            \ HuggingFace config override. Use 0.0 to drop the load-balancing term\
            \ during RL. Unset keeps the model's own value. Models that nest their\
            \ config (Qwen3.5 reads it under `text_config`) need `hf_config_overrides`\
            \ instead \u2014 a top-level key they do not read is absorbed silently."
          type: number
          minimum: 0.0
        hf_config_overrides:
          title: Hf Config Overrides
          description: 'Passed to NeMo-RL''s `policy.hf_config_overrides` verbatim,
            which forwards it to the training model as HuggingFace config kwargs and
            to vLLM as `hf_overrides`. Nested keys are preserved, so this reaches
            models that namespace their config, e.g. `{"text_config": {"router_aux_loss_coef":
            0.0}}` for Qwen3.5.'
          additionalProperties: true
          type: object
        vllm_tensor_parallel_size:
          title: Vllm Tensor Parallel Size
          description: Tensor parallel size for the vLLM rollout engine, independent
            of the policy's. Defaults to min(parallelism.tensor_parallel_size, parallelism.num_gpus_per_node).
          type: integer
          exclusiveMinimum: 0.0
        vllm_gpu_memory_utilization:
          type: number
          maximum: 1.0
          exclusiveMinimum: 0.0
          title: Vllm Gpu Memory Utilization
          description: Fraction of each GPU vLLM reserves for weights plus KV cache.
            Raise toward 0.7 for large models; the rest is left for the colocated
            policy.
          default: 0.5
      additionalProperties: false
      type: object
      required:
      - type
      title: RlGRPOTraining
      description: 'Group Relative Policy Optimization with NeMo Gym environments.


        ``finetuning_type`` is ``all_weights`` (default) or ``lora`` only.

        ``lora_merged`` is not supported for GRPO on the platform DTensor path.'
    RlJobInput:
      properties:
        name:
          title: Name
          type: string
        model:
          type: string
          title: Model
          description: Model entity reference ('name' or 'workspace/name').
        dataset:
          type: string
          title: Dataset
          description: 'Dataset fileset reference. DPO: preference JSONL (training.jsonl
            + validation.jsonl). GRPO: Gym JSONL (training.jsonl required).'
        environment:
          title: Environment
          description: Environment fileset reference (required when training.type
            is grpo).
          type: string
        training:
          oneOf:
          - $ref: '#/components/schemas/RlDPOTraining'
          - $ref: '#/components/schemas/RlGRPOTraining'
          title: Training
          description: Training method and hyperparameters (DPO or GRPO).
          discriminator:
            propertyName: type
            mapping:
              dpo: '#/components/schemas/RlDPOTraining'
              grpo: '#/components/schemas/RlGRPOTraining'
        integrations:
          $ref: '#/components/schemas/IntegrationsSpec'
        output:
          $ref: '#/components/schemas/RlOutputRequest'
      additionalProperties: false
      type: object
