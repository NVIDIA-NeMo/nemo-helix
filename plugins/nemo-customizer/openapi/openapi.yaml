        batch:
          $ref: '#/components/schemas/UnslothBatchSpec'
        optimizer:
          $ref: '#/components/schemas/UnslothOptimizerSpec'
        hardware:
          $ref: '#/components/schemas/UnslothHardwareSpec'
        integrations:
          $ref: '#/components/schemas/IntegrationsSpec'
        output:
          $ref: '#/components/schemas/UnslothOutputRequest'
        deployment_config:
          anyOf:
          - type: string
            title: Reference
            description: A reference to UnslothDeploymentParams.
          - $ref: '#/components/schemas/UnslothDeploymentParams'
          title: Deployment Config
          description: Deployment configuration for auto-deploying the model after
            training. Pass a string to reference an existing ModelDeploymentConfig
            by name ('my-config' or 'workspace/my-config'). An object provides inline
            NIM deployment parameters. Omit to skip deployment.
      additionalProperties: false
      type: object
      required:
      - model
      - dataset
      title: UnslothJobInput
      description: POST body / CLI JSON for ``nemo customization unsloth submit``.
    UnslothJobOutput:
      properties:
        name:
          title: Name
          type: string
        model:
          $ref: '#/components/schemas/UnslothModelLoadSpec'
        dataset:
          $ref: '#/components/schemas/UnslothDatasetSpec'
        training:
          $ref: '#/components/schemas/UnslothTrainingSpec'
        schedule:
          $ref: '#/components/schemas/UnslothScheduleSpec'
        batch:
          $ref: '#/components/schemas/UnslothBatchSpec'
        optimizer:
          $ref: '#/components/schemas/UnslothOptimizerSpec'
        hardware:
          $ref: '#/components/schemas/UnslothHardwareSpec'
        integrations:
          $ref: '#/components/schemas/IntegrationsSpec'
        output:
          $ref: '#/components/schemas/UnslothOutputResponse'
        deployment_config:
          anyOf:
          - type: string
            title: Reference
            description: A reference to UnslothDeploymentParams.
          - $ref: '#/components/schemas/UnslothDeploymentParams'
          title: Deployment Config
          description: Deployment configuration for auto-deploying the model after
            training. Pass a string to reference an existing ModelDeploymentConfig
            by name ('my-config' or 'workspace/my-config'). An object provides inline
            NIM deployment parameters. Omit to skip deployment.
