    UnslothLoRAParams:
      properties:
        rank:
          type: integer
          exclusiveMinimum: 0.0
          title: Rank
          description: LoRA rank.
          default: 16
        alpha:
          type: integer
          exclusiveMinimum: 0.0
          title: Alpha
          description: LoRA scaling factor (alpha).
          default: 16
        dropout:
          type: number
          exclusiveMaximum: 1.0
          minimum: 0.0
          title: Dropout
          default: 0.0
        target_modules:
          items:
            type: string
          type: array
          title: Target Modules
        bias:
          type: string
          enum:
          - none
          - all
          - lora_only
          title: Bias
          default: none
        use_rslora:
          type: boolean
          title: Use Rslora
          default: false
        random_state:
          type: integer
          title: Random State
          default: 3407
        use_dora:
          type: boolean
          title: Use Dora
          description: DoRA (weight-decomposed LoRA). Improves quality at low ranks;
            adds training overhead.
          default: false
        loftq_config:
          title: Loftq Config
          description: LoftQ initialization config for quantized bases. None disables
            LoftQ.
          additionalProperties: true
          type: object
        modules_to_save:
          title: Modules To Save
          description: Extra non-LoRA modules to train and save in full (e.g. ['embed_tokens',
            'lm_head']). Needed for vocab changes / continued pretraining.
          items:
            type: string
          type: array
        layers_to_transform:
          anyOf:
          - type: integer
          - items:
              type: integer
            type: array
          title: Layers To Transform
          description: Restrict LoRA to specific layer index(es). None applies to
            all layers.
        layer_replication:
          title: Layer Replication
          description: Layer-replication ranges for stacking, e.g. [[0, 16], [8, 24]].
            None disables.
          items:
            items:
              type: integer
            type: array
          type: array
        init_lora_weights:
          anyOf:
          - type: boolean
          - type: string
            enum:
            - gaussian
            - pissa
            - olora
            - loftq
          title: Init Lora Weights
          description: LoRA weight init scheme. True = PEFT default; 'pissa'/'olora'/'loftq'
            for advanced inits.
          default: true
      additionalProperties: false
      type: object
      title: UnslothLoRAParams
      description: Args to ``FastLanguageModel.get_peft_model``.
    UnslothModelLoadSpec:
      properties:
        name:
          type: string
          title: Name
          description: Model entity reference. Accepts 'name' (uses the job's workspace)
            or 'workspace/name'. The plugin's run resolves this to a local path before
            training.
        max_seq_length:
          type: integer
          exclusiveMinimum: 0.0
          title: Max Seq Length
          default: 2048
        load_in_4bit:
          type: boolean
          title: Load In 4Bit
          description: bitsandbytes 4-bit. Mutex with load_in_8bit. Default for Unsloth's
            headline path.
          default: true
        load_in_8bit:
          type: boolean
          title: Load In 8Bit
          default: false
        dtype:
          type: string
          enum:
          - auto
          - bfloat16
          - float16
          - float32
          title: Dtype
          default: auto
        trust_remote_code:
          type: boolean
          title: Trust Remote Code
          default: false
        device_map:
          anyOf:
          - type: string
          - type: integer
          - additionalProperties:
              type: integer
            type: object
          title: Device Map
          description: "Device placement forwarded to FastLanguageModel.from_pretrained.\
            \ Omit (null) to pin the whole model to the single visible GPU ({'': 0})\
            \ \u2014 the right default for this single-GPU backend, and it avoids\
            \ accelerate's auto-placement under-sizing GPU memory on unified-memory\
            \ parts (e.g. GB10 / DGX Spark), which otherwise spills layers to CPU\
            \ and aborts 4-bit loads. Set 'auto', 'balanced', 'sequential', a device\
            \ index, or a custom map for multi-device experiments."
        rope_scaling:
          title: Rope Scaling
          description: 'RoPE scaling config for long-context extension, passed to
            FastLanguageModel.from_pretrained (e.g. {''type'': ''linear'', ''factor'':
            2.0}). None uses the model''s native context length.'
          additionalProperties: true
          type: object
      additionalProperties: false
      type: object
      required:
      - name
      title: UnslothModelLoadSpec
      description: 'Args to ``FastLanguageModel.from_pretrained``.


        ``name`` is a NeMo Platform model entity reference (``"name"`` or

        ``"workspace/name"``). The plugin''s run orchestration resolves the

        entity, downloads its fileset to a local path, and hands that path

        to :func:`train_sft`.'
    UnslothOptimizerSpec:
      properties:
        learning_rate:
          type: number
          exclusiveMinimum: 0.0
          title: Learning Rate
          default: 0.0002
        weight_decay:
          type: number
          minimum: 0.0
          title: Weight Decay
          default: 0.0
        optim:
          type: string
          enum:
          - adamw_torch
          - adamw_torch_fused
          - adamw_8bit
          - paged_adamw_8bit
          - sgd
          title: Optim
          default: adamw_8bit
        adam_beta1:
          type: number
          exclusiveMaximum: 1.0
          minimum: 0.0
          title: Adam Beta1
          description: Adam/AdamW beta1.
          default: 0.9
        adam_beta2:
          type: number
          exclusiveMaximum: 1.0
          minimum: 0.0
          title: Adam Beta2
          description: Adam/AdamW beta2.
          default: 0.999
        adam_epsilon:
          type: number
          exclusiveMinimum: 0.0
          title: Adam Epsilon
          description: Adam/AdamW epsilon for numerical stability.
          default: 1.0e-08
        max_grad_norm:
          type: number
          minimum: 0.0
          title: Max Grad Norm
          description: Gradient-clipping max norm (TRL default 1.0).
          default: 1.0
        label_smoothing_factor:
          type: number
          exclusiveMaximum: 1.0
          minimum: 0.0
          title: Label Smoothing Factor
          description: Label smoothing for the cross-entropy loss. 0.0 disables.
          default: 0.0
        neftune_noise_alpha:
          title: Neftune Noise Alpha
          description: NEFTune embedding-noise alpha (quality boost). None disables.
          type: number
          minimum: 0.0
      additionalProperties: false
      type: object
      title: UnslothOptimizerSpec
    UnslothOutputRequest:
      properties:
        name:
          title: Name
          type: string
        description:
          title: Description
          type: string
        save_method:
          type: string
          enum:
          - lora
          - merged_16bit
          - merged_4bit
          title: Save Method
          default: lora
      additionalProperties: false
      type: object
      title: UnslothOutputRequest
      description: Submitter-facing output preferences. ``name`` is auto-derived if
        omitted.
    UnslothOutputResponse:
      properties:
        name:
          type: string
          title: Name
        type:
          type: string
          enum:
          - adapter
          - model
          title: Type
        save_method:
          type: string
          enum:
          - lora
          - merged_16bit
          - merged_4bit
          title: Save Method
        fileset:
          type: string
          title: Fileset
          description: Platform fileset name the trained checkpoint will be uploaded
            to. Defaults to the entity name.
        description:
          title: Description
          type: string
      additionalProperties: false
      type: object
      required:
      - name
      - type
      - save_method
      - fileset
      title: UnslothOutputResponse
      description: 'Stored on the canonical UnslothJobOutput. Output naming is resolved
        during ``to_spec``.


        ``type`` is the high-level shape (``adapter`` for a saved LoRA, ``model``

        for a merged checkpoint). ``save_method`` keeps the original Unsloth

        save verb so the training driver can dispatch correctly without

        re-deriving it. ``fileset`` is the platform fileset name the trained

        artefacts will be uploaded to (the plugin''s ``transform`` defaults

        this to ``name``).'
    UnslothScheduleSpec:
      properties:
        epochs:
          type: integer
          exclusiveMinimum: 0.0
          title: Epochs
          default: 1
        max_steps:
          title: Max Steps
          type: integer
          exclusiveMinimum: 0.0
        warmup_steps:
          type: integer
          minimum: 0.0
          title: Warmup Steps
          default: 0
        warmup_ratio:
          title: Warmup Ratio
          type: number
          maximum: 1.0
          minimum: 0.0
        lr_scheduler_type:
          type: string
          enum:
          - linear
          - cosine
          - constant
          - constant_with_warmup
          - cosine_with_restarts
          title: Lr Scheduler Type
          default: linear
        logging_steps:
          type: integer
          exclusiveMinimum: 0.0
          title: Logging Steps
          default: 1
        save_steps:
          title: Save Steps
          type: integer
          exclusiveMinimum: 0.0
        eval_steps:
          title: Eval Steps
          type: integer
          exclusiveMinimum: 0.0
        progress_reporting:
          $ref: '#/components/schemas/ProgressReportingConfig'
        seed:
          type: integer
          title: Seed
          default: 3407
        lr_scheduler_kwargs:
          title: Lr Scheduler Kwargs
          description: 'Extra kwargs for the LR scheduler, e.g. {''num_cycles'': 3}
            for cosine_with_restarts. None uses scheduler defaults.'
          additionalProperties: true
          type: object
      additionalProperties: false
      type: object
      title: UnslothScheduleSpec
      description: Training schedule, scheduler, logging cadence.
    UnslothToolCallParams:
      properties:
        tool_call_parser:
          title: Tool Call Parser
          description: Name of the tool call parser to use (e.g., 'openai', 'hermes',
            'pythonic', 'llama3_json', 'mistral').
          type: string
        tool_call_plugin:
          title: Tool Call Plugin
          description: 'Reference to a fileset containing the custom tool call plugin
            Python file. Expected format: ''{workspace}/{fileset_name}''.'
          type: string
          pattern: ^[\w\-.]+/[\w\-.]+$
        auto_tool_choice:
          title: Auto Tool Choice
          description: Whether to enable automatic tool choice.
          type: boolean
      additionalProperties: false
      type: object
      title: UnslothToolCallParams
      description: Tool calling configuration for NIM deployments.
    UnslothTrainingSpec:
      properties:
        training_type:
          type: string
          const: sft
          title: Training Type
          default: sft
        finetuning_type:
          type: string
          enum:
          - lora
          - all_weights
          title: Finetuning Type
          default: lora
        lora:
          allOf:
          - $ref: '#/components/schemas/UnslothLoRAParams'
          description: Required when finetuning_type='lora'. Auto-filled with defaults
            if omitted.
        use_gradient_checkpointing:
          type: string
          enum:
          - unsloth
          - 'true'
          - 'false'
          title: Use Gradient Checkpointing
          default: unsloth
      additionalProperties: false
      type: object
      title: UnslothTrainingSpec
      description: Algorithm + adapter shape selectors.
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
          additionalProperties: true
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WandbIntegration:
      properties:
        project:
          title: Project
          description: W&B project name (groups related runs). Defaults to output.name
            if not set.
          type: string
        name:
          title: Name
          description: W&B run name. Defaults to job_id if not provided.
          type: string
        entity:
          title: Entity
          description: W&B entity (team or username).
          type: string
        tags:
          title: Tags
          description: W&B tags for filtering runs.
          items:
            type: string
          type: array
        notes:
          title: Notes
          description: W&B notes/description for the run.
          type: string
        base_url:
          title: Base Url
          description: Base URL for self-hosted W&B server (e.g., 'https://wandb.mycompany.com').
            If not provided, uses the default W&B cloud service.
          type: string
        api_key_secret:
          allOf:
          - $ref: '#/components/schemas/SecretRef'
          description: 'Reference to a secret containing the WANDB_API_KEY. Format:
            ''secret_name'' (uses request workspace) or ''workspace/secret_name''
            (explicit workspace).'
      additionalProperties: false
      type: object
      title: WandbIntegration
      description: 'Weights & Biases integration configuration.


        To enable W&B, provide a non-null ``wandb`` object on :class:`IntegrationsSpec`.

        Provide ``api_key_secret`` referencing a secret that contains ``WANDB_API_KEY``.

        Optionally set ``base_url`` for self-hosted W&B servers.'
