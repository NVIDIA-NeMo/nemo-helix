# Platform agent for --agent optimize (nemo-agents-spec-v1).
# Models route through the local platform inference gateway: optimize jobs do not
# inherit provider keys, so the gateway holds the key. See README.md setup step 5.
config_format: nemo-agents-spec-v1
name: hermes-optimize-chatonly
description: Hermes chat-only agent for optimize --agent demos.

instructions:
  system:
    content: >
      Answer the user's question in one short sentence. Prefer factual,
      concise replies.

default_harness: hermes

harnesses:
  hermes:
    kind: hermes
    model:
      provider: openai
      model: nvidia-nemotron-3-super-120b-a12b
      base_url: http://localhost:8080/apis/inference-gateway/v2/workspaces/default/openai/-/v1
      api_key_env: NEMO_AGENTS_IGW_API_KEY
      temperature: 0.0
    settings:
      max_tokens: 256
      reasoning_config:
        effort: none

models:
  judge:
    provider: openai
    model: nvidia-nemotron-3-super-120b-a12b
    base_url: http://localhost:8080/apis/inference-gateway/v2/workspaces/default/openai/-/v1
    api_key_env: NEMO_AGENTS_IGW_API_KEY
    temperature: 0.0
    settings:
      max_tokens: 512

environment:
  provider: local
  workspace: ./workspace
  artifacts: ./artifacts

telemetry:
  enabled: false
