# --optimize-config: chat-only Hermes package (proven CLI smoke).
# Stage this bundle with:
#   nemo agents optimize prepare-fileset --source examples/hermes-optimize --optimize-config optimize-chatonly.yaml --fileset hermes-optimize-chatonly --workspace default
# Then launch it with:
#   nemo agents optimize --strategy nat --optimize-config-fileset default/hermes-optimize-chatonly --optimize-config optimize-chatonly.yaml --workspace default
#
# See README.md in this directory for install + run steps.
schema_version: fabric.agent/v1alpha1
metadata:
  name: hermes-optimize-chatonly
  description: Hermes-backed numeric HPO demo (chat-only, no MCP hook).
harness:
  adapter_id: nvidia.fabric.hermes
  resolution: preinstalled
  settings:
    max_tokens: 256
    reasoning_config:
      effort: none
models:
  default:
    provider: nvidia
    # inference-api.nvidia.com model ids are often prefixed (e.g. nvidia/meta/...).
    model: nvidia/nvidia/nemotron-3-nano-30b-a3b
    base_url: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    temperature: 0.0
    top_p: 1.0
  judge:
    provider: nvidia
    model: nvidia/nvidia/nemotron-3-nano-30b-a3b
    base_url: https://inference-api.nvidia.com/v1
    api_key_env: NVIDIA_API_KEY
    temperature: 0.0
    max_tokens: 512
instructions:
  system:
    content: >
      Answer the user's question in one short sentence. Prefer factual,
      concise replies.
runtime:
  input_schema: chat
  output_schema: message
  max_turns: 4
  timeout_seconds: 120
  artifacts: ./artifacts
environment:
  provider: local
  workspace: ./.tmp/workspace
  artifacts: ./artifacts
optimizer:
  numeric:
    enabled: true
    n_trials: 2
  reps_per_param_set: 1
  eval_metrics:
    average_score:
      evaluator_name: average_score
      direction: maximize
      weight: 1.0
  search_space:
    temperature:
      type: fabric
      path: models.default.temperature
      values: [0.0, 0.2]
eval:
  general:
    dataset:
      file_path: dataset-chatonly.json
    max_concurrency: 1
  fabric:
    base_dir: .
    capture_trajectory: false
    timeout_s: 180
  evaluators:
    accuracy:
      _type: tunable_rag_evaluator
      llm_name: judge
      default_scoring: true
      default_score_weights:
        coverage: 0.5
        correctness: 0.3
        relevance: 0.2
      judge_llm_prompt: >
        Score whether the generated answer correctly addresses the question
        compared to the expected answer. Return JSON only.
