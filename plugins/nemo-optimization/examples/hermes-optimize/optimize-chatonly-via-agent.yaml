# --optimize-config overlay for --agent hermes-optimize-chatonly.
# Agent body comes from the platform entity; this file supplies optimizer + eval.
optimizer:
  numeric:
    enabled: true
    n_trials: 2
  reps_per_param_set: 1
  eval_metrics:
    average_score:
      evaluator_name: average_score
      direction: maximize
      weight: 1.0
  search_space:
    temperature:
      type: fabric
      path: models.default.temperature
      values: [0.0, 0.2]
eval:
  general:
    dataset:
      file_path: dataset-chatonly.json
    max_concurrency: 1
  fabric:
    base_dir: .
    capture_trajectory: false
    timeout_s: 180
  evaluators:
    accuracy:
      _type: tunable_rag_evaluator
      llm_name: judge
      default_scoring: true
      default_score_weights:
        coverage: 0.5
        correctness: 0.3
        relevance: 0.2
      judge_llm_prompt: >
        Score whether the generated answer correctly addresses the question
        compared to the expected answer. Return JSON only.
