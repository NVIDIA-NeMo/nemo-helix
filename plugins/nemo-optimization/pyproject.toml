[project]
name = "nemo-optimization-plugin"
description = "NeMo optimization library — Optuna numeric HPO and Agents optimize job."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "nemo-agent-optimization-plugin",
    "nemo-platform-plugin",
    "nemo-platform",
    "nemo-evaluator-sdk",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "optuna>=4.0.0",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.6.1",
    "pyyaml>=6.0",
    "typer>=0.12.5",
]
version = "0.0.0"

[project.entry-points."nemo.optimization.backends"]
optuna = "nemo_optimization.backends.optuna.backend:OptunaBackend"
ga = "nemo_optimization.backends.ga.backend:GaBackend"

[project.entry-points."nemo.optimization-strategy"]
nat = "nemo_optimization.optimization_strategy:NatOptimizationStrategy"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_optimization"]

[tool.uv.sources]
nemo-agent-optimization-plugin = { workspace = true }
nemo-platform-plugin = { workspace = true }
nemo-platform = { workspace = true }
nemo-evaluator-sdk = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.24.0",
    "fastapi>=0.115.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
