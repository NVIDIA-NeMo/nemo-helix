[project]
name = "nemo-helix-operator-plugin"
description = "Builds nhx-api images from an uploaded NeMo Helix checkout."
requires-python = ">=3.11,<3.15"
version = "0.1.0"
dependencies = [
  "nemo-helix-plugin",
  "nemo-helix",
  "nemo-builder-plugin",
  "pydantic>=2.0.0",
  "httpx>=0.27.0",
]

[tool.uv.sources]
nemo-helix = { workspace = true }
nemo-helix-plugin = { workspace = true }
nemo-builder-plugin = { workspace = true }

[project.entry-points."nemo.services"]
helix-operator = "nemo_helix_operator.service:HelixOperatorService"

[project.entry-points."nemo.cli"]
helix-operator = "nemo_helix_operator.cli:HelixOperatorCLI"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_helix_operator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
