[project]
name = "nemo-observability-plugin"
description = "Embeds an external, customer-run trace explorer (MLflow, Phoenix) in NeMo Studio via a same-origin proxy."
requires-python = ">=3.11,<3.15"
dependencies = ["nemo-helix-plugin", "fastapi>=0.115", "httpx>=0.27", "pydantic>=2.0.0", "pyyaml>=6.0"]
version = "0.0.0"

[tool.uv.sources]
nemo-helix-plugin = { path = "../../packages/nemo_helix_plugin", editable = true }

[project.entry-points."nemo.services"]
observability = "nemo_observability_plugin.service:ObservabilityService"

[project.entry-points."nemo.studio"]
observability = "nemo_observability_plugin.studio:get_studio_spec"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_observability_plugin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
