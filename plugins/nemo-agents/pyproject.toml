[project]
name = "nemo-agents-plugin"
description = "NeMo Agents Plugin — agent lifecycle management on the NeMo Helix."
requires-python = ">=3.11,<3.15"
dependencies = [
    "nemo-helix",
    "nemo-helix-plugin",
    "nemo-deployments-plugin",
    "nemo-agent-config-example-email-security-triage",
    # NAT 1.9 is the first line whose cryptography cap (>=48,<49) overlaps
    # data-designer's, so it is what makes the published nemo-helix[all]
    # wheel resolvable at all; 1.8.0 caps cryptography at <47. That line ships
    # only pre-releases today, and uv accepts a pre-release solely when a
    # requirement it reads names one, so every NAT distribution in the closure
    # is listed here rather than only the two this package imports. Collapse
    # back to core + langchain on >=1.9.0 once it is released.
    "nvidia-nat-core>=1.9.0a20260811,<1.10",
    "nvidia-nat-langchain>=1.9.0a20260811,<1.10",
    "nvidia-nat-atif>=1.9.0a20260811,<1.10",
    "nvidia-nat-config-optimizer>=1.9.0a20260811,<1.10",
    "nvidia-nat-eval>=1.9.0a20260811,<1.10",
    "nvidia-nat-opentelemetry>=1.9.0a20260811,<1.10",
    # ASTD-164: tight pins avoid pip ResolutionTooDeep via aioboto3/langchain-aws.
    "langchain-aws==1.1.0",
    "boto3>=1.40.46,<1.40.62",
    "botocore>=1.40.46,<1.40.62",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # Base, not optional: the generated nemo-helix extra mirrors this list only,
    # and the plugin advertises `agents.package-agent` unconditionally.
    "jinja2>=3.1",
    "python-on-whales>=0.60",
    "nemo-fabric[relay,streaming]>=0.5.0,<0.6.0",
    "nemo-fabric-adapters-claude>=0.5.0,<0.6.0",
    "nemo-fabric-adapters-codex>=0.5.0,<0.6.0",
    "nemo-fabric-adapters-deepagents>=0.5.0,<0.6.0",
    "nemo-fabric-adapters-mini-swe-agent>=0.5.0,<0.6.0",
    "nemo-fabric-adapters-nooa>=0.5.0,<0.6.0; python_version >= '3.12' and python_version < '3.14'",
    # Remote Agent only needs its HTTP client; the service is deployed independently.
    "nemo-fabric-adapters-remote-agent>=0.5.0,<0.6.0",
    # Fabric's Hermes adapter intentionally excludes the harness. Platform manages
    # the compatible Hermes Agent installation separately.
    "nemo-fabric-adapters-hermes>=0.5.0,<0.6.0; python_version < '3.14'",
    # The deepagents adapter caps langchain-mcp-adapters below 0.3, whose 0.2.x releases break on mcp 2.
    "mcp>=1.28.1,<2",
]
version = "0.0.0"

[project.entry-points."nemo.services"]
agents = "nemo_agents_plugin.service:AgentsService"

[project.entry-points."nemo.cli"]
agents = "nemo_agents_plugin.cli:AgentsCLI"

[project.entry-points."nemo.sdk"]
agents = "nemo_agents_plugin.sdk:agents_sdk_resources"

[project.entry-points."nemo.skills"]
agents = "nemo_agents_plugin.skills:skills_dir"

[project.entry-points."nemo.jobs"]
"agents.evaluate" = "nemo_agents_plugin.jobs.evaluate_agent:EvaluateAgentJob"
"agents.execute" = "nemo_agents_plugin.jobs.execute:ExecuteAgentJob"
"agents.package-agent" = "nemo_agents_plugin.jobs.package_agent:PackageAgentJob"

[project.entry-points."nemo.agents.post_run_actions"]
"agents.noop" = "nemo_agents_plugin.jobs.post_run_actions:NoopPostRunAction"

[project.entry-points."nemo.controllers"]
"agents-deployment" = "nemo_agents_plugin.runner.controller:AgentDeploymentController"

# NeMo Agent Toolkit — register custom telemetry exporter (see nat.runtime.loader nat.plugins)
[project.entry-points."nat.plugins"]
nemo_agents_files_telemetry = "nemo_agents_plugin.telemetry.files_service_exporter"

[project.optional-dependencies]
claude = ["nemo-fabric-adapters-claude[harness]>=0.5.0,<0.6.0"]
codex = ["nemo-fabric-adapters-codex[harness]>=0.5.0,<0.6.0"]
deepagents = ["nemo-fabric-adapters-deepagents[harness]>=0.5.0,<0.6.0"]
mini-swe-agent = ["nemo-fabric-adapters-mini-swe-agent[harness]>=0.5.0,<0.6.0"]
nooa = ["nemo-fabric-adapters-nooa[harness]>=0.5.0,<0.6.0; python_version >= '3.12' and python_version < '3.14'"]
# Moved to [project] dependencies; kept so older install instructions resolve.
container = []
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpserver>=1.0.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/nemo_agents_plugin",
]

# Host-side mirror of the adapter's contract; refresh when PI_ADAPTER_NPM_SPEC in container/template.py is bumped.
[tool.hatch.build.targets.wheel.shared-data]
"pi.fabric-adapter.json" = "share/nemo-fabric/adapters/pi/pi.fabric-adapter.json"

[tool.uv.sources]

nemo-deployments-plugin = { workspace = true }
nemo-helix = { workspace = true }
nemo-helix-plugin = { workspace = true }
nemo-agent-config-example-calculator = {workspace = true}
nemo-agent-config-example-email-security-triage = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: service integration tests",
]
# "src" puts nemo_agents_plugin on sys.path.  nemo-helix is resolved
# from the workspace — run `uv sync` at the repo root before running these tests.
pythonpath = ["src"]

# Opt this plugin into OpenAPI spec generation.
[tool.nemo.openapi]
