[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemo-agent-config-example-email-security-triage"
version = "0.1.0"
description = "Packaged Fabric email-security sample assets for NeMo Helix setup."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/email_security_triage"]

[tool.hatch.build.targets.wheel.force-include]
"CUSTOMIZE.md" = "email_security_triage/CUSTOMIZE.md"
"README.md" = "email_security_triage/README.md"
"agent.yaml" = "email_security_triage/agent.yaml"
"dataset.jsonl" = "email_security_triage/dataset.jsonl"
"eval-config.dataset-driven.README.md" = "email_security_triage/eval-config.dataset-driven.README.md"
"eval-config.dataset-driven.yml" = "email_security_triage/eval-config.dataset-driven.yml"
"eval-config.task-driven.README.md" = "email_security_triage/eval-config.task-driven.README.md"
"eval-config.task-driven.json" = "email_security_triage/eval-config.task-driven.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
