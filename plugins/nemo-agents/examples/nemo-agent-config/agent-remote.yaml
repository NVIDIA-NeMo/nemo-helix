config_format: nemo-agents-spec-v1
name: remote-agent-example
default_harness: remote-agent
harnesses:
  remote-agent:
    kind: remote-agent
    settings:
      # API root of an independently deployed agent, including /v1.
      base_url: https://agent.example.com/v1
      api_type: openai-responses
models:
  default:
    provider: remote
    model: remote-agent
    # Remove api_key_env for an unauthenticated endpoint to skip credential lookup.
    api_key_env: REMOTE_AGENT_API_KEY
runtime:
  timeout_seconds: 600
telemetry:
  enabled: false
