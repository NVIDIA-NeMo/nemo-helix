config_format: nemo-agents-spec-v1
name: hermes-example

instructions:
  system:
    content: You are a concise test assistant.

default_harness: hermes

harnesses:
  hermes:
    kind: hermes
    model:
      provider: nvidia
      model: nvidia/nemotron-3.5-lightning-30b-a3b
      api_key_env: NVIDIA_API_KEY
      base_url: https://integrate.api.nvidia.com/v1
      temperature: 0.0
    settings:
      max_tokens: 512
      reasoning_config:
        effort: none

skills:
  paths: []

mcp:
  servers: {}

tools:
  blocked: []

environment:
  workspace: ./workspace
  artifacts: ./artifacts

telemetry:
  enabled: false
  provider: relay
  output_dir: ./artifacts/relay
  project: test-agent
