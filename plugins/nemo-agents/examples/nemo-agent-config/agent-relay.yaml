config_format: nemo-agents-spec-v1
name: test-agent
description: Test agent config

instructions:
  system:
    content: You are a concise test assistant.

default_harness: codex

harnesses:
  claude:
    kind: claude
    model:
      provider: anthropic
      model: anthropic/claude-sonnet-4-5
    settings:
      permission_mode: dontAsk
  hermes:
    kind: hermes
    model:
      provider: nvidia
      model: nvidia/nemotron-3.5-lightning-30b-a3b
      api_key_env: NVIDIA_API_KEY
      base_url: https://integrate.api.nvidia.com/v1
      temperature: 0.0
    settings:
      max_tokens: 512
      reasoning_config:
        effort: none
  deepagents:
    kind: deepagents
    settings:
      deepagents: {}
  codex:
    kind: codex
    settings:
      sandbox: workspace-write
      reasoning_effort: high

models:
  default:
    provider: nvidia
    model: nvidia-nemotron-3-5-lightning-30b-a3b
    api_key_env: NVIDIA_API_KEY

skills:
  paths: []

mcp:
  servers: {}

tools:
  blocked: []

environment:
  workspace: ./workspace
  artifacts: ./artifacts

telemetry:
  enabled: true
  provider: relay
  output_dir: ./artifacts/relay
  project: test-agent
  atif:
    enabled: true
    filename_template: trajectory-{session_id}.atif.json
  atof:
    enabled: true
    filename: events.atof.jsonl
    mode: overwrite
