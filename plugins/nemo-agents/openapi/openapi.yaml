    PackageAgentInput:
      properties:
        agent:
          type: string
          title: Agent
          description: Name of the Agent entity to package.
        tag:
          title: Tag
          description: Image name and optional tag, always nested under 'nemo-agents/{workspace}/'.
            Defaults to '{agent_name}-{agent_id}:{agent_version}'.
          type: string
          pattern: ^[a-z0-9][a-z0-9._-]*(:[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127})?$
        base_image_url:
          title: Base Image Url
          description: Base image repository override (e.g. 'nvcr.io/nvidia/base/ubuntu').
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*(:[0-9]+)?(/[a-zA-Z0-9][a-zA-Z0-9._-]*)*$
        base_image_tag:
          title: Base Image Tag
          description: Base image tag override (e.g. 'noble-20260217').
          type: string
          pattern: ^[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}$
        python_version:
          title: Python Version
          description: Python version baked into the image (e.g. '3.13').
          type: string
          pattern: ^[0-9]+(\.[0-9]+){0,2}$
        uv_version:
          title: Uv Version
          description: uv version baked into the image (e.g. '0.9.14').
          type: string
          pattern: ^[0-9]+(\.[0-9]+){0,2}$
        allow_root:
          type: boolean
          title: Allow Root
          description: Run the agent as root instead of the 'agent' user.
          default: false
        sandbox_runtime:
          title: Sandbox Runtime
          description: Render an image compatible with a sandbox runtime (e.g. 'openshell').
          type: string
        agent_version:
          title: Agent Version
          description: OCI image version label override.
          type: string
        agent_author:
          title: Agent Author
          description: OCI image authors label override.
          type: string
        skip_validation:
          type: boolean
          title: Skip Validation
          description: Bypass Fabric package validation before building.
          default: false
        registry:
          title: Registry
          description: 'Push the built image to this registry (e.g. ''nvcr.io/my-org'').
            The host executing the push must already be authenticated to it: the local
            machine for direct CLI invocation, or the platform''s job-execution host
            for remote execution or the REST API. Credentials are never accepted over
            this API.'
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*(:[0-9]+)?(/[a-zA-Z0-9][a-zA-Z0-9._-]*)*$
        push_tag:
          title: Push Tag
          description: "Fully-qualified remote tag. Defaults to '<registry>/<image>',\
            \ where <image> is the namespaced local reference 'nemo-agents/{workspace}/{tag}'.\
            \ Requires 'registry'. Must start with '<registry>/nemo-agents/{workspace}/'\
            \ \u2014 Docker tags are daemon-global while the auth boundary here is\
            \ the workspace, so an unscoped push_tag would let this workspace overwrite\
            \ another workspace's image, or redirect the push to a registry other\
            \ than the one declared."
          type: string
          pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*(:[0-9]+)?(/[a-zA-Z0-9][a-zA-Z0-9._-]*)*(:[a-zA-Z0-9_][a-zA-Z0-9._-]{0,127})?$
      additionalProperties: false
      type: object
      required:
      - agent
      title: PackageAgentInput
      description: 'What a caller POSTs: an agent name plus the packaging knobs.'
