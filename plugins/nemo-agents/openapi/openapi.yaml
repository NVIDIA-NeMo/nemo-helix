components:
  schemas:
    Agent:
      properties:
        description:
          type: string
          title: Description
          description: Human-readable description of the agent.
          default: ''
        config:
          additionalProperties: true
          type: object
          title: Config
          description: Agent config dict interpreted according to config_format.
        config_format:
          type: string
          title: Config Format
          description: platform-internal schema version tag for the agent config dict.
            `nat-workflow-v1` is the default legacy NAT workflow format; `nemo-agents-spec-v1`
            identifies the Platform-owned agent.yaml spec format.
          default: nat-workflow-v1
        name:
          type: string
          title: Name
          description: Entity name within the workspace
          default: ''
        workspace:
          type: string
          pattern: ^[\w\-\+.@:]+$
          title: Workspace
          description: Workspace identifier
        project:
          title: Project
          description: The name of the project associated with this entity.
          type: string
        id:
          type: string
          title: Id
          readOnly: true
        created_at:
          title: Created At
          readOnly: true
          type: string
          format: date-time
        created_by:
          title: Created By
          readOnly: true
          nullable: true
          type: string
        updated_at:
          title: Updated At
          readOnly: true
          type: string
          format: date-time
        updated_by:
          title: Updated By
          readOnly: true
          nullable: true
          type: string
        entity_id:
          type: string
          title: Entity Id
          description: Alias for id for backwards compatibility.
          readOnly: true
        parent:
          title: Parent
          description: Parent entity ID for nested entities.
          readOnly: true
          type: string
        db_version:
          type: integer
          title: Db Version
          description: Database version of the entity for optimistic locking.
          readOnly: true
      type: object
      required:
      - workspace
      - id
      - created_at
      - created_by
      - updated_at
      - updated_by
      - entity_id
      - parent
      - db_version
      title: Agent
      description: "An agent definition \u2014 stores agent config and metadata.\n\
        \nEntity type: ``agent``\nPrimary lookup: by ``name`` within a ``workspace``.\n\
        \nThe agent's Ethos files live at the locations returned by\n:func:`ethos_file_ref`\
        \ and :func:`agent_config_file_ref` \u2014 they\nare **not** stored on the\
        \ entity because the paths are fully derivable\nfrom ``(workspace, name)``."
    AgentComputeSpec:
      properties:
        description:
          type: string
          title: Description
          description: Human-readable description.
          default: ''
        resources:
          allOf:
          - $ref: '#/components/schemas/ComputeResources'
          description: k8s-style resource requests/limits for the execute container.
        name:
          type: string
          title: Name
          description: Entity name within the workspace
          default: ''
        workspace:
          type: string
          pattern: ^[\w\-\+.@:]+$
          title: Workspace
          description: Workspace identifier
        project:
          title: Project
          description: The name of the project associated with this entity.
          type: string
        id:
          type: string
          title: Id
          readOnly: true
        created_at:
          title: Created At
          readOnly: true
          type: string
          format: date-time
        created_by:
          title: Created By
          readOnly: true
          nullable: true
          type: string
        updated_at:
          title: Updated At
          readOnly: true
          type: string
          format: date-time
        updated_by:
          title: Updated By
          readOnly: true
          nullable: true
          type: string
        entity_id:
          type: string
          title: Entity Id
          description: Alias for id for backwards compatibility.
          readOnly: true
        parent:
          title: Parent
          description: Parent entity ID for nested entities.
          readOnly: true
          type: string
        db_version:
          type: integer
          title: Db Version
          description: Database version of the entity for optimistic locking.
          readOnly: true
      type: object
      required:
      - workspace
      - id
      - created_at
      - created_by
      - updated_at
      - updated_by
      - entity_id
      - parent
      - db_version
      title: AgentComputeSpec
      description: 'A reusable compute spec (k8s-style resource requests/limits).


        Entity type: ``agent_compute_spec``

        Referenced by an AgentEnvironment''s ``compute_spec`` (by name or inline).'
    AgentDeployment:
      properties:
        name:
          type: string
          title: Name
          description: Entity name within the workspace
          default: ''
        workspace:
          type: string
          pattern: ^[\w\-\+.@:]+$
          title: Workspace
          description: Workspace identifier
        project:
          title: Project
          description: The name of the project associated with this entity.
          type: string
        agent:
          type: string
          title: Agent
          description: Name of the Agent entity this deployment is for.
          default: ''
        config:
          additionalProperties: true
          type: object
          title: Config
          description: Resolved agent config with IGW URL injected and any referenced
            environment spec merged in, written when the deployment is created.
        environment:
          anyOf:
          - type: string
            title: Reference
            description: A reference to AgentEnvironmentInline.
          - $ref: '#/components/schemas/AgentEnvironmentInline'
          title: Environment
          description: '"workspace/name" ref to an AgentEnvironment, an inline environment,
            or None. Snapshotted at create time for provenance; the resolved values
            live in config/compute/secrets.'
        compute:
          allOf:
          - $ref: '#/components/schemas/ComputeSpecInline'
          description: Resolved compute snapshot from the referenced environment.
            Compiled into the container resources for docker/k8s modes; ignored for
            subprocess.
        secrets:
          additionalProperties:
            type: string
          type: object
          title: Secrets
          description: Resolved secret env references from the referenced environment,
            as ENV_VAR_NAME -> 'workspace/secret-name'. Compiled into secret-backed
            container env vars (never plaintext) for docker/k8s modes; ignored for
            subprocess.
        status:
          type: string
          enum:
          - pending
          - starting
          - running
          - failed
          - deleting
          title: Status
          description: 'Lifecycle status: pending | starting | running | failed |
            deleting.'
          default: pending
        deployment_mode:
          type: string
          enum:
          - subprocess
          - docker
          - k8s
          title: Deployment Mode
          description: Runtime backend for this deployment. 'subprocess' (default)
            reads the loopback 'endpoint'; 'docker'/'k8s' read the projected 'endpoints'.
          default: subprocess
        endpoint:
          type: string
          title: Endpoint
          description: Subprocess loopback endpoint of the agent process (e.g. http://localhost:9001).
          default: ''
        endpoints:
          items:
            $ref: '#/components/schemas/Endpoint'
          type: array
          title: Endpoints
          description: Routable endpoints for container modes, projected from the
            deployments-plugin Deployment. Empty for subprocess mode (which uses 'endpoint').
        image:
          type: string
          title: Image
          description: Container image for docker/k8s modes. Empty for subprocess;
            falls back to AgentsConfig.deployments.default_image.
          default: ''
        use_image_entrypoint:
          type: boolean
          title: Use Image Entrypoint
          description: 'Container modes only: preserve the image ENTRYPOINT/CMD instead
            of injecting the platform-owned NAT/Fabric server command.'
          default: false
        plugin_deployment:
          type: string
          title: Plugin Deployment
          description: Name of the linked nemo-deployments Deployment entity. Defaults
            to this deployment's name when empty (set by the controller on create).
          default: ''
        port:
          type: integer
          title: Port
          description: Port the agent process is listening on.
          default: 0
        pid:
          type: integer
          title: Pid
          description: OS process ID of the agent subprocess.
          default: 0
        error:
          type: string
          title: Error
          description: Error message if status is 'failed'.
          default: ''
        id:
          type: string
          title: Id
          readOnly: true
        created_at:
          title: Created At
          readOnly: true
          type: string
          format: date-time
        created_by:
          title: Created By
          readOnly: true
          nullable: true
          type: string
        updated_at:
          title: Updated At
          readOnly: true
          type: string
          format: date-time
        updated_by:
          title: Updated By
          readOnly: true
          nullable: true
          type: string
        entity_id:
          type: string
          title: Entity Id
          description: Alias for id for backwards compatibility.
          readOnly: true
        parent:
          title: Parent
          description: Parent entity ID for nested entities.
          readOnly: true
          type: string
        db_version:
          type: integer
          title: Db Version
          description: Database version of the entity for optimistic locking.
          readOnly: true
        auth_context:
          allOf:
          - $ref: '#/components/schemas/AuthContext'
          readOnly: true
          nullable: true
      type: object
      required:
      - workspace
      - id
      - created_at
      - created_by
      - updated_at
      - updated_by
      - entity_id
      - parent
      - db_version
      - auth_context
      title: AgentDeployment
      description: "A running (or pending) deployment of an Agent.\n\nEntity type:\
        \ ``agent_deployment``\nLifecycle: pending \u2192 starting \u2192 running\
        \ | failed.\nThe :class:`~nemo_agents_plugin.runner.controller.AgentDeploymentController`\n\
        drives state transitions by reconciling this entity against the\n:class:`~nemo_agents_plugin.runner.backend.RunnerBackend`."
    AgentEnvironment:
      properties:
        description:
          type: string
          title: Description
          description: Human-readable description.
          default: ''
        environment_spec:
          anyOf:
          - type: string
            title: Reference
            description: A reference to EnvironmentSpecInline.
          - $ref: '#/components/schemas/EnvironmentSpecInline'
          title: Environment Spec
          description: '"workspace/name" ref to an AgentEnvironmentSpec, an inline
            spec, or None.'
        compute_spec:
          anyOf:
          - type: string
            title: Reference
            description: A reference to ComputeSpecInline.
          - $ref: '#/components/schemas/ComputeSpecInline'
          title: Compute Spec
          description: '"workspace/name" ref to an AgentComputeSpec, an inline spec,
            or None.'
        name:
          type: string
          title: Name
          description: Entity name within the workspace
          default: ''
        workspace:
          type: string
          pattern: ^[\w\-\+.@:]+$
          title: Workspace
          description: Workspace identifier
        project:
          title: Project
          description: The name of the project associated with this entity.
          type: string
        id:
          type: string
          title: Id
          readOnly: true
        created_at:
          title: Created At
          readOnly: true
          type: string
          format: date-time
        created_by:
          title: Created By
          readOnly: true
          nullable: true
          type: string
        updated_at:
          title: Updated At
          readOnly: true
          type: string
          format: date-time
        updated_by:
          title: Updated By
          readOnly: true
          nullable: true
          type: string
        entity_id:
          type: string
          title: Entity Id
          description: Alias for id for backwards compatibility.
          readOnly: true
        parent:
          title: Parent
          description: Parent entity ID for nested entities.
          readOnly: true
          type: string
        db_version:
