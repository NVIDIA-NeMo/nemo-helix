[project]
name = "nemo-compass-plugin"
version = "0.1.0"
description = "Agent telemetry analysis and persistent insights for NeMo Helix."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115",
  "httpx",
  "nemo-compass==0.2.0; python_version < '3.14'",
  "nemo-fabric-adapter-contract>=0.5.0,<0.6.0",
  "nemo-fabric-adapters-common>=0.5.0,<0.6.0",
  "nemo-helix",
  "nemo-helix-plugin",
  "nemo-relay>=0.9.3,<0.10",
  "nooa>=0.0.10,<0.0.11",
  "opentelemetry-exporter-otlp>=1.42.1",
  "opentelemetry-sdk>=1.42.1",
  "pydantic>=2.12.0",
  "pyyaml>=6.0.3",
  "typer>=0.20.0",
  "tzdata==2026.2",
]

[project.entry-points."nemo.cli"]
compass = "nemo_compass_plugin.cli:CompassCLI"

[project.entry-points."nemo.services"]
compass = "nemo_compass_plugin.service:CompassService"

[project.entry-points."nemo.controllers"]
compass-analysis = "nemo_compass_plugin.controller:CompassAnalysisController"

[project.entry-points."nemo.agents.post_run_actions"]
"compass.persist" = "nemo_compass_plugin.post_run_actions:CompassPersistAction"
"compass.preview" = "nemo_compass_plugin.post_run_actions:CompassPreviewAction"

[project.entry-points."nemo.sdk"]
compass = "nemo_compass_plugin.sdk:compass_sdk_resources"

[project.entry-points."nemo.skills"]
compass = "nemo_compass_plugin.skills:skills_dir"

[tool.nemo.openapi]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_compass_plugin"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel.shared-data]
"analyst.fabric-adapter.json" = "share/nemo-fabric/adapters/helix/compass/analyst.fabric-adapter.json"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: service integration tests",
]
pythonpath = ["src", "."]
testpaths = ["tests"]
