# kind values for CPU-only GitHub Actions Kubernetes E2E runs.

rbac:
  volcanoEnabled: false

postgresql:
  image:
    repository: docker.io/library/postgres

clickhouse:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 500m
      memory: 1Gi

core:
  storage:
    accessModes:
      - ReadWriteOnce
    volumePermissionsImage: docker.io/library/busybox:stable

ingress:
  enabled: false

httpRoute:
  enabled: true
  parentRefs:
    - name: nmp-e2e-gateway

platformConfig:
  auth:
    allowed_service_principals:
      - e2e-test
      - e2e-test-on-behalf
  inference_gateway:
    mock_provider_prefix: igw-mock-
  jobs:
    executors:
      - provider: cpu
        profile: additional-volume
        backend: kubernetes_job
        config:
          service_account_name: '{{ include "nmp-core.jobsServiceAccountName" . }}'
          launcher_image: '{{ include "nmp-core.image" . }}'
          storage:
            pvc_name: '{{ include "nmp-core.persistentVolumeClaim" . }}'
            volume_permissions_image: '{{ .Values.core.storage.volumePermissionsImage }}'
            additional_volumes:
              - name: nmp-additional-volume
                persistent_volume_claim:
                  claim_name: '{{ include "nmp-core.persistentVolumeClaim" . }}'
            additional_volume_mounts:
              - name: nmp-additional-volume
                mount_path: /mnt/additional_storage
  models:
    controller:
      backends:
        deployments_plugin:
          enabled: true
          k8s_executor: kind-k8s
          default_executor: kind-k8s
  # Wire a nemo-deployments k8s executor so deployment_mode=k8s agent
  # deployments (test_nemo_agents_k8s.py) run as real Deployment+Service
  # workloads. default_namespace is omitted so the executor uses its own pod
  # namespace (the Helm release namespace), landing the agent beside the platform.
  agents:
    deployments:
      k8s_executor: kind-k8s
      container_port: 8000
  deployments:
    default_executor: kind-k8s
    executors:
      - name: kind-k8s
        backend: k8s
        # No config needed: kubeconfig_path unset -> in-cluster ServiceAccount
        # auth; default_namespace unset -> POD_NAMESPACE (release namespace).
