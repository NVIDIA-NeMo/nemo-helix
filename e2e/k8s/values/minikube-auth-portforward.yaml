# CPU-only minikube values for local auth E2E verification without ingress.
#
# Usage:
#   helm upgrade -i nemo-helix k8s/helm -f e2e/k8s/values/minikube-auth-portforward.yaml
#
# This keeps the auth-enabled local harness but disables ingress so the stack
# can be validated through kubectl port-forward on machines where registry.k8s.io
# is blocked and the ingress addon cannot bootstrap. The chart still keeps split
# pods on the API service URL while the API pod itself loops back to localhost.

postgresql:
  persistence:
    storageClass: standard

core:
  storage:
    storageClass: standard
    volumePermissionsImage: docker.io/library/busybox:stable

envoyProxy:
  enabled: false

ingress:
  enabled: false

platformConfig:
  auth:
    enabled: true
    policy_decision_point_provider: embedded
    policy_data_refresh_interval: 2
    bundle_cache_seconds: 2
    admin_email: "admin@example.com"
    allowed_service_principals:
      - e2e-test
      - e2e-test-on-behalf
  inference_gateway:
    mock_provider_prefix: igw-mock-
  jobs:
    executors:
      - provider: cpu
        profile: additional-volume
        backend: kubernetes_job
        config:
          service_account_name: '{{ include "nhx-core.jobsServiceAccountName" . }}'
          launcher_image: '{{ include "nhx-core.image" . }}'
          storage:
            pvc_name: '{{ include "nhx-core.persistentVolumeClaim" . }}'
            volume_permissions_image: '{{ .Values.core.storage.volumePermissionsImage }}'
            additional_volumes:
              - name: nhx-additional-volume
                persistent_volume_claim:
                  claim_name: '{{ include "nhx-core.persistentVolumeClaim" . }}'
            additional_volume_mounts:
              - name: nhx-additional-volume
                mount_path: /mnt/additional_storage
  models:
    controller:
      backends:
        deployments_plugin:
          enabled: true
          k8s_executor: local-k8s
          default_executor: local-k8s
  deployments:
    executors:
      - name: local-k8s
        backend: k8s
        config:
          default_namespace: default
    default_executor: local-k8s
