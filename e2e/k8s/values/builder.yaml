# The builder, for the Kind builder e2e (e2e/test_builder.py). Layer it on kind.yaml, and on auth-overlay.yaml for the
# auth-on run. Set the development registry's password with `--set-file builder.devRegistry.password=<file>`.

builder:
  enabled: true
  workVolume:
    # kind's default storage class provisions ReadWriteOnce only, once a pod uses the claim. A kind cluster is one
    # node, so every build pod lands where the volume is.
    accessModes:
      - ReadWriteOnce
    size: 5Gi
  devRegistry:
    enabled: true

platformConfig:
  builder:
    repository_prefix: e2e-builds
    sandbox:
      cpu: 500m
      memory: 1Gi
      ephemeral_storage: 4Gi
