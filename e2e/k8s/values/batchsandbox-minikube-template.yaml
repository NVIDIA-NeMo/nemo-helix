# BatchSandbox template for local minikube. Same ConfigMap name as
# k8s/helm/examples/opensandbox/batchsandbox-template.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensandbox-batchsandbox-template
  namespace: opensandbox-system
  labels:
    app.kubernetes.io/part-of: opensandbox
    opensandbox.nvidia.com/isolation-class: shared-kernel
data:
  batchsandbox-template.yaml: |
    metadata:
      labels:
        opensandbox.nvidia.com/isolation-class: shared-kernel
        opensandbox.nvidia.com/runtime: shared-kernel
    spec:
      replicas: 1
      template:
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          # Task code is untrusted and must not hold a cluster token.
          automountServiceAccountToken: false
          # Sandbox pods are built from this template by the OpenSandbox server,
          # not by the jobs controller, so neither jobs executor_defaults
          # image_pull_secrets nor the chart's top-level imagePullSecrets apply.
          imagePullSecrets:
            - name: nvcrimagepullsecret
          # Create-time default for the sandbox container. Requests must not exceed
          # limits. These match platformConfig.rl.sandbox_resources (4 CPU, 8Gi).
          containers:
            - name: sandbox
              volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
              resources:
                requests:
                  cpu: "4"
                  memory: 8Gi
                limits:
                  cpu: "4"
                  memory: 8Gi
          tolerations:
            - key: nvidia.com/gpu
              operator: Exists
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 8Gi
