# BatchSandbox template for the kind sandboxed Gym e2e (e2e/k8s/scripts/install_opensandbox_kind.sh).
# Same ConfigMap name as k8s/helm/examples/opensandbox/batchsandbox-template.yaml. Like the minikube
# template, it leaves out that file's node affinity: a kind cluster is one control-plane node, which
# the affinity would refuse.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensandbox-batchsandbox-template
  namespace: opensandbox-system
  labels:
    app.kubernetes.io/part-of: opensandbox
    opensandbox.nvidia.com/isolation-class: shared-kernel
data:
  batchsandbox-template.yaml: |
    metadata:
      labels:
        opensandbox.nvidia.com/isolation-class: shared-kernel
        opensandbox.nvidia.com/runtime: shared-kernel
    spec:
      replicas: 1
      template:
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          # Task code is untrusted and must not hold a cluster token.
          automountServiceAccountToken: false
          # Sandbox pods are built from this template by the OpenSandbox server, not by the jobs
          # controller, so the chart's imagePullSecrets do not reach them. setup_local_kind_cpu.sh
          # creates ghcr-pull when GITHUB_TOKEN is set. CI also pulls the Gym host image onto the
          # node first, so a cluster without the Secret still starts sandboxes from loaded images.
          imagePullSecrets:
            - name: ghcr-pull
          # Create-time default for the sandbox container. Requests must not exceed limits. These
          # match platformConfig.evals.sandbox_resources in e2e/k8s/values/gym-sandbox.yaml, sized
          # to fit beside the platform on a 4-CPU, 16 GB CI runner.
          containers:
            - name: sandbox
              volumeMounts:
                - name: dshm
                  mountPath: /dev/shm
              resources:
                requests:
                  cpu: "1"
                  memory: 4Gi
                limits:
                  cpu: "1"
                  memory: 4Gi
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 2Gi
