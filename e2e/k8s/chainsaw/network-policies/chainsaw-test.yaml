apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: network-policies
spec:
  timeouts:
    apply: 30s
    assert: 2m
    cleanup: 2m
    delete: 2m
  steps:
    - name: assert network policies rendered
      try:
        - assert:
            resource:
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: nemo-helix-api-ingress
              spec:
                policyTypes:
                  - Ingress
        - assert:
            resource:
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: nemo-helix-core-controller-ingress
              spec:
                policyTypes:
                  - Ingress
        - assert:
            resource:
              apiVersion: networking.k8s.io/v1
              kind: NetworkPolicy
              metadata:
                name: nemo-helix-jobs-egress
              spec:
                policyTypes:
                  - Egress

    - name: create open in-cluster target
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Service
              metadata:
                name: nhx-np-open-http
              spec:
                selector:
                  app: nhx-network-policy-open-target
                ports:
                  - name: http
                    port: 8080
                    targetPort: http
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: nhx-np-open-http
                labels:
                  app: nhx-network-policy-open-target
              spec:
                restartPolicy: Never
                containers:
                  - name: http
                    image: docker.io/library/python:3.12-alpine
                    ports:
                      - name: http
                        containerPort: 8080
                    command:
                      - python
                      - -m
                      - http.server
                      - "8080"
        - wait:
            apiVersion: v1
            kind: Pod
            name: nhx-np-open-http
            for:
              condition:
                name: Ready
                value: "True"
            timeout: 2m

    - name: assert allowed traffic
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: nhx-np-release-api
                labels:
                  app.kubernetes.io/name: nemo-helix
                  app.kubernetes.io/instance: nemo-helix
              spec:
                restartPolicy: Never
                containers:
                  - name: curl
                    image: curlimages/curl:8.11.1
                    command:
                      - curl
                      - -fsS
                      - --connect-timeout
                      - "8"
                      - --max-time
                      - "8"
                      - http://nemo-helix-api:8080/health/ready
        - wait:
            apiVersion: v1
            kind: Pod
            name: nhx-np-release-api
            for:
              jsonPath:
                path: "{.status.phase}"
                value: Succeeded
            timeout: 2m
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: nhx-np-managed-job-api
                labels:
                  app: nemo-job
                  nhx.nvidia.com/managed_by: jobs-controller
              spec:
                restartPolicy: Never
                containers:
                  - name: curl
                    image: curlimages/curl:8.11.1
                    command:
                      - curl
                      - -fsS
                      - --connect-timeout
                      - "8"
                      - --max-time
                      - "8"
                      - http://nemo-helix-api:8080/health/ready
        - wait:
            apiVersion: v1
            kind: Pod
            name: nhx-np-managed-job-api
            for:
              jsonPath:
                path: "{.status.phase}"
                value: Succeeded
            timeout: 2m
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: nhx-np-release-controller
                labels:
                  app.kubernetes.io/name: nemo-helix
                  app.kubernetes.io/instance: nemo-helix
              spec:
                restartPolicy: Never
                containers:
                  - name: curl
                    image: curlimages/curl:8.11.1
                    command:
                      - curl
                      - -fsS
                      - --connect-timeout
                      - "8"
                      - --max-time
                      - "8"
                      - http://nemo-helix-core-controller:8080/health/ready
        - wait:
            apiVersion: v1
            kind: Pod
            name: nhx-np-release-controller
            for:
              jsonPath:
                path: "{.status.phase}"
                value: Succeeded
            timeout: 2m
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: nhx-np-release-open-http
                labels:
                  app.kubernetes.io/name: nemo-helix
                  app.kubernetes.io/instance: nemo-helix
              spec:
                restartPolicy: Never
                containers:
                  - name: curl
                    image: curlimages/curl:8.11.1
                    command:
                      - curl
                      - -fsS
                      - --connect-timeout
                      - "8"
                      - --max-time
                      - "8"
                      - http://nhx-np-open-http:8080/
        - wait:
            apiVersion: v1
            kind: Pod
            name: nhx-np-release-open-http
            for:
              jsonPath:
                path: "{.status.phase}"
                value: Succeeded
            timeout: 2m

    - name: assert denied traffic
      try:
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: nhx-np-managed-job-open-http
                labels:
                  app: nemo-job
                  nhx.nvidia.com/managed_by: jobs-controller
              spec:
                restartPolicy: Never
                containers:
                  - name: curl
                    image: curlimages/curl:8.11.1
                    command:
                      - curl
                      - -fsS
                      - --connect-timeout
                      - "8"
                      - --max-time
                      - "8"
                      - http://nhx-np-open-http:8080/
        - wait:
            apiVersion: v1
            kind: Pod
            name: nhx-np-managed-job-open-http
            for:
              jsonPath:
                path: "{.status.phase}"
                value: Failed
            timeout: 2m
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: nhx-np-denied-api
                labels:
                  app: nhx-network-policy-probe
              spec:
                restartPolicy: Never
                containers:
                  - name: curl
                    image: curlimages/curl:8.11.1
                    command:
                      - curl
                      - -fsS
                      - --connect-timeout
                      - "8"
                      - --max-time
                      - "8"
                      - http://nemo-helix-api:8080/health/ready
        - wait:
            apiVersion: v1
            kind: Pod
            name: nhx-np-denied-api
            for:
              jsonPath:
                path: "{.status.phase}"
                value: Failed
            timeout: 2m
        - apply:
            resource:
              apiVersion: v1
              kind: Pod
              metadata:
                name: nhx-np-denied-controller
                labels:
                  app: nhx-network-policy-probe
              spec:
                restartPolicy: Never
                containers:
                  - name: curl
                    image: curlimages/curl:8.11.1
                    command:
                      - curl
                      - -fsS
                      - --connect-timeout
                      - "8"
                      - --max-time
                      - "8"
                      - http://nemo-helix-core-controller:8080/health/ready
        - wait:
            apiVersion: v1
            kind: Pod
            name: nhx-np-denied-controller
            for:
              jsonPath:
                path: "{.status.phase}"
                value: Failed
            timeout: 2m
