# Cancel paths. Runs at once; its run queues behind the slow tasks' run.
schema_version = "1.1"

[task]
name = "taskset-e2e/quick"

[agent]
timeout_sec = 120.0

[verifier]
timeout_sec = 60.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 512
