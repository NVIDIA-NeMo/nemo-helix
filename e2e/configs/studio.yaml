# Credential-free Studio browser tests: local APIs, no jobs or model inference.
platform:
  runtime: none
  base_url: http://127.0.0.1:8080

auth:
  enabled: false

secrets:
  allow_key_creation: true

studio:
  static_files_path: web/packages/studio/dist
  feature_flags:
    trace_graph_enabled: true
