[pytest]
pythonpath = /app
python_files = test_*.py
python_functions = test_*
addopts =
    --strict-markers
    --tb=short
    -ra
markers =
    auth_idp: Auth IdP provider contract tests
    auth_idp_runtime: Tests that require a provider runtime
    auth_idp_docker: Tests for the Docker Compose reference deployment
    auth_idp_k8s: Tests for a Kubernetes reference deployment
    e2e: End-to-end tests against deployed infrastructure
    xdist_group(name): Serial execution group metadata
timeout = 600
timeout_method = thread
