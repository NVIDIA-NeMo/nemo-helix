# CLI Configuration for NeMo Platform CLI
# This file configures CLI-specific behavior like table column display for listing entities.

# Default columns when no specific config exists
defaults:
  list:
    columns:
    - name
    - workspace
    - created_at
  get_logs:
    columns:
    - timestamp
    - message

# Root `nemo --help` metadata for generated API commands.
top_level:
  auth:
    panel: Core plugins
    help: Manage auth.
    hidden: true
  access-keys:
    panel: Core plugins
    help: Manage access keys.
    hidden: true
  audit:
    panel: Functional plugins
  secrets:
    panel: Core plugins
    help: Manage secrets.

# Resource-specific configurations
config:
- resource: [auth]
  skip: true
- resource: [access_keys]
  skip: true
- resource: [iam]
  skip: true
- resource: [datasets]
  methods:
    list:
      columns:
      - name
      - description
      - format
      - files_url
      - created_at
- resource: [evaluation, configs]
  methods:
    list:
      columns:
      - name
      - description
      - created_at
- resource: [evaluation, jobs]
  methods:
    list:
      columns:
      - name
      - description
      - config.type
      - status
      - status_details.progress
      - status_details.samples_processed
      - created_at
- resource: [evaluation, targets]
  methods:
    list:
      columns:
      - name
      - description
      - created_at
- resource: [evaluation, results]
  methods:
    list:
      columns:
      - name
      - description
      - status
      - created_at
- resource: [deployment, configs]
  methods:
    list:
      columns:
      - name
      - description
      - created_at
- resource: [deployment, model_deployments]
  methods:
    list:
      columns:
      - name
      - description
      - field: '{workspace}/{name}'
        header: openai_path (workspace/name)
      - status
      - created_at
- resource: [jobs]
  skip: true
- resource: [evaluation, jobs]
  methods:
    list:
      columns:
      - name
      - description
      - status
      - created_at
- resource: [evaluation, jobs, logs]
  methods:
    list:
      columns:
      - timestamp
      - message
- resource: [audit]
  help: Auditor operations.
- resource: [audit, configs]
  methods:
    list:
      columns:
      - name
      - description
      - created_at
- resource: [audit, targets]
  methods:
    list:
      columns:
      - name
      - description
      - created_at
- resource: [audit, jobs]
  methods:
    list:
      columns:
      - name
      - description
      - status
      - created_at

- resource: [safe_synthesizer]
  skip: true

- resource: [entities]
  skip: true
  methods:
    list:
      param_help:
        entity_type: "Entity type to list. Known types: {{ENTITY_TYPES}}"

- resource: [evaluation]
  skip: true
  methods:
    live:
      skip: true
    live_global:
      skip: true

- resource: [evaluations]
  skip: true

- resource: [secrets]
  skip: true

# Gateway proxy commands: `name` is a workspace query param, not a resource identifier

# High-level file operations at the `nmp files` level

# The body is binary protobuf, which cannot be passed as a shell argument. Producers
# use an OTLP exporter or the SDK's create(body=...) instead.

# High-level inference operations at the `nemo inference` level

- resource: [workspaces]
  skip: true

- resource: [projects]
  skip: true

- resource: [files]
  skip: true

- resource: [models]
  skip: true

- resource: [adapters]
  skip: true

- resource: [inference]
  skip: true

- resource: [guardrail]
  skip: true

- resource: [intake]
  skip: true

- resource: [experiments]
  skip: true
