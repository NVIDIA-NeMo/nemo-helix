schema-version = "1.14.0"

[install]
uv = { pkg-path = "uv", version = "0.10.10", pkg-group = "uv" }

[vars]
UV_VENV_SEED="1"
UV_MANAGED_PYTHON="1"
UV_PYTHON="3.12"
UV_CACHE_DIR="${FLOX_ENV_CACHE}/uv-cache"
UV_PYTHON_INSTALL_DIR="${FLOX_ENV_CACHE}/python"

[hook]
on-activate = '''
  set -euo pipefail

  export VIRTUAL_ENV="$PWD/.venv"
  export PATH="$VIRTUAL_ENV/bin:$PATH"

  if uv sync --frozen --all-packages --check; then
    return 0
  fi

  echo "Python environment is out of sync; synchronizing..."
  uv sync --frozen --all-packages
'''
