      "uv": {
        "pkg-path": "uv",
        "pkg-group": "uv",
        "version": "0.10.10"
      }
    },
    "vars": {
      "UV_CACHE_DIR": "${FLOX_ENV_CACHE}/uv-cache",
      "UV_MANAGED_PYTHON": "1",
      "UV_PYTHON": "3.12",
      "UV_PYTHON_INSTALL_DIR": "${FLOX_ENV_CACHE}/python",
      "UV_VENV_SEED": "1"
    },
    "hook": {
      "on-activate": "  set -euo pipefail\n\n  export VIRTUAL_ENV=\"$PWD/.venv\"\n  export PATH=\"$VIRTUAL_ENV/bin:$PATH\"\n\n  if uv sync --frozen --all-packages --check; then\n    return 0\n  fi\n\n  echo \"Python environment is out of sync; synchronizing...\"\n  uv sync --frozen --all-packages\n"
    },
    "options": {}
  },
