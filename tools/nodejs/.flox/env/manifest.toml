schema-version = "1.14.0"

[install]
# Fixed releases are not in the Flox catalog yet; use the pinned Nixpkgs package.
nodejs = { flake = "github:NixOS/nixpkgs/0f584e7c37a52b38bb201f5e7b8d66a74bf62d6a#nodejs_22" }

[vars]
NODE_VERSION="22.23.4"
PNPM_VERSION = "10.34.5"
COREPACK_HOME = "${FLOX_ENV_CACHE}/corepack"
COREPACK_SHIMS = "${FLOX_ENV_CACHE}/corepack/bin"

[hook]
on-activate = '''
  set -euo pipefail
  mkdir -p "$COREPACK_SHIMS"
  if ! test -x "$COREPACK_SHIMS/pnpm" || ! "$COREPACK_SHIMS/pnpm" --version | grep -Fxq "$PNPM_VERSION"; then
    corepack install --global "pnpm@$PNPM_VERSION"
    corepack enable --install-directory "$COREPACK_SHIMS"
  fi
  export PATH="$COREPACK_SHIMS:$PATH"
'''

[options]
systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
