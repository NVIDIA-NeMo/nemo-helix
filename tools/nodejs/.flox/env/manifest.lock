    "vars": {
      "COREPACK_HOME": "${FLOX_ENV_CACHE}/corepack",
      "COREPACK_SHIMS": "${FLOX_ENV_CACHE}/corepack/bin",
      "NODE_VERSION": "22.23.4",
      "PNPM_VERSION": "10.34.5"
    },
    "hook": {
      "on-activate": "  set -euo pipefail\n  mkdir -p \"$COREPACK_SHIMS\"\n  if ! test -x \"$COREPACK_SHIMS/pnpm\" || ! \"$COREPACK_SHIMS/pnpm\" --version | grep -Fxq \"$PNPM_VERSION\"; then\n    corepack install --global \"pnpm@$PNPM_VERSION\"\n    corepack enable --install-directory \"$COREPACK_SHIMS\"\n  fi\n  export PATH=\"$COREPACK_SHIMS:$PATH\"\n"
    },
    "options": {
      "systems": [
