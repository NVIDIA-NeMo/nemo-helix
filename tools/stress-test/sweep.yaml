run_key: stress
payload_bytes: 1024
pods:
  exit:
    cpu_request: 100m
    memory_request: 256Mi
    cpu_limit: 500m
    memory_limit: 512Mi
  idle:
    cpu_request: 100m
    memory_request: 256Mi
    cpu_limit: 500m
    memory_limit: 512Mi
  hammer:
    cpu_request: 500m
    memory_request: 512Mi
    cpu_limit: "1"
    memory_limit: 1Gi
steps:
  - {id: exit-01, kind: exit, count: 1}
  - {id: exit-10, kind: exit, count: 10}
  - {id: exit-25, kind: exit, count: 25}
  - {id: idle-01, kind: idle, count: 1, duration_seconds: 300}
  - {id: idle-10, kind: idle, count: 10, duration_seconds: 300}
  - {id: idle-25, kind: idle, count: 25, duration_seconds: 300}
  - {id: files-01, kind: hammer, count: 1, duration_seconds: 60, service: files, rate_per_second: 5}
  - {id: files-10, kind: hammer, count: 10, duration_seconds: 60, service: files, rate_per_second: 5}
  - {id: files-25, kind: hammer, count: 25, duration_seconds: 60, service: files, rate_per_second: 5}
  - {id: secrets-01, kind: hammer, count: 1, duration_seconds: 60, service: secrets, rate_per_second: 5}
  - {id: secrets-10, kind: hammer, count: 10, duration_seconds: 60, service: secrets, rate_per_second: 5}
  - {id: secrets-25, kind: hammer, count: 25, duration_seconds: 60, service: secrets, rate_per_second: 5}
  - {id: auth-01, kind: hammer, count: 1, duration_seconds: 60, service: auth, rate_per_second: 5}
  - {id: auth-10, kind: hammer, count: 10, duration_seconds: 60, service: auth, rate_per_second: 5}
  - {id: auth-25, kind: hammer, count: 25, duration_seconds: 60, service: auth, rate_per_second: 5}
