[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nemo-studio-assistant"
version = "0.1.0"
description = "NeMo Studio Assistant — a Fabric Deep Agents assistant for NeMo Helix tasks."
requires-python = ">=3.12,<3.14"
dependencies = [
    "nemo-helix",
    "fastmcp>=3.2.0",
    "httpx",
]

[project.scripts]
nemo-studio-assistant-mcp = "nemo_studio_assistant.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_studio_assistant"]

[tool.uv.sources]
nemo-agents-plugin = { path = "../../plugins/nemo-agents", editable = true }

[dependency-groups]
test = [
    "nemo-agents-plugin",
    "pytest>=9.0.3",
]
