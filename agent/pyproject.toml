[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meridian-ops-tools"
version = "0.1.0"
description = "Tool server for the Meridian Compute infra-ops routing agent (nemo-agents-spec-v1 example)."
requires-python = ">=3.11,<3.15"
dependencies = [
    "mcp>=1.28.1,<2",
    "httpx>=0.27",
]

[project.scripts]
meridian-ops-tools = "mcps.ops_tools:main"

[tool.hatch.build.targets.wheel]
packages = ["mcps"]
