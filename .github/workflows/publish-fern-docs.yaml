# Publishes the Fern documentation site using the default branch's tooling when
# docs change on main or a release branch, a release/docs tag is pushed, or the
# workflow is manually triggered. Versioned content follows origin release branches.
#
# Stable SemVer release tags only remove the matching branch's preview badge;
# they never supply documentation content or create separate version entries.
# To republish docs without creating a release version: push a docs tag, for
# example `git tag docs/v1.2.0 && git push origin docs/v1.2.0`.
# Or use the "Run workflow" button in the Actions tab.
#
# Required configuration:
# - Organization secret: DOCS_FERN_TOKEN (from `fern token` for the nvidia Fern org)

name: Publish Fern Docs

on:
  push:
    branches:
      - main
      - 'release/*'
    paths:
      - 'docs/**'
    tags:
      - '*.*.*'
      - 'docs/v*'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fern-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Install Fern dependencies
        working-directory: ./docs/fern
        run: npm ci

      - name: Check release tag eligibility
        id: release-tag
        if: ${{ github.ref_type == 'tag' && !startsWith(github.ref_name, 'docs/') }}
        working-directory: ./docs/fern
        run: |
          node scripts/materialize-release-versions.mjs --check-tag "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Materialize release versions
        if: ${{ steps.release-tag.outputs.eligible != 'false' }}
        working-directory: ./docs/fern
        run: npm run materialize:versions

      - name: Check Fern docs
        if: ${{ steps.release-tag.outputs.eligible != 'false' }}
        run: make docs-check

      - name: Publish Docs
        if: ${{ steps.release-tag.outputs.eligible != 'false' }}
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        working-directory: ./docs/fern
        run: npm run generate
