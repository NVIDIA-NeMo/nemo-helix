name: Release smoke checks

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: "Published chart version (e.g. 0.8.0 or 0.8.0-nightly-20261021000000)"
        required: true
        type: string
      send-notifications:
        description: Send notifications to Slack
        type: boolean
        default: false
  workflow_call:
    inputs:
      release-version:
        required: true
        type: string
      send-notifications:
        type: boolean
        default: false
    secrets:
      NGC_REGISTRY_READ_TOKEN:
        required: false
      SLACK_RELEASE_WEBHOOK:
        required: false

permissions:
  contents: read
  packages: read

env:
  UV_VERSION: "0.10.10"
  RELEASE_VERSION: ${{ inputs.release-version }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      wheel_version: ${{ steps.resolve.outputs.wheel_version }}
      wheel_index: ${{ steps.resolve.outputs.wheel_index }}
      image_registry: ${{ steps.resolve.outputs.image_registry }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      chart_repository: ${{ steps.resolve.outputs.chart_repository }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { resolveRelease } = require("./.github/scripts/release-smoke.cjs");
            for (const [key, value] of Object.entries(resolveRelease(process.env.RELEASE_VERSION))) {
              core.setOutput(key, value);
            }

  macos:
    name: Published wheel (macOS)
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 20
    env:
      WHEEL_VERSION: ${{ needs.prepare.outputs.wheel_version }}
      WHEEL_INDEX: ${{ needs.prepare.outputs.wheel_index }}
      DO_NOT_TRACK: "1"
    steps:
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      # Native ARM Mac; package installation and CLI startup need no Docker VM.
      - name: Install published package and launch CLI
        working-directory: ${{ runner.temp }}
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/smoke-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/smoke-bin
        run: |
          uv tool install --python 3.12 --index "$WHEEL_INDEX" "nemo-helix[all]==$WHEEL_VERSION"
          "$UV_TOOL_BIN_DIR/nemo" --version

  kubernetes:
    name: Published images and chart
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_REGISTRY: ${{ needs.prepare.outputs.image_registry }}
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      CHART_REPOSITORY: ${{ needs.prepare.outputs.chart_repository }}
      KIND_CLUSTER_NAME: release-smoke
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Create disposable Kind cluster
        uses: ./.github/actions/setup-kind-cluster
        with:
          kind-cluster-name: release-smoke
          kube-namespace: release-smoke
          install-nemo-helix: "false"
          wait-for-api: "false"
          kind-enable-gateway: "false"
          image-registry: ${{ env.IMAGE_REGISTRY }}
          image-tag: ${{ env.IMAGE_TAG }}
          kind-image-pull-user: ${{ github.actor }}
          kind-image-pull-token: ${{ github.token }}
      - name: Pull released artifacts, install chart, and check readiness
        timeout-minutes: 30
        env:
          NGC_REGISTRY_READ_TOKEN: ${{ secrets.NGC_REGISTRY_READ_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/release-smoke.sh
      - name: Collect Kubernetes logs
        if: always()
        timeout-minutes: 2
        run: bash e2e/k8s/scripts/collect_k8s_logs.sh smoke-logs
      - name: Delete Kind cluster
        if: always()
        timeout-minutes: 2
        run: kind delete cluster --name "$KIND_CLUSTER_NAME"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: smoke-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: smoke-logs/
          retention-days: 7

  result:
    name: Combined smoke result
    if: always()
    needs: [prepare, macos, kubernetes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: always()
        with:
          persist-credentials: false
      - name: Report result and optionally notify Slack
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          KUBERNETES_RESULT: ${{ needs.kubernetes.result }}
          SEND_NOTIFICATIONS: ${{ inputs.send-notifications }}
          SLACK_RELEASE_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { finishSmoke } = require("./.github/scripts/release-smoke.cjs");
            const { result, text } = await finishSmoke({ env: process.env, fetchImpl: fetch });
            await core.summary.addRaw(text).write();
            if (result !== "passed") core.setFailed(`Smoke checks ${result}`);
