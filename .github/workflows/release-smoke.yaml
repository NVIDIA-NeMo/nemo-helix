name: Release smoke checks

on:
  workflow_dispatch:
    inputs:
      release-version:
        description: "Published chart version (e.g. 0.8.0 or 0.8.0-rc-20261021000000)"
        required: true
        type: string
      send-notifications:
        description: Send notifications to Slack
        type: boolean
        default: false
  workflow_call:
    inputs:
      release-version:
        required: true
        type: string
      send-notifications:
        type: boolean
        default: false
      check-latest:
        description: Verify an unpinned install does not select an older stable release
        type: boolean
        default: false
    secrets:
      AIRE_DOCKERHUB_ACCESS_TOKEN:
        required: true
      SLACK_RELEASE_WEBHOOK:
        required: false

permissions:
  contents: read
  packages: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.13.4"
  RELEASE_VERSION: ${{ inputs.release-version }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      wheel_version: ${{ steps.resolve.outputs.wheel_version }}
      wheel_index: ${{ steps.resolve.outputs.wheel_index }}
      image_registry: ${{ steps.resolve.outputs.image_registry }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      chart_repository: ${{ steps.resolve.outputs.chart_repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: resolve
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { resolveRelease } = require("./.github/scripts/release-smoke.cjs");
            for (const [key, value] of Object.entries(resolveRelease(process.env.RELEASE_VERSION))) {
              core.setOutput(key, value);
            }

  macos:
    name: Published wheel (macOS)
    needs: prepare
    runs-on: macos-15
    timeout-minutes: 20
    env:
      WHEEL_VERSION: ${{ needs.prepare.outputs.wheel_version }}
      WHEEL_INDEX: ${{ needs.prepare.outputs.wheel_index }}
      DO_NOT_TRACK: "1"
    steps:
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: false
      # Native ARM Mac; package installation and CLI startup need no Docker VM.
      - name: Install published package and launch CLI
        working-directory: ${{ runner.temp }}
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/smoke-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/smoke-bin
        run: |
          uv tool install --python "$PYTHON_VERSION" --index "$WHEEL_INDEX" "nemo-helix[all]==$WHEEL_VERSION"
          installed_version=$("$UV_TOOL_DIR/nemo-helix/bin/python" -c 'from importlib.metadata import version; print(version("nemo-helix"))')
          if [[ "$installed_version" != "$WHEEL_VERSION" ]]; then
            echo "::error::Expected nemo-helix $WHEEL_VERSION, installed $installed_version"
            exit 1
          fi
          "$UV_TOOL_BIN_DIR/nemo" --version

      - name: Check default stable installation
        if: ${{ inputs.check-latest }}
        working-directory: ${{ runner.temp }}
        env:
          # Separate environment so the pinned install cannot influence resolution.
          UV_TOOL_DIR: ${{ runner.temp }}/smoke-latest-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/smoke-latest-bin
        run: |
          uv tool install --python "$PYTHON_VERSION" --index "$WHEEL_INDEX" "nemo-helix[all]"
          "$UV_TOOL_DIR/nemo-helix/bin/python" - <<'PYTHON'
          import os
          import re
          from importlib.metadata import version

          expected = os.environ["WHEEL_VERSION"]
          installed = version("nemo-helix")
          if not all(re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", v) for v in (expected, installed)):
              raise SystemExit(f"::error::Expected stable versions, got {expected=} and {installed=}")
          if tuple(map(int, installed.split("."))) < tuple(map(int, expected.split("."))):
              raise SystemExit(f"::error::Expected at least nemo-helix {expected}, installed {installed}")
          print(f"Default install selected {installed}; requested release {expected} was verified separately.")
          PYTHON

  kubernetes:
    name: Published images and chart
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE_REGISTRY: ${{ needs.prepare.outputs.image_registry }}
      IMAGE_TAG: ${{ needs.prepare.outputs.image_tag }}
      CHART_REPOSITORY: ${{ needs.prepare.outputs.chart_repository }}
      KIND_CLUSTER_NAME: release-smoke
      DOCKER_CONFIG: /tmp/smoke-docker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ vars.AIRE_DOCKERHUB_USERNAME }}
          password: ${{ secrets.AIRE_DOCKERHUB_ACCESS_TOKEN }}
      - name: Create disposable Kind cluster
        uses: ./.github/actions/setup-kind-cluster
        with:
          kind-cluster-name: release-smoke
          kube-namespace: release-smoke
          install-nemo-helix: "false"
          wait-for-api: "false"
          kind-enable-gateway: "false"
          image-registry: ${{ env.IMAGE_REGISTRY }}
          image-tag: ${{ env.IMAGE_TAG }}
          kind-image-pull-user: ${{ github.actor }}
          kind-image-pull-token: ${{ github.token }}
      - name: Configure Docker Hub pulls in Kind
        timeout-minutes: 2
        # Copy before GHCR login so the secret contains only Docker Hub credentials.
        run: |
          kubectl -n release-smoke create secret generic dockerhub \
            --type=kubernetes.io/dockerconfigjson \
            --from-file=".dockerconfigjson=$DOCKER_CONFIG/config.json"
      - name: Download published chart
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$CHART_REPOSITORY" == oci:* ]]; then
            printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
            helm pull "$CHART_REPOSITORY" --version "$RELEASE_VERSION" --destination "$RUNNER_TEMP"
          else
            helm pull nemo-helix --repo "$CHART_REPOSITORY" --version "$RELEASE_VERSION" --destination "$RUNNER_TEMP"
          fi
      - name: Pull released API and tasks images
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          registry="${IMAGE_REGISTRY%%/*}"
          if [[ "$registry" == ghcr.io ]]; then
            printf '%s' "$GH_TOKEN" | docker login "$registry" --username "$GITHUB_ACTOR" --password-stdin
          fi
          docker pull "$IMAGE_REGISTRY/nhx-api:$IMAGE_TAG"
          docker pull "$IMAGE_REGISTRY/nhx-tasks:$IMAGE_TAG"
      - name: Load API image into Kind
        timeout-minutes: 5
        # Export only the runner's platform; Kind otherwise imports missing architectures.
        run: |
          docker image save --platform linux/amd64 --output "$RUNNER_TEMP/nhx-api.tar" "$IMAGE_REGISTRY/nhx-api:$IMAGE_TAG"
          kind load image-archive --name "$KIND_CLUSTER_NAME" "$RUNNER_TEMP/nhx-api.tar"
          rm "$RUNNER_TEMP/nhx-api.tar"
      - name: Install published chart
        timeout-minutes: 10
        run: |
          helm upgrade --install release-smoke "$RUNNER_TEMP/nemo-helix-$RELEASE_VERSION.tgz" \
            --namespace release-smoke --create-namespace --wait --timeout 8m \
            -f .github/scripts/release-smoke-values.yaml \
            --set-string "imagePullSecrets[0].name=dockerhub" \
            --set-string "api.image.repository=$IMAGE_REGISTRY/nhx-api" \
            --set-string "api.image.tag=$IMAGE_TAG" \
            --set-string "core.image.repository=$IMAGE_REGISTRY/nhx-api" \
            --set-string "core.image.tag=$IMAGE_TAG" \
            --set-string "platformConfig.platform.image_registry=$IMAGE_REGISTRY" \
            --set-string "platformConfig.platform.image_tag=$IMAGE_TAG"
      - name: Check API readiness
        timeout-minutes: 3
        run: |
          mkdir -p smoke-logs
          kubectl -n release-smoke port-forward svc/release-smoke-api 8080:8080 > smoke-logs/port-forward.log 2>&1 &
          forward_pid=$!
          trap 'kill "$forward_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 2 \
            --max-time 5 --retry-max-time 120 http://127.0.0.1:8080/health/ready \
            | tee smoke-logs/readiness.json | jq -e '.status == "ready"'
      - name: Collect Kubernetes logs
        if: always()
        timeout-minutes: 2
        run: bash e2e/k8s/scripts/collect_k8s_logs.sh smoke-logs
      - name: Delete Kind cluster
        if: always()
        timeout-minutes: 2
        run: kind delete cluster --name "$KIND_CLUSTER_NAME"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: smoke-logs/
          retention-days: 7

  result:
    name: Combined smoke result
    if: always()
    needs: [prepare, macos, kubernetes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: always()
        with:
          persist-credentials: false
      - name: Report result and optionally notify Slack
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          MACOS_RESULT: ${{ needs.macos.result }}
          KUBERNETES_RESULT: ${{ needs.kubernetes.result }}
          SEND_NOTIFICATIONS: ${{ inputs.send-notifications }}
          SLACK_RELEASE_WEBHOOK: ${{ secrets.SLACK_RELEASE_WEBHOOK }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const { finishSmoke } = require("./.github/scripts/release-smoke.cjs");
            const { result, text } = await finishSmoke({ env: process.env, fetchImpl: fetch, github, context });
            await core.summary.addRaw(text).write();
            if (result !== "passed") core.setFailed(`Smoke checks ${result}`);
