# Validates Fern docs configuration on pull requests.
# See docs/fern/README.md and docs/fern/docs.yml `libraries`.

name: Fern docs (check)

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/fern-docs-ci.yaml'

permissions:
  contents: read

env:
  UV_VERSION: "0.9.14"
  TOOLCHAIN: system

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          lfs: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/fern/package-lock.json

      - name: Install docs tooling
        working-directory: ./docs/fern
        run: npm ci

      - name: Validate Fern configuration
        working-directory: ./docs/fern
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        run: npm run check

  python-snippets:
    name: Docs lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.12"
          cache-dependency-glob: uv.lock

      - name: Lint Python snippets
        run: make docs-lint-snippets

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: docs/fern/package-lock.json

      - name: Install docs tooling
        working-directory: ./docs/fern
        run: npm ci

      - name: Check for broken links
        working-directory: ./docs/fern
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        run: npm run broken-links
