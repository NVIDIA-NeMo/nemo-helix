# Taskset runs on kind, end to end: e2e/test_taskset_runs.py against a platform with the run controller, the builder
# and OpenSandbox. Nightly and on dispatch, never on PRs or the merge queue: it gates no merge.
#
# Three rows, auth x workload_token_exchange (auth-off has no exchange):
# - auth-off-exchange-false: the platform chart with auth off.
# - auth-on-exchange-false: the platform chart with e2e/k8s/values/auth-overlay.yaml (auth on, no gateway, no OIDC),
#   as a non-admin user with an unsigned JWT. Jobs act as the submitter through principal headers, the way auth on
#   runs until workload token exchange is finished.
# - auth-on-exchange-true: the Authentik demo (contrib/auth/authentik) with workload token exchange, as a non-admin
#   OIDC user, so Jobs run as the nemo-helix-jobs ServiceAccount on behalf of the user; the only mode that reaches
#   Job-identity bugs such as NVBug 7083853. Red until that is fixed on main. The demo's own services authenticate
#   through the exchange, so it has no exchange-off row.
# Steps for the platform chart run when workload_token_exchange is false, the Authentik ones when it is true.

name: Nightly taskset runs e2e

on:
  # TEMPORARY, drop before merge: one CI run of this branch.
  push:
    branches: [taskset-runs-auth-e2e/ngoncharenko]
  schedule:
    - cron: "0 10 * * *"  # 10:00 UTC (02:00 PST), ahead of the 16:00 America/Los_Angeles RC cut
  workflow_dispatch:
    inputs:
      repeat:
        description: Copies to run, each on its own runner and kind cluster.
        required: false
        type: number
        default: 1
      source_sha:
        description: >-
          Commit to build and test; default the dispatched ref's head. Use a commit on main: images are tagged with
          this SHA, which an open PR's builds also use for its head, with different code (its merge commit).
        required: false
        type: string
        default: ""
      classify_for:
        description: Set by `report` only. The scheduled run this one classifies as flaky or a regression.
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.13.4"
  TOOLCHAIN: system

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      copies: ${{ steps.plan.outputs.copies }}
    steps:
      - id: plan
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
          REPEAT: ${{ inputs.repeat || 1 }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be a full commit SHA" >&2; exit 1; }
          if ! [[ "${REPEAT}" =~ ^[0-9]+$ ]] || (( REPEAT < 1 || REPEAT > 20 )); then
            echo "repeat must be 1-20" >&2
            exit 1
          fi
          echo "source_sha=${SOURCE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "copies=$(python3 -c "import json, sys; print(json.dumps(list(range(1, int(sys.argv[1]) + 1))))" "${REPEAT}")" >> "${GITHUB_OUTPUT}"

  # CI publishes the images for main and same-repo PRs, tagged with the commit, but only when its path filter matches:
  # reuse them when all four are there, else build them below. A PR's builds tag their merge commit's images with
  # the PR's head SHA, so on a PR head this tests the merge with main.
  find-images:
    name: Find images
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: read
    outputs:
      found: ${{ steps.find.outputs.found }}
      image_registry: ${{ steps.find.outputs.image_registry }}
      image_tag: ${{ steps.find.outputs.image_tag }}
    steps:
      - id: find
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
        run: |
          set -euo pipefail
          registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "${GHCR_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          found=true
          for image in nhx-api nhx-tasks nhx-builder-tasks nhx-kaniko; do
            if ! docker manifest inspect "${registry}/${image}:${SOURCE_SHA}" >/dev/null; then
              echo "No ${registry}/${image}:${SOURCE_SHA}: building the images"
              found=false
              break
            fi
          done
          {
            echo "found=${found}"
            echo "image_registry=${registry}"
            echo "image_tag=${SOURCE_SHA}"
          } >> "${GITHUB_OUTPUT}"

  build-images:
    name: Build images
    needs: [plan, find-images]
    if: needs.find-images.outputs.found != 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-cpu-smoke-images.yaml
    with:
      source_sha: ${{ needs.plan.outputs.source_sha }}
      checkout_ref: ${{ needs.plan.outputs.source_sha }}  # build exactly the commit under test
      publish: true

  kind-taskset-runs-e2e:
    name: Kind taskset runs e2e (auth-${{ matrix.auth }}, exchange-${{ matrix.workload_token_exchange }}, ${{ matrix.copy }})
    needs: [plan, find-images, build-images]
    # Runs on images this run built, or on CI's when the build was skipped for them.
    if: >-
      ${{ !cancelled() && (needs.build-images.result == 'success'
      || (needs.build-images.result == 'skipped' && needs.find-images.outputs.found == 'true')) }}
    runs-on: ubuntu-latest
    # kind, OpenSandbox and the pre-pulls, then pytest's 49-minute timeout.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        copy: ${{ fromJSON(needs.plan.outputs.copies) }}
        auth: ["off", "on"]
        workload_token_exchange: [true, false]
        exclude:
          - auth: "off"
            workload_token_exchange: true
    env:
      KIND_CLUSTER_NAME: gha-${{ github.run_id }}-${{ github.run_attempt }}-taskset-runs-${{ matrix.auth }}-${{ matrix.workload_token_exchange }}-${{ matrix.copy }}
      # The Authentik demo installs into its own namespace.
      KUBE_NAMESPACE: ${{ matrix.workload_token_exchange && 'nemo-authentik' || 'nemo-helix' }}
      NHX_E2E_IMAGE_REGISTRY: ${{ needs.build-images.outputs.image_registry || needs.find-images.outputs.image_registry }}
      NHX_E2E_IMAGE_TAG: ${{ needs.build-images.outputs.image_tag || needs.find-images.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.source_sha }}

      - name: Make a password for the development registry
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          printf '%s' "${password}" > "${RUNNER_TEMP}/builder-registry-password"

      - name: Set up kind
        uses: ./.github/actions/setup-kind-cluster
        with:
          kind-cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          kube-namespace: ${{ env.KUBE_NAMESPACE }}
          install-nemo-helix: "false"
          image-registry: ${{ env.NHX_E2E_IMAGE_REGISTRY }}
          image-tag: ${{ env.NHX_E2E_IMAGE_TAG }}
          kind-image-pull-token: ${{ github.token }}
          kind-image-pull-user: ${{ github.actor }}

      - name: Install OpenSandbox
        if: ${{ !matrix.workload_token_exchange }}
        shell: bash
        run: |
          set -euo pipefail
          kubectl create namespace "${KUBE_NAMESPACE}" --dry-run=client -o yaml | kubectl apply -f -
          # Sandboxes pull the builder's images from the development registry with this.
          kubectl -n "${KUBE_NAMESPACE}" create secret docker-registry builder-registry-pull \
            --docker-server="nemo-helix-builder-registry.${KUBE_NAMESPACE}.svc.cluster.local:5000" \
            --docker-username=builder \
            --docker-password="$(cat "${RUNNER_TEMP}/builder-registry-password")" \
            --dry-run=client -o yaml | kubectl apply -f -
          KUBE_CONTEXT="kind-${KIND_CLUSTER_NAME}" \
            BATCHSANDBOX_TEMPLATE=e2e/k8s/values/batchsandbox-kind-template.yaml \
            SANDBOX_PULL_SECRET=builder-registry-pull \
            e2e/k8s/scripts/install_opensandbox_minikube.sh

      - name: Pre-pull the platform and build step images
        shell: bash
        env:
          KIND_IMAGE_PULL_TOKEN: ${{ github.token }}
          KIND_IMAGE_PULL_USER: ${{ github.actor }}
        run: |
          e2e/k8s/scripts/prepull_kind_images.sh \
            "${NHX_E2E_IMAGE_REGISTRY}/nhx-api:${NHX_E2E_IMAGE_TAG}" \
            "${NHX_E2E_IMAGE_REGISTRY}/nhx-tasks:${NHX_E2E_IMAGE_TAG}" \
            "${NHX_E2E_IMAGE_REGISTRY}/nhx-builder-tasks:${NHX_E2E_IMAGE_TAG}" \
            "${NHX_E2E_IMAGE_REGISTRY}/nhx-kaniko:${NHX_E2E_IMAGE_TAG}"

      # The Authentik demo reuses the kind cluster above, whose ghcr-pull secret lets the node pull nhx-api before
      # run.sh waits on Helm. It ends by exporting KUBECONFIG, the kube context and the gateway URL to GITHUB_ENV.
      - name: Set up the Authentik demo with taskset runs
        if: matrix.workload_token_exchange
        shell: bash
        env:
          NHX_E2E_IMAGE_REGISTRY: ${{ env.NHX_E2E_IMAGE_REGISTRY }}
          NHX_E2E_IMAGE_TAG: ${{ env.NHX_E2E_IMAGE_TAG }}
          NHX_AUTHENTIK_K8S_NAMESPACE: ${{ env.KUBE_NAMESPACE }}
          NHX_AUTHENTIK_K8S_REUSE_CLUSTER: "1"
          NHX_AUTHENTIK_K8S_IMAGE_PULL_SECRET: ghcr-pull
          NHX_AUTHENTIK_K8S_SKIP_IMAGE_LOAD: "1"
          NHX_AUTHENTIK_K8S_NGC_EXISTING_SECRET: ngc-api
          BUILDER_REGISTRY_PASSWORD_FILE: ${{ runner.temp }}/builder-registry-password
          NHX_E2E_STATE_DIR: ${{ runner.temp }}/authentik-e2e
          E2E_SERVICES_LOG_DIR: ${{ runner.temp }}/e2e-services-logs
        run: e2e/k8s/scripts/setup_authentik_taskset_runs.sh

      - name: Install NeMo Helix with the builder and taskset runs
        if: ${{ !matrix.workload_token_exchange }}
        shell: bash
        env:
          NAMESPACE: ${{ env.KUBE_NAMESPACE }}
          NHX_E2E_REGISTRY: ${{ env.NHX_E2E_IMAGE_REGISTRY }}
          NHX_E2E_TAG: ${{ env.NHX_E2E_IMAGE_TAG }}
          HELM_VALUES: e2e/k8s/values/kind.yaml
          HELM_EXTRA_ARGS: >-
            -f e2e/k8s/values/builder.yaml
            --set-file builder.devRegistry.password=${{ runner.temp }}/builder-registry-password
            -f e2e/k8s/values/taskset-runs.yaml
            ${{ matrix.auth == 'on' && '-f e2e/k8s/values/auth-overlay.yaml --set platformConfig.auth.allow_unsigned_jwt=true' || '' }}
          REQUIRE_NHX_E2E_IMAGES: "true"
          POSTGRES_IMAGE: docker.io/library/postgres
          BUSYBOX_IMAGE: docker.io/library/busybox:stable
          GITHUB_TOKEN: ${{ github.token }}
        run: e2e/k8s/scripts/install_helm_e2e.sh

      - name: Wait for the API
        if: ${{ !matrix.workload_token_exchange }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${NHX_E2E_CLUSTER_URL}"
          e2e/k8s/scripts/wait_for_api.sh "${NHX_E2E_CLUSTER_URL}/cluster-info" 120

      # The client sends a bearer token only over HTTPS or loopback HTTP, and the gateway is plain HTTP on the kind
      # network: reach the API through a port-forward, kept up for the steps after this one.
      - name: Reach the API on loopback
        if: ${{ matrix.auth == 'on' && !matrix.workload_token_exchange }}
        shell: bash
        run: |
          set -euo pipefail
          nohup bash -c "while true; do kubectl -n '${KUBE_NAMESPACE}' port-forward svc/nemo-helix-api 18090:8080; sleep 1; done" \
            >"${RUNNER_TEMP}/api-port-forward.log" 2>&1 &
          e2e/k8s/scripts/wait_for_api.sh http://127.0.0.1:18090/cluster-info 60
          echo "NHX_E2E_CLUSTER_URL=http://127.0.0.1:18090" >>"${GITHUB_ENV}"

      - name: Let the node pull from the development registry
        if: ${{ !matrix.workload_token_exchange }}
        shell: bash
        run: e2e/k8s/scripts/kind_dev_registry_mirror.sh

      - name: Create the builder's push secrets in the system workspace
        if: ${{ !matrix.workload_token_exchange }}
        shell: bash
        env:
          NHX_BASE_URL: ${{ env.NHX_E2E_CLUSTER_URL }}
          AUTH: ${{ matrix.auth }}
        run: |
          set -euo pipefail
          if [[ "${AUTH}" == on ]]; then
            # auth-overlay.yaml's platform admin.
            e2e/k8s/scripts/unsigned_user_token.sh admin@example.com "${RUNNER_TEMP}/admin.token"
            NHX_ACCESS_TOKEN="$(cat "${RUNNER_TEMP}/admin.token")"
            export NHX_ACCESS_TOKEN
          fi
          key="${RUNNER_TEMP}/builder-signing-key.pem"
          openssl ecparam -name prime256v1 -genkey -noout | openssl pkcs8 -topk8 -nocrypt -out "${key}"
          uv run --frozen nemo secrets create builder-registry-username --workspace system --value builder
          uv run --frozen nemo secrets create builder-registry-password --workspace system \
            --from-file "${RUNNER_TEMP}/builder-registry-password"
          uv run --frozen nemo secrets create builder-signing-key --workspace system --from-file "${key}"

      - name: Run taskset runs e2e
        shell: bash
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
          AUTH: ${{ matrix.auth }}
          WORKLOAD_TOKEN_EXCHANGE: ${{ matrix.workload_token_exchange }}
          NHX_E2E_STATE_DIR: ${{ runner.temp }}/authentik-e2e
          E2E_SERVICES_LOG_DIR: ${{ runner.temp }}/e2e-services-logs
          NHX_E2E_KUBE_CONTEXT: kind-${{ env.KIND_CLUSTER_NAME }}
          NHX_E2E_KUBE_NAMESPACE: ${{ env.KUBE_NAMESPACE }}
        run: |
          set -euo pipefail
          export NHX_BASE_URL="${NHX_E2E_CLUSTER_URL}"
          if [[ "${AUTH}" == on ]]; then
            # A non-admin user: workspace-owner grants are what the Job-identity bugs are about.
            if [[ "${WORKLOAD_TOKEN_EXCHANGE}" == true ]]; then
              e2e/k8s/scripts/authentik_user_token.sh nemo-user "${NHX_E2E_STATE_DIR}/nemo-user.token"
            else
              e2e/k8s/scripts/unsigned_user_token.sh nemo-user@example.com "${NHX_E2E_STATE_DIR}/nemo-user.token"
            fi
            NHX_E2E_ACCESS_TOKEN="$(cat "${NHX_E2E_STATE_DIR}/nemo-user.token")"
            # Checks Job identity matches the row: the ServiceAccount with exchange, the submitter without.
            export NHX_E2E_ACCESS_TOKEN NHX_E2E_WORKLOAD_TOKEN_EXCHANGE="${WORKLOAD_TOKEN_EXCHANGE}"
          fi
          # record_property needs xunit1 to include per-test metadata without schema warnings.
          uv run --frozen pytest \
            e2e/test_taskset_runs.py \
            -v \
            -m "taskset_runs_e2e or taskset_runs_cancel_e2e" \
            --feature taskset-runs \
            --feature taskset-runs-cancel \
            --run-e2e \
            --no-cov \
            -o junit_family=xunit1 \
            --junitxml=report-kubernetes-taskset-runs-e2e.xml
          # A skipped step, such as the leftover-sandbox check, is a check that didn't run: fail, as
          # run-taskset-run-controller-integration.sh does.
          if ! grep -q ' skipped="0"' report-kubernetes-taskset-runs-e2e.xml; then
            echo "::error::taskset runs e2e skipped a test or step" >&2
            exit 1
          fi

      - name: Finalize
        if: always()
        uses: ./.github/actions/finalize-kind-e2e
        with:
          kind-cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          artifact-name: kind-taskset-runs-e2e-auth-${{ matrix.auth }}-exchange-${{ matrix.workload_token_exchange }}-${{ matrix.copy }}-kubernetes-artifacts
          junit-report: report-kubernetes-taskset-runs-e2e.xml
          services-log-dir: ${{ runner.temp }}/e2e-services-logs

  report:
    name: Report
    needs: [plan, find-images, build-images, kind-taskset-runs-e2e]
    # Its own job: a job whose dependency failed is skipped, so an alert inside the e2e job would miss a failed build.
    # TEMPORARY, drop `push` before merge.
    if: always() && (github.event_name == 'schedule' || github.event_name == 'push' || inputs.classify_for != '')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
      issues: write
    steps:
      - name: Checkout the report helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download the e2e artifacts
        if: needs.kind-taskset-runs-e2e.result != 'skipped'
        continue-on-error: true  # a run that failed before the test uploads none
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: kind-taskset-runs-e2e-*-kubernetes-artifacts
          path: ${{ runner.temp }}/artifacts

      - name: Report
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJson(needs) }}
          SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
          CLASSIFY_FOR: ${{ inputs.classify_for }}
          ARTIFACTS: ${{ runner.temp }}/artifacts
          # TEMPORARY, drop before merge: on a push, print the GitHub calls instead of making them.
          ACT: ${{ github.event_name == 'push' && 'true' || '' }}
        run: python3 .github/scripts/nightly_taskset_runs_report.py
