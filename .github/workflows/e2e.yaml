name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*"]
    types: [labeled]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional CPU smoke image tag. Defaults to the commit SHA.
        required: false
        type: string
        default: ""
      publish:
        description: Publish CPU smoke images to GHCR.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.13.4"
  TOOLCHAIN: system

jobs:
  eligibility:
    name: Check E2E eligibility
    # Never run secret-bearing tests or publish images for forks/drafts. Do not
    # use pull_request_target: PR code runs only in the pull_request context.
    # Recheck current labels and draft status on each label event.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       toJSON(github.event.pull_request.draft) == 'false' &&
       contains(github.event.pull_request.labels.*.name, 'e2e'))
    runs-on: ubuntu-latest
    steps:
      - run: echo "E2E suite enabled"

  policy-wasm:
    name: OPA policy build and tests
    needs: [eligibility]
    runs-on: ubuntu-latest
    outputs:
      # Preserve the raw outcome: continue-on-error makes the conclusion success.
      policy-test-outcome: ${{ steps.policy-test.outcome }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-policy-wasm
        id: build
      - name: Upload policy WASM
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: policy-wasm
          retention-days: 1
          path: services/core/auth/src/nhx/core/auth/assets/policy.wasm
      - name: Test OPA policy
        id: policy-test
        # Test failures must fail CI status, not block consumers of a valid WASM.
        continue-on-error: true
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        uses: flox/activate-action@410568008895a0f2e09a34bbd9523f8ef1f2d292 # v1.1.0
        with:
          dir: ./tools/open-policy-agent
          command: |
            opa test services/core/auth/src/nhx/core/auth/app/policies services/core/auth/src/nhx/core/auth/app/policy_tests services/core/auth/src/nhx/core/auth/assets/static-authz.yaml -v

  python-auth-idp-static-test:
    name: Python auth-idp static tests
    needs: [eligibility]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Run auth-idp static tests
        run: |
          set -euo pipefail
          docker pull docker.io/envoyproxy/envoy:v1.37.0
          docker pull envoyproxy/envoy:v1.36.2
          helm dependency build k8s/helm
          helm dependency build contrib/auth/authentik/helm
          helm dependency build contrib/auth/zitadel/helm
          uv run --frozen --group auth-idp-e2e pytest tests/auth_idp/static -v
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-auth-idp-static-test-results
          retention-days: 30
          if-no-files-found: ignore
          path: |
            report.xml
            coverage.xml
            coverage.json

  build-cpu-smoke-images:
    name: Build CPU smoke images
    needs: [eligibility]
    permissions:
      contents: read
      packages: write
    # Shared with ci.yaml and nightly-taskset-runs-e2e.yaml.
    uses: ./.github/workflows/build-cpu-smoke-images.yaml
    with:
      source_sha: ${{ github.event.pull_request.head.sha || github.sha }}
      image_tag: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }}
      # Publish on a push to main, a same-repo PR, the merge queue, or a dispatch that asks to.
      publish: >-
        ${{
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
          github.event_name == 'merge_group' ||
          (github.event_name == 'workflow_dispatch' && inputs.publish)
        }}

  kind-cpu-e2e:
    name: Kind CPU e2e
    needs: [eligibility, build-cpu-smoke-images]
    if: needs.build-cpu-smoke-images.outputs.publish_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      KIND_CLUSTER_NAME: gha-${{ github.run_id }}-${{ github.run_attempt }}-kind-e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Kind cluster with NeMo Helix
        uses: ./.github/actions/setup-kind-cluster
        with:
          kind-cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          image-registry: ${{ needs.build-cpu-smoke-images.outputs.image_registry }}
          image-tag: ${{ needs.build-cpu-smoke-images.outputs.image_tag }}
          kind-image-pull-token: ${{ github.token }}
          kind-image-pull-user: ${{ github.actor }}

      - name: Pre-pull agent E2E image into Kind
        shell: bash
        env:
          KIND_IMAGE_PULL_TOKEN: ${{ github.token }}
          KIND_IMAGE_PULL_USER: ${{ github.actor }}
          NHX_E2E_IMAGE_REGISTRY: ${{ needs.build-cpu-smoke-images.outputs.image_registry }}
          NHX_E2E_IMAGE_TAG: ${{ needs.build-cpu-smoke-images.outputs.image_tag }}
        run: |
          e2e/k8s/scripts/prepull_kind_images.sh \
            "${NHX_E2E_IMAGE_REGISTRY}/nhx-agents-deepagents-e2e:${NHX_E2E_IMAGE_TAG}"

      # Includes the job-secret and generic-model lifecycle smoke tests; do not
      # provision a second identical cluster just to execute those tests again.
      - name: Run CPU e2e tests (including smoke tests)
        shell: bash
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
          E2E_SERVICES_LOG_DIR: ${{ runner.temp }}/e2e-services-logs
          NGC_API_KEY: not-used-for-ghcr-cpu-e2e
          # Let the k8s-mode agent deployment e2e (test_nemo_agents_k8s.py) learn
          # the agent image ref. The Helm platform is configured with a k8s
          # deployments executor (e2e/k8s/values/kind.yaml) and this same
          # nhx-agents-deepagents-e2e image is pre-pulled into the kind nodes, so the agent pod
          # resolves it node-locally under IfNotPresent.
          NHX_E2E_IMAGE_REGISTRY: ${{ needs.build-cpu-smoke-images.outputs.image_registry }}
          NHX_E2E_IMAGE_TAG: ${{ needs.build-cpu-smoke-images.outputs.image_tag }}
        run: |
          test -n "${NHX_E2E_CLUSTER_URL}"
          export NHX_BASE_URL="${NHX_E2E_CLUSTER_URL}"
          uv run --frozen pytest \
            e2e \
            -v \
            -m "not gym_e2e and not full_e2e and not customization_auth_e2e" \
            --run-e2e \
            --no-cov \
            --junitxml=report-kubernetes-e2e.xml

      - name: Finalize Kind e2e
        if: always()
        uses: ./.github/actions/finalize-kind-e2e
        with:
          kind-cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          artifact-name: kind-e2e-kubernetes-artifacts
          junit-report: report-kubernetes-e2e.xml
          services-log-dir: ${{ runner.temp }}/e2e-services-logs

  kind-gym-e2e:
    name: Kind Gym agent-evaluate e2e
    needs: [eligibility, build-cpu-smoke-images]
    if: needs.build-cpu-smoke-images.outputs.publish_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      KIND_CLUSTER_NAME: gha-${{ github.run_id }}-${{ github.run_attempt }}-kind-gym-e2e
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Kind cluster for Gym evaluation
        uses: ./.github/actions/setup-kind-cluster
        with:
          kind-cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          image-registry: ${{ needs.build-cpu-smoke-images.outputs.image_registry }}
          image-tag: ${{ needs.build-cpu-smoke-images.outputs.image_tag }}
          kind-image-pull-token: ${{ github.token }}
          kind-image-pull-user: ${{ github.actor }}

      - name: Pre-pull Gym task image
        shell: bash
        env:
          KIND_IMAGE_PULL_TOKEN: ${{ github.token }}
          KIND_IMAGE_PULL_USER: ${{ github.actor }}
          IMAGE_REGISTRY: ${{ needs.build-cpu-smoke-images.outputs.image_registry }}
          IMAGE_TAG: ${{ needs.build-cpu-smoke-images.outputs.image_tag }}
        run: e2e/k8s/scripts/prepull_kind_images.sh "${IMAGE_REGISTRY}/nhx-gym-tasks:${IMAGE_TAG}"

      - name: Run GRPO sandbox workspace permissions regression
        shell: bash
        env:
          NHX_GYM_WORKSPACE_KIND: ${{ env.KIND_CLUSTER_NAME }}
        run: |
          uv run --frozen pytest \
            -c pytest.ini \
            services/rl/tests/test_gym_workspace_kubernetes_integration.py \
            -v -s \
            --no-cov \
            --junitxml=report-kubernetes-gym-workspace.xml

      - name: Run Gym agent-evaluate e2e test
        shell: bash
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
          E2E_SERVICES_LOG_DIR: ${{ runner.temp }}/e2e-services-logs
        run: |
          test -n "${NHX_E2E_CLUSTER_URL}"
          export NHX_BASE_URL="${NHX_E2E_CLUSTER_URL}"
          uv run --frozen pytest \
            e2e/test_evaluator_plugin.py \
            -v \
            -m gym_e2e \
            --run-e2e \
            --no-cov \
            --junitxml=report-kubernetes-gym-e2e.xml

      - name: Finalize Kind Gym e2e
        if: always()
        uses: ./.github/actions/finalize-kind-e2e
        with:
          kind-cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          artifact-name: kind-gym-e2e-kubernetes-artifacts
          junit-report: report-kubernetes-gym-*.xml
          services-log-dir: ${{ runner.temp }}/e2e-services-logs

  kind-customizer-auth-e2e:
    name: Kind customizer auth e2e
    needs: [eligibility, build-cpu-smoke-images]
    if: needs.build-cpu-smoke-images.outputs.publish_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      KIND_CLUSTER_NAME: gha-${{ github.run_id }}-${{ github.run_attempt }}-kind-customizer-auth
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Kind cluster with auth enabled
        uses: ./.github/actions/setup-kind-cluster
        with:
          kind-cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          image-registry: ${{ needs.build-cpu-smoke-images.outputs.image_registry }}
          image-tag: ${{ needs.build-cpu-smoke-images.outputs.image_tag }}
          kind-image-pull-token: ${{ github.token }}
          kind-image-pull-user: ${{ github.actor }}
          helm-extra-args: -f e2e/k8s/values/auth-overlay.yaml

      - name: Run customizer auth e2e tests
        shell: bash
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
          E2E_SERVICES_LOG_DIR: ${{ runner.temp }}/e2e-services-logs
        run: |
          test -n "${NHX_E2E_CLUSTER_URL}"
          export NHX_BASE_URL="${NHX_E2E_CLUSTER_URL}"
          uv run --frozen pytest \
            e2e/test_customization_auth.py \
            -v \
            -m customization_auth_e2e \
            --run-e2e \
            --no-cov \
            --junitxml=report-kubernetes-customizer-auth-e2e.xml

      - name: Finalize Kind customizer auth e2e
        if: always()
        uses: ./.github/actions/finalize-kind-e2e
        with:
          kind-cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          artifact-name: kind-customizer-auth-e2e-kubernetes-artifacts
          junit-report: report-kubernetes-customizer-auth-e2e.xml
          services-log-dir: ${{ runner.temp }}/e2e-services-logs

  kind-builder-e2e:
    name: Kind builder e2e (auth ${{ matrix.auth }})
    needs: [eligibility, build-cpu-smoke-images]
    if: needs.build-cpu-smoke-images.outputs.publish_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        auth: ["off", "on"]
    env:
      KIND_CLUSTER_NAME: gha-${{ github.run_id }}-${{ github.run_attempt }}-kind-builder-auth-${{ matrix.auth }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Make a password for the development registry
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          printf '%s' "${password}" > "${RUNNER_TEMP}/builder-registry-password"

      - name: Setup Kind cluster with NeMo Helix and the builder
        uses: ./.github/actions/setup-kind-cluster
        with:
          kind-cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          image-registry: ${{ needs.build-cpu-smoke-images.outputs.image_registry }}
          image-tag: ${{ needs.build-cpu-smoke-images.outputs.image_tag }}
          kind-image-pull-token: ${{ github.token }}
          kind-image-pull-user: ${{ github.actor }}
          helm-extra-args: >-
            -f e2e/k8s/values/builder.yaml
            --set-file builder.devRegistry.password=${{ runner.temp }}/builder-registry-password
            ${{ matrix.auth == 'on' && '-f e2e/k8s/values/auth-overlay.yaml' || '' }}

      - name: Pre-pull the build step and sandbox images into Kind
        shell: bash
        env:
          KIND_IMAGE_PULL_TOKEN: ${{ github.token }}
          KIND_IMAGE_PULL_USER: ${{ github.actor }}
          NHX_E2E_IMAGE_REGISTRY: ${{ needs.build-cpu-smoke-images.outputs.image_registry }}
          NHX_E2E_IMAGE_TAG: ${{ needs.build-cpu-smoke-images.outputs.image_tag }}
        run: |
          e2e/k8s/scripts/prepull_kind_images.sh \
            "${NHX_E2E_IMAGE_REGISTRY}/nhx-builder-tasks:${NHX_E2E_IMAGE_TAG}" \
            "${NHX_E2E_IMAGE_REGISTRY}/nhx-kaniko:${NHX_E2E_IMAGE_TAG}"

      - name: Run builder e2e tests
        shell: bash
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
          E2E_SERVICES_LOG_DIR: ${{ runner.temp }}/e2e-services-logs
          AUTH: ${{ matrix.auth }}
          NHX_E2E_KUBE_CONTEXT: kind-${{ env.KIND_CLUSTER_NAME }}
          NHX_E2E_KUBE_NAMESPACE: nemo-helix
          NHX_E2E_IMAGE_REGISTRY: ${{ needs.build-cpu-smoke-images.outputs.image_registry }}
          NHX_E2E_IMAGE_TAG: ${{ needs.build-cpu-smoke-images.outputs.image_tag }}
        run: |
          set -euo pipefail
          test -n "${NHX_E2E_CLUSTER_URL}"
          export NHX_BASE_URL="${NHX_E2E_CLUSTER_URL}"
          NHX_E2E_BUILDER_REGISTRY_PASSWORD="$(cat "${RUNNER_TEMP}/builder-registry-password")"
          export NHX_E2E_BUILDER_REGISTRY_PASSWORD

          markers="builder_e2e and not builder_auth_e2e"
          features=(--feature builder)
          if [ "${AUTH}" = "on" ]; then
            markers="builder_e2e"
            # The auth config tells the e2e client that auth is on, so it sends the admin's principal headers.
            features+=(--feature auth --config e2e/quickstart/auth.yaml)
          fi
          uv run --frozen pytest \
            e2e/test_builder.py \
            -v \
            -m "${markers}" \
            "${features[@]}" \
            --run-e2e \
            --no-cov \
            --junitxml=report-kubernetes-builder-e2e.xml

          # A skipped test here means a marker or feature selected the wrong tests, so it fails the job.
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET

          root = ET.parse("report-kubernetes-builder-e2e.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          tests = sum(int(suite.get("tests", 0)) for suite in suites)
          skipped = sum(int(suite.get("skipped", 0)) for suite in suites)
          if tests == 0 or skipped:
              raise SystemExit(f"builder e2e ran {tests} tests and skipped {skipped}: expected none skipped")
          print(f"builder e2e: {tests} tests, none skipped")
          EOF

      - name: Finalize Kind builder e2e
        if: always()
        uses: ./.github/actions/finalize-kind-e2e
        with:
          kind-cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          artifact-name: kind-builder-e2e-auth-${{ matrix.auth }}-kubernetes-artifacts
          junit-report: report-kubernetes-builder-e2e.xml
          services-log-dir: ${{ runner.temp }}/e2e-services-logs

  kind-network-policy-smoke:
    name: Kind NetworkPolicy smoke
    needs: [eligibility, build-cpu-smoke-images]
    if: needs.build-cpu-smoke-images.outputs.publish_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    env:
      KIND_CLUSTER_NAME: gha-${{ github.run_id }}-${{ github.run_attempt }}-network-policy
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup Kind cluster with NetworkPolicy enforcement
        uses: ./.github/actions/setup-kind-cluster
        with:
          kind-cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          image-registry: ${{ needs.build-cpu-smoke-images.outputs.image_registry }}
          image-tag: ${{ needs.build-cpu-smoke-images.outputs.image_tag }}
          kind-image-pull-token: ${{ github.token }}
          kind-image-pull-user: ${{ github.actor }}
          kind-enable-gateway: "false"
          kind-enable-network-policies: "true"
          helm-extra-args: -f e2e/k8s/values/network-policies.yaml
          wait-for-api: "false"

      - name: Run NetworkPolicy smoke test
        shell: bash
        env:
          NAMESPACE: nemo-helix
          CHAINSAW_REPORT_FORMAT: XML
          CHAINSAW_REPORT_NAME: report-network-policy-smoke
          CHAINSAW_REPORT_PATH: .
        run: |
          if e2e/k8s/scripts/test_network_policies.sh; then
            if [ ! -f report-network-policy-smoke.xml ]; then
              printf '<testsuite name="network-policy-smoke" tests="1" failures="0"/>%s' $'\n' > report-network-policy-smoke.xml
            fi
            exit 0
          fi
          status="$?"
          if [ ! -f report-network-policy-smoke.xml ]; then
            cat > report-network-policy-smoke.xml <<'EOF'
          <testsuite name="network-policy-smoke" tests="1" failures="1">
            <testcase name="network-policy-smoke">
              <failure message="network policy smoke test failed">See the workflow log and Kubernetes artifact bundle.</failure>
            </testcase>
          </testsuite>
          EOF
          fi
          exit "${status}"

      - name: Finalize Kind e2e
        if: always()
        uses: ./.github/actions/finalize-kind-e2e
        with:
          kind-cluster-name: ${{ env.KIND_CLUSTER_NAME }}
          artifact-name: kind-network-policy-smoke-artifacts
          junit-report: report-network-policy-smoke.xml
          services-log-dir: ${{ runner.temp }}/e2e-services-logs

  python-auth-idp-e2e-test:
    name: Python auth-idp ${{ matrix.runtime }} tests
    needs: [eligibility, build-cpu-smoke-images, policy-wasm, python-auth-idp-static-test]
    if: needs.build-cpu-smoke-images.outputs.publish_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: authentik
            runtime: authentik-compose
            backend: compose
            command: test compose --gateway-port 18080
            namespace: nemo-authentik
          - provider: authentik
            runtime: authentik-kubernetes
            backend: kubernetes
            command: test k8s --runtime kind --gateway-port 18082
            namespace: nemo-authentik
          - provider: zitadel
            runtime: zitadel-kubernetes
            backend: kubernetes
            command: test k8s --runtime kind --gateway-port 18084
            namespace: nemo-zitadel
    env:
      AUTH_IDP_K8S_CLUSTER_NAME: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runtime }}
      AUTH_IDP_K8S_NAMESPACE: ${{ matrix.namespace }}
      NHX_AUTHENTIK_K8S_RUNTIME: kind
      NHX_AUTHENTIK_K8S_NAMESPACE: ${{ matrix.namespace }}
      NHX_AUTHENTIK_K8S_IMAGE_PULL_SECRET: ghcr-pull
      NHX_AUTHENTIK_K8S_NGC_EXISTING_SECRET: ngc-api
      NHX_AUTHENTIK_K8S_CLUSTER_NAME: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runtime }}
      NHX_AUTHENTIK_K8S_REUSE_CLUSTER: "1"
      NHX_ZITADEL_K8S_RUNTIME: kind
      NHX_ZITADEL_K8S_NAMESPACE: ${{ matrix.namespace }}
      NHX_ZITADEL_K8S_IMAGE_PULL_SECRET: ghcr-pull
      NHX_ZITADEL_K8S_NGC_EXISTING_SECRET: ngc-api
      NHX_ZITADEL_K8S_CLUSTER_NAME: gha-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.runtime }}
      NHX_ZITADEL_K8S_REUSE_CLUSTER: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install auth browser
        run: uv run --frozen --group auth-idp-e2e playwright install --with-deps chromium
      - name: Setup Kind cluster
        if: matrix.backend == 'kubernetes'
        uses: ./.github/actions/setup-kind-cluster
        with:
          kind-cluster-name: ${{ env.AUTH_IDP_K8S_CLUSTER_NAME }}
          install-nemo-helix: "false"
          kube-namespace: ${{ env.AUTH_IDP_K8S_NAMESPACE }}
          image-registry: ${{ needs.build-cpu-smoke-images.outputs.image_registry }}
          image-tag: ${{ needs.build-cpu-smoke-images.outputs.image_tag }}
          kind-image-pull-token: ${{ github.token }}
          kind-image-pull-user: ${{ github.actor }}
      - name: Log in to GHCR
        if: matrix.backend == 'compose' && needs.build-cpu-smoke-images.outputs.publish_images == 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Install Helm
        if: matrix.backend == 'kubernetes'
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
      - name: Lint Authentik umbrella Helm chart
        if: matrix.provider == 'authentik' && matrix.backend == 'kubernetes'
        shell: bash
        run: |
          helm repo add authentik https://charts.goauthentik.io --force-update
          helm dependency build k8s/helm
          helm dependency build contrib/auth/authentik/helm
          helm lint --strict contrib/auth/authentik/helm
      - name: Verify official Authentik Helm chart is reachable
        if: matrix.provider == 'authentik' && matrix.backend == 'kubernetes'
        shell: bash
        run: |
          helm show chart authentik --repo https://charts.goauthentik.io --version 2026.5.4
      - name: Lint ZITADEL umbrella Helm chart
        if: matrix.provider == 'zitadel' && matrix.backend == 'kubernetes'
        shell: bash
        run: |
          helm repo add zitadel https://charts.zitadel.com --force-update
          helm dependency build k8s/helm
          helm dependency build contrib/auth/zitadel/helm
          helm lint --strict contrib/auth/zitadel/helm
      - name: Verify official ZITADEL Helm chart is reachable
        if: matrix.provider == 'zitadel' && matrix.backend == 'kubernetes'
        shell: bash
        run: |
          helm show chart zitadel --repo https://charts.zitadel.com --version 10.0.6
      - name: Download policy WASM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: policy-wasm
          path: services/core/auth/src/nhx/core/auth/assets
      - name: Run auth-idp ${{ matrix.runtime }} tests
        run: >
          contrib/auth/${{ matrix.provider }}/run.sh
          ${{ matrix.command }}
          --image "${IMAGE_REGISTRY}/nhx-api:${BAKE_TAG}"
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
          E2E_SERVICES_LOG_DIR: ${{ runner.temp }}/e2e-services-logs
          IMAGE_REGISTRY: ${{ needs.build-cpu-smoke-images.outputs.image_registry }}
          BAKE_TAG: ${{ needs.build-cpu-smoke-images.outputs.image_tag }}
          NHX_AUTHENTIK_K8S_JUNIT_XML: report-auth-idp-${{ matrix.runtime }}.xml
          NHX_AUTHENTIK_K8S_IMAGE_PULL_SECRET: ${{ env.NHX_AUTHENTIK_K8S_IMAGE_PULL_SECRET }}
          NHX_AUTHENTIK_K8S_SKIP_IMAGE_LOAD: ${{ needs.build-cpu-smoke-images.outputs.publish_images == 'true' && '1' || '0' }}
          NHX_ZITADEL_K8S_JUNIT_XML: report-auth-idp-${{ matrix.runtime }}.xml
          NHX_ZITADEL_K8S_IMAGE_PULL_SECRET: ${{ env.NHX_ZITADEL_K8S_IMAGE_PULL_SECRET }}
          NHX_ZITADEL_K8S_SKIP_IMAGE_LOAD: ${{ needs.build-cpu-smoke-images.outputs.publish_images == 'true' && '1' || '0' }}
      # run.sh writes cluster diagnostics into E2E_SERVICES_LOG_DIR before it deletes the cluster.
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-auth-idp-${{ matrix.runtime }}-test-results
          retention-days: 30
          if-no-files-found: ignore
          path: |
            report-auth-idp-${{ matrix.runtime }}.xml
            ${{ runner.temp }}/e2e-services-logs/
      - name: Delete kind cluster
        if: always() && matrix.backend == 'kubernetes'
        shell: bash
        run: |
          docker rm -f "cloud-provider-kind-${AUTH_IDP_K8S_CLUSTER_NAME}" || true
          kind delete cluster --name "${AUTH_IDP_K8S_CLUSTER_NAME}" || true

  # Keep interpreter coverage parallel, but share setup/build/install work for
  # both packages and both CLI install methods within each interpreter's job.
  # E2E tests: start services from the workspace venv and run the e2e
  # suite against the real process.
  python-e2e-test:
    name: Python e2e tests
    needs: [eligibility, policy-wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Download policy WASM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: policy-wasm
          path: services/core/auth/src/nhx/core/auth/assets
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Run e2e tests
        # Two workers, one services pool per worker (see register_services_pool_items).
        run: make test-e2e PYTEST_EXTRA='-m "not full_e2e" -n 2 --dist loadgroup --durations=25'
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
          E2E_SERVICES_LOG_DIR: ${{ runner.temp }}/e2e-services-logs
          NGC_API_KEY: ${{ secrets.NGC_REGISTRY_READ_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NHX_FILES_HF_RETRY_ATTEMPTS: "7"
          NHX_FILES_HF_RETRY_INITIAL_DELAY_SECONDS: "1"
          NHX_FILES_HF_RETRY_MAX_DELAY_SECONDS: "30"
      - name: Dump server logs
        if: always()
        run: |
          echo "::group::Server logs"
          for f in "${{ runner.temp }}/e2e-services-logs"/*.log; do
            [ -f "$f" ] && echo "--- $(basename "$f") ---" && cat "$f" || echo "No server logs found"
          done
          echo "::endgroup::"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-e2e-test-results
          retention-days: 30
          path: |
            report.xml
            ${{ runner.temp }}/e2e-services-logs/

  # E2E tests that run on the subprocess harness but need the prebuilt
  # DeepAgents image available in the local Docker daemon. Marked
  # `needs_agents_e2e_image`; the plain python-e2e-test job skips them because
  # NHX_E2E_IMAGE_REGISTRY / NHX_E2E_IMAGE_TAG are unset there.
  python-e2e-image-test:
    name: Python e2e tests (prebuilt image)
    needs: [eligibility, build-cpu-smoke-images, policy-wasm]
    if: needs.build-cpu-smoke-images.outputs.publish_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    env:
      NHX_E2E_IMAGE_REGISTRY: ${{ needs.build-cpu-smoke-images.outputs.image_registry }}
      NHX_E2E_IMAGE_TAG: ${{ needs.build-cpu-smoke-images.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Download policy WASM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: policy-wasm
          path: services/core/auth/src/nhx/core/auth/assets
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Log in to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Pull agent E2E image (timed)
        shell: bash
        run: |
          image="${NHX_E2E_IMAGE_REGISTRY}/nhx-agents-deepagents-e2e:${NHX_E2E_IMAGE_TAG}"
          echo "Pulling ${image}"
          start=$(date +%s)
          docker pull "$image"
          echo "agent E2E image pull took $(( $(date +%s) - start ))s"
      - name: Run e2e tests (needs_agents_e2e_image)
        run: make test-e2e PYTEST_EXTRA="-m needs_agents_e2e_image"
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
          E2E_SERVICES_LOG_DIR: ${{ runner.temp }}/e2e-services-logs
      - name: Dump server logs
        if: always()
        run: |
          echo "::group::Server logs"
          for f in "${{ runner.temp }}/e2e-services-logs"/*.log; do
            [ -f "$f" ] && echo "--- $(basename "$f") ---" && cat "$f" || echo "No server logs found"
          done
          echo "::endgroup::"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-e2e-image-test-results
          retention-days: 30
          path: |
            report.xml
            ${{ runner.temp }}/e2e-services-logs/

  post-merge-e2e-status:
    name: Post-merge E2E status
    needs:
      - eligibility
      - policy-wasm
      - python-auth-idp-static-test
      - build-cpu-smoke-images
      - kind-cpu-e2e
      - kind-gym-e2e
      - kind-customizer-auth-e2e
      - kind-builder-e2e
      - kind-network-policy-smoke
      - python-auth-idp-e2e-test
      - python-e2e-test
      - python-e2e-image-test
    # Include prerequisites so a failed build cannot hide behind skipped tests.
    if: >
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout notification helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Report results and alert on failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          CHECKS_NAME: E2E
          SLACK_ALERTS_WEBHOOK: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
        with:
          script: |
            const { reportPostMergeResults } = require("./.github/scripts/ci-post-merge-notification.cjs");
            await reportPostMergeResults({ core, context, env: process.env, fetchImpl: fetch });
