      - build-safe-synthesizer-test-image
    # E2E runs in its own workflow; this notification covers only CI image builds
    # and prerequisites. E2E has its own main-push notification.
    if: >
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout notification helper
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
