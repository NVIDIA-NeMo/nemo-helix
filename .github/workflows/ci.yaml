name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "release/*"]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Optional CI image tag. Defaults to the commit SHA.
        required: false
        type: string
        default: ""
      publish:
        description: Publish CPU smoke images to GHCR on manual runs.
        required: false
        type: boolean
        default: false

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Keep the CI uv binary aligned with the Flox development environment.
  UV_VERSION: "0.13.4"
  # Jobs here provision their own toolchain, so Make bypasses Flox activation.
  TOOLCHAIN: system

jobs:
  changes:
    name: Detect Path Changes
    runs-on: ubuntu-latest
    outputs:
      post-merge: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      openapi: ${{ steps.changes.outputs.openapi }}
      test: ${{ steps.changes.outputs.test }}
      deps: ${{ steps.changes.outputs.deps }}
      fabric: ${{ steps.changes.outputs.fabric }}
      agents-harnesses: ${{ steps.changes.outputs.agents-harnesses }}
      harbor-integration: ${{ steps.changes.outputs.harbor-integration }}
      evaluator-sdk-closure: ${{ steps.changes.outputs.evaluator-sdk-closure }}
      evaluator-integration: ${{ steps.changes.outputs.evaluator-integration }}
      scaled-evals: ${{ steps.changes.outputs.scaled-evals }}
      docs: ${{ steps.changes.outputs.docs }}
      web-studio: ${{ steps.changes.outputs.web-studio }}
      customizer-skill-references: ${{ steps.changes.outputs.customizer-skill-references }}
      github-scripts: ${{ steps.changes.outputs.github-scripts }}
      tools: ${{ steps.changes.outputs.tools }}
      docker: ${{ steps.changes.outputs.docker }}
      helm: ${{ steps.changes.outputs.helm }}
      cpu-smoke: ${{ steps.changes.outputs.cpu-smoke }}
      guardrails-benchmark: ${{ steps.changes.outputs.guardrails-benchmark }}
      deployments-openshell: ${{ steps.changes.outputs.deployments-openshell }}
      jobs-openshell: ${{ steps.changes.outputs.jobs-openshell }}
      ngc-metadata: ${{ steps.changes.outputs.ngc-metadata }}
      auth-idp: ${{ steps.changes.outputs.auth-idp }}
      customization-auth: ${{ steps.changes.outputs.customization-auth }}
      builder-e2e: ${{ steps.changes.outputs.builder-e2e }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: ./.github/actions/changes
        id: changes

  actionlint:
    name: Run actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Flox
        uses: flox/install-flox-action@c94e7e1ab56ae14fe98bae4fd84384fd135f0c2a # v2.4.0
        with:
          disable-metrics: "true"
      - name: Lint GitHub workflows and actions
        uses: flox/activate-action@410568008895a0f2e09a34bbd9523f8ef1f2d292 # v1.1.0
        with:
          dir: ./tools/actionlint
          command: actionlint

  ngc-metadata-test:
    name: Test NGC metadata sync
    needs: [changes]
    if: >
      !cancelled() &&
      github.event_name == 'pull_request' &&
      needs.changes.outputs.ngc-metadata == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Run NGC metadata unit tests
        run: uv run --no-cache .github/scripts/tests/test_ngc_metadata.py

  test-gates:
    name: Check test gates
    # Deliberately unconditional. An orphaned gate arrives by editing a test file, not by editing
    # .github/scripts, so a path filter here would let exactly the case this guards slip through.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - name: Run test-gate check unit tests
        run: uv run --no-cache .github/scripts/tests/test_check_test_gates.py
      - name: Check for test gates no workflow sets
        run: uv run --no-cache .github/scripts/check_test_gates.py

  uv-lock:
    name: Dependency checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install platform uv
        id: uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
          python-version: "3.13"

      - name: Show uv version
        run: uv --version

      - name: Check lock with platform uv
        run: bash script/uv-lock.sh --check

      - name: Check sync with configured uv
        if: ${{ !cancelled() && steps.uv.outcome == 'success' }}
        run: uv sync --frozen --all-packages

  docker-bake-graph:
    name: Docker bake graph
    needs: [changes]
    if: >
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.docker == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Print bake groups
        shell: bash
        run: |
          make docker-print TARGET=docker-cpu
          make docker-print TARGET=docker-gpu
          make docker-print TARGET=docker-garak
          make docker-print TARGET=docker-python-base
          make docker-print TARGET=nhx-automodel-gpu-wheels
          make docker-print TARGET=nhx-automodel
          make docker-print TARGET=nhx-unsloth

  # Keep the build steps aligned with e2e.yaml. CI validates image builds without
  # requiring E2E opt-in; E2E builds independently to avoid cross-workflow races.
  build-cpu-smoke-images:
    name: Build CPU smoke images
    needs: [changes]
    if: >
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.cpu-smoke == 'true' ||
        needs.changes.outputs.auth-idp == 'true' ||
        needs.changes.outputs.customization-auth == 'true' ||
        needs.changes.outputs.builder-e2e == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    outputs:
      image_registry: ${{ steps.bake-vars.outputs.image_registry }}
      image_tag: ${{ steps.bake-vars.outputs.image_tag }}
      publish_images: ${{ steps.bake-vars.outputs.publish_images }}
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          disable_swap: "true"
          remove_haskell: "true"
          remove_java: "true"
          remove_ruby: "true"
          remove_swift: "true"
          prune_docker: "true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          name: nhx-builder
          driver: docker-container
          cleanup: true

      - name: Configure bake variables
        id: bake-vars
        shell: bash
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          INPUT_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          image_registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          source_sha="${SOURCE_SHA:-$GITHUB_SHA}"
          bake_tag="${INPUT_IMAGE_TAG:-$source_sha}"
          fastembed_cache_dir="${RUNNER_TEMP}/fastembed-cache"
          publish_images="false"

          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            publish_images="true"
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPOSITORY" = "$GITHUB_REPOSITORY" ]; then
            publish_images="true"
          fi

          if [ "$GITHUB_EVENT_NAME" = "merge_group" ]; then
            publish_images="true"
          fi

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$INPUT_PUBLISH" = "true" ]; then
            publish_images="true"
          fi

          {
            printf 'IMAGE_REGISTRY=%s\n' "$image_registry"
            printf 'BASE_REGISTRY=%s\n' "$image_registry"
            printf 'CACHE_REGISTRY=%s\n' "$image_registry"
            printf 'BAKE_TAG=%s\n' "$bake_tag"
            printf 'CI_COMMIT_SHA=%s\n' "$source_sha"
            printf 'FASTEMBED_CACHE_CONTEXT=%s\n' "$fastembed_cache_dir"
            printf 'FASTEMBED_CACHE_DIR=%s\n' "$fastembed_cache_dir"
            printf 'DOCKER_BAKE_ALLOW_FS_READ=%s\n' "$fastembed_cache_dir"
            printf 'FASTEMBED_MODEL_REPO=%s\n' "qdrant/all-MiniLM-L6-v2-onnx"
            printf 'FASTEMBED_MODEL_REVISION=%s\n' "main"
            printf 'PUBLISH_IMAGES=%s\n' "$publish_images"
          } >> "$GITHUB_ENV"
          {
            printf 'image_registry=%s\n' "$image_registry"
            printf 'image_tag=%s\n' "$bake_tag"
            printf 'publish_images=%s\n' "$publish_images"
          } >> "$GITHUB_OUTPUT"

      - name: Prepare fastembed model cache directory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${FASTEMBED_CACHE_DIR}"
          touch "${FASTEMBED_CACHE_DIR}/.cache-context"

      - name: Restore fastembed model cache
        id: fastembed-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ runner.temp }}/fastembed-cache
          key: fastembed-qdrant-all-MiniLM-L6-v2-onnx-main-v1

      - name: Install uv for fastembed model cache
        if: steps.fastembed-cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          cache-dependency-glob: uv.lock

      - name: Populate fastembed model cache
        if: steps.fastembed-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          HF_HUB_DISABLE_UPDATE_CHECK=1 uv run --no-project --with 'huggingface-hub>=1.0.1,<2.0.0' hf download \
            "${FASTEMBED_MODEL_REPO}" \
            --revision "${FASTEMBED_MODEL_REVISION}" \
            --cache-dir "${FASTEMBED_CACHE_DIR}" \
            --format quiet
          find "${FASTEMBED_CACHE_DIR}/models--qdrant--all-MiniLM-L6-v2-onnx/snapshots" \
            -mindepth 1 -maxdepth 1 -type d -print -quit | grep -q .

      - name: Log in to GHCR
        if: env.PUBLISH_IMAGES == 'true'
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Print Docker bake graph
        shell: bash
        run: |
          target=docker-cpu
          if [ "${PUBLISH_IMAGES}" = "true" ]; then
            target=docker-cpu-ci
          fi
          make docker-print TARGET="${target}"

      - name: Build CPU images
        if: env.PUBLISH_IMAGES != 'true'
        shell: bash
        run: make docker-load TARGET=docker-cpu

      - name: Build and publish CPU images
        if: env.PUBLISH_IMAGES == 'true'
        shell: bash
        run: make docker-push TARGET=docker-cpu-ci

      - name: Save fastembed model cache
        if: steps.fastembed-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/fastembed-cache
          key: fastembed-qdrant-all-MiniLM-L6-v2-onnx-main-v1

  build-garak-test-image:
    name: Build garak test image
    needs: [changes]
    if: >
      !cancelled() && needs.changes.outputs.post-merge == 'true' && (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.cpu-smoke == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          disable_swap: "true"
          remove_haskell: "true"
          remove_java: "true"
          remove_ruby: "true"
          remove_swift: "true"
          prune_docker: "true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          name: nhx-builder
          driver: docker-container
          cleanup: true

      - name: Configure bake variables
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          image_registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          source_sha="${SOURCE_SHA:-$GITHUB_SHA}"
          bake_tag="${INPUT_IMAGE_TAG:-$source_sha}"

          {
            printf 'IMAGE_REGISTRY=%s\n' "$image_registry"
            printf 'BASE_REGISTRY=%s\n' "$image_registry"
            printf 'CACHE_REGISTRY=%s\n' "$image_registry"
            printf 'BAKE_TAG=%s\n' "$bake_tag"
            printf 'CI_COMMIT_SHA=%s\n' "$source_sha"
          } >> "$GITHUB_ENV"

      - name: Print Docker bake graph
        shell: bash
        run: make docker-print TARGET=docker-garak

      - name: Build garak image
        shell: bash
        run: make docker-build TARGET=docker-garak

  build-safe-synthesizer-test-image:
    name: Build Safe Synthesizer test image
    needs: [changes]
    if: >
      !cancelled() && needs.changes.outputs.post-merge == 'true' && (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.cpu-smoke == 'true'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          disable_swap: "true"
          remove_go: "true"
          remove_haskell: "true"
          remove_java: "true"
          remove_node: "true"
          remove_pypy: "true"
          remove_python: "true"
          remove_ruby: "true"
          remove_swift: "true"
          prune_docker: "true"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          name: nhx-builder
          driver: docker-container
          cleanup: true

      - name: Configure bake variables
        shell: bash
        env:
          INPUT_IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || '' }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          image_registry="ghcr.io/${GITHUB_REPOSITORY,,}"
          source_sha="${SOURCE_SHA:-$GITHUB_SHA}"
          bake_tag="${INPUT_IMAGE_TAG:-$source_sha}"

          {
            printf 'IMAGE_REGISTRY=%s\n' "$image_registry"
            printf 'BASE_REGISTRY=%s\n' "$image_registry"
            printf 'CACHE_REGISTRY=%s\n' "$image_registry"
            printf 'BAKE_TAG=%s\n' "$bake_tag"
            printf 'CI_COMMIT_SHA=%s\n' "$source_sha"
          } >> "$GITHUB_ENV"

      - name: Print Docker bake graph
        shell: bash
        run: make docker-print TARGET=docker-gpu

      - name: Build Safe Synthesizer image
        shell: bash
        run: make docker-build TARGET=docker-gpu

  helm-lint:
    name: Helm lint
    needs: [changes]
    if: >
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.helm == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HELM_FOLDER: k8s/helm
      HELM_RELEASE_NAME: nemo-helix
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Flox
        uses: flox/install-flox-action@c94e7e1ab56ae14fe98bae4fd84384fd135f0c2a # v2.4.0
        with:
          disable-metrics: "true"
      - name: Lint and validate Helm chart
        uses: flox/activate-action@410568008895a0f2e09a34bbd9523f8ef1f2d292 # v1.1.0
        with:
          dir: ./tools/helm
          command: tools/lint/lint-helm.sh
      - name: Upload Helm lint artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helm-lint-artifacts
          retention-days: 7
          if-no-files-found: ignore
          path: |
            k8s/helm/ci/*.output
            k8s/helm/ci/*.kubeconform.json

  helm-chart-verifier:
    name: Helm chart verifier
    needs: [changes]
    if: >
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.helm == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CHART_VERIFIER_VERSION: "1.14.0"
      HELM_FOLDER: k8s/helm
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0
      - name: Install chart-verifier
        id: install-chart-verifier
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          mkdir -p "${RUNNER_TEMP}/chart-verifier"
          chart_verifier_archive="chart-verifier-${CHART_VERIFIER_VERSION}.tgz"
          chart_verifier_archive_path="${RUNNER_TEMP}/chart-verifier.tar.gz"
          release_metadata_path="${RUNNER_TEMP}/chart-verifier-release.json"
          release_url="https://github.com/redhat-certification/chart-verifier/releases/download/${CHART_VERIFIER_VERSION}/${chart_verifier_archive}"
          release_api_url="https://api.github.com/repos/redhat-certification/chart-verifier/releases/tags/${CHART_VERIFIER_VERSION}"

          curl_args=(
            --fail
            --show-error
            --silent
            --location
            --retry 5
            --retry-delay 2
            --retry-all-errors
          )
          github_api_args=(
            "${curl_args[@]}"
            --header "Accept: application/vnd.github+json"
            --header "X-GitHub-Api-Version: 2022-11-28"
          )
          if [ -n "${GITHUB_TOKEN:-}" ]; then
            github_api_args+=(--header "Authorization: Bearer ${GITHUB_TOKEN}")
          fi

          if ! curl "${curl_args[@]}" -o "${chart_verifier_archive_path}" "${release_url}"; then
            echo "::warning::Unable to download chart-verifier ${CHART_VERIFIER_VERSION}; skipping chart verifier."
            echo "installed=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

          if ! curl "${github_api_args[@]}" -o "${release_metadata_path}" "${release_api_url}"; then
            echo "::warning::Unable to fetch chart-verifier release metadata; skipping chart verifier."
            echo "installed=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

          if ! chart_verifier_sha256="$(
            python3 - "${release_metadata_path}" "${chart_verifier_archive}" <<'PY'
          import json
          import sys

          metadata_path = sys.argv[1]
          target = sys.argv[2]

          with open(metadata_path, encoding="utf-8") as metadata_file:
              release = json.load(metadata_file)

          for asset in release.get("assets", []):
              if asset.get("name") != target:
                  continue
              digest = asset.get("digest", "")
              if digest.startswith("sha256:"):
                  print(digest.removeprefix("sha256:"))
                  sys.exit(0)

          print(f"sha256 digest not found for release asset {target}", file=sys.stderr)
          sys.exit(1)
          PY
          )"; then
            echo "::warning::Unable to read chart-verifier release digest; skipping chart verifier."
            echo "installed=false" >> "${GITHUB_OUTPUT}"
            exit 1
          fi

          printf '%s  %s\n' "${chart_verifier_sha256}" "${RUNNER_TEMP}/chart-verifier.tar.gz" \
            | sha256sum -c -
          tar -xzf "${RUNNER_TEMP}/chart-verifier.tar.gz" -C "${RUNNER_TEMP}/chart-verifier" chart-verifier
          chmod +x "${RUNNER_TEMP}/chart-verifier/chart-verifier"
          echo "${RUNNER_TEMP}/chart-verifier" >> "${GITHUB_PATH}"
          echo "installed=true" >> "${GITHUB_OUTPUT}"
      - name: Prepare Helm dependencies
        if: steps.install-chart-verifier.outputs.installed == 'true'
        shell: bash
        run: |
          helm repo add nvidia https://helm.ngc.nvidia.com/nvidia
          helm repo update
          helm dep update "${HELM_FOLDER}"
      - name: Run chart verifier
        if: steps.install-chart-verifier.outputs.installed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          report_json="${RUNNER_TEMP}/chart-verifier-report.json"
          chart-verifier verify --enable helm-lint,is-helm-v3,contains-values,has-readme \
            -o json "${HELM_FOLDER}" | tee "${report_json}"

          python3 - "${report_json}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as report_file:
              data = json.load(report_file)

          failed = [
              result.get("check", "?")
              for result in data.get("results", [])
              if result.get("outcome") == "FAIL"
          ]
          if failed:
              print("chart-verifier failed checks: " + ", ".join(failed), file=sys.stderr)
              sys.exit(1)
          PY

  lint:
    name: Lint all
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install flox
        uses: flox/install-flox-action@c94e7e1ab56ae14fe98bae4fd84384fd135f0c2a # v2.4.0
        with:
          disable-metrics: "true"
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          python-version: "3.13"
          cache-dependency-glob: uv.lock
      - name: Install nodejs
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm via corepack
        run: |
          npm i -g corepack@0.31.0
          corepack enable pnpm
      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      # Unit tests skip the vendor bundler; exercise the same production mode
      # as the Studio image so asset/loader failures are caught before merge.
      - name: Build Studio production assets
        working-directory: web
        timeout-minutes: 5
        env:
          NODE_ENV: production
        run: pnpm --filter nemo-studio-ui --fail-if-no-match build:fastapi
      - name: Run Lint
        uses: flox/activate-action@410568008895a0f2e09a34bbd9523f8ef1f2d292 # v1.1.0
        env:
          CI_PROJECT_DIR: ${{ github.workspace }}
        with:
          dir: ./tools/lint
          command: |
            tools/lint/lint-all.sh
      - name: Upload lint artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Lint Artifacts
          retention-days: 7
          path: |
            third_party/
            openapi/openapi.yaml
            openapicheck/openapi.yaml
            docs/set-up/config-reference.md
            python-sdk-lint/
            web/packages/sdk/generated/
            diff.txt

  python-unit-test-tools:
    name: Python unit tests (tools)
    needs: [changes]
    if: >
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.deps == 'true' ||
        needs.changes.outputs.tools == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Run tools unit tests
        run: uv run pytest tools -v --junit-xml=report.xml
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-unit-test-tools-results
          retention-days: 30
          path: report.xml

  python-unit-test:
    name: Python unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every supported interpreter: this is the only job that executes the suite, so it is
        # the only one that answers "does the code work here". Packaging and install are
        # covered elsewhere; running them is not the same as running the tests.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Run unit tests
        run: make test-unit-ci
        env:
          EXTRA: cpu
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PYTEST_WORKERS: "4"
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-unit-test-results-py${{ matrix.python-version }}
          retention-days: 30
          path: |
            report.xml
            coverage.xml
            coverage.json
            coverage-html/
      - name: Upload worker crash dumps
        # Separate artifact so coverage-comment keeps receiving exactly the files it expects.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-unit-crash-dumps-py${{ matrix.python-version }}
          retention-days: 30
          if-no-files-found: ignore
          path: crash-dumps/

  # The `main-and-release-checks` ruleset requires a check named exactly "Python unit tests".
  # Now that the job is a matrix, its legs report "Python unit tests (py3.12)" and friends, and
  # nothing carries the bare name -- the required check would sit on "Expected — Waiting for
  # status to be reported" forever. This job reports that name, and is red whenever any leg is.
  # Removing it means updating the ruleset, which needs repository admin.
  python-unit-test-status:
    name: Python unit tests
    needs: [python-unit-test]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check unit test legs
        shell: bash
        env:
          # A matrix job's `result` is already the aggregate: success only when every leg
          # succeeded, failure when any leg failed.
          NEEDS_JSON: ${{ toJson(needs) }}
        run: |
          set -euo pipefail

          {
            echo "## Python unit tests"
            echo
            echo "| Job | Result |"
            echo "| --- | --- |"
            printf '%s\n' "${NEEDS_JSON}" \
              | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"'
          } >> "${GITHUB_STEP_SUMMARY}"

          printf '%s\n' "${NEEDS_JSON}" \
            | jq -e 'to_entries | map(.value.result) | all(. as $result | ["success", "skipped"] | any($result == .))'

  # The scaled-evals plugin stays out of `enabled-plugins`, so `python-unit-test` cannot
  # import it and skips its tests. Installing it into that shared run is not an option:
  # the platform then discovers the service and waits on a Postgres that is not there,
  # which slowed the suite roughly sixfold and broke timing-sensitive daemon tests. Give
  # it its own environment instead.
  python-unit-test-scaled-evals:
    name: Python unit tests (scaled-evals plugin)
    needs: [changes]
    if: >
      !cancelled() &&
      (needs.changes.outputs.deps == 'true' || needs.changes.outputs.scaled-evals == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Run scaled-evals plugin tests
        run: uv run --frozen --group scaled-evals pytest plugins/_temporary-scaled-evals/tests -v
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
      # The workspace venv carries a single Harbor release, but NemoOpenSandboxEnvironment must run on
      # every runner harbor_opensandbox accepts: those whose requirements pin the OpenSandbox SDK.
      # Build each runner's venv from its own requirements, as the image does, and run the tests there.
      - name: Run harbor_opensandbox environment tests on each supported Harbor runner
        working-directory: packages/nhx_sandbox
        run: |
          set -eu
          for requirements in harbor-runners/*.txt; do
            grep -q '^opensandbox==' "$requirements" || continue
            version="$(basename "$requirements" .txt)"
            venv="$RUNNER_TEMP/harbor-$version"
            uv venv --python 3.12 "$venv"
            # --python, not VIRTUAL_ENV: setup-uv exports UV_PYTHON, which would otherwise send the
            # install to the workspace .venv.
            uv pip install --python "$venv/bin/python" -r "$requirements" . pytest pytest-asyncio
            echo "::group::Harbor $version"
            # The repository's shared-patch guard, with nhx_sandbox counted as first-party although
            # this venv installs it as a wheel.
            PYTHONPATH="$GITHUB_WORKSPACE" "$venv/bin/python" -m pytest -p no:cacheprovider -v \
              -p tests.shared_patch_guard --shared-patch-guard=strict -o shared_patch_first_party=nhx_sandbox \
              tests/test_harbor_opensandbox_environment.py tests/test_harbor_opensandbox_driver.py \
              tests/test_harbor_opensandbox_compose_services.py
            echo "::endgroup::"
          done

  # WHY THIS JOB EXISTS (it looks redundant, it isn't): `--extra fabric` appears nowhere else in this
  # file and there is no `--all-extras`, so no other job installs nemo-fabric. Every other Fabric test
  # either fakes `nemo_fabric` or `importorskip`s it, which means the hermetic suite keeps passing when
  # the real API moves — that is how the enable_relay keyword, the `.cli`/`.sdk` adapter ids, and the
  # entire profile mechanism each drifted underneath us while the unit tests stayed green. Deleting
  # this job takes real-Fabric coverage to zero. The bare import is also the ONLY check on runtime.py's
  # TYPE_CHECKING import block (RunResult/RunOutput/...), which ty cannot verify because nemo-fabric is
  # absent from the type-check environment.
  fabric-wheel-smoke:
    name: Fabric wheel install smoke (Linux, py${{ matrix.python-version }})
    needs: [changes]
    # A Fabric wheel bump lands in uv.lock (deps), and edits to the runtime's own Fabric call sites or
    # its tests land under the fabric filter — either can surface API drift, so run on both.
    if: >
      !cancelled() &&
      (needs.changes.outputs.deps == 'true' || needs.changes.outputs.fabric == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One leg per distinct dependency closure. 3.13 resolves exactly what 3.12 does; 3.14
        # does not, because the `fabric` extra pins `nemo-fabric-adapters-hermes` to
        # `python_version < '3.14'`, and nothing else in CI installs that closure.
        python-version: ["3.12", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # This job installs and imports third-party wheels; don't leave GITHUB_TOKEN in .git/config.
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          # Must satisfy the workspace floor in the root pyproject.toml (`requires-python`), or
          # `uv sync` refuses the interpreter outright.
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Installs the published nemo-fabric wheels (+ codex/claude/deepagents adapters) from the lock.
      # Linux is where jobs actually execute the runtime, and it validates that the manylinux
      # nemo-fabric-runtime wheel installs on the runner's glibc.
      - name: Install nhx-evals-sdk[fabric] from the lock
        run: uv sync --frozen --package nhx-evals-sdk --extra fabric
      # Import the Fabric SDK surface that agent_eval/runtimes/fabric/runtime.py depends on, so the
      # published package is exercised for real instead of only via the hermetic fake-nemo_fabric tests.
      - name: Import the Fabric SDK surface the runtime uses
        run: |
          uv run --frozen --no-sync python - <<'PY'
          import nemo_fabric
          from nemo_fabric import (
              EnvironmentConfig,
              Fabric,
              FabricConfig,
              RelayAtifConfig,
              RelayAtofConfig,
              RelayAtofFileSinkConfig,
              RelayObservabilityConfig,
              RunRequest,
              RunResult,
          )
          print("nemo_fabric import OK:", nemo_fabric.__file__)
          PY
      # A bare import can't catch API drift in the runtime's *call sites* — the enable_relay keyword and
      # the harness adapter ids both moved under us while the hermetic fakes kept passing. These contract
      # tests exercise those call sites against the real wheels (importorskip elsewhere), so a future
      # drift turns this job red instead of slipping through.
      - name: Run Fabric runtime contract tests against the real wheels
        # pytest lives in the root `dev` group, which the minimal `--package ... --extra fabric` sync
        # above does not pull, so install it (and pytest-asyncio, for the SDK package's
        # asyncio_mode=auto) into the synced venv rather than bloating the smoke env with the whole
        # dev group.
        #
        # It must go INTO .venv — NOT via `uv run --with`, which layers an ephemeral overlay whose
        # sys.prefix is a temp build dir. Fabric discovers adapter descriptors under
        # `<sys.prefix>/share/nemo-fabric/adapters` (that is where the adapter wheels install their
        # fabric-adapter.json data files), so under an overlay every adapter goes missing and any
        # resolution fails with `unknown adapter ...; available adapters: []`.
        run: |
          uv pip install --python .venv/bin/python pytest pytest-asyncio
          uv run --frozen --no-sync pytest \
            packages/nhx_evals_sdk/tests/agent_eval/test_fabric_surface.py -v

  # Installs only nhx-evals-sdk (no workspace/extras/dev) and imports
  # agent_eval.runtimes.harbor.runtime. Catches undeclared deps (workspace sync hides them)
  # and broken lazy barrels that pull in the metric/execution stack.
  evaluator-sdk-closure-smoke:
    name: Evals SDK dependency-closure smoke (Linux, py${{ matrix.python-version }})
    needs: [changes]
    if: >
      !cancelled() &&
      (needs.changes.outputs.deps == 'true' || needs.changes.outputs.evaluator-sdk-closure == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Must satisfy uv.lock's requires-python (>=3.12,<3.15), which this job syncs against.
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install nhx-evals-sdk with no extras and no dev group
        run: uv sync --frozen --package nhx-evals-sdk --no-dev
      # pytest is not in the package-only sync; install the runner only (do not add SDK deps).
      # WHY BOTH THIS JOB AND THE UNIT TEST:
      # - Unit-test CI syncs the whole workspace: a sibling package may already
      #   provide httpx, so an undeclared SDK dep still imports — green here, broken for consumers
      #   who only installed nhx-evals-sdk.
      # - This job: `uv sync --package nhx-evals-sdk --no-dev` (no extras/siblings) so that
      #   undeclared-dep case fails, then runs test_lazy_public_api (laziness assertions; one source
      #   of truth — no duplicated heredoc probe).
      - name: Run lazy-import closure unit test under the stripped install
        run: |
          uv pip install --python .venv/bin/python pytest
          uv run --frozen --no-sync pytest \
            packages/nhx_evals_sdk/tests/test_lazy_public_api.py::test_agent_eval_import_does_not_pull_the_execution_stack -v

  python-integration-test:
    name: Python integration tests (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Whole-package allocation based on JUnit durations; see tests/integration_groups.py.
        group: [services, platform]
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Log in to Docker Hub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ vars.AIRE_DOCKERHUB_USERNAME }}
          password: ${{ secrets.AIRE_DOCKERHUB_ACCESS_TOKEN }}
      - name: Pull mock base images
        run: |
          docker pull nginx:1.29.4-alpine-slim
          docker pull alpine:3.23
        shell: bash
      - name: Run integration tests
        run: make test-integration-ci
        env:
          EXTRA: cpu
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NHX_FILES_HF_RETRY_ATTEMPTS: "7"
          NHX_FILES_HF_RETRY_INITIAL_DELAY_SECONDS: "1"
          NHX_FILES_HF_RETRY_MAX_DELAY_SECONDS: "30"
          PYTEST_WORKERS: "4"
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
          PYTEST_EXTRA: --integration-group=${{ matrix.group }}
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-integration-test-results-${{ matrix.group }}
          retention-days: 30
          include-hidden-files: true
          path: |
            report.xml
            coverage.xml
            coverage.json
            .coverage
      - name: Upload worker crash dumps
        # Separate artifact so coverage-comment keeps receiving exactly the files it expects.
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-integration-crash-dumps-${{ matrix.group }}
          retention-days: 30
          if-no-files-found: ignore
          path: crash-dumps/

  evaluator-integration-test:
    name: Evaluator integration tests
    # Required (see ci-status), unlike the repo-wide `python-integration-test` job, which stays
    # advisory so this does not make every team's integration suite blocking. Path-filtered, so it
    # skips -- and skips count as pass -- on PRs that do not touch the evaluator. Also hosts the
    # opt-in Harbor taskset integration step so its failures gate merges too.
    needs: [changes]
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.evaluator-integration == 'true' ||
        needs.changes.outputs.harbor-integration == 'true' ||
        needs.changes.outputs.deps == 'true'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Run evaluator integration tests
        run: >-
          uv run --frozen pytest plugins/nemo-evals/tests/integration
          -m integration -n 4 --dist loadgroup -v
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
      # test_taskset_run_controller.py tests platforms it does not start, so it skips in the step above.
      # The script hosts one per auth mode at the URLs below and runs only that file against them; every
      # test has to run here, and a skip fails the step.
      - name: Run taskset-run controller integration
        id: controller-integration
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: bash .github/scripts/run-taskset-run-controller-integration.sh
        env:
          NHX_AGENT_BASE_URL: http://localhost:18090
          NHX_AGENT_AUTH_BASE_URL: http://localhost:18092
          UV_FROZEN: "1"
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
      - name: Upload taskset-run controller diagnostics
        if: ${{ !cancelled() && steps.controller-integration.outcome == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: taskset-run-controller-results
          retention-days: 14
          if-no-files-found: warn
          # Logs and results only: the platforms' data directories sit beside them.
          path: |
            ${{ runner.temp }}/controller-platforms/*.log
            ${{ runner.temp }}/controller-platforms/junit.xml
      # Run separately from xdist: the shared platform fixture binds one port.
      # Keep opt-in and plugin isolation scoped to this step, not the general suite.
      - name: Run Harbor taskset integration
        id: harbor-integration
        # Directory/file patterns live in .github/actions/changes/action.yaml.
        # Dependency changes can also affect Harbor; manual runs always exercise it.
        if: >
          !cancelled() && (
            github.event_name == 'workflow_dispatch' ||
            needs.changes.outputs.deps == 'true' ||
            needs.changes.outputs.harbor-integration == 'true'
          )
        timeout-minutes: 10
        run: |
          uv sync --frozen --package nemohelix --package nemo-evals-plugin --extra harbor
          # Preserve the Harbor extra when the fixture launches `uv run nemo services run`.
          export UV_NO_SYNC=1
          uv run --frozen --no-sync pytest \
            plugins/nemo-evals/tests/integration/test_harbor_taskset.py -v -n 0 \
            --basetemp="$RUNNER_TEMP/harbor-taskset" \
            --junitxml="$RUNNER_TEMP/harbor-taskset.xml" -o junit_logging=all
        env:
          RUN_AGENT_EVAL_INTEGRATION: "1"
          NEMO_PLUGIN_SERVICES_ALLOWLIST: evals
          NEMO_PLUGIN_CONTROLLERS_ALLOWLIST: ""
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
      - name: Upload Harbor integration diagnostics
        if: always() && (steps.harbor-integration.outcome == 'success' || steps.harbor-integration.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harbor-taskset-results
          retention-days: 14
          if-no-files-found: warn
          # Exclude the platform database and ClickHouse storage in sibling directories.
          path: |
            ${{ runner.temp }}/harbor-taskset.xml
            ${{ runner.temp }}/harbor-taskset/test_harbor_taskset*/

  python-auth-idp-static-test:
    name: Python auth-idp static tests
    needs: [changes]
    if: >
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.cpu-smoke == 'true' ||
        needs.changes.outputs.helm == 'true' ||
        needs.changes.outputs.auth-idp == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Run auth-idp static tests
        run: |
          set -euo pipefail
          docker pull docker.io/envoyproxy/envoy:v1.37.0
          docker pull envoyproxy/envoy:v1.36.2
          helm dependency build k8s/helm
          helm dependency build contrib/auth/authentik/helm
          helm dependency build contrib/auth/zitadel/helm
          uv run --frozen --group auth-idp-e2e pytest tests/auth_idp/static -v
        env:
          _TYPER_FORCE_DISABLE_TERMINAL: "1"
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-auth-idp-static-test-results
          retention-days: 30
          if-no-files-found: ignore
          path: |
            report.xml
            coverage.xml
            coverage.json

  wheel-build:
    name: Wheel build and install tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Build nemo-helix wheel
        id: helix
        uses: ./.github/actions/build-nemo-helix-wheel
        with:
          package: nemo-helix
          out-dir: ${{ github.workspace }}/dist/nemo-helix
          cadence: rc
          # Sentinel epoch — the wheel version is meaningless for a CI test
          # build, but stamp_sdk_version.py requires \d{14}.
          rc-timestamp: "19700101000000"
          python-version: ${{ matrix.python-version }}
      - name: Upload nemo-helix wheel
        if: ${{ !cancelled() && steps.helix.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nemo-helix-wheel-py${{ matrix.python-version }}
          path: ${{ steps.helix.outputs.wheel-path }}
          retention-days: 7
          if-no-files-found: error
      - name: Build nemo-helix-plugin wheel
        id: plugin
        if: ${{ !cancelled() }}
        uses: ./.github/actions/build-nemo-helix-wheel
        with:
          package: nemo-helix-plugin
          out-dir: ${{ github.workspace }}/dist/nemo-helix-plugin
          cadence: rc
          rc-timestamp: "19700101000000"
          python-version: ${{ matrix.python-version }}
      - name: Upload nemo-helix-plugin wheel
        if: ${{ !cancelled() && steps.plugin.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nemo-helix-plugin-wheel-py${{ matrix.python-version }}
          path: ${{ steps.plugin.outputs.wheel-path }}
          retention-days: 7
          if-no-files-found: error
      # Independent steps preserve all install results even if an earlier method fails.
      # The helper isolates venvs, uv tool state, and CLI data from the build workspace.
      - name: Install and test CLI (venv)
        if: ${{ !cancelled() && steps.helix.outcome == 'success' }}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          WHEEL: ${{ steps.helix.outputs.wheel-path }}
        run: bash tests/packaging/test-wheel-install.sh nemo-helix venv
      - name: Install and test CLI (tool)
        if: ${{ !cancelled() && steps.helix.outcome == 'success' }}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          WHEEL: ${{ steps.helix.outputs.wheel-path }}
        run: bash tests/packaging/test-wheel-install.sh nemo-helix tool
      - name: Install and test plugin (venv)
        if: ${{ !cancelled() && steps.plugin.outcome == 'success' }}
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          WHEEL: ${{ steps.plugin.outputs.wheel-path }}
        run: bash tests/packaging/test-wheel-install.sh nemo-helix-plugin venv

