# Temporary branch-only caller: never merge this file into the default branch.
name: Release smoke validation
run-name: Smoke validation ${{ inputs.image_tag }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full published chart version to validate
        type: string
        required: true
      publish:
        description: Unused compatibility input; this workflow does not publish
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  helper-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - run: node --test .github/scripts/tests/release-smoke.test.cjs .github/scripts/tests/release-notification.test.cjs
  smoke:
    if: inputs.image_tag != 'provider-diagnostic'
    uses: ./.github/workflows/release-smoke.yaml
    with:
      release-version: ${{ inputs.image_tag }}
      send-notifications: false
    secrets: inherit
  provider-diagnostic:
    if: inputs.image_tag == 'provider-diagnostic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NVIDIA_INFERENCE_URL: ${{ secrets.NVIDIA_INFERENCE_URL }}
          NVIDIA_INFERENCE_KEY: ${{ secrets.NVIDIA_INFERENCE_KEY }}
        with:
          script: |
            const probe = require('./.github/scripts/release-smoke-provider-probe.cjs');
            console.log(await probe({ env: process.env, fetchImpl: fetch }));
