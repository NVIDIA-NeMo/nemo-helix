  web-typecheck:
    name: Web type and SDK checks
    needs: [changes]
    if: >
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.web-studio == 'true' ||
        needs.changes.outputs.openapi == 'true'
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm via corepack
        run: npm i -g corepack@0.31.0 && corepack enable pnpm
      - name: Install dependencies
        id: deps
        run: pnpm install --frozen-lockfile
      # Check the committed sources before generation can modify them.
      - name: Typecheck web packages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ needs.changes.outputs.openapi }}" != "true" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            pnpm --filter="...[origin/${{ github.base_ref }}]" run --parallel --if-present typecheck
          else
            pnpm run --recursive --parallel --if-present typecheck
          fi
      - name: Generate SDK from OpenAPI specs
        id: sdk
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm --filter @nemo/sdk gen:all-force
      - name: Typecheck SDK generated output
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: pnpm --filter @nemo/sdk typecheck
      - name: Typecheck web packages against regenerated SDK
        if: ${{ !cancelled() && steps.sdk.outcome == 'success' }}
        run: pnpm run --recursive --parallel --if-present typecheck

  web-test:
    name: Web tests
    needs: [changes]
    if: >
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.web-studio == 'true'
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm via corepack
        run: npm i -g corepack@0.31.0 && corepack enable pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test changed packages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            filters=(--filter="...[origin/${{ github.base_ref }}]")
            # Studio imports these from outside web/, and only its tests resolve the imports:
            # the `*?raw` module type lets typecheck pass even when a file is gone.
            if [ "${{ needs.changes.outputs.customizer-skill-references }}" = "true" ]; then
              filters+=(--filter=nemo-studio-ui)
            fi
            pnpm "${filters[@]}" run --parallel --if-present test:ci
          else
            pnpm run --recursive --parallel --if-present test:ci
          fi

  web-static:
    name: Web static checks
    needs: [changes]
    if: >
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.web-studio == 'true'
      )
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
        shell: bash
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - name: Install pnpm via corepack
        run: npm i -g corepack@0.31.0 && corepack enable pnpm
      - name: Install dependencies
        id: deps
        run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm format
      - name: Lint
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm lint
      - name: Check studio deps
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: pnpm deps:studio
      - name: Regenerate and check plugin surface types
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          pnpm --filter @nemo/common types:plugin
          # Out-of-tree plugins vendor this artifact; it must stay current.
          git diff --exit-code -- packages/common/plugin-types

