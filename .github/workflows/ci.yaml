      - name: Report results and alert on failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          CHECKS_NAME: image
          SLACK_ALERTS_WEBHOOK: ${{ secrets.SLACK_ALERTS_WEBHOOK }}
        with:
          script: |
            const { reportPostMergeResults } = require("./.github/scripts/ci-post-merge-notification.cjs");
            await reportPostMergeResults({ core, context, env: process.env, fetchImpl: fetch });

  github-scripts:
    name: GitHub JavaScript checks
    needs: [changes]
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch' ||
        needs.changes.outputs.github-scripts == 'true'
