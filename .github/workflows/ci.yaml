# Temporary branch-only caller: never merge this file into the default branch.
name: Release smoke validation
run-name: Smoke validation ${{ inputs.image_tag }}

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Full published chart version to validate
        type: string
        required: true
      publish:
        description: Unused compatibility input; this workflow does not publish
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

jobs:
  helper-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
      - run: node --test .github/scripts/tests/release-smoke.test.cjs .github/scripts/tests/release-notification.test.cjs
  smoke:
    uses: ./.github/workflows/release-smoke.yaml
    with:
      release-version: ${{ inputs.image_tag }}
      send-notifications: false
      check-latest: true
    secrets: inherit
