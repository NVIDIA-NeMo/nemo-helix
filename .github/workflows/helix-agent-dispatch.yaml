# Generic GitHub -> NeMo Helix agent trigger: a `/helix-*` PR comment fires a
# `repository_dispatch` to the worker repo (fire-and-forget; the agent acks + replies
# itself). Architecture + the trigger->agent mapping: see HELIX_AGENT_DISPATCH.md.

name: Helix agent dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch Helix agent
    # Gate on: a PR comment (not an issue), a `/helix-` trigger token, AND an org
    # OWNER/MEMBER commenter — issue_comment runs in the base repo with its secrets, so
    # this stops an arbitrary external user from firing the agent. (COLLABORATOR dropped:
    # it doesn't imply write access. A live repo-permission check is a tracked follow-up.)
    if: >-
      github.event.issue.pull_request != null &&
      startsWith(github.event.comment.body, '/helix-') &&
      contains(fromJSON('["OWNER", "MEMBER"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dispatch Helix agent
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DISPATCH_REPO: ${{ secrets.AUTOMATION_DISPATCH_REPO }}
        with:
          github-token: ${{ env.ACT == 'true' && 'act-no-dispatch' || secrets.CI_DISPATCH_TOKEN }}
          script: |
            const { dispatchAgent } = require("./.github/scripts/helix-agent-dispatch.cjs");
            await dispatchAgent({ core, github, context, env: process.env });
