name: Forward merge recovery dispatch

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch failed forward merge recovery
    if: >-
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'rapids-bot[bot]' &&
      startsWith(github.event.issue.title, 'Forward-merge ') &&
      startsWith(github.event.comment.body, '**FAILURE** - Unable to forward-merge')
    runs-on: ubuntu-latest
    steps:
      - name: Check out workflow revision
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Dispatch recovery to Platform-Deploy
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DISPATCH_REPO: ${{ secrets.CI_DISPATCH_REPO }}
        with:
          github-token: ${{ env.ACT == 'true' && 'act-no-dispatch' || secrets.CI_DISPATCH_TOKEN }}
          script: |
            const { dispatchOrReport } = require("./.github/scripts/release-dispatch.cjs");
            await dispatchOrReport({
              core,
              github,
              env: process.env,
              eventType: "recover-forward-merge",
              clientPayload: { pull_number: context.payload.issue.number },
            });
