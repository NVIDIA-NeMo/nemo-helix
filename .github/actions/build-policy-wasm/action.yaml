name: Build OPA policy WASM
description: >
  Installs Flox, activates the OPA environment, and builds the authorization
  policy WASM asset at
  services/core/auth/src/nhx/core/auth/assets/policy.wasm. Assumes the
  repository has already been checked out to `inputs.source-root`.

inputs:
  source-root:
    description: Path to the checked-out NeMo Helix repository.
    required: false
    default: "."
  activate-as-root:
    description: Run Flox activation as root for runners with a root-owned Nix store.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install Flox
      uses: flox/install-flox-action@c94e7e1ab56ae14fe98bae4fd84384fd135f0c2a # v2.4.0
      with:
        disable-metrics: "true"
    - name: Build policy WASM
      if: inputs.activate-as-root != 'true'
      uses: flox/activate-action@410568008895a0f2e09a34bbd9523f8ef1f2d292 # v1.1.0
      with:
        dir: ${{ inputs.source-root }}/tools/open-policy-agent
        command: >-
          bash -c 'cd "$1" && ./script/build_policy_wasm.sh' _ "${{ inputs.source-root }}"
    - name: Build policy WASM as root
      if: inputs.activate-as-root == 'true'
      shell: bash
      env:
        SOURCE_ROOT: ${{ inputs.source-root }}
      run: |
        source_root="$(cd "${SOURCE_ROOT}" && pwd -P)"
        owner_uid="$(id -u)"
        owner_gid="$(id -g)"
        policy_wasm="${source_root}/services/core/auth/src/nhx/core/auth/assets/policy.wasm"
        sudo git config --global --add safe.directory "${source_root}"
        sudo -E flox -q activate --dir="${source_root}/tools/open-policy-agent" -- \
          bash -c 'cd "$1" && ./script/build_policy_wasm.sh' _ "${source_root}"
        sudo chown "${owner_uid}:${owner_gid}" "${policy_wasm}"
