name: Set up web dependencies
description: Install pnpm, Node.js, and web/ dependencies, reusing the cached pnpm store and generated SDK.

runs:
  using: composite
  steps:
    # setup-node's pnpm cache runs `pnpm store path` from the repo root, which has no
    # packageManager, so activate web/'s pinned pnpm before it.
    - name: Install pnpm via corepack
      shell: bash
      run: |
        npm i -g corepack@0.31.0
        corepack enable pnpm
        corepack prepare "$(jq -r .packageManager web/package.json)" --activate
    - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: web/pnpm-lock.yaml
    # postinstall's `gen:all` skips generation when generated/.input-hash matches its inputs,
    # so a restored tree is only used if it was built from the same specs and generator.
    - name: Restore generated SDK
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: web/packages/sdk/generated
        key: web-sdk-${{ runner.os }}-${{ hashFiles('.nvmrc', 'web/pnpm-lock.yaml', 'openapi/openapi.yaml', 'plugins/*/openapi/openapi.yaml', 'web/packages/sdk/orval.config.ts', 'web/packages/sdk/generateAll.ts', 'web/packages/sdk/orval/**') }}
    - name: Install dependencies
      shell: bash
      working-directory: web
      run: pnpm install --frozen-lockfile
