name: Setup Kind cluster with NeMo Helix
description: >
  Creates a Kind cluster, installs tooling (kind, kubectl, Helm, uv),
  optionally deploys NeMo Helix via Helm, and waits for the API to become
  healthy.

inputs:
  kind-cluster-name:
    description: Kind cluster name
    required: true
  install-nemo-helix:
    description: Deploy NeMo Helix into the Kind cluster
    required: false
    default: "true"
  kube-namespace:
    description: Kubernetes namespace for NeMo Helix
    required: false
    default: nemo-helix
  kube-gateway-name:
    description: Gateway resource name
    required: false
    default: nhx-e2e-gateway
  image-registry:
    description: Container image registry
    required: true
  image-tag:
    description: Container image tag
    required: true
  helm-values:
    description: Helm values file path (relative to repo root)
    required: false
    default: e2e/k8s/values/kind.yaml
  helm-extra-args:
    description: Extra arguments passed to Helm install, for example additional -f values files
    required: false
    default: ""
  kind-enable-network-policies:
    description: Create Kind without the default CNI and install Calico for NetworkPolicy enforcement
    required: false
    default: "false"
  kind-enable-gateway:
    description: Install Gateway API, run cloud-provider-kind, and create the test Gateway
    required: false
    default: "true"
  wait-for-api:
    description: Wait for the Gateway-routed API endpoint after installing NeMo Helix
    required: false
    default: "true"
  kind-image-pull-token:
    description: Token for pulling images into Kind
    required: true
  kind-image-pull-user:
    description: Username for pulling images into Kind
    required: true
  ngc-api-key:
    description: NGC API key (can be a placeholder for CPU-only)
    required: false
    default: not-used

runs:
  using: composite
  steps:
    - name: Free disk space
      uses: ./.github/actions/free-disk-space
      with:
        disable_swap: "true"
        remove_haskell: "true"
        remove_java: "true"
        remove_ruby: "true"
        remove_swift: "true"
        prune_docker: "true"

    - name: Install kind
      shell: bash
      env:
        KIND_VERSION: v0.32.0
      run: |
        set -euo pipefail

        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *)
            echo "Unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        kind_url="https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-${arch}"
        curl -fsSLo "${RUNNER_TEMP}/kind" "${kind_url}"
        curl -fsSLo "${RUNNER_TEMP}/kind.sha256sum" "${kind_url}.sha256sum"
        sed "s#  kind-linux-${arch}#  ${RUNNER_TEMP}/kind#" "${RUNNER_TEMP}/kind.sha256sum" | sha256sum -c -
        sudo install -m 0755 "${RUNNER_TEMP}/kind" /usr/local/bin/kind

    - name: Install kubectl
      shell: bash
      env:
        KUBECTL_VERSION: v1.33.7
      run: |
        set -euo pipefail

        case "$(uname -m)" in
          x86_64) arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *)
            echo "Unsupported architecture: $(uname -m)" >&2
            exit 1
            ;;
        esac

        kubectl_url="https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${arch}/kubectl"
        curl -fsSLo "${RUNNER_TEMP}/kubectl" "${kubectl_url}"
        curl -fsSLo "${RUNNER_TEMP}/kubectl.sha256" "${kubectl_url}.sha256"
        echo "$(cat "${RUNNER_TEMP}/kubectl.sha256")  ${RUNNER_TEMP}/kubectl" | sha256sum -c -
        sudo install -m 0755 "${RUNNER_TEMP}/kubectl" /usr/local/bin/kubectl

    - name: Install Helm
      uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5.0.0

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      with:
        version: ${{ env.UV_VERSION }}
        python-version: "3.13"
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Start kind cluster
      shell: bash
      env:
        KIND_CLUSTER_NAME: ${{ inputs['kind-cluster-name'] }}
        KUBE_NAMESPACE: ${{ inputs['kube-namespace'] }}
        NGC_API_KEY: ${{ inputs['ngc-api-key'] }}
        GITHUB_TOKEN: ${{ inputs['kind-image-pull-token'] }}
        KIND_ENABLE_GATEWAY: ${{ inputs['kind-enable-gateway'] }}
        KIND_ENABLE_NETWORK_POLICIES: ${{ inputs['kind-enable-network-policies'] }}
      run: bash e2e/k8s/scripts/setup_local_kind_cpu.sh

    - name: Set default kubectl namespace
      shell: bash
      env:
        NAMESPACE: ${{ inputs['kube-namespace'] }}
      run: kubectl config set-context --current --namespace="${NAMESPACE}"

    - name: Verify Gateway API setup
      if: ${{ inputs['kind-enable-gateway'] == 'true' }}
      shell: bash
      env:
        NAMESPACE: ${{ inputs['kube-namespace'] }}
        KUBE_GATEWAY_NAME: ${{ inputs['kube-gateway-name'] }}
      run: |
        set -euo pipefail
        kubectl wait --for=condition=Established crd/gateways.gateway.networking.k8s.io --timeout=2m
        kubectl wait --for=condition=Established crd/httproutes.gateway.networking.k8s.io --timeout=2m
        kubectl get gatewayclass cloud-provider-kind
        kubectl -n "${NAMESPACE}" get gateway "${KUBE_GATEWAY_NAME}"

    - name: Pre-pull GHCR images into kind
      if: ${{ inputs['install-nemo-helix'] == 'true' }}
      shell: bash
      env:
        KIND_IMAGE_PULL_TOKEN: ${{ inputs['kind-image-pull-token'] }}
        KIND_IMAGE_PULL_USER: ${{ inputs['kind-image-pull-user'] }}
        NHX_E2E_REGISTRY: ${{ inputs['image-registry'] }}
        NHX_E2E_TAG: ${{ inputs['image-tag'] }}
        # CPU generic HTTP smoke image; tag must match e2e/test_models_deployments_plugin.py.
        GENERIC_HTTP_IMAGE: docker.io/library/python
        GENERIC_HTTP_TAG: 3.12-alpine
      run: |
        e2e/k8s/scripts/prepull_kind_images.sh \
          "${NHX_E2E_REGISTRY}/nhx-api:${NHX_E2E_TAG}" \
          "${NHX_E2E_REGISTRY}/nhx-cpu-tasks:${NHX_E2E_TAG}" \
          "${GENERIC_HTTP_IMAGE}:${GENERIC_HTTP_TAG}"

    - name: Install NeMo Helix
      if: ${{ inputs['install-nemo-helix'] == 'true' }}
      shell: bash
      env:
        NAMESPACE: ${{ inputs['kube-namespace'] }}
        NHX_E2E_REGISTRY: ${{ inputs['image-registry'] }}
        NHX_E2E_TAG: ${{ inputs['image-tag'] }}
        HELM_VALUES: ${{ inputs['helm-values'] }}
        HELM_EXTRA_ARGS: ${{ inputs['helm-extra-args'] }}
        REQUIRE_NHX_E2E_IMAGES: "true"
        POSTGRES_IMAGE: docker.io/library/postgres
        BUSYBOX_IMAGE: docker.io/library/busybox:stable
        GITHUB_TOKEN: ${{ inputs['kind-image-pull-token'] }}
      run: |
        if ! e2e/k8s/scripts/install_helm_e2e.sh; then
          echo "--- helm list -A ---"
          helm list -A || true
          echo "--- helm status ${NAMESPACE}/nemo-helix ---"
          helm status -n "${NAMESPACE}" nemo-helix || true
          echo "--- kubectl get all -n ${NAMESPACE} ---"
          kubectl get all -n "${NAMESPACE}" || true
          exit 1
        fi

    - name: Wait for API
      if: ${{ inputs['install-nemo-helix'] == 'true' && inputs['wait-for-api'] == 'true' }}
      shell: bash
      env:
        NHX_E2E_CLUSTER_URL: ${{ env.NHX_E2E_CLUSTER_URL }}
      run: |
        test -n "${NHX_E2E_CLUSTER_URL}"
        e2e/k8s/scripts/wait_for_api.sh "${NHX_E2E_CLUSTER_URL}/cluster-info" 120
