name: "Changes"
description: >
  Detect which file categories changed using dorny/paths-filter.
  Outputs boolean flags that downstream jobs use to decide whether to run.

outputs:
  openapi:
    description: "'true' if any file under openapi/ changed"
    value: ${{ steps.filter.outputs.openapi }}
  test:
    description: "'true' if any file under tests/ or pytest.ini changed"
    value: ${{ steps.filter.outputs.tests }}
  deps:
    description: "'true' if any dependency-related files changed"
    value: ${{ steps.filter.outputs.deps }}
  agents-harnesses:
    description: "'true' if harness adapter integration code or tests changed"
    value: ${{ steps.filter.outputs.agents-harnesses }}
  fabric:
    description: "'true' if the Fabric agent-eval runtime, its tests, or its dependency extra changed"
    value: ${{ steps.filter.outputs.fabric }}
  harbor-integration:
    description: "'true' if the Harbor runtime, its tests/fixtures, or its dependency extra changed"
    value: ${{ steps.filter.outputs.harbor-integration }}
  evaluator-sdk-closure:
    description: "'true' if anything that can change the agent_eval import closure changed"
    value: ${{ steps.filter.outputs.evaluator-sdk-closure }}
  evaluator-integration:
    description: "'true' if anything the evaluator integration tests exercise changed"
    value: ${{ steps.filter.outputs.evaluator-integration }}
  scaled-evals:
    description: "'true' if the temporary scaled-evals plugin changed"
    value: ${{ steps.filter.outputs.scaled-evals }}
  e2e:
    description: "'true' if any e2e test files changed"
    value: ${{ steps.filter.outputs.e2e }}
  docs:
    description: "'true' if any documentation files changed"
    value: ${{ steps.filter.outputs.docs }}
  tools:
    description: "'true' if any files under tools/ changed"
    value: ${{ steps.filter.outputs.tools }}
  web-studio:
    description: "'true' if any web files changed"
    value: ${{ steps.filter.outputs.web-studio }}
  customizer-skill-references:
    description: "'true' if the customizer skill references Studio inlines at build time changed"
    value: ${{ steps.filter.outputs.customizer-skill-references }}
  github-scripts:
    description: "'true' if GitHub JavaScript scripts or their validation changes"
    value: ${{ steps.filter.outputs.github-scripts }}
  docker:
    description: "'true' if any Docker build files changed"
    value: ${{ steps.filter.outputs.docker }}
  docker-scripts:
    description: "'true' if scripts directly invoked by Docker builds changed"
    value: ${{ steps.filter.outputs.docker-scripts }}
  helm:
    description: "'true' if any Helm chart files changed"
    value: ${{ steps.filter.outputs.helm }}
  python-runtime:
    description: "'true' if Python runtime packages, services, plugins, or SDK files changed"
    value: ${{ steps.filter.outputs.python-runtime }}
  k8s-smoke:
    description: "'true' if Kubernetes smoke test support files changed"
    value: ${{ steps.filter.outputs.k8s-smoke }}
  guardrails-benchmark:
    description: "'true' if the nemo-guardrails plugin or guardrails service changed"
    value: ${{ steps.filter.outputs.guardrails-benchmark }}
  deployments-openshell:
    description: "'true' if the nemo-deployments plugin changed (OpenShell backend coverage)"
    value: ${{ steps.filter.outputs.deployments-openshell }}
  jobs-openshell:
    description: "'true' if the jobs service or jobs-launcher changed (OpenShell job backend coverage)"
    value: ${{ steps.filter.outputs.jobs-openshell }}
  ngc-metadata:
    description: "'true' if NGC metadata scripts, tests, or assets changed"
    value: ${{ steps.filter.outputs.ngc-metadata }}
  cpu-smoke:
    description: "'true' if CPU smoke image or Kubernetes smoke test inputs changed"
    value: ${{ steps.filter.outputs.deps == 'true' || steps.filter.outputs.docker == 'true' || steps.filter.outputs.docker-scripts == 'true' || steps.filter.outputs.helm == 'true' || steps.filter.outputs.openapi == 'true' || steps.filter.outputs.python-runtime == 'true' || steps.filter.outputs.web-studio == 'true' || steps.filter.outputs.k8s-smoke == 'true' }}
  auth-idp:
    description: "'true' if auth-idp tests or their containerized E2E harness inputs changed"
    value: ${{ steps.filter.outputs.auth-idp == 'true' }}

runs:
  using: "composite"
  steps:
    # Requires actions/checkout to have been run first so that
    # (a) this action.yml can be found, and
    # (b) dorny/paths-filter can diff against git history on push events.
    - name: Detect changed paths
      id: filter
      uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
      with:
        filters: |
          openapi:
            - 'openapi/**'
            - 'plugins/*/openapi/**'
            - 'plugins/*/src/**'
            - 'plugins/*/pyproject.toml'
            - 'packages/nhx_common/src/nhx_common/api/**'
            - 'packages/nhx_common/src/nhx_common/datamodel/**'
            - 'packages/nemo_helix_plugin/src/**'
            - 'packages/nhx_evals_sdk/src/**'
            - 'script/generate_openapi_spec.py'
            - 'script/generate-openapi-spec.sh'
            - 'script/openapi_helper/**'
          tests:
            - 'tests/**'
            - 'pytest.ini'
          deps:
            - 'pyproject.toml'
            - 'uv.lock'
            - '.pre-commit-config.yaml'
            - '.flox/**'
            - 'tools/common/**'
            - 'tools/osv-scanner/**'
            - 'tools/python/**'
          agents-harnesses:
            - 'script/dev-install-hermes.sh'
            - 'plugins/nemo-agents/**'
            - 'packages/nemo_helix_plugin/**'
            - 'packages/nemo_helix/pyproject.toml'
            - 'conftest.py'
            - 'pytest.ini'
            - '.github/workflows/ci.yaml'
            - '.github/actions/changes/action.yaml'
          fabric:
            - 'packages/nhx_evals_sdk/src/nhx_evals_sdk/agent_eval/runtimes/fabric/**'
            - 'packages/nhx_evals_sdk/src/nhx_evals_sdk/agent_eval/**'
            - 'packages/nhx_evals_sdk/tests/agent_eval/test_fabric_*.py'
            - 'packages/nhx_evals_sdk/pyproject.toml'
            - '.github/workflows/ci.yaml'
            - '.github/actions/changes/action.yaml'
          harbor-integration:
            - 'plugins/nemo-evals/src/nemo_evals/harbor/**'
            - 'plugins/nemo-evals/src/nemo_evals/revisions.py'
            - 'plugins/nemo-evals/src/nemo_evals/sdk/**'
            - 'plugins/nemo-evals/src/nemo_evals/jobs/**'
            - 'plugins/nemo-evals/src/nemo_evals/api/**'
            - 'plugins/nemo-evals/src/nemo_evals/task_refs.py'
            - 'plugins/nemo-evals/src/nemo_evals/task_identity.py'
            - 'packages/nhx_evals_sdk/src/nhx_evals_sdk/agent_eval/**'
            - 'packages/nhx_evals_sdk/tests/agent_eval/test_harbor_*.py'
            - 'packages/nhx_evals_sdk/pyproject.toml'
            - 'plugins/nemo-evals/tests/integration/test_harbor_*.py'
            - 'plugins/nemo-evals/tests/integration/conftest.py'
            - 'plugins/nemo-evals/examples/harbor_taskset/**'
            - 'plugins/nemo-evals/src/nemo_evals/examples/harbor_test_agent.py'
            - 'plugins/nemo-evals/pyproject.toml'
            - '.github/workflows/ci.yaml'
            - '.github/actions/changes/action.yaml'
          evaluator-integration:
            # What the evaluator integration suite actually drives. The harness starts a real
            # platform (`nemo services run --service-group all`), so a change to a service it calls
            # can break these tests without touching evaluator code at all -- and because the job is
            # required, a filter that missed those paths would let the skip count as a pass.
            #
            # The services listed are the ones the suite calls, not everything `--service-group all`
            # happens to start: entities (workspaces, tasks, tasksets, metrics), jobs (submission and
            # reconciliation), files (filesets, derived metrics), models + inference-gateway (model
            # targets via the IGW mock provider), secrets (env_secrets references), auth (the
            # auth-enabled platform fixture) and intake (result publishing). Extend it deliberately
            # when the suite starts calling something new.
            - 'plugins/nemo-evals/**'
            - 'packages/nhx_evals_sdk/**'
            - 'packages/nemo_helix_plugin/**'
            - 'packages/nhx_common/**'  # shared contracts every service above is built on
            - 'services/core/entities/**'
            - 'services/core/jobs/**'
            - 'services/core/files/**'
            - 'services/core/models/**'
            - 'services/core/inference-gateway/**'
            - 'services/core/secrets/**'
            - 'services/core/auth/**'
            - 'services/intake/**'
            # The suite runs under `uv run --frozen`, so the lockfile decides every version it
            # executes against, and the root manifest decides which workspace members and
            # dependency groups exist at all. Per-package manifests are already covered by the
            # globs above. Without these two, a lockfile-only PR skips a required job.
            - 'pyproject.toml'
            - 'uv.lock'
            - '.github/workflows/ci.yaml'  # the job definition itself
            - '.github/actions/changes/action.yaml'  # this filter (self-coverage)
          evaluator-sdk-closure:
            # Paths that can change what `import ...harbor.runtime` loads or how the smoke job runs.
            - 'packages/nhx_evals_sdk/src/nhx_evals_sdk/**'  # package-wide import closure
            - 'packages/nhx_evals_sdk/tests/test_lazy_public_api.py'  # smoke test file
            - 'packages/nhx_evals_sdk/pyproject.toml'  # declared [project] dependencies
            - 'uv.lock'  # locked versions installed for the package
            - '.github/workflows/ci.yaml'  # smoke job definition
            - '.github/actions/changes/action.yaml'  # this filter (self-coverage)
          scaled-evals:
            - 'plugins/_temporary-scaled-evals/**'
            - 'packages/nemo_helix_plugin/**'
            - 'packages/nhx_platform_runner/**'
            - 'packages/nhx_sandbox/**'
            # test_files_backend.py imports these from outside the plugin tree.
            - 'packages/filesets/src/filesets/resources.py'
            - 'packages/nhx_testing/src/nhx/testing/**'
            - 'services/core/files/src/nhx/core/files/service.py'
            - 'services/core/secrets/src/nhx/core/secrets/service.py'
          e2e:
            - 'e2e/**'
          docs:
            - 'docs/**'
          tools:
            - 'tools/**'
            - 'packages/nemo_helix_ext/**'
            - 'packages/nemo_helix_plugin/**'
            - 'packages/nhx_common/**'
          web-studio:
            - 'web/**'
            - '.nvmrc'
            - 'tools/nodejs/**'
            # Studio inlines these at build time (see web/packages/studio/tsconfig.json).
            - 'plugins/nemo-customizer/src/nemo_customizer/skills/nemo-customizer/references/**'
          # Lives outside web/, so pnpm's changed-package filter never selects Studio for it.
          customizer-skill-references:
            - 'plugins/nemo-customizer/src/nemo_customizer/skills/nemo-customizer/references/**'
          github-scripts:
            - '.github/scripts/**/*.cjs'
            - '.github/eslint.config.mjs'
            - '.github/workflows/release.yaml'
            - '.github/workflows/ci.yaml'
            - '.github/actions/changes/action.yaml'
          docker:
            - 'docker-bake.hcl'
            - 'docker/**'
            - 'Makefile'
          docker-scripts:
            - 'script/install_duckdb_extensions.sh'
            - 'script/build_policy_wasm.sh'
          helm:
            - 'k8s/**'
            - 'tools/lint/lint-helm.sh'
            - 'tools/helm/**'
            - '.github/workflows/ci.yaml'
            - '.github/actions/changes/action.yaml'
            - '.pre-commit-config.yaml'
          python-runtime:
            - 'packages/**'
            - 'services/**'
            - 'plugins/**'
          k8s-smoke:
            - 'e2e/k8s/scripts/**'
            - 'e2e/k8s/values/**'
            - 'e2e/test_evaluator_plugin.py'
            - 'e2e/test_jobs.py'
            - '.github/actions/free-disk-space/action.yaml'
          guardrails-benchmark:
            - 'plugins/nemo-guardrails/**'
            - 'services/guardrails/**'
            - 'packages/nemo_helix_plugin/**'
          deployments-openshell:
            - 'plugins/nemo-deployments/**'
            - 'packages/nemo_helix_plugin/**'
          jobs-openshell:
            - 'services/core/jobs/**'
            - 'packages/nemo_helix_plugin/**'
          ngc-metadata:
            - '.github/scripts/ngc_metadata.py'
            - '.github/scripts/tests/test_ngc_metadata.py'
            - '.github/assets/ngc/**'
          auth-idp:
            - 'conftest.py'
            - 'pytest.ini'
            - 'tests/auth_idp/**'
            - 'e2e/**'
            - 'contrib/auth/**'
