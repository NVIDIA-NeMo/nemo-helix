# Local-cluster adaptations and the same mock provider used by CPU agent E2E tests.
fullnameOverride: release-smoke
rbac:
  volcanoEnabled: false
postgresql:
  image:
    repository: docker.io/library/postgres
clickhouse:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
core:
  storage:
    accessModes: [ReadWriteOnce]
ingress:
  enabled: false
httpRoute:
  enabled: false
platformConfig:
  inference_gateway:
    mock_provider_prefix: igw-mock-
  agents:
    deployments:
      k8s_executor: smoke-k8s
      container_port: 8000
  deployments:
    default_executor: smoke-k8s
    executors:
      - name: smoke-k8s
        backend: k8s
