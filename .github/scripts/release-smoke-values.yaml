# Adapt the published chart for a disposable, single-node CPU cluster.
fullnameOverride: release-smoke
rbac:
  volcanoEnabled: false
postgresql:
  image:
    repository: docker.io/library/postgres
clickhouse:
  persistence:
    enabled: false
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
core:
  storage:
    accessModes: [ReadWriteOnce]
ingress:
  enabled: false
httpRoute:
  enabled: false
