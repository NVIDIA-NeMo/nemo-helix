[project]
name = "nhx-build-tools"
description = "Build-time helpers for NeMo Helix workspace packages"
requires-python = ">=3.11,<3.15"
dependencies = [
    "packaging",
    "uv-dynamic-versioning",
]
version = "0.0.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nhx_build_tools"]

[project.entry-points.hatch]
nhx-build-tools = "nhx_build_tools.hatch"
