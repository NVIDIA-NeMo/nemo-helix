[project]
name = "nemo-sandboxed-gym"
dynamic = ["version"]
description = "Trusted episode broker + sandboxed NeMo-Gym host orchestrator"
readme = "README.md"
authors = [
  { name = "NVIDIA", email = "nemo@nvidia.com" },
  { name = "Sandy Chapman", email = "schapman@nvidia.com" },
  { name = "Sam Oluwalana", email = "soluwalana@nvidia.com" },
]
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
# Base install is the wire contract and the type declarations: `sandboxed_gym.wire` and
# `sandboxed_gym.sandbox_types` import nothing but the standard library and Pydantic. A client that
# speaks the broker protocol without running a broker -- Evaluator's `BrokerSandboxProvider` is the
# case in view -- should not install a web server to get a set of request models. Running a broker
# or the orchestrator needs the `server` extra.
dependencies = [
  "pydantic>=2.10.0",
]

[project.optional-dependencies]
# Everything that serves HTTP or reads the serve config: `http_app`, `proxy_app`, `broker`,
# `serve`, `cli`. Required by the `sandboxed-gym` console script.
server = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "nemo-sandboxed-gym[runtime]",
]
# Dependencies imported by gym_host_runtime.py inside the sandbox image. NeMo-Gym itself is
# supplied by that image for the compatibility reasons documented below.
runtime = [
  "pyyaml>=6.0.2",
]
# The OpenSandbox episode backend. Optional because the broker also runs on the in-memory backend,
# and because only a deployment that provisions real sandboxes needs the SDK.
opensandbox = [
  "opensandbox>=0.1.15",
]
ray = ["ray>=2.40.0"]
# NeMo-Gym is deliberately absent from this file, including as an extra.
#
# It is needed only where this package *drives* Gym: the OpenSandbox provider (imported lazily, at
# the point the backend is constructed) and `runtime/gym_host_runtime.py`, which runs inside the Gym
# image. The broker and its wire contract need none of it -- see `wire.py`.
#
# It cannot be declared here even optionally. Gym floors at CPython 3.13.14 and pulls
# `mlflow-skinny>=3.15.1`, which this workspace cannot satisfy (`services/unsloth` pins `<3.12.0`).
# uv does not fail on that -- it resolves backwards to nemo-gym 0.2.1, a release predating the
# sandbox work entirely, which satisfies neither the imports nor anything we plan against. Gym is
# supplied by the runtime image instead, which is how the platform runs it everywhere else.
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
  "httpx>=0.27.0",
  # The suite exercises the broker app and the orchestrator, so it needs the server extra.
  # The OpenSandbox extra lets the episode backend construct a real provider under test.
  "nemo-sandboxed-gym[server,opensandbox]",
]

[project.scripts]
sandboxed-gym = "sandboxed_gym.cli:main"

[tool.hatch.version]
source = "nmp-dynamic-versioning"
# Tags of its own, so a build never inherits the platform's release lineage.
pattern-prefix = "nemo-sandboxed-gym-v"
fallback-version = "0.0.0"

[build-system]
requires = ["hatchling", "nmp-build-tools"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sandboxed_gym"]

[tool.hatch.build.targets.wheel.force-include]
"src/sandboxed_gym/host/gym_host.sh" = "sandboxed_gym/host/gym_host.sh"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
