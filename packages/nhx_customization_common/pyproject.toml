[project]
name = "nhx-customization-common"
description = "Shared library for NeMo customization training backends (unsloth, automodel) — plugin SDK/contributor bases and service-side task/compile helpers."
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "nhx-common",
    "nemo-helix-plugin",
    "filesets",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.6.1",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
]
version = "0.0.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nhx"]


[tool.uv.sources]
nhx-common = { workspace = true }
nemo-helix-plugin = { workspace = true }
filesets = { workspace = true }


[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "pandas",
    "pyarrow",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
