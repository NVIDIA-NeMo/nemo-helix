[project]
name = "nemo-platform-plugin"
dynamic = ["version"]
description = "Public plugin contract for the NeMo Platform - the only package plugin authors need."
readme = "src/nemo_platform_plugin/README.md"
requires-python = ">=3.12,<3.14"
classifiers = [
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: Apache Software License",
]
dependencies = [
    "anthropic>=0.88.0",
    "fastapi>=0.115.4",
    "filesets",
    "jsonschema>=4.0.0",
    "lark>=1.1.0",
    "nemo-platform-sdk",
    "openai>=1.109.1",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.8.1",
    "pyyaml>=6.0.2",
    # Upper bound: typer 0.26.x has a regression where Click sentinel defaults
    # for boolean options surface as `AttributeError: 'Sentinel' object has no
    # attribute 'strip'` from `BoolParamType.str_to_bool`, breaking commands
    # like `nemo services run`. Drop the upper bound once typer ships a fix.
    "typer>=0.20.0,<0.26",
]
license = "Apache-2.0"

[project.urls]
Homepage = "https://github.com/NVIDIA-NeMo/nemo-platform"
Source = "https://github.com/NVIDIA-NeMo/nemo-platform/tree/main/packages/nemo_platform_plugin"
Documentation = "https://github.com/NVIDIA-NeMo/nemo-platform/tree/main/packages/nemo_platform_plugin/src/nemo_platform_plugin/docs"

[project.optional-dependencies]
# Generated from [tool.bundle-package]; do not edit by hand.
nemo-evaluator-sdk = [
  "pydantic>=2.10.6",
  "jinja2>=3.1.6",
  "jsonschema>=4.23.0",
  "jsonpath-ng>=1.7.0",
  "pyarrow>=19.0.1",
  "pandas>=1.5.3",
  "openai>=1.61.0",
  "httpx>=0.27.0,<1",
  "sacrebleu>=2.5.1",
  "rouge_score==0.1.2",
  "ragas==0.4.3",
  "langchain-openai>=1.3.5",
  "langchain-nvidia-ai-endpoints>=1.4.3,<2.0.0",
  "nemo-relay>=0.7.3,<0.8",
  "nemo-fabric==0.3.0b1",
  "opentelemetry-proto>=1.27.0",
  "pytrec-eval-terrier==0.5.10",
]

# Generated from [tool.bundle-package]; do not edit by hand.
nemo-platform-sdk = [
  "httpx>=0.23.0, <1",
  "pydantic>=2.0.0,<3",
  "typing-extensions>=4.14, <5",
  "anyio>=4.0.0,<5",
  "distro>=1.7.0, <2",
  "sniffio",
  "typer>=0.20.0",
  "rich>=13.7.1",
  "prompt_toolkit>=3.0.0",
  "requests>=2.31.0",
  "pyyaml>=6.0.0",
  "docker>=7.0.0",
  "ngcsdk>=4.8.2",
  "nvidia-ml-py>=13.0.0",
  "psutil>=5.9.0",
  "openai",
  "fsspec>=2023.1.0",
]

[tool.uv.sources]
filesets = { workspace = true }
nemo-platform-sdk = { workspace = true }
nmp-build-tools = { workspace = true }


[build-system]
requires = ["hatchling", "nmp-build-tools"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "nmp-dynamic-versioning"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_platform_plugin"]

[tool.bundle-package]
nemo-platform-sdk = { source = "../../sdk/python/nemo-platform/src/nemo_platform", module = "nemo_platform" }
nemo-platform-ext = { source = "../nemo_platform_ext/src/nemo_platform_ext", module = "nemo_platform_ext", deps_group = "nemo-platform-sdk", force_include = { "../../../../docs" = "nemo_platform_ext/cli/docs" } }
models = { source = "../models/src/models", module = "models", deps_group = "nemo-platform-sdk" }
filesets = { source = "../filesets/src/filesets", module = "filesets", deps_group = "nemo-platform-sdk" }
nemo-evaluator-sdk = { source = "../nemo_evaluator_sdk/src/nemo_evaluator_sdk", module = "nemo_evaluator_sdk" }
