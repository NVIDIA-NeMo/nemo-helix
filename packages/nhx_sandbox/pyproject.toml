[project]
name = "nhx-sandbox"
description = "Shared sandbox semantics for NeMo Helix: egress policy, OpenSandbox rendering, applied-policy verification"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
# Installed into third-party runner environments (such as Harbor's), so the base install stays at
# Pydantic alone.
dependencies = [
  "pydantic>=2.10.0",
]
version = "0.0.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nhx_sandbox"]
