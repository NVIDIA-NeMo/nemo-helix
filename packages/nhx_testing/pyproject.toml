[project]
name = "nhx-testing"
description = "Testing utilities for NeMo Helix services"
readme = "README.md"
requires-python = ">=3.11,<3.15"

dependencies = [
    "nhx-common",
    "nhx-auth",
    "nhx-entities",
    "nemo-helix",
    "nemo-nb",
    "docker>=7.0.0",
    "httpx",
    "httpx2>=2.12.0",
    "fastapi",
    "pytest>=8.3.3",
    "pytest-httpserver>=1.0.0",
    "werkzeug>=2.0.0",
    "testcontainers>=4.0.0",
    "tenacity>=9.0.0",  # Retry logic for integration tests
]
version = "0.0.0"

[tool.uv.sources]
nhx-common = { workspace = true }
nhx-auth = { workspace = true }
nhx-entities = { workspace = true }
nemo-nb = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nhx"]
