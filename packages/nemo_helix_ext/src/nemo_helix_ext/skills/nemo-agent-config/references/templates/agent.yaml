config_format: nemo-agents-spec-v1
name: replace-with-agent-name
description: Replace with a short agent description

instructions:
  system:
    content: Replace with the agent's system instructions.

default_harness: codex

harnesses:
  codex:
    kind: codex
    settings:
      sandbox: workspace-write
      reasoning_effort: high
  hermes:
    kind: hermes
    model:
      provider: replace-with-verified-provider
      model: replace-with-verified-model-name
      api_key_env: replace-or-remove-credential-env-var
      base_url: replace-or-remove-provider-base-url
      temperature: 0.0
    settings:
      max_tokens: 512
      reasoning_config:
        effort: none
  deepagents:
    kind: deepagents
    settings:
      deepagents: {}
  claude:
    kind: claude
    model:
      provider: anthropic
      model: replace-with-verified-anthropic-model-name
      api_key_env: ANTHROPIC_API_KEY
    settings:
      permission_mode: dontAsk
models:
  default:
    provider: replace-with-verified-provider
    model: replace-with-verified-model-name

skills:
  paths: []

mcp:
  servers: {}
  # To configure a server, replace `servers: {}` with:
  # servers:
  #   github:
  #     transport: streamable-http
  #     url: ${GITHUB_MCP_URL}
  #     exposure: harness_native

tools:
  blocked: []

environment:
  workspace: ./workspace
  artifacts: ./artifacts

telemetry:
  enabled: false
  provider: relay
  output_dir: ./artifacts/relay
  project: replace-with-agent-name
