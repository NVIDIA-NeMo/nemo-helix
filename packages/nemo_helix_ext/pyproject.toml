[project]
name = "nemo-helix-ext"
description = "The nemo CLI and client-side extensions for NeMo Helix: high-level interfaces, CLI, quickstart functionality."
license = "Apache-2.0"
authors = [{name = "NVIDIA Corporation"}]
dependencies = [
    "nemo-helix-plugin",
    "typer>=0.20.0",
    "rich>=13.7.1",
    "prompt_toolkit>=3.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "docker>=7.0.0",
    "ngcsdk>=4.8.2",
    "nvidia-ml-py>=13.0.0",
    "psutil>=5.9.0",
    "httpx>=0.23.0,<1",
]
requires-python = ">=3.11,<3.15"
readme = "README.md"
classifiers = [
  "Typing :: Typed",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Operating System :: POSIX",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "License :: OSI Approved :: Apache Software License"
]
version = "0.0.0"

[project.urls]
Homepage = "https://docs.nvidia.com/nemo-helix"

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.20.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "nhx-testing",
]

[project.scripts]
# Private names so the workspace venv exposes one `nemo`; the nemo-helix wheel declares the public scripts.
_nemo = "nemo_helix_ext.cli.app:cli"
_nhx = "nemo_helix_ext.cli.app:cli"

# The platform's own bundled skills are registered through the same
# ``nemo.skills`` discovery mechanism that third-party plugins use, so the
# skills registry has a single load path.
[project.entry-points."nemo.skills"]
platform = "nemo_helix_ext.skills:skills_dir"

[build-system]
requires = ["hatchling==1.26.3"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = [
  "src/*"
]

[tool.hatch.build.targets.wheel]
packages = ["src/nemo_helix_ext"]

[tool.hatch.build.targets.wheel.force-include]
"../../docs" = "nemo_helix_ext/cli/docs"
