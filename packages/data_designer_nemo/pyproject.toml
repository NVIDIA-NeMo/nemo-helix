[project]
name = "data-designer-nemo"
description = "NeMo-Helix integration helpers for the Data Designer library."
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{ name = "NVIDIA", email = "nemo@nvidia.com" }]
dependencies = [
    "nemo-helix",
    "nemo-helix-plugin",
    "data-designer==0.9.3",
    "anyio>=4.0",
    "duckdb",
    "pydantic>=2",
]
version = "0.0.0"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_designer_nemo"]


[tool.uv.sources]
nemo-helix = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
