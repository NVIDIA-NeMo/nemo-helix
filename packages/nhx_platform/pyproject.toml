[project]
name = "nhx-platform"
description = "Nemo Helix - entry point for all domain services"
requires-python = ">=3.11,<3.15"

# Service dependencies are NOT listed here - they're defined in the root
# pyproject.toml dependency-groups for container builds. This allows each
# container to include only the services it needs.
dependencies = [
    "fastapi[standard]>=0.115.4",
    "uvicorn[standard]>=0.12.0",
    "nemo-helix-plugin",
    "nhx-common",
    "nhx-platform-runner",
    "nhx-auth",
    "nhx-entities",
    "nhx-models",
    "models",
    "nhx-files",
    "nhx-jobs",
    "nhx-inference-gateway",
    "nhx-secrets",
    "pyleak>=0.1.0",
    "rich-argparse>=1.7.2",
    "rich>=14.1.0",
]
version = "0.0.0"

[project.scripts]
nemo-helix = "nhx.platform.main:main"

[tool.uv.sources]
nemo-helix-plugin = { workspace = true }
nhx-common = { workspace = true }
nhx-platform-runner = { workspace = true }
nhx-auth = { workspace = true }
nhx-entities = { workspace = true }
nhx-models = { workspace = true }
models = { workspace = true }
nhx-files = { workspace = true }
nhx-jobs = { workspace = true }
nhx-inference-gateway = { workspace = true }
nhx-secrets = { workspace = true }


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nhx"]
