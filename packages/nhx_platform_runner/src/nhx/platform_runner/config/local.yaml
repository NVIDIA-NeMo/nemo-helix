# Bundled fallback when NHX_CONFIG_FILE_PATH is unset. For local dev, prefer:
#   source packages/nhx_platform/config/local.env  (SQLite + paths)
platform:
  runtime: "docker"
  base_url: "http://0.0.0.0:8080"

service: {}

auth:
  enabled: false
  allow_unsigned_jwt: true
  policy_decision_point_provider: embedded
  policy_decision_point_base_url: "http://127.0.0.1:8080"
  policy_data_refresh_interval: 2
  bundle_cache_seconds: 15
  admin_email: "admin@example.com"

entities: {}

jobs:
  executors:
    - provider: subprocess
      profile: default
      backend: subprocess
      config:
        working_directory: /tmp/nhx-subprocess-jobs
        cleanup_completed_jobs_immediately: false
        ttl_seconds_before_active: 60
        ttl_seconds_active: 3600
        ttl_seconds_after_finished: 300
    # Customizer (automodel / unsloth) GPU jobs. The unsloth backend stamps the
    # profile name "gpu" onto all 4 steps, so both cpu/gpu and gpu/gpu must
    # exist. `profile` is a name, not a resource claim — `provider` governs
    # CPU vs GPU, so provider: cpu + profile: gpu is correct (not a mismatch).
    - provider: cpu
      profile: gpu
      backend: docker
      config:
        launcher_tool_path: ./services/core/jobs/jobs-launcher/jobs-launcher
    - provider: gpu
      profile: gpu
      backend: docker
      config:
        launcher_tool_path: ./services/core/jobs/jobs-launcher/jobs-launcher

  executor_defaults:
    docker:
      cleanup_completed_jobs_immediately: false
      ttl_seconds_before_active: 60
      ttl_seconds_active: 3600
      ttl_seconds_after_finished: 300
    subprocess:
      working_directory: /tmp/nhx-subprocess-jobs
      cleanup_completed_jobs_immediately: false
      ttl_seconds_before_active: 60
      ttl_seconds_active: 3600
      ttl_seconds_after_finished: 300

models:
  controller:
    interval_seconds: 5
    model_deployment_garbage_collection_ttl_seconds: 30
    backends:
      deployments_plugin:
        enabled: true
        docker_executor: local-docker
        default_executor: local-docker
        # LoRA adapter-download sidecar for deployments with lora_enabled. Both
        # backends override the image ENTRYPOINT with lora_sidecar_command: k8s
        # maps it to the pod container `command`, and the docker backend maps it
        # to docker's `entrypoint` (with lora_sidecar_args -> docker `command`).
        # So the command must be a complete executable list, not a bare `-m`
        # fragment — `python` resolves on the nhx-customizer-tasks PATH
        # (/opt/venv/bin).
        lora_sidecar_image_name: nhx-customizer-tasks
        lora_sidecar_command: ["python", "-m", "nhx.core.models.sidecars.adapters.main"]

deployments:
  executors:
    - name: local-docker
      backend: docker
      config:
        pull_images: false
        port_range_start: 49152
        port_range_end: 49251
  default_executor: local-docker

inference_gateway: {}

secrets:
  allow_key_creation: true

files:
  default_storage_config:
    type: local
    # Empty means the platform user-data directory, so blobs follow NHX_DATA_DIR
    # alongside the entity-store database.
    path: ""
