[project]
name = "models"
description = "Extended ModelsResource with high-level helper methods"
readme = "README.md"
authors = [{ name = "NVIDIA", email = "nemo@nvidia.com" }]
requires-python = ">=3.11,<3.15"
dependencies = [
  "nemo-helix-sdk",
  "openai",
]
version = "0.0.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/models"]

[dependency-groups]
dev = []
