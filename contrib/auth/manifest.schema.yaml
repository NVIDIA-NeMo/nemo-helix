$defs:
  generic_token_grant:
    type: object
    required:
      - grant_type
      - client_id
      - scope
    anyOf:
      - required:
          - password
      - required:
          - password_env_var
      - required:
          - client_secret
      - required:
          - client_secret_env_var
    properties:
      grant_type:
        type: string
      client_id:
        type: string
      client_secret:
        type: string
      client_secret_env_var:
        type: string
      client_auth_method:
        type: string
        enum:
          - client_secret_basic
          - client_secret_post
      username:
        type: string
      expected_subject:
        type: string
      password:
        type: string
      password_env_var:
        type: string
      scope:
        type: string
  password_token_grant:
    type: object
    required:
      - grant_type
      - client_id
      - username
      - scope
    oneOf:
      - required:
          - password
      - required:
          - password_env_var
    properties:
      grant_type:
        type: string
      client_id:
        type: string
      client_secret:
        type: string
      username:
        type: string
      expected_subject:
        type: string
      password:
        type: string
      password_env_var:
        type: string
      scope:
        type: string

type: object
required:
  - provider
  - mode
  - compose_file
  - gateway_base_url
  - issuer_url
  - discovery_url
  - nemo_config
  - principal_contract
  - interactive_user_identity
  - workload_identity
  - workload_contract
  - healthchecks
  - startup_timeouts
properties:
  provider:
    type: string
  mode:
    type: string
    enum:
      - compose-ci
      - reference-only
  compose_file:
    type:
      - string
      - "null"
  gateway_base_url:
    type: string
  issuer_url:
    type: string
  discovery_url:
    type: string
  nemo_config:
    type: string
  principal_contract:
    type: object
    required:
      - subject_claim
      - groups_claim
      - external_machine_principals_use_service_prefix
      - internal_service_prefix_reserved
  interactive_user_identity:
    type: object
    required:
      - username
      - expected_email
    oneOf:
      - required:
          - password
      - required:
          - password_env_var
    properties:
      username:
        type: string
      password:
        type: string
      password_env_var:
        type: string
      expected_email:
        type: string
  workload_identity:
    type: object
    required:
      - principal_id
      - expected_groups
  workload_contract:
    type: object
    required:
      - audience
      - principal_claim
      - groups_claim
      - groups_format
      - token_env_vars
      - forwarded_headers
  token_acquisition:
    type: object
    required:
      - token_endpoint
    properties:
      token_endpoint:
        type: string
      e2e_setup_grant:
        allOf:
          - $ref: "#/$defs/generic_token_grant"
        description: >-
          E2E test harness only. Do not use this grant as a production user,
          CLI, or workload authentication pattern.
      e2e_setup_password_grant:
        allOf:
          - $ref: "#/$defs/password_token_grant"
        description: >-
          E2E test harness only. Do not use this grant as a production user,
          CLI, or workload authentication pattern.
      interactive_user_grant:
        $ref: "#/$defs/generic_token_grant"
      interactive_user_password_grant:
        $ref: "#/$defs/password_token_grant"
      workload_provider_grant:
        $ref: "#/$defs/generic_token_grant"
      workload_provider_password_grant:
        $ref: "#/$defs/password_token_grant"
  healthchecks:
    type: array
  startup_timeouts:
    type: object
    required:
      - healthchecks_seconds
      - gateway_seconds
      - token_endpoint_seconds
  test_runtimes:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - id
        - backend
        - capabilities
      properties:
        id:
          type: string
        backend:
          type: string
          enum:
            - compose
            - kubernetes
            - external
        command:
          type: string
        capabilities:
          type: array
          minItems: 1
          items:
            type: string
