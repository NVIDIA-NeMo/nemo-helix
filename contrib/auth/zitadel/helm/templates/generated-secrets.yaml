    {{- include "nemo-platform-zitadel.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{ required "nemoPlatformSecrets.ngc.key is required" .key }}: {{ include "nemo-platform-zitadel.secretValue" (dict "root" $ "secretName" .secretName "key" .key "generated" (randAlphaNum 32)) | quote }}
{{ end }}
{{ end }}
{{- with $nemoPlatformSecrets.postgresql }}
{{- if .create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "nemoPlatformSecrets.postgresql.secretName is required" .secretName }}
  namespace: {{ include "nemo-platform-zitadel.namespace" $ }}
  labels:
    app.kubernetes.io/component: nemo-platform-postgresql
    {{- include "nemo-platform-zitadel.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{ required "nemoPlatformSecrets.postgresql.passwordKey is required" .passwordKey }}: {{ include "nemo-platform-zitadel.secretValue" (dict "root" $ "secretName" .secretName "key" .passwordKey "generated" (randAlphaNum 32)) | quote }}
{{ end }}
{{ end }}
