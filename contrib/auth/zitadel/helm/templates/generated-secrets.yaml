{{- $zitadelSecrets := .Values.zitadelSecrets -}}
{{- with $zitadelSecrets.masterkey }}
{{- if .create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "zitadelSecrets.masterkey.secretName is required" .secretName }}
  namespace: {{ include "nemo-platform-zitadel.namespace" $ }}
  labels:
    app.kubernetes.io/component: zitadel-masterkey
    {{- include "nemo-platform-zitadel.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{ required "zitadelSecrets.masterkey.key is required" .key }}: {{ include "nemo-platform-zitadel.secretValue" (dict "root" $ "secretName" .secretName "key" .key "generated" (randAlphaNum 32)) | quote }}
{{ end }}
{{ end }}
{{- with $zitadelSecrets.demo }}
{{- if .create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "zitadelSecrets.demo.secretName is required" .secretName }}
  namespace: {{ include "nemo-platform-zitadel.namespace" $ }}
  labels:
    app.kubernetes.io/component: zitadel-demo-credentials
    {{- include "nemo-platform-zitadel.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{ required "zitadelSecrets.demo.interactiveUserPasswordKey is required" .interactiveUserPasswordKey }}: {{ include "nemo-platform-zitadel.secretValue" (dict "root" $ "secretName" .secretName "key" .interactiveUserPasswordKey "generated" (printf "Nemo%s1!" (randAlphaNum 20))) | quote }}
{{ end }}
{{ end }}
{{- with $zitadelSecrets.postgresql }}
{{- if .create }}
{{- $adminPassword := include "nemo-platform-zitadel.secretValue" (dict "root" $ "secretName" .secretName "key" .adminPasswordKey "generated" (randAlphaNum 32)) -}}
{{- $userPassword := include "nemo-platform-zitadel.secretValue" (dict "root" $ "secretName" .secretName "key" .userPasswordKey "generated" (randAlphaNum 32)) -}}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "zitadelSecrets.postgresql.secretName is required" .secretName }}
  namespace: {{ include "nemo-platform-zitadel.namespace" $ }}
  labels:
    app.kubernetes.io/component: zitadel-postgresql
    {{- include "nemo-platform-zitadel.labels" $ | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  {{ required "zitadelSecrets.postgresql.adminPasswordKey is required" .adminPasswordKey }}: {{ $adminPassword | quote }}
  {{ required "zitadelSecrets.postgresql.userPasswordKey is required" .userPasswordKey }}: {{ $userPassword | quote }}
  {{ required "zitadelSecrets.postgresql.dsnKey is required" .dsnKey }}: {{ include "nemo-platform-zitadel.secretValue" (dict "root" $ "secretName" .secretName "key" .dsnKey "generated" (printf "host=zitadel-postgresql port=5432 user=postgres password=%s dbname=zitadel sslmode=disable" $adminPassword)) | quote }}
{{ end }}
{{ end }}
