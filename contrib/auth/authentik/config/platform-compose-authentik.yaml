platform:
  runtime: "none"
  base_url: "https://nemo-gateway:8080"
  advertised_base_url: "https://127.0.0.1:18080"

service: {}

auth:
  enabled: true
  allow_unsigned_jwt: false
  policy_decision_point_provider: embedded
  policy_decision_point_base_url: "http://127.0.0.1:8080"
  policy_data_refresh_interval: 2
  bundle_cache_seconds: 15
  admin_email: "admin@example.com"
  token_signing:
    issuer: "https://nemo-gateway:8080/apis/auth"
    key_id: "nemo-helix-signing"
    private_key_file: "/var/run/secrets/nemo-helix/workload-token-signing/private-key.pem"
  access_keys:
    enabled: true
  oidc:
    enabled: true
    issuer: "http://authentik-server:9000/application/o/nemo-user/"
    additional_issuers:
      - "http://authentik-server:9000/application/o/nemo/"
      - "http://authentik-server:9000/application/o/nemo-cli/"
      - "https://127.0.0.1:18080/application/o/nemo-user/"
      - "https://127.0.0.1:18080/application/o/nemo-cli/"
      - "https://127.0.0.1:18080/application/o/nemo/"
    public_client:
      client_id: "nemo-helix-cli"
      server_side_sessions: false
      authorization_endpoint: "https://127.0.0.1:18080/application/o/authorize/"
      token_endpoint: "https://127.0.0.1:18080/application/o/token/"
      device_authorization_endpoint: "https://127.0.0.1:18080/application/o/device/"
      default_scopes: "openid email offline_access groups"
    server_sessions:
      encryption_key_env_var: NHX_AUTH_SESSION_ENCRYPTION_KEY
    confidential_client:
      client_id: "nemo-helix-user"
      client_secret_env_var: NHX_OIDC_CLIENT_SECRET
      login_redirect_uri: "https://127.0.0.1:18080/apis/auth/v2/login/callback"
      authorization_endpoint: "https://127.0.0.1:18080/application/o/authorize/"
      token_endpoint: "http://authentik-server:9000/application/o/token/"
      default_scopes: "openid email offline_access groups"
    workload:
      client_id: "nemo-helix-workload"
      token_endpoint: "https://nemo-gateway:8080/apis/auth/token"
      audience: "nemo-helix"
      scope: "openid email groups"
      subject_jwks_uri: "http://authentik-server:9000/application/o/nemo-workload/jwks/"
      subject_issuers:
        - "http://authentik-server:9000/application/o/nemo-workload/"
        - "https://nemo-gateway:8080/application/o/nemo-workload/"
        - "https://127.0.0.1:18080/application/o/nemo-workload/"
    subject_claim: "sub"
    email_claim: "email"
    groups_claim: "groups"

entities: {}

jobs:
  enable_subprocess_executor: false
  executors:
    - provider: cpu
      profile: workload
      backend: docker
      config:
        cleanup_completed_jobs_immediately: true
        launcher_tool_path: /tools/jobs-launcher
        env:
          SSL_CERT_FILE: "/etc/nhx/gateway-tls/tls.crt"
          REQUESTS_CA_BUNDLE: "/etc/nhx/gateway-tls/tls.crt"
        storage:
          additional_volume_mounts:
            - volume_name: "authentik_gateway_tls"
              mount_path: "/etc/nhx/gateway-tls"
  executor_defaults:
    docker:
      cleanup_completed_jobs_immediately: true
      launcher_tool_path: /tools/jobs-launcher
      ttl_seconds_before_active: 60
      ttl_seconds_active: 3600
      ttl_seconds_after_finished: 300

deployments:
  default_executor: auth-idp-docker
  executors:
    - name: auth-idp-docker
      backend: docker
      config:
        pull_images: false
        network: authentik_workload
        endpoint_mode: network
        docker_timeout: 600
        oneshot_observe_timeout_seconds: 30
        additional_volume_mounts:
          - volume_name: "authentik_gateway_tls"
            mount_path: "/etc/nhx/gateway-tls"
            read_only: true
  controller:
    interval_seconds: 2
    terminal_orphan_grace_seconds: 300

evals:
  recreate_existing_system_entities: true

safe_synthesizer: {}

models:
  controller:
    interval_seconds: 5
    model_deployment_garbage_collection_ttl_seconds: 30

inference_gateway: {}

secrets:
  encryption:
    current_provider: local_v1
    providers:
      secret_key:
        local_v1:
          from_env: NHX_SECRETS_DEFAULT_ENCRYPTION_KEY

files:
  default_storage_config:
    type: local
    path: /data/files

studio:
  static_files_path: /static/studio
  sandbox_enabled: true
