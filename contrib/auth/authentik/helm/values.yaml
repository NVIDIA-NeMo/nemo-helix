workloadTokenSigningKey:
  secretName: &workloadTokenSigningKeySecretName nemo-workload-token-signing-key
  key: private-key.pem
  mountPath: &workloadTokenSigningKeyMountPath /etc/nhx/workload-token

workloadTokenTls:
  secretName: &workloadTokenTlsSecretName nemo-helix-envoy-tls
  mountPath: &workloadTokenTlsMountPath /etc/nhx/workload-token-tls
  caBundleMountPath: &workloadTokenTlsCaBundleMountPath /etc/nhx/workload-token-ca
  caBundleFile: &workloadTokenTlsCaBundleFile /etc/nhx/workload-token-ca/ca.crt

blueprintApplyJob:
  enabled: true
  oidcSecretName: nemo-helix-user-oidc
  oidcClientSecretKey: NHX_OIDC_CLIENT_SECRET
  image:
    tag: "2026.5.4"
    pullPolicy: IfNotPresent
  activeDeadlineSeconds: 600
  backoffLimit: 6
  ttlSecondsAfterFinished: 300
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []

sharedPostgresql:
  enabled: true
  serviceName: shared-postgresql
  existingSecret: shared-postgresql
  postgresqlVersion: "18.4"
  imageRepository: docker.io/library/postgres
  imageTag: "18.4"
  imagePullPolicy: IfNotPresent
  service:
    port: 5432
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  serviceAccount:
    create: true
    automount: false
    annotations: {}
    name: ""
  podSecurityContext: {}
  securityContext: {}
  resources: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  authentik:
    database: authentik
    username: authentik
  nemo:
    database: nemohelix
    username: nemo

authentik:
  fullnameOverride: authentik
  global:
    env:
      - name: AUTHENTIK_POSTGRESQL__HOST
        value: shared-postgresql
      - name: AUTHENTIK_POSTGRESQL__NAME
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__USER
        value: authentik
      - name: AUTHENTIK_POSTGRESQL__PORT
        value: "5432"
      - name: AUTHENTIK_POSTGRESQL__PASSWORD
        valueFrom:
          secretKeyRef:
            name: shared-postgresql
            key: AUTHENTIK_POSTGRES_PASSWORD
    envFrom:
      - secretRef:
          name: nemo-auth-idp-e2e
  authentik:
    existingSecret:
      secretName: nemo-authentik-secret-key
    error_reporting:
      enabled: false
  blueprints:
    configMaps:
      - authentik-nemo-blueprint
  postgresql:
    enabled: false

nemo-helix:
  fullnameOverride: nemo-helix
  existingSecret: nemo-authentik-platform
  ngcAPIKey: ""
  authentikPublicGateway:
    scheme: https
    host: 127.0.0.1
    port: 18081
  k8s-nim-operator:
    enabled: false
  rbac:
    k8sNimOperatorEnabled: false
    volcanoEnabled: false
  postgresql:
    enabled: false
  clickhouse:
    enabled: false
  externalClickhouse:
    host: unused-clickhouse
    existingSecret: shared-postgresql
    existingSecretPasswordKey: NEMO_POSTGRES_PASSWORD
  externalDatabase:
    host: shared-postgresql
    port: 5432
    user: nemo
    database: nemohelix
    existingSecret: shared-postgresql
    existingSecretPasswordKey: NEMO_POSTGRES_PASSWORD
  secrets:
    defaultEncryptionKey:
      existingSecret:
        name: nemo-authentik-platform
        key: NHX_SECRETS_DEFAULT_ENCRYPTION_KEY
  core:
    controller:
      controllerGroup: core
      startupProbe:
        failureThreshold: 80
      controllers:
        - jobs
        - models
        - entities
        - deployments
      env:
        NHX_CLIENT_SSL_CERT_FILE: *workloadTokenTlsCaBundleFile
      extraVolumes:
        - name: workload-token-signing-key
          secret:
            secretName: *workloadTokenSigningKeySecretName
        - name: workload-token-tls-ca
          secret:
            secretName: *workloadTokenTlsSecretName
            items:
              - key: ca.crt
                path: ca.crt
      extraVolumeMounts:
        - name: workload-token-signing-key
          mountPath: *workloadTokenSigningKeyMountPath
          readOnly: true
        - name: workload-token-tls-ca
          mountPath: *workloadTokenTlsCaBundleMountPath
          readOnly: true
    storage:
      accessModes:
        - ReadWriteOnce
  api:
    serviceAccount:
      create: true
      name: nemo
    serviceGroup: core
    startupProbe:
      failureThreshold: 80
    services:
      - auth
      - models
      - files
      - inference-gateway
      - jobs
      - secrets
      - entities
      - deployments
      - studio
    env:
      NHX_AUTH_TOKEN_SIGNING__PRIVATE_KEY_FILE: "/etc/nhx/workload-token/private-key.pem"
      NHX_OIDC_CLIENT_SECRET:
        valueFrom:
          secretKeyRef:
            name: nemo-helix-user-oidc
            key: NHX_OIDC_CLIENT_SECRET
      NHX_AUTH_SESSION_ENCRYPTION_KEY:
        valueFrom:
          secretKeyRef:
            name: nemo-helix-user-oidc
            key: NHX_AUTH_SESSION_ENCRYPTION_KEY
    extraVolumes:
      - name: workload-token-signing-key
        secret:
          secretName: *workloadTokenSigningKeySecretName
    extraVolumeMounts:
      - name: workload-token-signing-key
        mountPath: *workloadTokenSigningKeyMountPath
        readOnly: true
  platformSeedJob:
    extraEnv:
      - name: NHX_CLIENT_SSL_CERT_FILE
        value: *workloadTokenTlsCaBundleFile
    extraVolumes:
      - name: workload-token-signing-key
        secret:
          secretName: *workloadTokenSigningKeySecretName
      - name: workload-token-tls-ca
        secret:
          secretName: *workloadTokenTlsSecretName
          items:
            - key: ca.crt
              path: ca.crt
    extraVolumeMounts:
      - name: workload-token-signing-key
        mountPath: *workloadTokenSigningKeyMountPath
        readOnly: true
      - name: workload-token-tls-ca
        mountPath: *workloadTokenTlsCaBundleMountPath
        readOnly: true
  authentikEnvoy:
    serviceName: &authentikServiceName authentik-server
    servicePort: &authentikServicePort 80
  envoyProxy:
    enabled: true
    replicaCount: 1
    serviceNamespace: ""
    image:
      repository: envoyproxy/envoy
      tag: v1.37.0
      digest: sha256:f91c972d5c99bc133233a079b5663b903e7d56b3b0b0216398924f7b80d09e47
    serviceAccount:
      create: true
      automount: false
    podSecurityContext:
      fsGroup: 65532
      fsGroupChangePolicy: OnRootMismatch
    securityContext:
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    extraVolumeMounts:
      - name: tmp
        mountPath: /tmp
      - name: workload-token-tls
        mountPath: *workloadTokenTlsMountPath
        readOnly: true
    extraVolumes:
      - name: tmp
        emptyDir: {}
      - name: workload-token-tls
        secret:
          secretName: *workloadTokenTlsSecretName
    timeouts:
      upstreamIdle: "4s"
    configOverride: '{{ include "nemo-helix-authentik.envoyConfig" . }}'
  platformConfig:
    platform:
      base_url: '{{ include "nemo-helix-authentik.serviceUrl" (dict "root" . "serviceName" "nemo-helix-envoy" "namespace" .Values.envoyProxy.serviceNamespace "scheme" "https" "port" 8080) }}'
      advertised_base_url: '{{ include "nemo-helix-authentik.publicGatewayUrl" . }}'
    auth:
      enabled: true
      allow_unsigned_jwt: false
      policy_decision_point_provider: embedded
      policy_decision_point_base_url: "http://127.0.0.1:8080"
      policy_data_refresh_interval: 2
      bundle_cache_seconds: 15
      admin_email: "admin@example.com"
      token_signing:
        issuer: '{{ include "nemo-helix-authentik.serviceUrl" (dict "root" . "serviceName" "nemo-helix-envoy" "namespace" .Values.envoyProxy.serviceNamespace "scheme" "https" "port" 8080) }}/apis/auth'
        key_id: "nemo-helix-signing"
        private_key_file: "/etc/nhx/workload-token/private-key.pem"
      access_keys:
        enabled: false
      oidc:
        enabled: true
        issuer: '{{ include "nemo-helix-authentik.serviceUrl" (dict "root" . "serviceName" "authentik-server" "scheme" "http") }}/application/o/nemo-user/'
        additional_issuers:
          - '{{ include "nemo-helix-authentik.serviceUrl" (dict "root" . "serviceName" "authentik-server" "scheme" "http") }}/application/o/nemo/'
          - '{{ include "nemo-helix-authentik.serviceUrl" (dict "root" . "serviceName" "authentik-server" "scheme" "http") }}/application/o/nemo-cli/'
          - '{{ include "nemo-helix-authentik.publicGatewayUrl" . }}/application/o/nemo-user/'
          - '{{ include "nemo-helix-authentik.publicGatewayUrl" . }}/application/o/nemo-cli/'
          - '{{ include "nemo-helix-authentik.publicGatewayUrl" . }}/application/o/nemo/'
        public_client:
          client_id: "nemo-helix-cli"
          server_side_sessions: false
          authorization_endpoint: '{{ include "nemo-helix-authentik.publicGatewayUrl" . }}/application/o/authorize/'
          token_endpoint: '{{ include "nemo-helix-authentik.publicGatewayUrl" . }}/application/o/token/'
          device_authorization_endpoint: '{{ include "nemo-helix-authentik.publicGatewayUrl" . }}/application/o/device/'
          default_scopes: "openid email offline_access groups"
        server_sessions:
          encryption_key_env_var: NHX_AUTH_SESSION_ENCRYPTION_KEY
        confidential_client:
          client_id: "nemo-helix-user"
          client_secret_env_var: NHX_OIDC_CLIENT_SECRET
          login_redirect_uri: '{{ include "nemo-helix-authentik.publicGatewayUrl" . }}/apis/auth/v2/login/callback'
          authorization_endpoint: '{{ include "nemo-helix-authentik.publicGatewayUrl" . }}/application/o/authorize/'
          token_endpoint: '{{ include "nemo-helix-authentik.serviceUrl" (dict "root" . "serviceName" "authentik-server" "scheme" "http") }}/application/o/token/'
          default_scopes: "openid email offline_access groups"
        workload:
          client_id: "nemo-helix-workload"
          token_endpoint: '{{ include "nemo-helix-authentik.serviceUrl" (dict "root" . "serviceName" "nemo-helix-envoy" "namespace" .Values.envoyProxy.serviceNamespace "scheme" "https" "port" 8080) }}/apis/auth/token'
          audience: "nemo-helix"
          scope: "openid email groups"
          subject_jwks_uri: '{{ include "nemo-helix-authentik.serviceUrl" (dict "root" . "serviceName" "authentik-server" "scheme" "http") }}/application/o/nemo-workload/jwks/'
          subject_issuers:
            - '{{ include "nemo-helix-authentik.serviceUrl" (dict "root" . "serviceName" "authentik-server" "scheme" "http") }}/application/o/nemo-workload/'
            - '{{ include "nemo-helix-authentik.serviceUrl" (dict "root" . "serviceName" "nemo-helix-envoy" "namespace" .Values.envoyProxy.serviceNamespace "scheme" "https" "port" 8080) }}/application/o/nemo-workload/'
            - '{{ include "nemo-helix-authentik.publicGatewayUrl" . }}/application/o/nemo-workload/'
          kubernetes_token_review_enabled: true
        subject_claim: "sub"
        email_claim: "email"
        groups_claim: "groups"
    jobs:
      executor_defaults:
        kubernetes_job:
          env:
            SSL_CERT_FILE: *workloadTokenTlsCaBundleFile
            REQUESTS_CA_BUNDLE: *workloadTokenTlsCaBundleFile
          storage:
            additional_volumes:
              - name: workload-token-tls-ca
                secret:
                  secret_name: *workloadTokenTlsSecretName
                  items:
                    - key: ca.crt
                      path: ca.crt
            additional_volume_mounts:
              - name: workload-token-tls-ca
                mount_path: *workloadTokenTlsCaBundleMountPath
                read_only: true
      executors:
        - provider: cpu
          profile: workload
          backend: kubernetes_job
          config:
            launcher_image: '{{ include "nhx-core.image" . }}'
            env:
              SSL_CERT_FILE: *workloadTokenTlsCaBundleFile
              REQUESTS_CA_BUNDLE: *workloadTokenTlsCaBundleFile
            storage:
              additional_volumes:
                - name: workload-token-tls-ca
                  secret:
                    secret_name: *workloadTokenTlsSecretName
                    items:
                      - key: ca.crt
                        path: ca.crt
              additional_volume_mounts:
                - name: workload-token-tls-ca
                  mount_path: *workloadTokenTlsCaBundleMountPath
                  read_only: true
            workload_identity:
              token_audience: "nemo-helix-workload"
              token_expiration_seconds: 600
    models:
      controller:
        backends:
          deployments_plugin:
            enabled: true

integration:
  nemoHelix:
    apiServiceAccountName: nemo
    apiServiceName: nemo-helix-api
    apiServicePort: 8080
    envoyServiceName: nemo-helix-envoy
    envoyServicePort: 8080
  authentik:
    serviceName: *authentikServiceName
    servicePort: *authentikServicePort
    workloadAudience: nemo-helix
    cliAudience: nemo-helix-cli
    workloadClientAudience: nemo-helix-workload
