{{- if .Values.workloadTokenSigningKey.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nemo-helix-authentik.workloadTokenSigningKey.secretName" . }}
  namespace: {{ include "nemo-helix-authentik.namespace" . }}
  labels:
    app.kubernetes.io/component: workload-token-signing-key
type: Opaque
stringData:
  {{ include "nemo-helix-authentik.workloadTokenSigningKey.key" . }}: |-
{{ include "nemo-helix-authentik.workloadTokenSigningKey.privateKeyPem" . | nindent 4 }}
{{- end }}
