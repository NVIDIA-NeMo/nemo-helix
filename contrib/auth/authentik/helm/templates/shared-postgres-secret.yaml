{{- if .Values.sharedPostgresql.enabled }}
{{- $secretName := .Values.sharedPostgresql.serviceName -}}
{{- $postgresPassword := include "nemo-helix-authentik.sharedPostgresql.password" (dict "root" . "secretName" $secretName "secretKey" "postgres-password" "value" .Values.sharedPostgresql.postgresPassword) -}}
{{- $authentikPassword := include "nemo-helix-authentik.sharedPostgresql.password" (dict "root" . "secretName" $secretName "secretKey" "authentik-password" "value" .Values.sharedPostgresql.authentik.password "generate" true) -}}
{{- $nemoPassword := include "nemo-helix-authentik.sharedPostgresql.password" (dict "root" . "secretName" $secretName "secretKey" "nemo-password" "value" .Values.sharedPostgresql.nemo.password) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "nemo-helix-authentik.namespace" . }}
  {{- if .Values.sharedPostgresql.persistence.enabled }}
  annotations:
    "helm.sh/resource-policy": keep
  {{- end }}
  labels:
    {{- include "nemo-helix-authentik.labels" . | nindent 4 }}
    app.kubernetes.io/component: shared-postgresql
type: Opaque
# Initdb provisions these role passwords only when PGDATA is empty; keep the
# Secret data fixed while the StatefulSet PVC persists.
immutable: true
stringData:
  postgres-password: {{ $postgresPassword | quote }}
  authentik-password: {{ $authentikPassword | quote }}
  nemo-password: {{ $nemoPassword | quote }}
{{- end }}
