# authentik blueprint: provision everything NeMo needs to use authentik as its
# OIDC IdP, including a demo workload identity for gateway-verified auth.

version: 1
metadata:
  name: nemo-helix-oidc
  labels:
    blueprints.goauthentik.io/instantiate: "true"
    blueprints.goauthentik.io/description: "NeMo Helix OIDC provider + demo workload identity"

entries:
  - model: authentik_providers_oauth2.scopemapping
    id: nemo-groups-scope
    identifiers:
      name: "NeMo groups"
    attrs:
      name: "NeMo groups"
      scope_name: groups
      description: "Comma-separated group membership used by the gateway workload header contract"
      expression: |
        return {"groups": ",".join(group.name for group in user.ak_groups.all())}

  - model: authentik_providers_oauth2.oauth2provider
    id: nemo-provider
    identifiers:
      name: nemo-helix
    attrs:
      name: nemo-helix
      client_type: confidential
      client_id: nemo-helix
      client_secret: nemo-helix-secret-dev
      grant_types:
        - authorization_code
        - refresh_token
        - password
      sub_mode: user_username
      include_claims_in_id_token: true
      redirect_uris: []
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
        - !KeyOf nemo-groups-scope

  - model: authentik_providers_oauth2.oauth2provider
    id: nemo-cli-provider
    identifiers:
      name: nemo-helix-cli
    attrs:
      name: nemo-helix-cli
      client_type: public
      client_id: nemo-helix-cli
      grant_types:
        - authorization_code
        - refresh_token
        - password
        - urn:ietf:params:oauth:grant-type:device_code
      sub_mode: user_username
      include_claims_in_id_token: true
      # Local demo only: keep CLI access tokens short so refresh-token renewal
      # is easy to observe. Use a longer value such as "hours=1" outside this
      # refresh demonstration.
      access_token_validity: "minutes=2"
      redirect_uris: []
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, offline_access]]
        - !KeyOf nemo-groups-scope

  - model: authentik_providers_oauth2.oauth2provider
    id: nemo-workload-provider
    identifiers:
      name: nemo-helix-workload
    attrs:
      name: nemo-helix-workload
      client_type: public
      client_id: nemo-helix-workload
      grant_types:
        - password
      sub_mode: user_username
      include_claims_in_id_token: true
      access_token_validity: "minutes=5"
      redirect_uris: []
      authorization_flow:
        !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow:
        !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key:
        !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !KeyOf nemo-groups-scope

  - model: authentik_core.application
    identifiers:
      slug: nemo
    attrs:
      name: NeMo Helix
      slug: nemo
      provider: !KeyOf nemo-provider

  - model: authentik_core.application
    identifiers:
      slug: nemo-cli
    attrs:
      name: NeMo Helix CLI
      slug: nemo-cli
      provider: !KeyOf nemo-cli-provider

  - model: authentik_core.application
    identifiers:
      slug: nemo-workload
    attrs:
      name: NeMo Helix Workload Identity
      slug: nemo-workload
      provider: !KeyOf nemo-workload-provider

  - model: authentik_core.group
    id: group-nemo-admins
    identifiers:
      name: nemo-admins
    attrs:
      name: nemo-admins

  - model: authentik_core.group
    id: group-nemo-editors
    identifiers:
      name: nemo-editors
    attrs:
      name: nemo-editors

  - model: authentik_core.group
    id: group-nemo-workloads
    identifiers:
      name: nemo-workloads
    attrs:
      name: nemo-workloads

  - model: authentik_core.user
    id: nemo-user
    identifiers:
      username: nemo-user
    attrs:
      username: nemo-user
      email: nemo-user@example.com
      name: "NeMo CLI demo user"
      password: nemo-user-password-dev
      groups:
        - !KeyOf group-nemo-editors

  - model: authentik_core.user
    id: svc-nemo
    identifiers:
      username: svc-nemo
    attrs:
      username: svc-nemo
      name: "NeMo demo workload identity"
      type: service_account
      path: service-accounts
      groups:
        - !KeyOf group-nemo-workloads

  # E2E TEST HARNESS ONLY. The setup identity lets automated auth-idp contract
  # tests create temporary workspaces and grants after nemo-user app-passwords
  # were removed. Do not use this as a production user, CLI, or workload auth
  # pattern.
  - model: authentik_core.user
    id: nemo-setup
    identifiers:
      username: nemo-setup
    attrs:
      username: nemo-setup
      name: "NeMo auth-idp e2e setup identity"
      type: service_account
      path: service-accounts
      groups:
        - !KeyOf group-nemo-admins

  # E2E TEST HARNESS ONLY. This app-password must not be copied into production
  # deployments; use browser/device login for users and workload token exchange
  # for workloads.
  - model: authentik_core.token
    identifiers:
      identifier: nemo-setup-token
    attrs:
      identifier: nemo-setup-token
      intent: app_password
      user: !KeyOf nemo-setup
      key: nemo-setup-token-secret-dev
      expiring: false

  - model: authentik_core.token
    identifiers:
      identifier: svc-nemo-token
    attrs:
      identifier: svc-nemo-token
      intent: app_password
      user: !KeyOf svc-nemo
      key: !Env AUTHENTIK_WORKLOAD_IDENTITY_PASSWORD
      expiring: false

  - model: authentik_brands.brand
    identifiers:
      domain: authentik-default
    attrs:
      default: true
      flow_device_code:
        !Find [authentik_flows.flow, [slug, default-authentication-flow]]
