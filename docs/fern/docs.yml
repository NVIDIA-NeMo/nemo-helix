instances:
- url: nemo-helix.docs.buildwithfern.com/nemo-helix
  custom-domain: docs.nvidia.com/nemo-helix
  multi-source: true
title: NVIDIA NeMo Helix
global-theme: nvidia
settings:
  http-snippets:
  - python
  - javascript
  - curl
logo:
  right-text: NeMo Helix
css:
- ./styles/notebook-viewer.css
- ./styles/button.css
navbar-links:
- type: github
  value: https://github.com/NVIDIA-NeMo/nemo-helix
experimental:
  mdx-components:
  - ./components
versions:
- display-name: Latest
  path: versions/latest.yml
  slug: latest
  announcement:
    message: >-
      These are unreleased development docs from main and may differ from the
      released product.

redirects:
  # Sources are site-relative: Fern adds the instance basepath when matching.
  # Destinations are Location paths, so include /nemo-helix explicitly.
  # The retired rolling release-note URL now opens the versioned release index.
  - source: "/documentation/reference/release-notes/current-release"
    destination: "/nemo-helix/documentation/reference/release-notes"
  - source: "/latest/documentation/reference/release-notes/current-release"
    destination: "/nemo-helix/latest/documentation/reference/release-notes"
  # Evals troubleshooting URL rename.
  - source: "/documentation/reference/troubleshooting/evaluator"
    destination: "/nemo-helix/documentation/reference/troubleshooting/evals"
  - source: "/latest/documentation/reference/troubleshooting/evaluator"
    destination: "/nemo-helix/latest/documentation/reference/troubleshooting/evals"
  # Hand-maintained: Agents docs restructure (guardrails moved to Virtual Models, Plugins and Skills moved to Reference > Plugin Architecture)
  - source: "/documentation/agents/secure-agents"
    destination: "/nemo-helix/documentation/models-and-inference/virtual-models"
  - source: "/latest/documentation/agents/secure-agents"
    destination: "/nemo-helix/latest/documentation/models-and-inference/virtual-models"
  - source: "/documentation/agents/add-guardrails"
    destination: "/nemo-helix/documentation/models-and-inference/virtual-models"
  - source: "/latest/documentation/agents/add-guardrails"
    destination: "/nemo-helix/latest/documentation/models-and-inference/virtual-models"
  - source: "/documentation/agents/scan-trace-data"
    destination: "/nemo-helix/documentation/agents/traces-and-insights/collect-agent-traces"
  - source: "/latest/documentation/agents/scan-trace-data"
    destination: "/nemo-helix/latest/documentation/agents/traces-and-insights/collect-agent-traces"
  - source: "/documentation/agents/observe-agents"
    destination: "/nemo-helix/documentation/agents/traces-and-insights/collect-agent-traces"
  - source: "/latest/documentation/agents/observe-agents"
    destination: "/nemo-helix/latest/documentation/agents/traces-and-insights/collect-agent-traces"
  - source: "/documentation/agents/optimize-agents/insights-analysis"
    destination: "/nemo-helix/documentation/agents/traces-and-insights/insights-from-traces"
  - source: "/latest/documentation/agents/optimize-agents/insights-analysis"
    destination: "/nemo-helix/latest/documentation/agents/traces-and-insights/insights-from-traces"
  - source: "/documentation/agents/optimize-agents/run-the-agent-optimizer"
    destination: "/nemo-helix/documentation/agents/optimize-agents"
  - source: "/latest/documentation/agents/optimize-agents/run-the-agent-optimizer"
    destination: "/nemo-helix/latest/documentation/agents/optimize-agents"
  - source: "/documentation/agents/sandboxed-deployments"
    destination: "/nemo-helix/documentation/agents/deploy-agents/sandboxed-deployments"
  - source: "/latest/documentation/agents/sandboxed-deployments"
    destination: "/nemo-helix/latest/documentation/agents/deploy-agents/sandboxed-deployments"
  - source: "/documentation/agents/plugins-and-skills"
    destination: "/nemo-helix/documentation/reference/plugin-architecture"
  - source: "/latest/documentation/agents/plugins-and-skills"
    destination: "/nemo-helix/latest/documentation/reference/plugin-architecture"
  - source: "/index.html"
    destination: "/nemo-helix/latest"
  - source: "/index"
    destination: "/nemo-helix/latest"
  - source: "/latest/:path*/index.html"
    destination: "/nemo-helix/latest/:path*"
  - source: "/:path*/index.html"
    destination: "/nemo-helix/:path*"
  # Sphinx page URLs (foo.html); must follow all :path*/index.html rules above
  - source: "/:path*.html"
    destination: "/nemo-helix/:path*"
  # NV 6722631: OpenSandbox how-to live slug is open-sandbox.
  - source: "/documentation/self-managed-deployment/setup/helm/opensandbox"
    destination: "/nemo-helix/documentation/kubernetes-deployment/setup/helm/open-sandbox"
  - source: "/latest/documentation/self-managed-deployment/setup/helm/opensandbox"
    destination: "/nemo-helix/latest/documentation/kubernetes-deployment/setup/helm/open-sandbox"
  - source: "/documentation/kubernetes-deployment/setup/helm/opensandbox"
    destination: "/nemo-helix/documentation/kubernetes-deployment/setup/helm/open-sandbox"
  - source: "/latest/documentation/kubernetes-deployment/setup/helm/opensandbox"
    destination: "/nemo-helix/latest/documentation/kubernetes-deployment/setup/helm/open-sandbox"
  # NV 6722623: published hrefs still use the old self-managed-deployment nav slug.
  - source: "/documentation/self-managed-deployment/helm"
    destination: "/nemo-helix/documentation/kubernetes-deployment/setup/helm"
  - source: "/latest/documentation/self-managed-deployment/helm"
    destination: "/nemo-helix/latest/documentation/kubernetes-deployment/setup/helm"
  - source: "/documentation/self-managed-deployment/:path*"
    destination: "/nemo-helix/documentation/kubernetes-deployment/:path*"
  - source: "/latest/documentation/self-managed-deployment/:path*"
    destination: "/nemo-helix/latest/documentation/kubernetes-deployment/:path*"
  # NV 6722632: Models and Inference pages are no longer under /tutorials/.
  - source: "/documentation/models-and-inference/tutorials/run-inference"
    destination: "/nemo-helix/documentation/models-and-inference/run-inference"
  - source: "/latest/documentation/models-and-inference/tutorials/run-inference"
    destination: "/nemo-helix/latest/documentation/models-and-inference/run-inference"
  - source: "/documentation/models-and-inference/tutorials/deploy-models"
    destination: "/nemo-helix/documentation/models-and-inference/deploy-models"
  - source: "/latest/documentation/models-and-inference/tutorials/deploy-models"
    destination: "/nemo-helix/latest/documentation/models-and-inference/deploy-models"
  # NV 6722634: Plugin UIs title otherwise kebab-cases to plugin-u-is.
  - source: "/documentation/studio/plugin-u-is"
    destination: "/nemo-helix/documentation/studio/plugins"
  - source: "/latest/documentation/studio/plugin-u-is"
    destination: "/nemo-helix/latest/documentation/studio/plugins"
