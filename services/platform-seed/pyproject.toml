[project]
name = "nhx-platform-seed"
version = "0.0.1"
description = "Platform seed service and task - runs centralized seeding (auth, guardrails, auditor, and plugin seed jobs) after dependencies are ready"
readme = "README.md"
requires-python = ">=3.11,<3.15"

dependencies = [
  "nhx-common",
  "nhx-auth",
  "nhx-guardrails",
  "nemo-auditor-plugin",
]

[project.scripts]
platform-seed = "nhx.platform_seed.__main__:main"

[tool.uv.sources]
nhx-common = { workspace = true }
nhx-auth = { workspace = true }
nhx-guardrails = { workspace = true }
nemo-auditor-plugin = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "nhx-testing",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nhx"]
