[project]
name = "nmp-rl"
version = "0.1.0"
description = "NeMo-RL task package — Ray DPO driver and compile glue. No HTTP server."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "nmp-common",
    "nmp-customization-common",
    "nemo-platform-plugin",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.6.1",
    "httpx>=0.27.0",
    "tenacity>=8.5.0",
    # Imported at module scope by tasks/environment/convert.py, which the package __init__
    # pulls in — so it is reachable from the training path, not just the conversion CLI.
    "packaging>=24.0",
]

# Heavy ML deps (nemo-rl, ray, megatron, torch, transformers, etc.) are NOT declared here: they are
# provided by the published NGC NeMo-RL container (v0.6.0) that
# docker/Dockerfile.nmp-rl-base builds on, with the platform glue installed on
# top — exactly like the reference customizer. The package stays importable
# without that stack (compile.py + schemas), so plugin discovery and the compiler pay
# no install cost.
[project.optional-dependencies]
integrations = [
    "wandb>=0.29.0",
    "mlflow-skinny>=3.15.0,<3.16.0",
]
# Only pi-to-gym-conversion needs these, and it runs on an internet-capable host rather
# than in the training image. Kept out of the core deps so the training image does not
# carry a git-sourced package it never imports: convert.py imports verifiers lazily, and
# pip is only ever invoked as a subprocess.
conversion = [
    # Vendors hub wheel closures; uv environments omit pip by default.
    "pip>=25.0",
    # Materializes Gym JSONL from hub environments.
    "verifiers @ git+https://github.com/PrimeIntellect-ai/verifiers.git@v0.1.14",
]

[project.scripts]
# Container entrypoints. Names match the automodel/unsloth pattern for parity.
nmp-rl-training = "nmp.rl.tasks.training.__main__:main"
pi-to-gym-conversion = "nmp.rl.tasks.environment.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nmp"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
nmp-common = { workspace = true }
nmp-customization-common = { workspace = true }
nemo-platform-plugin = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
