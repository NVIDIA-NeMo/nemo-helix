[project]
name = "nhx-secrets"
description = "NeMo Helix Secrets provides secrets to other microservices."
readme = "README.md"
requires-python = ">=3.11,<3.15"

classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # API server dependencies (for nhx-api/nhx-core containers)
    "fastapi>=0.115.8",
    "uvicorn>=0.34.0",
    "nhx-common",
]
version = "0.0.0"

[project.scripts]
secrets-server = "nhx.core.secrets.main:run_standalone"

[tool.hatch.build.targets.wheel]
packages = ["src/nhx"]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# No task deps for secrets - all deps are in main dependencies

dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.3",
    "aiosqlite>=0.20.0",
    "ruff>=0.11.8",
    "ty>=0.0.1a14",
]

[tool.pytest.ini_options]
# testpaths = ["tests"]  # Commented to prevent namespace collision with root pytest
asyncio_mode = "auto"

[tool.uv.sources]
nhx-common = { workspace = true }
