[project]
name = "nhx-hello-world"
description = "Hello World service for NeMo Helix"
requires-python = ">=3.11,<3.15"

dependencies = [
  # API server dependencies (lightweight - for nhx-api/nhx-core containers)
  "fastapi[standard]>=0.115.4",
  "uvicorn[standard]>=0.12.0",
  "nhx-common",
]
version = "0.0.0"

[project.scripts]
hello-world-server = "nhx.hello_world.main:run_standalone"

[tool.uv.sources]
nhx-common = { workspace = true }
nhx-testing = { workspace = true }


[dependency-groups]
# Task execution dependencies (for nhx-cpu-tasks container - demo task)
task = [
  "requests",
  "nhx-common",
]

dev = [
  "pytest>=8.3.3",
  "nhx-testing",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nhx"]
