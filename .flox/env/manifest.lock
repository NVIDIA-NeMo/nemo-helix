    "vars": {
      "ALIGN": "center",
      "BORDER": "double",
      "BORDER_FOREGROUND": "#76B900",
      "COREPACK_HOME": "${FLOX_ENV_CACHE}/corepack",
      "COREPACK_SHIMS": "${FLOX_ENV_CACHE}/corepack/bin",
      "FOREGROUND": "#76B900",
      "GUM_LOG_MESSAGE_FOREGROUND": "#76B900",
      "MARGIN": "1 2",
      "PADDING": "1 2",
      "PNPM_VERSION": "10.34.5",
      "UV_CACHE_DIR": "${FLOX_ENV_CACHE}/uv-cache",
      "UV_MANAGED_PYTHON": "1",
      "UV_PYTHON": "3.12",
      "UV_PYTHON_INSTALL_DIR": "${FLOX_ENV_CACHE}/python",
      "UV_VENV_SEED": "1",
      "WIDTH": "50"
    },
    "hook": {
      "on-activate": "  set -euo pipefail\n\n  export VIRTUAL_ENV=\"$PWD/.venv\"\n  export PATH=\"$VIRTUAL_ENV/bin:$PATH\"\n\n  if uv sync --frozen --all-packages --check; then\n    return 0\n  fi\n\n  echo \"Python environment is out of sync; synchronizing...\"\n  uv sync --frozen --all-packages\n\n  set -euo pipefail\n  mkdir -p \"$COREPACK_SHIMS\"\n  if ! test -x \"$COREPACK_SHIMS/pnpm\" || ! \"$COREPACK_SHIMS/pnpm\" --version | grep -Fxq \"$PNPM_VERSION\"; then\n    corepack install --global \"pnpm@$PNPM_VERSION\"\n    corepack enable --install-directory \"$COREPACK_SHIMS\"\n  fi\n  export PATH=\"$COREPACK_SHIMS:$PATH\"\n"
    },
    "profile": {
      "common": "  export PATH=\"$COREPACK_SHIMS:$PATH\"\n\n  test -f .git/hooks/pre-commit || pre-commit install\n\n  gum style \"NeMo Platform\"\n"
    },
    "options": {
      "systems": [
        "aarch64-darwin",
        "aarch64-linux",
        "x86_64-linux"
      ]
    }
  },
