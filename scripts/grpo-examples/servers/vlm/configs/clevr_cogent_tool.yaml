clevr_cogent:
  resources_servers:
    vlm:
      entrypoint: app.py
      domain: knowledge
      verified: false
      description: CLEVR-CoGenT scorer ported from NeMo-RL VLMEnvironment
      value: Score a short answer inside answer tags, with a format bonus
      reward_functions:
        - name: format
          weight: 0.2
        - name: exact_alnum
          weight: 0.8
# max_steps is 2 so the model generates again after inspect_scene returns its image.
# One step executes the tool and then stops, and that image never reaches a prompt.
clevr_cogent_tool_agent:
  responses_api_agents:
    simple_agent:
      entrypoint: app.py
      max_steps: 2
      resources_server:
        type: resources_servers
        name: clevr_cogent
      model_server:
        type: responses_api_models
        name: policy_model
