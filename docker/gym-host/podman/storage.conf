# Rootless storage for docker-user. rootless-podman-up mounts an ext4 file at graphroot, because overlay
# can't unpack layers under remapped uids on Kata's virtio-fs root filesystem.
[storage]
driver = "overlay"
graphroot = "/home/docker-user/.local/share/containers/storage"
runroot = "/run/user/1000/containers"
