[project]
name = "nhx-gym-host"
version = "0.0.0"
requires-python = ">=3.13.14,<3.14"
dependencies = [
    "nemo-gym==0.5.0",
    "nemo-sandboxed-gym[runtime]",
    "tiktoken==0.13.0",
]

[tool.uv.sources]
nemo-sandboxed-gym = { path = "../../../packages/sandboxed_gym" }
# Some first-party packages declare nhx-build-tools in build-system.requires. The standalone
# gym-host lock project is resolved outside the root workspace, so it must provide an explicit
# local source for that build dependency instead of letting uv search the package registry.
nhx-build-tools = { path = "../../../packages/nhx_build_tools", editable = true }

[tool.uv.extra-build-dependencies]
nemo-sandboxed-gym = ["nhx-build-tools"]

[tool.uv]
constraint-dependencies = [
    "certifi>=2026.10.19",
    "pip>=26.2.2",
    "mlflow-skinny>=3.15.0,<3.16.0",
    "sqlparse>=0.6.0,<0.7",
    "wandb>=0.30.0",
    "virtualenv>=21.14.9", # GHSA-6w3r-xr62-4xcp and related virtualenv advisories
]
required-version = ">=0.13.4"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
