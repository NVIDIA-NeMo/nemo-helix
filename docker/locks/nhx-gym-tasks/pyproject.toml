[project]
name = "nhx-gym-tasks"
version = "0.0.0"
requires-python = ">=3.13.14,<3.14"
dependencies = [
    "nemo-gym==0.7.0",
    "tiktoken==0.13.0",
]

[tool.uv]
constraint-dependencies = [
    "certifi>=2026.10.19",
    "pip>=26.2.2",
    "mlflow>=3.17.2",
    "mlflow-skinny>=3.17.2,<3.18.0",
    "sqlparse>=0.6.0,<0.7",
    "hydra-core>=1.3.7,<1.4", # GHSA-rqx7-p7vv-w7hr, GHSA-c3wx-c55w-pxjq, GHSA-mwj6-rfh8-7qf4
    "wandb>=0.31.2",
    "virtualenv>=21.14.13", # GHSA-cx6f-vjhg-g3cc and GHSA-4f8h-vr72-p32c
    "nltk>=3.10.4",                 # GHSA-8mgp-746c-j5xp and CVE-2026-7{1513,8680,8681,8682,9657,9674,9675} + CVE-2026-8{1722,1726,1727}
    "gitpython>=3.2.1",             # BDSA-2026-{30097,30098,31388}
    "graphql-core>=3.2.12",
    "msgpack>=1.2.3",
    "pyasn1>=0.6.5",
    "filelock>=4.2.1",
    "mcp>=1.30.0",
    "pillow>=13.0.0",
]
required-version = ">=0.13.4"
environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
