# Minimal uv workspace for nhx-unsloth container image builds only.
# Keeps uv validation scoped to the partial source tree copied into the image.

[project]
name = "nemo-helix-unsloth-image"
version = "0.0.0"
requires-python = ">=3.11,<3.14"

[tool.uv]
required-version = ">=0.9.14,<0.10.0"

[tool.uv.workspace]
members = [
  "packages/nhx_build_tools",
  "packages/filesets",

  "packages/nemo_helix_plugin",
  "packages/nemo_helix_ext",
  "packages/nhx_testing",
  "packages/nhx_common",
  "packages/nhx_customization_common",
  "services/unsloth",
]

[tool.uv.sources]
nhx-build-tools = { workspace = true }
filesets = { workspace = true }

nemo-helix-plugin = { workspace = true }
nemo-helix-ext = { workspace = true }
nhx-testing = { workspace = true }
nhx-common = { workspace = true }
nhx-customization-common = { workspace = true }
nhx-unsloth = { workspace = true }
