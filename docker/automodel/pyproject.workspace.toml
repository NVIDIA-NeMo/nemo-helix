# Minimal uv workspace for nhx-automodel container image builds only.
# Keeps uv validation scoped to the partial source tree copied into the image.

[project]
name = "nemo-helix-automodel-image"
version = "0.0.0"
requires-python = ">=3.11,<3.14"

[tool.uv]
required-version = ">=0.9.14,<0.10.0"
# greenlet 3.5.x ships x86_64-only wheels today; cap until aarch64 wheels land.
constraint-dependencies = ["greenlet>=3.0.0,<3.5"]

[tool.uv.workspace]
members = [
  "packages/nhx_build_tools",
  "packages/filesets",
  "packages/models",
  "sdk/python/nemo-helix",
  "packages/nemo_helix_plugin",
  "packages/nhx_common",
  "packages/nhx_customization_common",
  "plugins/nemo-deployments",
  "services/automodel",
  "services/core/models",
]

[tool.uv.sources]
nhx-build-tools = { workspace = true }
filesets = { workspace = true }
models = { workspace = true }
nemo-helix-sdk = { workspace = true }
nemo-helix-plugin = { workspace = true }
nemo-deployments-plugin = { workspace = true }
nhx-common = { workspace = true }
nhx-customization-common = { workspace = true }
nhx-automodel = { workspace = true }
nhx-models = { workspace = true }
