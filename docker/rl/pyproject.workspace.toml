# Minimal uv workspace for nhx-rl container image builds only.
# Keeps uv validation scoped to the partial source tree copied into the image.
# Keep in sync with docker/rl/Dockerfile.platform-workspace members.

[project]
name = "nemo-helix-rl-image"
version = "0.0.0"
requires-python = ">=3.11,<3.14"

[tool.uv]
required-version = ">=0.9.14,<0.10.0"

[tool.uv.workspace]
members = [
  "packages/nhx_build_tools",
  "packages/filesets",
  "packages/models",
  "sdk/python/nemo-helix",
  "packages/nemo_helix_plugin",
  "packages/nhx_common",
  "packages/nhx_customization_common",
  "services/rl",
]

[tool.uv.sources]
nhx-build-tools = { workspace = true }
filesets = { workspace = true }
models = { workspace = true }
nemo-helix-sdk = { workspace = true }
nemo-helix-plugin = { workspace = true }
nhx-common = { workspace = true }
nhx-customization-common = { workspace = true }
nhx-rl = { workspace = true }
