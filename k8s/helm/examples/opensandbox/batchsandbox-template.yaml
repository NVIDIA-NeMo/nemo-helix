# ConfigMap mounted by opensandbox-server.
# Shared-kernel profile: no runtimeClassName → cluster default OCI runtime.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensandbox-batchsandbox-template
  namespace: opensandbox-system
  labels:
    app.kubernetes.io/part-of: opensandbox
    opensandbox.nvidia.com/isolation-class: shared-kernel
data:
  batchsandbox-template.yaml: |
    metadata:
      labels:
        opensandbox.nvidia.com/isolation-class: shared-kernel
        opensandbox.nvidia.com/runtime: shared-kernel
    spec:
      replicas: 1
      template:
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 30
          # Sandbox pods are built from this template by the OpenSandbox server,
          # not by the jobs controller, so neither jobs executor_defaults
          # image_pull_secrets nor the chart's top-level imagePullSecrets apply.
          # This name is required as written. If your NGC (or other) pull Secret
          # is named differently, change it here before kubectl apply. The Secret
          # must exist in the sandbox / job namespace.
          imagePullSecrets:
            - name: nvcrimagepullsecret
          # Prefer non-GPU / non-kata workers so H100 capacity stays for kata-qemu
          # and GPU training. Soft preference only — still schedules if needed.
          affinity:
            nodeAffinity:
              # Hard floor. These pods run untrusted environment code on a shared
              # kernel, and `tolerations: [{operator: Exists}]` below tolerates every
              # taint — including the control-plane NoSchedule taint. Without a
              # required rule the soft preferences above collapse under capacity
              # pressure and a sandbox can land on a control-plane node.
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
                      - key: node-role.kubernetes.io/master
                        operator: DoesNotExist
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  preference:
                    matchExpressions:
                      - key: katacontainers.io/kata-runtime
                        operator: NotIn
                        values: ["true"]
                - weight: 80
                  preference:
                    matchExpressions:
                      - key: nvidia.com/gpu.present
                        operator: NotIn
                        values: ["true"]
          tolerations:
            - operator: Exists
          # Harbor (scaled-evals harbor_opensandbox) creates its directories under
          # these paths through execd, which runs as the image's USER. Writable
          # emptyDirs let non-root images start without running the container as
          # root. /tests is deliberately not mounted: verifier images bake their
          # tests into /tests, and an empty mount would hide them.
          volumes:
            - name: harbor-logs
              emptyDir:
                sizeLimit: 2Gi
            - name: harbor-solution
              emptyDir:
                sizeLimit: 1Gi
            - name: harbor-installed-agent
              emptyDir:
                sizeLimit: 2Gi
          # OpenSandbox v0.2.1 copies only volumeMounts from the container named
          # "sandbox" onto the task container; other container fields here are
          # ignored.
          containers:
            - name: sandbox
              volumeMounts:
                - name: harbor-logs
                  mountPath: /logs
                - name: harbor-solution
                  mountPath: /solution
                - name: harbor-installed-agent
                  mountPath: /installed-agent
