# OpenSandbox server — shared-kernel profile (cluster default OCI runtime).
# The chart does not install this release. Pass the file to the upstream
# opensandbox-server chart: helm upgrade --install ... -f this file.
#
# OpenSandbox [secure_runtime] is server-global, so shared-kernel and kata-qemu
# each get their own Helm release. This release leaves secure_runtime unset so
# pods use the cluster default OCI runtime.
#
# API key comes from Secret opensandbox-server-api-key (key: api-key),
# injected as OPENSANDBOX_SERVER_API_KEY (overrides any TOML api_key).

fullnameOverride: opensandbox-server

server:
  replicaCount: 1
  image:
    repository: docker.io/opensandbox/server
    tag: "v0.2.1"

  env:
    - name: OPENSANDBOX_SERVER_API_KEY
      valueFrom:
        secretKeyRef:
          name: opensandbox-server-api-key
          key: api-key

  resources:
    requests:
      cpu: "500m"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: nvidia.com/gpu.present
                operator: NotIn
                values: ["true"]

  # Mount the shared-kernel BatchSandbox template ConfigMap.
  volumeMounts:
    - name: batchsandbox-template
      mountPath: /etc/opensandbox/batchsandbox-template.yaml
      subPath: batchsandbox-template.yaml
      readOnly: true
  volumes:
    - name: batchsandbox-template
      configMap:
        name: opensandbox-batchsandbox-template

  # In-cluster clients use the Service + use_server_proxy; gateway optional.
  gateway:
    enabled: false

configToml: |
  [server]
  host = "0.0.0.0"
  port = 80
  # api_key intentionally omitted — set via OPENSANDBOX_SERVER_API_KEY Secret
  max_sandbox_timeout_seconds = 86400

  [log]
  level = "INFO"

  [runtime]
  type = "kubernetes"
  execd_image = "docker.io/opensandbox/execd:v1.0.21"

  [storage]
  allowed_host_paths = []
  volume_default_size = "1Gi"

  [kubernetes]
  kubeconfig_path = ""
  # MUST be the same namespace the platform jobs run in (Helm release namespace).
  # PVC remounts and image-pull secrets fail across namespaces.
  # Replace with your NeMo Helix release namespace before installing.
  namespace = "REPLACE_WITH_RELEASE_NAMESPACE"
  informer_enabled = true
  informer_resync_seconds = 300
  informer_watch_timeout_seconds = 60
  snapshot_create_timeout_seconds = 900
  # How long the server waits for a sandbox pod to reach Running-with-IP. Raised from the
  # upstream default of 60s
  sandbox_create_timeout_seconds = 900
  workload_provider = "batchsandbox"
  image_pull_policy = "IfNotPresent"
  batchsandbox_template_file = "/etc/opensandbox/batchsandbox-template.yaml"

  [egress]
  image = "docker.io/opensandbox/egress:v1.1.4"
  mode = "dns+nft"
  # Prefer dual-stack deny rules over privileged IPv6-disable init.
  disable_ipv6 = false

  # Intentionally NO [secure_runtime] — shared-kernel / cluster default OCI runtime.
