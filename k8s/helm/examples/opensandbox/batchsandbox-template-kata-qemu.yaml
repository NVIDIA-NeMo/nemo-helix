# ConfigMap mounted by opensandbox-server-kata.
# Pins BatchSandbox pods onto nodes kata-deploy labeled.
# RuntimeClass/kata-qemu already carries katacontainers.io/kata-runtime;
# repeating it here fails faster and keeps the label visible on the CR.
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensandbox-batchsandbox-template-kata-qemu
  namespace: opensandbox-system
  labels:
    app.kubernetes.io/part-of: opensandbox
    opensandbox.nvidia.com/isolation-class: kata-qemu
data:
  batchsandbox-template.yaml: |
    metadata:
      labels:
        opensandbox.nvidia.com/isolation-class: kata-qemu
        opensandbox.nvidia.com/runtime: kata-qemu
    spec:
      replicas: 1
      template:
        spec:
          restartPolicy: Never
          terminationGracePeriodSeconds: 60
          # Sandbox pods are built from this template by the OpenSandbox server
          # not by the jobs controller, so neither the jobs controller's
          # image_pull_secrets nor the chart's top-level imagePullSecrets reaches them.
          # This name is required as written. If your pull Secret is named
          # differently, change it here before kubectl apply. The Secret must
          # exist in the sandbox / job namespace.
          imagePullSecrets:
            - name: nvcrimagepullsecret
          # Schedule onto nodes kata-deploy labeled. Replace or extend this
          # if you pin sandboxes with a custom KVM label as well.
          nodeSelector:
            katacontainers.io/kata-runtime: "true"
          tolerations:
            - operator: Exists
          # Harbor (scaled-evals harbor_opensandbox) creates its directories under
          # these paths through execd, which runs as the image's USER. Writable
          # emptyDirs let non-root images start without running the container as
          # root. /tests is deliberately not mounted: verifier images bake their
          # tests into /tests, and an empty mount would hide them.
          volumes:
            - name: harbor-logs
              emptyDir:
                sizeLimit: 2Gi
            - name: harbor-solution
              emptyDir:
                sizeLimit: 1Gi
            - name: harbor-installed-agent
              emptyDir:
                sizeLimit: 2Gi
          # OpenSandbox v0.2.1 copies only volumeMounts from the container named
          # "sandbox" onto the task container; other container fields here are
          # ignored.
          containers:
            - name: sandbox
              volumeMounts:
                - name: harbor-logs
                  mountPath: /logs
                - name: harbor-solution
                  mountPath: /solution
                - name: harbor-installed-agent
                  mountPath: /installed-agent
