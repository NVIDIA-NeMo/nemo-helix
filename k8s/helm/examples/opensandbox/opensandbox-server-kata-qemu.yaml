# OpenSandbox server — kata-qemu profile.
# The chart does not install this release. Pass the file to the upstream
# opensandbox-server chart. Point the platform at this Service *or* the
# shared-kernel Service — not both. [secure_runtime] is server-global.
#
# Pins every sandbox to RuntimeClass/kata-qemu. Template nodeSelector is
# katacontainers.io/kata-runtime (applied by kata-deploy). Add a custom KVM
# label if you restrict which nodes get kata-deploy.
#
# API key comes from Secret opensandbox-server-kata-api-key (key: api-key),
# injected as OPENSANDBOX_SERVER_API_KEY (overrides any TOML api_key).

fullnameOverride: opensandbox-server-kata

server:
  replicaCount: 1
  image:
    repository: docker.io/opensandbox/server
    tag: "v0.2.1"

  env:
    - name: OPENSANDBOX_SERVER_API_KEY
      valueFrom:
        secretKeyRef:
          name: opensandbox-server-kata-api-key
          key: api-key
    # Loads the NeMo services extension (nemo-opensandbox-ext.yaml) when its
    # ConfigMap exists; without it the server runs unchanged.
    - name: PYTHONPATH
      value: /opt/nemo-opensandbox-ext

  resources:
    requests:
      cpu: "500m"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: nvidia.com/gpu.present
                operator: NotIn
                values: ["true"]

  volumeMounts:
    - name: batchsandbox-template
      mountPath: /etc/opensandbox/batchsandbox-template-kata-qemu.yaml
      subPath: batchsandbox-template.yaml
      readOnly: true
    - name: nemo-opensandbox-ext
      mountPath: /opt/nemo-opensandbox-ext
      readOnly: true
  volumes:
    - name: batchsandbox-template
      configMap:
        name: opensandbox-batchsandbox-template-kata-qemu
    - name: nemo-opensandbox-ext
      configMap:
        name: nemo-opensandbox-ext
        optional: true

  gateway:
    enabled: false

configToml: |
  [server]
  host = "0.0.0.0"
  port = 80
  # api_key intentionally omitted — set via OPENSANDBOX_SERVER_API_KEY Secret
  max_sandbox_timeout_seconds = 86400

  [log]
  level = "INFO"

  [runtime]
  type = "kubernetes"
  execd_image = "docker.io/opensandbox/execd:v1.0.21"

  [storage]
  allowed_host_paths = []
  volume_default_size = "1Gi"

  [kubernetes]
  kubeconfig_path = ""
  # MUST be the same namespace the platform jobs run in (Helm release namespace).
  namespace = "REPLACE_WITH_RELEASE_NAMESPACE"
  informer_enabled = true
  informer_resync_seconds = 300
  informer_watch_timeout_seconds = 60
  snapshot_create_timeout_seconds = 900
  # Raised from the upstream 60s default; kata adds VM boot on top of the image pull, so it
  # needs the headroom at least as much as the shared-kernel profile.
  sandbox_create_timeout_seconds = 900
  workload_provider = "batchsandbox"
  image_pull_policy = "IfNotPresent"
  batchsandbox_template_file = "/etc/opensandbox/batchsandbox-template-kata-qemu.yaml"

  [egress]
  image = "docker.io/opensandbox/egress:v1.1.4"
  mode = "dns+nft"
  # QEMU can run privileged IPv6-disable init, but RFC Phase 1 prefers
  # disable_ipv6=false + dual-stack local/metadata denies.
  disable_ipv6 = false

  [secure_runtime]
  type = "kata"
  k8s_runtime_class = "kata-qemu"
