# Extra permissions for the NeMo Compose services extension (see README, "Compose services").
#
# The extension's exec route runs commands in a sandbox's service containers, and
# its services route reads a failed service's last log lines. The upstream server
# ClusterRole grants neither pods/exec nor pods/log, so this adds them. The rules are a
# ClusterRole, which grants nothing by itself; a RoleBinding then gives them to the server's
# service account in one namespace only. Platform job pods get no new permissions.
#
# RBAC can't limit pods/exec to sandbox pods, so this covers every pod in a bound
# namespace; the extension itself only execs into service containers it added.
# The stock server ClusterRole already allows creating pods and reading secrets
# in all namespaces, so this adds little beyond what the server can already do.
#
# Replace REPLACE_WITH_RELEASE_NAMESPACE (the NeMo Helix release namespace, the
# same value as [kubernetes] namespace in the server values) and, if the server
# is not in opensandbox-system, the subject namespace. For the Kata server, add a
# second subject named opensandbox-server-kata.
#
# Multi-tenant server ([tenants] in the server config): each tenant's sandboxes are in the
# tenant's own namespace, so the server needs these permissions in every one of them. Keep the
# ClusterRole as it is and repeat the RoleBinding below once per tenant namespace, with that
# namespace in place of REPLACE_WITH_RELEASE_NAMESPACE. A tenant namespace with no RoleBinding
# gets a 403 from Kubernetes on the extension's exec and services routes.
#
# Upgrading from the earlier version of this file, which had a Role of the same name: a
# RoleBinding's roleRef can't change in place, so delete that RoleBinding and Role first:
#   kubectl delete rolebinding,role nemo-opensandbox-ext -n <namespace>
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nemo-opensandbox-ext
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Kubernetes checks "create" for exec over WebSocket on current versions and
  # "get" on older ones.
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nemo-opensandbox-ext
  namespace: REPLACE_WITH_RELEASE_NAMESPACE
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nemo-opensandbox-ext
subjects:
  - kind: ServiceAccount
    name: opensandbox-server
    namespace: opensandbox-system
