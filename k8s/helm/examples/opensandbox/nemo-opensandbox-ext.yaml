                        return status

                    if waiting:
                        entry.message = f"waiting for services: {', '.join(waiting)}"

                if entry.failure is not None:
                    raise HTTPException(status_code=422, detail={"code": "NEMO::SERVICE_FAILED", "message": entry.failure})

