# Preview: opt-in Agent Hardener war-games against an independently installed OpenShell gateway.
# Jobs run in the nhx-agent-hardener-tasks image and register this gateway with the openshell CLI.
# A job here cannot build the victim, so each manifest needs a victim image: run `agent-hardener stage`
# on it, build and push that context to a registry the gateway can pull from, and set the image on the
# manifest. That needs agent-hardener 0.0.18 or later in the task image.
# This plaintext endpoint is for an isolated evaluation gateway only; for an https:// endpoint also set
# openshell_ca_secret, openshell_client_cert_secret and openshell_client_key_secret (NeMo Secret names).
# events_dir keeps live run events on the shared files volume (files.default_storage_config.path) so they
# survive an API restart and every API replica serves them; drop it if Files does not use local storage.
platformConfig:
  agent_hardener:
    container_jobs: true
    openshell_gateway_endpoint: http://openshell.openshell.svc.cluster.local:8080
    events_dir: /vol/files/.agent-hardener/run-events
