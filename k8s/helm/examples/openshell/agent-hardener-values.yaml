# Opt-in Agent Hardener war-games against an independently installed OpenShell gateway.
# Jobs run in the nhx-agent-hardener-tasks image and register this gateway with the openshell CLI.
# This plaintext endpoint is for an isolated evaluation gateway only; for an https:// endpoint also set
# openshell_ca_secret, openshell_client_cert_secret and openshell_client_key_secret (NeMo Secret names).
platformConfig:
  agent_hardener:
    openshell_gateway_endpoint: http://openshell.openshell.svc.cluster.local:8080
