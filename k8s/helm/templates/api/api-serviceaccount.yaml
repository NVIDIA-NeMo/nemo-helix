{{- if .Values.api.enabled }}
{{- if .Values.api.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "nhx-api.apiServiceAccountName" . }}
  labels:
    app.kubernetes.io/component: nhx-api
    {{- include "nemo-helix.labels" . | nindent 4 }}
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.api.serviceAccount.automount }}
{{- end }}
{{- end }}
