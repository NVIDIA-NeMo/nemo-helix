{{- if and .Values.core.enabled .Values.networkPolicies.enabled .Values.networkPolicies.controller.enabled }}
{{- $controller := .Values.networkPolicies.controller -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ printf "%s-core-controller-ingress" (include "nemo-helix.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    app.kubernetes.io/component: nhx-core-controller
    {{- include "nemo-helix.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: nhx-core-controller
      {{- include "nemo-helix.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  {{- if or $controller.sameReleasePods.enabled $controller.extraIngress }}
  ingress:
    {{- if $controller.sameReleasePods.enabled }}
    - from:
        - podSelector:
            matchLabels:
              {{- include "nemo-helix.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ default .Values.core.controller.service.port $controller.port }}
    {{- end }}
    {{- with $controller.extraIngress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
