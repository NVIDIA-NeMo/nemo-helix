{{- if and .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $secretName := include "nemo-common.postgresql.fullname" . }}
{{- $password := .Values.postgresql.auth.password }}
{{- if not $password }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- if $existing }}
{{- $password = required "existing PostgreSQL Secret must contain data.password; restore the original credentials" (index ($existing.data | default dict) "password") | b64dec }}
{{/* Offline helm template cannot look up Secrets; --is-upgrade enables this guard. */}}
{{- else if .Release.IsUpgrade }}
{{- fail "PostgreSQL Secret not found on upgrade; restore the original Secret or supply the existing database password via postgresql.auth.password or postgresql.auth.existingSecret" }}
{{- else }}
{{- $password = randAlphaNum 32 }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "nemo-common.postgresql.fullname" . }}
  labels:
    app.kubernetes.io/component: postgres
    {{- include "nemo-helix.labels" . | nindent 4 }}
type: Opaque
stringData:
  password: {{ $password | quote }}
{{- end }}
