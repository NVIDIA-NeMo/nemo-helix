{{- include "nemo-helix.validateEnvoyKeepAliveTimeouts" . }}
{{- if and (include "nemo-helix.authEnabled" .) .Values.envoyProxy.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nhx-envoy.servicename" . }}
  labels:
    {{- include "nhx-envoy.labels" . | nindent 4 }}
data:
  envoy.yaml: |
{{- if .Values.envoyProxy.configOverride }}
{{ tpl .Values.envoyProxy.configOverride . | nindent 4 }}
{{- else }}
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: {{ .Values.envoyProxy.adminPort }}
    static_resources:
      listeners:
        - name: listener_0
          address:
            socket_address:
              address: 0.0.0.0
              port_value: {{ .Values.envoyProxy.service.port }}
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: ingress_http
                    stream_idle_timeout: {{ .Values.envoyProxy.timeouts.streamIdle | quote }}
                    request_headers_timeout: {{ .Values.envoyProxy.timeouts.requestHeaders | quote }}
                    request_timeout: {{ .Values.envoyProxy.timeouts.request | quote }}
                    access_log:
                      - name: envoy.access_loggers.stdout
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                    http_filters:
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                    route_config:
                      name: passthrough_route
                      internal_only_headers:
                      {{- range .Values.envoyProxy.trustedHeaders }}
                        - {{ . }}
                      {{- end }}
                      virtual_hosts:
                        - name: backend
                          domains: ["*"]
                          routes:
                            - match:
                                prefix: "/"
                              route:
                                cluster: backend_cluster
                                timeout: {{ .Values.envoyProxy.timeouts.route | quote }}
      clusters:
        - name: backend_cluster
          type: STRICT_DNS
          lb_policy: ROUND_ROBIN
          connect_timeout: {{ .Values.envoyProxy.timeouts.connect | quote }}
          # Envoy's default upstream HTTP idle timeout is 1h. The chart default
          # stays below the API keep-alive timeout so stale pooled API
          # connections are retired before the backend closes them.
          typed_extension_protocol_options:
            envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
              "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
              common_http_protocol_options:
                idle_timeout: {{ .Values.envoyProxy.timeouts.upstreamIdle | quote }}
              explicit_http_config:
                http_protocol_options: {}
          load_assignment:
            cluster_name: backend_cluster
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: {{ include "nhx-api.api-servicename" . }}
                          port_value: {{ .Values.api.service.port }}
{{- end }}
{{- end }}
