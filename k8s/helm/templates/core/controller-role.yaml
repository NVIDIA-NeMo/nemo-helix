{{- if .Values.core.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "nhx-core.controllerServiceAccountName" . }}
  labels:
    app.kubernetes.io/component: nhx-core-controller
    {{- include "nemo-helix.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch", "create"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get", "list"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "create", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "create", "delete"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "create", "delete"]
- apiGroups: [""]
  resources: ["secrets"]
  # get/list are required by the deployments k8s backend: it reads a managed
  # Secret to enforce the ownership-label guard before create (409 conflict) and
  # before delete. Without get, delete_deployment fails with 403 and the
  # Deployment is stuck in DELETING. Mirrors the configmaps verb set.
  verbs: ["get", "list", "create", "delete"]
{{- if .Values.rbac.volcanoEnabled }}
# Volcano
- apiGroups: ["batch.volcano.sh"]
  resources: ["jobs", "jobs/status"]
  verbs: ["get","list","watch","update","delete","create","patch"]
- apiGroups: ["scheduling.incubator.k8s.io", "scheduling.volcano.sh"]
  resources: ["queues", "queues/status", "podgroups"]
  verbs: ["create", "get", "list", "watch", "update", "patch", "bind", "updateStatus", "delete"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "nhx-core.controllerServiceAccountName" . }}
  labels:
    {{- include "nemo-helix.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: {{ include "nhx-core.controllerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "nhx-core.controllerServiceAccountName" . }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
