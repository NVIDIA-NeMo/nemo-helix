# The OpenSandbox compose services extension, with the server in its own namespace and a Kata server.
sandboxClusterCapable: true
opensandbox:
  namespace: opensandbox-system
  composeServices:
    enabled: true
    sandboxNamespace: nemo-sandboxes
    kataServerServiceAccount: opensandbox-server-kata
