# Test that topologySpreadConstraints are correctly templated for API and core controller deployments.
# CI validates by running: helm template nemo-helix . -f ci/12-topology-spread-constraints.yaml
# The rendered output must include topologySpreadConstraints in both deployment pod specs.

api:
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: DoNotSchedule
      labelSelector:
        matchLabels:
          app.kubernetes.io/component: nhx-api

core:
  controller:
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels:
            app.kubernetes.io/component: nhx-core-controller
