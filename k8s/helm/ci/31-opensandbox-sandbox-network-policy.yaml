# TEST INPUT FOR CI ONLY. This is not an example and not for deployment.
# tools/lint/lint-helm.sh renders the chart with this file and validates the output with kubeconform, so the
# OpenSandbox sandbox ingress NetworkPolicy, which needs sandboxClusterCapable, is checked against the Kubernetes schemas.
sandboxClusterCapable: true
opensandbox:
  namespace: opensandbox-system
  sandboxNetworkPolicy:
    serverPodSelector:
      matchLabels:
        app.kubernetes.io/name: opensandbox-server
    extraIngress:
      - from:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: opensandbox-gateway
