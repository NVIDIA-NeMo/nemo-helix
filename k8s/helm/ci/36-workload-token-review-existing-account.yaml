# Bind TokenReview to an existing API ServiceAccount, without creating it.
api:
  serviceAccount:
    create: false
    name: existing-helix-api

platformConfig:
  platform:
    base_url: https://helix.example.com
  auth:
    enabled: true
    oidc:
      workload:
        client_id: helix-workload
