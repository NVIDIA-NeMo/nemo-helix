# CI validates by running: helm template nemo-helix . -f ci/25-core-controller-extra-volumes.yaml
# Exercises core controller extra volume/mount rendering with a ConfigMap.

core:
  controller:
    extraVolumes:
      - name: extra-config
        configMap:
          name: controller-extra-config
    extraVolumeMounts:
      - name: extra-config
        mountPath: /etc/nhx/extra-config
        readOnly: true
